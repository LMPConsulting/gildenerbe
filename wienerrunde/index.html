<style id="wienerrunde-css">
/* Wiener Runde — Brett in Creme auf dunklem Samt. Bewusst einthemig,
   alles explizit gefärbt. */

:root {
  --tisch: #221a24;
  --tisch-2: #150f17;
  --panel: #302436;
  --panel-2: #3c2e44;
  --naht: #4a3a54;
  --schrift: #f0e8f2;
  --schrift-dim: #b7a8bd;
  --schrift-blass: #877a8d;

  --brett: #f4ece0;
  --brett-rand: #c9b8a3;
  --linie: #bcaa96;
  --feld: #fdf9f2;

  --rot: #b5323f;
  --rot-hell: #dd5c68;
  --blau: #2e7d6b;
  --blau-hell: #4aa993;
  --gold: #d9a441;
  --gut: #6aa96f;

  --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
  --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-num: ui-monospace, SFMono-Regular, 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace;

  --r-md: 14px;
  --r-lg: 22px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: none; }

body {
  background: var(--tisch);
  background-image:
    radial-gradient(120% 60% at 50% -10%, #38294010 0%, rgba(56, 41, 64, 0) 60%),
    linear-gradient(180deg, var(--tisch) 0%, var(--tisch-2) 100%);
  background-attachment: fixed;
  color: var(--schrift-dim);
  font-family: var(--font-ui);
  font-size: 16px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
}

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* ---------- Gerüst ---------- */

#app { min-height: 100dvh; display: flex; flex-direction: column; }
.screen { flex: 1; display: flex; flex-direction: column; min-height: 100dvh; }
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; min-height: 0; }
.scrollbar { overflow-y: auto; max-height: 100dvh; }
.wrap { width: 100%; max-width: 560px; margin-inline: auto; padding: 22px 18px calc(18px + var(--safe-b)); }
.blatt { padding: calc(var(--safe-t) + 16px) 18px calc(18px + var(--safe-b)); width: 100%; max-width: 560px; margin-inline: auto; }

h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; color: var(--schrift); margin: 0 0 6px; }
h3 { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin: 24px 0 8px; }
p, li { font-size: 15px; line-height: 1.6; color: var(--schrift-dim); }
strong { color: var(--schrift); }
em { color: var(--gold); font-style: italic; }

.kopf {
  display: flex; align-items: center; gap: 12px;
  padding: calc(var(--safe-t) + 12px) 16px 10px;
  border-bottom: 1px solid var(--naht);
}
.kopf .titel { flex: 1; min-width: 0; }
.kopf .ober { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--schrift-blass); font-weight: 700; }
.kopf h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 23px;
  color: var(--schrift); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.kopf h1 .wer--0 { color: var(--rot-hell); }
.kopf h1 .wer--1 { color: var(--blau-hell); }
.werkzeuge { display: flex; gap: 7px; }
.werkzeug {
  width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
  background: var(--panel); border: 1px solid var(--naht); color: var(--schrift-dim); font-size: 15px;
}

/* ---------- Knöpfe ---------- */

.btn {
  display: flex; align-items: center; justify-content: center; gap: 9px;
  width: 100%; padding: 16px 18px; border-radius: var(--r-md);
  font-weight: 650; font-size: 16px; letter-spacing: -0.01em;
  transition: transform 0.1s ease, filter 0.15s ease;
}
.btn:active { transform: scale(0.985); }
.btn:disabled { opacity: 0.3; transform: none; box-shadow: none; filter: saturate(0.5); }
.btn--rot { background: var(--gold); color: #2a1c05; box-shadow: 0 8px 26px rgba(217, 164, 65, 0.18); }
.btn--hell { background: var(--brett); color: #241c17; }
.btn--geist { background: var(--panel); color: var(--schrift); border: 1px solid var(--naht); }
.btn--leise { background: none; color: var(--schrift-blass); font-weight: 500; font-size: 15px; padding: 13px; }
.knopfsaeule { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.reihe { display: flex; gap: 10px; }
.reihe .btn { width: auto; flex: 1; }

/* ---------- Startbildschirm ---------- */

.start { justify-content: center; text-align: center; padding: 30px 20px calc(28px + var(--safe-b)); }
.wortmarke {
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(38px, 13vw, 56px); line-height: 1.02; margin: 0;
  color: var(--schrift); letter-spacing: -0.02em;
}
.wortmarke em { font-style: italic; color: var(--gold); }
.unterzeile { color: var(--schrift-blass); margin: 10px 0 26px; }

/* ---------- Das Brett ---------- */

.tischplatte { flex: 1; display: grid; place-items: center; padding: 10px 12px 0; min-height: 0; }
.brett {
  width: 100%; max-width: min(96vw, 54dvh); aspect-ratio: 1;
  background: var(--brett);
  border: 3px solid var(--brett-rand);
  border-radius: 18px;
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.4);
  display: block;
}
/* ---------- Würfel und Leiste ---------- */

.leiste {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px calc(14px + var(--safe-b));
  max-width: 560px; margin-inline: auto; width: 100%;
}
.wuerfel {
  width: 66px; height: 66px; flex: 0 0 auto; border-radius: 16px;
  background: var(--feld); border: 2px solid var(--brett-rand);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
  padding: 9px; gap: 2px;
}
.wuerfel:disabled { opacity: 0.45; box-shadow: none; }
.wuerfel .auge { width: 100%; height: 100%; border-radius: 50%; background: #2a201a; }
.wuerfel .auge--leer { background: none; }
.wuerfel--rollt { animation: schuetteln 0.4s ease; }
@keyframes schuetteln {
  25% { transform: rotate(-9deg) scale(1.05); }
  75% { transform: rotate(9deg) scale(1.05); }
}
.wuerfel--frage { display: grid; place-items: center; font-size: 26px; color: #2a201a; font-weight: 700; }

.sagt { flex: 1; min-width: 0; }
.sagt .zeile1 { color: var(--schrift); font-size: 15px; line-height: 1.35; }
.sagt .zeile2 { color: var(--schrift-blass); font-size: 13px; margin-top: 2px; }
.sagt .warnung { color: var(--gold); }

/* ---------- Punktetafel ---------- */

.tafel {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  gap: 10px; background: var(--panel); border: 1px solid var(--naht);
  border-radius: var(--r-lg); padding: 16px 14px; margin: 16px 0;
}
.tafel .seite { text-align: center; min-width: 0; }
.tafel .wer { font-size: 12px; color: var(--schrift-blass); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tafel .zahl { font-family: var(--font-num); font-size: 34px; font-weight: 800; line-height: 1.1; }
.tafel .seite--0 .zahl { color: var(--rot-hell); }
.tafel .seite--1 .zahl { color: var(--blau-hell); }
.tafel .strichlein { width: 1px; height: 40px; background: var(--naht); }

.feld {
  background: var(--panel); border: 1px solid var(--naht);
  border-radius: var(--r-md); padding: 14px; color: var(--schrift); font-size: 16px;
  user-select: text; -webkit-user-select: text; width: 100%;
}
.feld::placeholder { color: var(--schrift-blass); }
.feld--code {
  width: 100%; text-align: center; letter-spacing: 0.3em;
  font-family: var(--font-num); font-size: 28px; text-transform: uppercase; margin-top: 8px;
}
.feldlabel { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--schrift-blass); font-weight: 700; text-align: left; margin: 18px 0 7px; }
.warnton { color: var(--rot-hell); }

.wahlliste { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.wahl {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: var(--panel); border: 1px solid var(--naht); border-radius: var(--r-md); padding: 13px 15px;
}
.wahl--an { border-color: var(--gold); background: #3a2c18; }
.wahl .haupt { flex: 1; min-width: 0; }
.wahl .oben { color: var(--schrift); font-weight: 650; }
.wahl .unten { font-size: 13px; color: var(--schrift-blass); }
.wahl .haken { color: var(--gold); font-size: 18px; }

/* ---------- Overlays ---------- */

.overlay {
  position: fixed; inset: 0; z-index: 50; background: var(--tisch-2);
  display: flex; flex-direction: column; animation: einblenden 0.18s ease-out;
}
@keyframes einblenden { from { opacity: 0; } }

.jubel {
  justify-content: center; align-items: center; text-align: center;
  padding: 26px calc(24px + var(--safe-b));
  /* Deckende Grundfarbe muss hier noch einmal stehen: das Verlaufsbild allein
     ließe das Brett durchscheinen. */
  background-color: var(--tisch-2);
  background-image: radial-gradient(90% 50% at 50% 40%, #382940 0%, rgba(56, 41, 64, 0) 70%);
}
.jubel p { max-width: 30ch; }
.jubel .btn { width: min(340px, 100%); }
.jubel .krone { font-size: 46px; }
.jubel .name { font-family: var(--font-display); font-size: clamp(30px, 9vw, 44px); color: var(--schrift); line-height: 1.1; margin: 6px 0; }
.jubel .btn { max-width: 340px; }

/* ---------- Kopplung per QR ---------- */

.qrfeld { display: grid; place-items: center; background: var(--brett); border-radius: 14px; padding: 14px; margin: 16px 0; }
.qrfeld canvas { width: 100%; max-width: 300px; height: auto; image-rendering: pixelated; display: block; }

.scanfenster {
  position: relative; overflow: hidden; border-radius: 14px; background: #000;
  aspect-ratio: 1; margin: 16px 0; border: 1px solid var(--naht);
}
.scanfenster video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scanfenster::after {
  content: ""; position: absolute; inset: 16%;
  border: 2px solid var(--gold); border-radius: 12px;
  box-shadow: 0 0 0 999px rgba(0, 0, 0, 0.45);
}

.raumcode {
  font-family: var(--font-num); font-size: clamp(38px, 13vw, 58px); font-weight: 800;
  letter-spacing: 0.14em; text-align: center; padding: 18px 10px; margin: 16px 0;
  border-radius: 14px; user-select: all; -webkit-user-select: all;
  background: var(--panel); color: var(--schrift); border: 2px solid var(--gold);
}

.codeklappe { margin-top: 6px; }
.codeklappe summary { font-size: 13px; color: var(--schrift-blass); cursor: pointer; padding: 8px 0; list-style: none; }
.codeklappe summary::before { content: "▸ "; }
.codeklappe[open] summary::before { content: "▾ "; }
.codeklappe .btn { margin-top: 8px; }
.codefeld {
  width: 100%; min-height: 84px; resize: vertical; margin-top: 6px;
  background: var(--panel); border: 1px solid var(--naht); border-radius: 10px;
  padding: 10px; color: var(--schrift-blass); font-family: var(--font-num); font-size: 11px;
  word-break: break-all; user-select: text; -webkit-user-select: text;
}
.lage { margin-top: 12px; font-size: 12px; line-height: 1.55; opacity: 0.62; word-break: break-word; }

/* ---------- Quer: Brett links, Bedienung rechts ---------- */

@media (orientation: landscape) and (max-height: 560px) {
  .screen--spiel { flex-direction: row; align-items: stretch; }
  .screen--spiel .kopf { display: none; }
  .tischplatte { padding: 8px; }
  .brett { max-width: min(46vw, 92dvh); }
  .leiste { flex-direction: column; align-items: stretch; justify-content: center; max-width: 320px; padding: 10px 14px; }
  .leiste .wuerfel { align-self: center; }
}

/* ---------- Das Brett ---------- */

.brett .zelle { fill: var(--feld); stroke: var(--linie); stroke-width: 0.35; }
.brett .zelle--ecke { fill: #efe6d8; }
.brett .zelle--wahl { cursor: pointer; }
.brett .zelle--jetzt { stroke: var(--gold); stroke-width: 0.9; }
.brett .band { stroke: rgba(0, 0, 0, 0.25); stroke-width: 0.2; }
.brett .marke { stroke: rgba(0, 0, 0, 0.3); stroke-width: 0.25; }
.brett .marke--0 { fill: var(--rot); }
.brett .marke--1 { fill: var(--blau); }
.brett .haus { fill: #4f9d69; stroke: #23472f; stroke-width: 0.2; }
.brett .hotel { fill: var(--rot); stroke: #4d1219; stroke-width: 0.2; }
.brett .hyp { fill: none; stroke: var(--rot); stroke-width: 0.5; }
.brett .figur { stroke: #fff; stroke-width: 0.5; }
.brett .figur--0 { fill: var(--rot); }
.brett .figur--1 { fill: var(--blau); }
.brett .kuerzel {
  font-family: var(--font-ui); font-size: 2.5px; font-weight: 700;
  fill: #6b5c4c; text-anchor: middle; dominant-baseline: central;
}
.brett .mitteschrift {
  font-family: var(--font-display); font-size: 6px; fill: var(--linie);
  text-anchor: middle; dominant-baseline: central;
}
.brett .mittezeile {
  font-family: var(--font-ui); font-size: 3px; font-weight: 700; letter-spacing: 0.1em;
  fill: var(--brett-rand); text-anchor: middle; dominant-baseline: central;
}

/* ---------- Konten und Karten ---------- */

.konten { display: flex; gap: 8px; padding: 0 14px; max-width: 560px; margin-inline: auto; width: 100%; }
.konto {
  flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--naht);
  border-radius: 12px; padding: 8px 10px;
}
.konto--dran { border-color: var(--gold); }
.konto .wer { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.konto--0 .wer { color: var(--rot-hell); }
.konto--1 .wer { color: var(--blau-hell); }
.konto .geld { font-family: var(--font-num); font-size: 19px; font-weight: 800; color: var(--schrift); }
.konto .klein { font-size: 11px; color: var(--schrift-blass); }

.karte {
  background: var(--feld); color: #2a2028; border-radius: 14px; overflow: hidden;
  margin: 12px 0; border: 1px solid var(--brett-rand);
}
.karte .kopfband { height: 26px; display: grid; place-items: center; color: #fff;
  font-weight: 700; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }

/* ------------------------------------------------------- Galois-Feld GF(256) */

const EXP = new Uint8Array(512);

      m[n - 11 + spalte][zeile] = wert;
      m[zeile][n - 11 + spalte] = wert;
    }
  }
}

function qrMatrix(text, maskeErzwingen = null) {
  const bytes = new TextEncoder().encode(text);
  const version = versionWaehlen(bytes.length);
  const worte = endgueltigeWoerter(codewoerter(bytes, version), version);

  const belegt = reserviert(version);
  const roh = funktionsMuster(version);
  datenSetzen(roh, belegt, worte);

  let beste = null;
  for (let maske = 0; maske < 8; maske++) {
    if (maskeErzwingen !== null && maske !== maskeErzwingen) continue;
    const m = roh.map((zeile, r) => zeile.map((wert, c) => (
      belegt[r][c] ? wert : wert !== MASKEN[maske](r, c)
    )));
    infoSetzen(m, version, maske);
    const p = strafe(m);
    if (!beste || p < beste.punkte) beste = { punkte: p, module: m };
  }

  return { groesse: beste.module.length, version, module: beste.module };
}

/** Zeichnet den Code in ein Canvas — mit der vorgeschriebenen ruhigen Zone. */
function qrZeichnen(canvas, text, { rand = 4, hell = '#f6f2e7', dunkel = '#16211e' } = {}) {
  const { groesse, module } = qrMatrix(text);
  const gesamt = groesse + rand * 2;
  const pixel = Math.max(1, Math.floor(canvas.width / gesamt));
  const kante = pixel * gesamt;

  canvas.width = kante;
  canvas.height = kante;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = hell;
  ctx.fillRect(0, 0, kante, kante);
  ctx.fillStyle = dunkel;
  for (let r = 0; r < groesse; r++) {
    for (let c = 0; c < groesse; c++) {
      if (module[r][c]) ctx.fillRect((c + rand) * pixel, (r + rand) * pixel, pixel, pixel);
    }
  }
  return { groesse, kante };
}

// Direktverbindung zwischen zwei Handys im selben WLAN oder Hotspot.
//
// Es gibt keinen Server, der vermittelt. Deshalb tauschen die Geräte ihre
// Verbindungsdaten einmalig per QR-Code aus: Gastgeber zeigt, Gast scannt,
// Gast zeigt zurück, Gastgeber scannt. Danach läuft alles direkt.
//
// Damit ein Code auf ein Handydisplay passt, wird die Beschreibung auf das
// Nötigste eingedampft und auf der Gegenseite aus einer Vorlage neu gebaut.

const CODE_MARKE = 'WR1';

/* ------------------------------------------------- Verbindungsdaten packen */

function hexZuBase64(hex) {
  const bytes = hex.split(':').map((h) => parseInt(h, 16));
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function base64ZuHex(b64) {
  const roh = atob(b64.replace(/-/g, '+').replace(/_/g, '/'));
  return Array.from(roh, (c) => c.charCodeAt(0).toString(16).padStart(2, '0').toUpperCase()).join(':');
}

/** Aus einer vollständigen Beschreibung einen kurzen, scanbaren Code machen. */
function funkCodeBauen(sdp, rolle) {
  const hole = (muster) => (sdp.match(muster) || [])[1] || '';
  const ufrag = hole(/^a=ice-ufrag:(.+)$/m);
  const pwd = hole(/^a=ice-pwd:(.+)$/m);
  const fingerabdruck = hole(/^a=fingerprint:sha-256 (.+)$/m).trim();

  const kandidaten = [];
  for (const zeile of sdp.split(/\r?\n/)) {
    const t = zeile.match(/^a=candidate:\S+ \d+ (udp|UDP) \d+ (\S+) (\d+) typ (host|srflx)/);
    if (t && !kandidaten.some((k) => k === `${t[2]},${t[3]}`)) kandidaten.push(`${t[2]},${t[3]}`);
  }

  return [CODE_MARKE + rolle, ufrag, pwd, hexZuBase64(fingerabdruck), ...kandidaten].join('|');
}

/** Kurzcode wieder zu einer vollständigen Beschreibung aufblasen. */
function funkCodeLesen(code) {
  const teile = String(code).trim().split('|');
  const kopf = teile[0] || '';
  if (!kopf.startsWith(CODE_MARKE)) throw new Error('Das ist keine Wiener-Runde-Verbindung.');
  const rolle = kopf.slice(CODE_MARKE.length);
  if (rolle !== 'O' && rolle !== 'A') throw new Error('Der Verbindungscode ist unvollständig.');

  const [, ufrag, pwd, fingerBase64, ...kandidaten] = teile;
  if (!ufrag || !pwd || !fingerBase64) throw new Error('Der Verbindungscode ist unvollständig.');

  const sdp = [
    'v=0',
    'o=- 1 2 IN IP4 127.0.0.1',
    's=-',
    't=0 0',
    'a=group:BUNDLE 0',
    'a=msid-semantic: WMS',
    'm=application 9 UDP/DTLS/SCTP webrtc-datachannel',
    'c=IN IP4 0.0.0.0',
    `a=ice-ufrag:${ufrag}`,
    `a=ice-pwd:${pwd}`,
    'a=ice-options:trickle',
    `a=fingerprint:sha-256 ${base64ZuHex(fingerBase64)}`,
    `a=setup:${rolle === 'O' ? 'actpass' : 'active'}`,
    'a=mid:0',
    'a=sctp-port:5000',
    'a=max-message-size:262144',
    '',
  ].join('\r\n');

  return {
    typ: rolle === 'O' ? 'offer' : 'answer',
    sdp,
    kandidaten: kandidaten.filter(Boolean).map((k) => {
      const [adresse, port] = k.split(',');
      return {
        candidate: `candidate:1 1 udp 2130706431 ${adresse} ${port} typ host generation 0 ufrag ${ufrag}`,
        sdpMid: '0',
        sdpMLineIndex: 0,
      };
    }),
  };
}

/* -------------------------------------------------------- Kamera-Freigabe */

// Chrome verrät die echte WLAN-Adresse eines Handys nicht einfach so: statt
// 192.168.x.y steht in den Verbindungsdaten ein zufälliger „….local"-Name
// (mDNS). Die Gegenseite müsste diesen Namen per Multicast auflösen — und
// genau das lassen Handy-Hotspots meistens nicht durch. Hat die Seite aber
// einmal die Erlaubnis für die Kamera, gibt Chrome die echte Adresse heraus.
// Also holen wir die Erlaubnis, *bevor* die Verbindung entsteht; die Kamera
// geht sofort wieder aus. Zum Scannen brauchen wir sie ohnehin gleich.
async function kameraFreigeben() {
  try {
    const strom = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: false,
    });
    strom.getTracks().forEach((spur) => spur.stop());
    return true;
  } catch {
    return false;
  }
}

/* ------------------------------------------------------------- Verbindung */

/**
 * Baut die Verbindung auf. `aufZustand(text, verbunden)` meldet Fortschritt,
 * `aufNachricht(objekt)` liefert eingehende Daten.
 */
function funkAufbauen({ gastgeber, aufZustand, aufNachricht }) {
  const pc = new RTCPeerConnection({ iceServers: [] });
  let kanal = null;
  let offen = false;
  const lage = { eigene: [], fremde: 0, mdns: false, stand: 'neu', sammeln: 'läuft' };

  const melde = (text) => aufZustand?.(text, offen);

  const kanalVerdrahten = (k) => {
    kanal = k;
    k.onopen = () => { offen = true; aufZustand?.('verbunden', true); };
    k.onclose = () => { offen = false; aufZustand?.('getrennt', false); };
    k.onmessage = (e) => {
      try { aufNachricht?.(JSON.parse(e.data)); } catch { /* kaputte Nachricht */ }
    };
  };

  if (gastgeber) kanalVerdrahten(pc.createDataChannel('wienerrunde', { ordered: true }));
  else pc.ondatachannel = (e) => kanalVerdrahten(e.channel);

  // Mitschreiben, was das Handy findet — sonst steht man bei „Verbinde …" im Dunkeln.
  pc.onicecandidate = (e) => {
    if (!e.candidate) return;
    const roh = e.candidate.candidate;
    if (/\.local\b/.test(roh)) { lage.mdns = true; return; }
    const t = roh.match(/ (\S+) (\d+) typ (?:host|srflx)/);
    if (t && !lage.eigene.includes(`${t[1]}:${t[2]}`)) lage.eigene.push(`${t[1]}:${t[2]}`);
  };

  pc.oniceconnectionstatechange = () => {
    lage.stand = pc.iceConnectionState;
    if (['failed', 'disconnected'].includes(pc.iceConnectionState) && !offen) {
      melde(lage.mdns && !lage.eigene.length
        ? 'Keine Verbindung — dieses Handy hat seine WLAN-Adresse nicht herausgegeben.'
        : 'Keine Verbindung — blockiert euer Hotspot vielleicht den direkten Weg?');
    }
  };

  /** Wartet, bis alle lokalen Adressen gesammelt sind (oder die Geduld endet). */
  const adressenSammeln = () => new Promise((fertig) => {
    if (pc.iceGatheringState === 'complete') { lage.sammeln = 'fertig'; return fertig(); }
    const stopp = setTimeout(() => { lage.sammeln = 'fertig'; fertig(); }, 6000);
    pc.onicegatheringstatechange = () => {
      lage.sammeln = pc.iceGatheringState === 'complete' ? 'fertig' : pc.iceGatheringState;
      if (pc.iceGatheringState === 'complete') { clearTimeout(stopp); fertig(); }
    };
    return undefined;
  });

  return {
    /** Gastgeber: eigenen Code erzeugen. Gast: erst nach codeLesen aufrufen. */
    async eigenerCode() {
      const beschreibung = gastgeber ? await pc.createOffer() : await pc.createAnswer();
      await pc.setLocalDescription(beschreibung);
      await adressenSammeln();
      return funkCodeBauen(pc.localDescription.sdp, gastgeber ? 'O' : 'A');
    },

    async codeLesen(code) {
      const { typ, sdp, kandidaten } = funkCodeLesen(code);
      if (gastgeber && typ !== 'answer') throw new Error('Das ist der Code des Gastgebers — du brauchst den vom Gast.');
      if (!gastgeber && typ !== 'offer') throw new Error('Das ist der Code des Gasts — du brauchst den vom Gastgeber.');
      await pc.setRemoteDescription({ type: typ, sdp });
      for (const k of kandidaten) {
        try { await pc.addIceCandidate(k); lage.fremde += 1; } catch { /* einzelne Adresse taugt nicht */ }
      }
      melde('verbinde …');
    },

    senden(objekt) {
      if (kanal && kanal.readyState === 'open') {
        kanal.send(JSON.stringify(objekt));
        return true;
      }
      return false;
    },

    get verbunden() { return offen; },

    /** Momentaufnahme für die Fehlersuche — reine Lesekopie. */
    get lage() { return { ...lage, eigene: lage.eigene.slice() }; },

    schliessen() {
      try { kanal?.close(); } catch { /* egal */ }
      try { pc.close(); } catch { /* egal */ }
    },
  };
}

/* ---------------------------------------------------------------- Scanner */

const scannerMoeglich = () => typeof window !== 'undefined'
  && 'BarcodeDetector' in window
  && !!navigator.mediaDevices?.getUserMedia;

/**
 * Startet die Kamera und meldet den ersten gefundenen QR-Code.
 * Gibt eine Funktion zum Abschalten zurück.
 */
async function scannerStarten(videoElement, aufTreffer, aufFehler) {
  if (!scannerMoeglich()) {
    aufFehler?.(new Error('Dieser Browser kann keine QR-Codes lesen — nimm den Textcode.'));
    return () => {};
  }
  let laeuft = true;
  let strom = null;

  try {
    strom = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: false,
    });
  } catch (fehler) {
    aufFehler?.(new Error('Kein Zugriff auf die Kamera. Erlaube ihn oder nimm den Textcode.'));
    return () => {};
  }

  videoElement.srcObject = strom;
  videoElement.setAttribute('playsinline', '');
  await videoElement.play().catch(() => {});

  const sucher = new window.BarcodeDetector({ formats: ['qr_code'] });
  const schauen = async () => {
    if (!laeuft) return;
    try {
      const treffer = await sucher.detect(videoElement);
      const code = treffer.find((t) => String(t.rawValue).startsWith(CODE_MARKE));
      if (code) { laeuft = false; aufTreffer(code.rawValue); return stoppen(); }
    } catch { /* einzelner Fehlversuch ist egal */ }
    setTimeout(schauen, 220);
    return undefined;
  };

  const stoppen = () => {
    laeuft = false;
    strom?.getTracks().forEach((t) => t.stop());
    videoElement.srcObject = null;
  };

  schauen();
  return stoppen;
}

// Zwei Handys über das Internet verbinden — für die Fassung auf der Webseite.
//
// Anders als funk.js braucht das kein gemeinsames WLAN und keine Kamera: Der
// Server hält nur einen Raum mit einem kurzen Code offen und reicht Nachrichten
// durch. Er versteht kein Spiel; er merkt sich, wer was noch nicht abgeholt hat.
//
// Nach außen sieht das genauso aus wie eine Direktverbindung — `senden`,
// `verbunden`, `schliessen` — damit die Oberfläche nichts davon wissen muss.

const NETZ_BASIS = (typeof SPIELE_BASIS === 'string' ? SPIELE_BASIS : '.').replace(/\/$/, '');

/** Steht dieser Weg überhaupt zur Verfügung? Nur in der Webfassung. */
const netzMoeglich = () => typeof SPIELE_BASIS === 'string';

async function ruf(pfad, optionen = {}) {
  const antwort = await fetch(`${NETZ_BASIS}/api${pfad}`, {
    cache: 'no-store',
    headers: { 'Content-Type': 'application/json' },
    ...optionen,
  });
  let daten = null;
  try { daten = await antwort.json(); } catch { /* leere Antwort */ }
  if (!antwort.ok) throw new Error((daten && daten.fehler) || `Server meldet ${antwort.status}.`);
  return daten || {};
}

/**
 * Raum aufmachen oder beitreten und danach dauerhaft lauschen.
 *
 * `aufZustand(text, verbunden)` meldet Fortschritt, `aufNachricht(objekt)`
 * liefert alles, was die Gegenseite schickt, `aufCode(code)` den Raumcode,
 * sobald er feststeht.
 */
function netzAufbauen({ gastgeber, code, aufZustand, aufNachricht, aufCode }) {
  let raum = null;         // { code, sitz, schluessel }
  let ab = 0;
  let offen = false;
  let laeuft = true;
  let fehlversuche = 0;

  const melde = (text, verbunden = offen) => aufZustand?.(text, verbunden);

  async function lauschen() {
    while (laeuft && raum) {
      try {
        const q = new URLSearchParams({
          sitz: String(raum.sitz),
          ab: String(ab),
          voll: offen ? '1' : '0',        // der Server meldet sich, sobald sich das ändert
          schluessel: raum.schluessel,
        });
        const daten = await ruf(`/raum/${raum.code}/holen?${q}`);
        if (!laeuft) return;
        fehlversuche = 0;

        if (daten.voll && !offen) { offen = true; aufZustand?.('verbunden', true); }
        if (!daten.voll && offen) { offen = false; aufZustand?.('getrennt', false); }

        for (const n of daten.nachrichten || []) {
          ab = Math.max(ab, n.nr);
          try { aufNachricht?.(n.inhalt); } catch { /* kaputte Nachricht */ }
        }
        if (typeof daten.stand === 'number') ab = Math.max(ab, Math.min(ab, daten.stand));
      } catch (fehler) {
        if (!laeuft) return;
        fehlversuche += 1;
        if (fehlversuche >= 4) {
          offen = false;
          aufZustand?.(`Verbindung abgerissen: ${fehler.message}`, false);
        }
        // Kurz warten, dann weiter — kurze Aussetzer sollen das Spiel nicht beenden.
        await new Promise((w) => setTimeout(w, Math.min(4000, 500 * fehlversuche)));
      }
    }
  }

  const bereit = (async () => {
    melde(gastgeber ? 'Raum wird geöffnet …' : 'Raum wird gesucht …', false);
    raum = gastgeber
      ? await ruf('/raum', { method: 'POST', body: '{}' })
      : await ruf(`/raum/${String(code || '').trim().toUpperCase()}/beitreten`,
        { method: 'POST', body: '{}' });
    aufCode?.(raum.code);
    melde(gastgeber ? 'Warte auf das zweite Handy …' : 'Verbinde …', false);
    lauschen();
    return raum.code;
  })();

  return {
    bereit,                                   // Promise: fertig, sobald der Raum steht
    get code() { return raum && raum.code; },
    get verbunden() { return offen; },

    senden(objekt) {
      if (!raum) return false;
      ruf(`/raum/${raum.code}/senden`, {
        method: 'POST',
        body: JSON.stringify({ sitz: raum.sitz, schluessel: raum.schluessel, nachricht: objekt }),
      }).catch(() => { /* der Lauscher merkt den Ausfall */ });
      return true;
    },

    schliessen() {
      laeuft = false;
      offen = false;
      raum = null;
    },
  };
}

  { id: 'e7', text: 'Strafmandat fürs Radeln am Gehsteig. Zahle 60 €.', art: 'geld', betrag: -60 },
  { id: 'e8', text: 'Die Jahreskarte war teurer als gedacht. Zahle 150 €.', art: 'geld', betrag: -150 },
  { id: 'e9', text: 'Drei Felder zurück — du hast die U-Bahn verpasst.', art: 'zurueck', schritte: 3 },
  { id: 'e10', text: 'Freifahrschein aus dem Kommissariat. Heb ihn auf.', art: 'freikarte' },
  { id: 'e11', text: 'Rücke vor zur nächsten U-Bahn-Linie.', art: 'naechsteLinie' },
  { id: 'e12', text: 'Sanierung: zahle 40 € je Haus und 115 € je Hotel.', art: 'bauabgabe', proHaus: 40, proHotel: 115 },
];

const KAFFEEHAUS = [
  { id: 'k1', text: 'Die Kellnerin rundet großzügig. Ziehe 200 € ein.', art: 'geld', betrag: 200 },
  { id: 'k2', text: 'Zwei Sachertorten und ein Verlängerter. Zahle 90 €.', art: 'geld', betrag: -90 },
  { id: 'k3', text: 'Du hast im Heurigen die Runde geschmissen. Zahle 100 €.', art: 'geld', betrag: -100 },
  { id: 'k4', text: 'Trinkgeld zurückbekommen, weil du so nett warst. 25 €.', art: 'geld', betrag: 25 },
  { id: 'k5', text: 'Rücke vor bis Los und kassiere.', art: 'gehe', feld: 0 },
  { id: 'k6', text: 'Ein Kellner hat dich falsch angesprochen. Ab ins Kommissariat.', art: 'haft' },
  { id: 'k7', text: 'Freifahrschein aus dem Kommissariat. Heb ihn auf.', art: 'freikarte' },
  { id: 'k8', text: 'Die Gegenseite lädt dich ein. Sie zahlt dir 50 €.', art: 'vomAnderen', betrag: 50 },
  { id: 'k9', text: 'Runde für alle: gib der Gegenseite 50 €.', art: 'vomAnderen', betrag: -50 },
  { id: 'k10', text: 'Erbschaft von der Tante aus Grinzing. 100 €.', art: 'geld', betrag: 100 },
  { id: 'k11', text: 'Reparatur: zahle 25 € je Haus und 100 € je Hotel.', art: 'bauabgabe', proHaus: 25, proHotel: 100 },
  { id: 'k12', text: 'Zahnarzt in der Josefstadt. Zahle 50 €.', art: 'geld', betrag: -50 },
];

// Wo die 40 Felder liegen. Reine Geometrie, kein DOM.
//
// Das Brett ist der Rand eines 11 × 11-Rasters: 4 × 11 − 4 = 40 Zellen. Los
// sitzt unten rechts, gezogen wird gegen den Uhrzeigersinn — erst nach links
// über die untere Kante, dann hoch, nach rechts, wieder herunter.

const RASTER = 11;

const strecke = (x, y, dx, dy, n) =>
  Array.from({ length: n }, (_, i) => [x + dx * i, y + dy * i]);

const FELDPUNKTE = [
  ...strecke(10, 10, -1, 0, 10),   //  0– 9  unten nach links, 0 ist Los
  ...strecke(0, 10, 0, -1, 10),    // 10–19  links hinauf, 10 ist das Kommissariat
  ...strecke(0, 0, 1, 0, 10),      // 20–29  oben nach rechts
  ...strecke(10, 0, 0, 1, 10),     // 30–39  rechts hinunter
];

/** An welcher Kante liegt ein Feld? Bestimmt, wohin das Farbband zeigt. */
const KANTE = FELDPUNKTE.map(([x, y]) => {
  if (y === RASTER - 1) return 'unten';
  if (x === 0) return 'links';
  if (y === 0) return 'oben';
  return 'rechts';
});

const mitte = ([x, y], zelle = 10) => [x * zelle + zelle / 2, y * zelle + zelle / 2];

// Wiener Runde — Spiellogik ohne DOM. Alles serialisierbar.
//
// Ablauf eines klassischen Straßenkaufspiels für zwei: würfeln, ziehen,
// kaufen oder Miete zahlen, bauen, handeln. Gewonnen hat, wer die Gegenseite
// zahlungsunfähig macht — oder, in der kurzen Partie, wer nach der letzten
// Runde mehr besitzt.
//
// Der Zug läuft in Phasen, damit die Oberfläche immer weiß, was gerade dran
// ist: 'wuerfeln' → (nach dem Ziehen) 'kaufen' oder 'handeln' → 'ende'.


const SAVE_VERSION = 1;
const HAFTVERSUCHE = 3;

const VORGABE = {
  // Zwei Messungen über je 400 Selbstspiele haben die Zahl bestimmt:
  //
  // 1. Bis zur Pleite dauert eine Partie im Schnitt 149 Runden, und jede fünfte
  //    war nach 300 Runden noch offen. Nichts fürs Handy im Urlaub.
  // 2. In 30 Runden werden zwar 20 Felder verkauft, aber nur 3,3 Häuser gebaut.
  //    Bei 40 Runden sind es 3,7 volle Farbgruppen und 6,6 Häuser — erst dann
  //    kommt der Teil des Spiels vor, um den es eigentlich geht.
  //
  // (Beide Zahlen mit einem Testspieler, der auch handelt. Ohne Handel bleiben
  // die Gruppen fast immer unvollständig — Handeln ist keine Zugabe, sondern
  // die Voraussetzung dafür, dass gebaut wird.)
  runden: 40,       // 0 = bis zur Pleite, sonst so viele Runden
};

const anderer = (i) => (i === 0 ? 1 : 0);
const karteIds = (liste) => liste.map((k) => k.id);
const ALLE_KARTEN = [...EREIGNIS, ...KAFFEEHAUS];

function mischen(liste, rnd) {
  const a = liste.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function neuerStand(namen = ['Monty', 'Christina'], regeln = {}, rnd = Math.random) {
  return {
    v: SAVE_VERSION,
    spieler: namen.map((name) => ({ name })),
    geld: [STARTGELD, STARTGELD],
    ort: [0, 0],
    haft: [0, 0],              // verbleibende Versuche, 0 = frei
    freikarten: [0, 0],
    besitz: {},                // Feld -> Spielerindex
    haeuser: {},               // Feld -> 0..5 (5 = Hotel)
    hypothek: {},              // Feld -> true
    stapel: {
      ereignis: mischen(karteIds(EREIGNIS), rnd),
      kaffeehaus: mischen(karteIds(KAFFEEHAUS), rnd),
    },
    dran: 0,
    phase: 'wuerfeln',
    wurf: null,                // { wuerfel: [a, b], summe, pasch }
    paschFolge: 0,
    letzteKarte: null,
    handel: null,
    runde: 1,
    siege: [0, 0],
    partie: 1,
    regeln: { ...VORGABE, ...regeln },
    verlauf: [],
    fertig: null,
  };
}

// `fertig` ist der Index des Siegers und darf 0 sein — nie auf Wahrheit prüfen.
const vorbei = (stand) => stand.fertig !== null;
const phase = (stand) => (vorbei(stand) ? 'ende' : stand.phase);

/* ---------------------------------------------------------------- Abfragen */

const besitzer = (stand, feld) =>
  (Object.prototype.hasOwnProperty.call(stand.besitz, feld) ? stand.besitz[feld] : null);

const haeuserAuf = (stand, feld) => stand.haeuser[feld] || 0;
const beliehen = (stand, feld) => !!stand.hypothek[feld];

/** Gehören einem Spieler alle Orte einer Farbgruppe? */
function gruppeKomplett(stand, gruppe, spieler) {
  const felder = GRUPPENFELDER[gruppe] || [];
  return felder.length > 0 && felder.every((f) => besitzer(stand, f) === spieler);
}

const anzahlArt = (stand, art, spieler) =>
  FELDER.filter((f) => f.art === art && besitzer(stand, f.feld) === spieler).length;

/** Was kostet es, hier zu landen? `wurf` zählt nur bei den Werken. */
function miete(stand, feld, wurf = 7) {
  const wem = besitzer(stand, feld);
  if (wem === null || beliehen(stand, feld)) return 0;
  const f = FELDER[feld];

  if (f.art === 'linie') return LINIENMIETE[anzahlArt(stand, 'linie', wem)] || 0;
  if (f.art === 'werk') return wurf * (WERKFAKTOR[anzahlArt(stand, 'werk', wem)] || 0);
  if (f.art !== 'ort') return 0;

  const h = haeuserAuf(stand, feld);
  if (h > 0) return f.miete[h];
  return gruppeKomplett(stand, f.gruppe, wem) ? f.miete[0] * 2 : f.miete[0];
}

/** Geld plus halber Grundwert plus halbe Bauten — so viel ist einer wert. */
function vermoegen(stand, spieler) {
  let summe = stand.geld[spieler];
  for (const f of FELDER) {
    if (besitzer(stand, f.feld) !== spieler) continue;
    summe += beliehen(stand, f.feld) ? Math.floor(f.preis / 2) : f.preis;
    summe += haeuserAuf(stand, f.feld) * Math.floor((f.haus || 0) / 2);
  }
  return summe;
}

/** Schulden, aus denen sich niemand mehr herauswinden kann. */
function pleite(stand, spieler) {
  if (stand.geld[spieler] >= 0) return false;
  const rettung = FELDER.reduce((n, f) => {
    if (besitzer(stand, f.feld) !== spieler) return n;
    const haus = haeuserAuf(stand, f.feld) * Math.floor((f.haus || 0) / 2);
    const grund = beliehen(stand, f.feld) ? 0 : Math.floor(f.preis / 2);
    return n + haus + grund;
  }, 0);
  return stand.geld[spieler] + rettung < 0;
}

function pruefePleite(stand, spieler) {
  if (!pleite(stand, spieler)) return false;
  stand.fertig = anderer(spieler);
  stand.siege[stand.fertig] += 1;
  stand.phase = 'ende';
  return true;
}

/** Geld bewegen — negativ heißt zahlen. */
function buchen(stand, spieler, betrag, an = null) {
  stand.geld[spieler] += betrag;
  if (an !== null) stand.geld[an] -= betrag;
  if (betrag < 0) pruefePleite(stand, spieler);
  else if (an !== null) pruefePleite(stand, an);
}

/* --------------------------------------------------------------- Würfeln */

function wuerfeln(stand, rnd = Math.random) {
  if (vorbei(stand)) throw new Error('Die Partie ist vorbei.');
  if (stand.phase !== 'wuerfeln') throw new Error('Jetzt wird nicht gewürfelt.');
  const a = 1 + Math.floor(rnd() * 6);
  const b = 1 + Math.floor(rnd() * 6);
  stand.wurf = { wuerfel: [a, b], summe: a + b, pasch: a === b };
  stand.phase = 'ziehen';
  return stand.wurf;
}

/** Setzt die Figur weiter und wertet das Feld aus. */
function ziehen(stand) {
  if (stand.phase !== 'ziehen' || !stand.wurf) return null;
  const wer = stand.dran;

  if (stand.wurf.pasch) {
    stand.paschFolge += 1;
    if (stand.paschFolge >= 3) {
      insKommissariat(stand, wer);
      stand.phase = 'ende';
      return { art: 'haft' };
    }
  } else {
    stand.paschFolge = 0;
  }

  const ziel = (stand.ort[wer] + stand.wurf.summe) % FELDER_GESAMT;
  if (ziel < stand.ort[wer]) buchen(stand, wer, LOS_GELD);
  stand.ort[wer] = ziel;
  return feldAuswerten(stand, stand.wurf.summe);
}

function insKommissariat(stand, spieler) {
  stand.ort[spieler] = GEFAENGNIS_FELD;
  stand.haft[spieler] = HAFTVERSUCHE;
  stand.paschFolge = 0;
}

/** Was passiert auf dem Feld, auf dem man steht. */
function feldAuswerten(stand, wurf) {
  const wer = stand.dran;
  const f = FELDER[stand.ort[wer]];
  stand.phase = 'ende';

  if (f.art === 'los' || f.art === 'besuch' || f.art === 'parken') return { art: f.art };

  if (f.art === 'inHaft') {
    insKommissariat(stand, wer);
    return { art: 'haft' };
  }

  if (f.art === 'steuer') {
    buchen(stand, wer, -f.betrag);
    return { art: 'steuer', betrag: f.betrag };
  }

  if (f.art === 'ereignis' || f.art === 'kaffeehaus') {
    const karte = karteZiehen(stand, f.art === 'ereignis' ? 'ereignis' : 'kaffeehaus');
    karteAusfuehren(stand, karte, wurf);
    return { art: 'karte', karte };
  }

  const wem = besitzer(stand, f.feld);
  if (wem === null) {
    if (stand.geld[wer] >= f.preis) stand.phase = 'kaufen';
    return { art: 'frei', feld: f.feld };
  }
  if (wem === wer) return { art: 'eigen', feld: f.feld };

  const betrag = miete(stand, f.feld, wurf);
  if (betrag > 0) buchen(stand, wer, -betrag, wem);
  return { art: 'miete', feld: f.feld, betrag };
}

/* --------------------------------------------------------------- Kaufen */

function kaufen(stand) {
  if (stand.phase !== 'kaufen') return false;
  const wer = stand.dran;
  const f = FELDER[stand.ort[wer]];
  if (besitzer(stand, f.feld) !== null) return false;
  if (stand.geld[wer] < f.preis) return false;
  stand.geld[wer] -= f.preis;
  stand.besitz[f.feld] = wer;
  stand.phase = 'ende';
  return true;
}

function kaufVerzichten(stand) {
  if (stand.phase !== 'kaufen') return false;
  stand.phase = 'ende';          // keine Versteigerung — so spielt es sich zu zweit besser
  return true;
}

/* ---------------------------------------------------------------- Bauen */

function bauen(stand, feld) {
  const f = FELDER[feld];
  if (!f || f.art !== 'ort') return false;
  const wer = besitzer(stand, feld);
  if (wer === null || wer !== stand.dran) return false;
  if (!gruppeKomplett(stand, f.gruppe, wer)) return false;
  if (GRUPPENFELDER[f.gruppe].some((g) => beliehen(stand, g))) return false;
  const jetzt = haeuserAuf(stand, feld);
  if (jetzt >= 5) return false;
  // Gleichmäßig bauen: kein Feld darf mehr als eines vorausbauen.
  const kleinste = Math.min(...GRUPPENFELDER[f.gruppe].map((g) => haeuserAuf(stand, g)));
  if (jetzt > kleinste) return false;
  if (stand.geld[wer] < f.haus) return false;
  stand.geld[wer] -= f.haus;
  stand.haeuser[feld] = jetzt + 1;
  return true;
}

function abreissen(stand, feld) {
  const f = FELDER[feld];
  if (!f || f.art !== 'ort') return false;
  const wer = besitzer(stand, feld);
  if (wer === null || wer !== stand.dran) return false;   // nur eigener Grund
  const jetzt = haeuserAuf(stand, feld);
  if (jetzt <= 0) return false;
  const groesste = Math.max(...GRUPPENFELDER[f.gruppe].map((g) => haeuserAuf(stand, g)));
  if (jetzt < groesste) return false;             // auch beim Abreißen gleichmäßig
  stand.haeuser[feld] = jetzt - 1;
  if (!stand.haeuser[feld]) delete stand.haeuser[feld];
  stand.geld[wer] += Math.floor(f.haus / 2);
  return true;
}

/* -------------------------------------------------------------- Hypothek */

function beleihen(stand, feld) {
  const f = FELDER[feld];
  if (!f || !f.preis) return false;
  const wer = besitzer(stand, feld);
  if (wer === null || wer !== stand.dran) return false;   // nur eigener Grund
  if (beliehen(stand, feld)) return false;
  if (haeuserAuf(stand, feld) > 0) return false;
  stand.hypothek[feld] = true;
  stand.geld[wer] += Math.floor(f.preis / 2);
  return true;
}

function ausloesen(stand, feld) {
  const f = FELDER[feld];
  if (!f || !beliehen(stand, feld)) return false;
  const wer = besitzer(stand, feld);
  if (wer === null || wer !== stand.dran) return false;   // nur eigener Grund
  const kosten = Math.ceil(Math.floor(f.preis / 2) * 1.1);
  if (stand.geld[wer] < kosten) return false;
  stand.geld[wer] -= kosten;
  delete stand.hypothek[feld];
  return true;
}

/* ----------------------------------------------------------- Gefängnis */

function kautionZahlen(stand) {
  const wer = stand.dran;
  if (stand.haft[wer] <= 0) return false;
  if (stand.geld[wer] < KAUTION) return false;
  stand.geld[wer] -= KAUTION;
  stand.haft[wer] = 0;
  return true;
}

function freikarteNutzen(stand) {
  const wer = stand.dran;
  if (stand.haft[wer] <= 0 || stand.freikarten[wer] <= 0) return false;
  stand.freikarten[wer] -= 1;
  stand.haft[wer] = 0;
  return true;
}

/**
 * Im Kommissariat wird auf einen Pasch gewürfelt. Beim dritten Fehlversuch
 * wird die Kaution fällig und es geht trotzdem weiter.
 */
function wuerfelnImKnast(stand, rnd = Math.random) {
  const wer = stand.dran;
  if (stand.haft[wer] <= 0) return null;
  const a = 1 + Math.floor(rnd() * 6);
  const b = 1 + Math.floor(rnd() * 6);
  stand.wurf = { wuerfel: [a, b], summe: a + b, pasch: a === b };

  if (a === b) {
    stand.haft[wer] = 0;
    stand.phase = 'ziehen';
    ziehenAusHaft(stand);
    return { frei: true, pasch: true, gezahlt: 0, wuerfel: [a, b] };
  }

  stand.haft[wer] -= 1;
  if (stand.haft[wer] > 0) return { frei: false, pasch: false, gezahlt: 0, wuerfel: [a, b] };

  const gezahlt = Math.min(KAUTION, Math.max(0, stand.geld[wer]));
  buchen(stand, wer, -KAUTION);
  if (vorbei(stand)) return { frei: true, pasch: false, gezahlt, wuerfel: [a, b] };
  stand.phase = 'ziehen';
  ziehenAusHaft(stand);
  return { frei: true, pasch: false, gezahlt: KAUTION, wuerfel: [a, b] };
}

/** Nach der Freilassung wird sofort gezogen — aber ohne Pasch-Bonus. */
function ziehenAusHaft(stand) {
  const wer = stand.dran;
  const ziel = (stand.ort[wer] + stand.wurf.summe) % FELDER_GESAMT;
  if (ziel < stand.ort[wer]) buchen(stand, wer, LOS_GELD);
  stand.ort[wer] = ziel;
  stand.paschFolge = 0;
  feldAuswerten(stand, stand.wurf.summe);
}

/* ----------------------------------------------------------------- Karten */

function karteZiehen(stand, welcher) {
  const stapel = stand.stapel[welcher];
  const id = stapel.shift();
  stapel.push(id);                        // unten wieder einlegen
  const karte = ALLE_KARTEN.find((k) => k.id === id);
  stand.letzteKarte = karte;
  return karte;
}

function karteAusfuehren(stand, karte, wurf = 7) {
  const wer = stand.dran;
  if (!karte) return null;

  if (karte.art === 'geld') { buchen(stand, wer, karte.betrag); return karte; }
  if (karte.art === 'vomAnderen') { buchen(stand, wer, karte.betrag, anderer(wer)); return karte; }
  if (karte.art === 'freikarte') { stand.freikarten[wer] += 1; return karte; }
  if (karte.art === 'haft') { insKommissariat(stand, wer); stand.phase = 'ende'; return karte; }

  if (karte.art === 'gehe') {
    if (karte.feld <= stand.ort[wer]) buchen(stand, wer, LOS_GELD);
    stand.ort[wer] = karte.feld;
    feldAuswerten(stand, wurf);
    return karte;
  }

  if (karte.art === 'zurueck') {
    stand.ort[wer] = (stand.ort[wer] - karte.schritte + FELDER_GESAMT) % FELDER_GESAMT;
    feldAuswerten(stand, wurf);
    return karte;
  }

  if (karte.art === 'naechsteLinie') {
    const linien = FELDER.filter((f) => f.art === 'linie').map((f) => f.feld);
    const naechste = linien.find((f) => f > stand.ort[wer]);
    const ziel = naechste === undefined ? linien[0] : naechste;
    if (ziel <= stand.ort[wer]) buchen(stand, wer, LOS_GELD);
    stand.ort[wer] = ziel;
    feldAuswerten(stand, wurf);
    return karte;
  }

  if (karte.art === 'bauabgabe') {
    let summe = 0;
    for (const f of FELDER) {
      if (besitzer(stand, f.feld) !== wer) continue;
      const h = haeuserAuf(stand, f.feld);
      summe += h === 5 ? karte.proHotel : h * karte.proHaus;
    }
    buchen(stand, wer, -summe);
    return karte;
  }

  return karte;
}

/* ----------------------------------------------------------------- Handel */

function handelAnbieten(stand, { von, feld, preis }) {
  if (vorbei(stand)) return false;
  if (besitzer(stand, feld) !== von) return false;
  if (haeuserAuf(stand, feld) > 0) return false;
  const f = FELDER[feld];
  if (f.art === 'ort' && GRUPPENFELDER[f.gruppe].some((g) => haeuserAuf(stand, g) > 0)) return false;
  const p = Math.max(0, Math.round(preis));
  stand.handel = { von, feld, preis: p };
  return true;
}

function handelAnnehmen(stand) {
  const h = stand.handel;
  if (!h) return false;
  const an = anderer(h.von);
  if (stand.geld[an] < h.preis) return false;
  stand.geld[an] -= h.preis;
  stand.geld[h.von] += h.preis;
  stand.besitz[h.feld] = an;
  stand.handel = null;
  return true;
}

function handelAblehnen(stand) {
  stand.handel = null;
  return true;
}

/* ------------------------------------------------------------- Zug beenden */

function zugBeenden(stand) {
  if (vorbei(stand)) return stand;
  const wer = stand.dran;
  const nochmal = stand.wurf && stand.wurf.pasch && stand.haft[wer] === 0 && stand.paschFolge > 0;

  stand.handel = null;
  stand.wurf = null;
  stand.phase = 'wuerfeln';

  if (nochmal) return stand;                    // Pasch: derselbe bleibt dran

  stand.paschFolge = 0;
  stand.dran = anderer(wer);
  if (stand.dran === 0) {
    stand.runde += 1;
    const grenze = stand.regeln.runden;
    if (grenze > 0 && stand.runde > grenze) kurzeParteiEnde(stand);
  }
  return stand;
}

function kurzeParteiEnde(stand) {
  const a = vermoegen(stand, 0);
  const b = vermoegen(stand, 1);
  stand.fertig = a === b ? 0 : (a > b ? 0 : 1);
  stand.siege[stand.fertig] += 1;
  stand.phase = 'ende';
}

function partieNeu(stand, rnd = Math.random) {
  const frisch = neuerStand(stand.spieler.map((s) => s.name), stand.regeln, rnd);
  frisch.siege = stand.siege.slice();
  frisch.partie = stand.partie + 1;
  frisch.dran = stand.fertig === null ? stand.dran : anderer(stand.fertig);
  return frisch;
}

/* --------------------------------------------------- Punktestand mitnehmen */

function alsCode(stand) {
  const kern = { v: SAVE_VERSION, n: stand.spieler.map((s) => s.name), s: stand.siege, p: stand.partie };
  return `WR1-${btoa(unescape(encodeURIComponent(JSON.stringify(kern))))}`;
}

function ausCode(code) {
  const roh = String(code || '').trim();
  if (!roh.startsWith('WR1-')) throw new Error('Das ist kein Wiener-Runde-Punktestand.');
  let kern;
  try {
    kern = JSON.parse(decodeURIComponent(escape(atob(roh.slice(4)))));
  } catch {
    throw new Error('Der Code ist unvollständig oder verrutscht.');
  }
  if (!kern || !Array.isArray(kern.s) || kern.s.length !== 2) {
    throw new Error('Der Code passt nicht zu diesem Spiel.');
  }
  const stand = neuerStand(Array.isArray(kern.n) && kern.n.length === 2 ? kern.n : undefined);
  stand.siege = kern.s.map((n) => (Number.isFinite(n) ? n : 0));
  stand.partie = Number.isFinite(kern.p) ? kern.p : 1;
  return stand;
}

// Wiener Runde — Oberfläche. Ein Handy zum Weiterreichen oder zwei zugleich.
//
// Nichts ist geheim: beide sehen dasselbe Brett und dieselben Konten. Darum
// kein Übergabe-Bildschirm; die Kopfzeile und der Rahmen um das Konto sagen,
// wer dran ist.


const KEY = 'wienerrunde.v1';
const app = document.getElementById('app');

let stand = null;
let ui = {

  gezeigtesFeld: null,     // welches Feld gerade als Karte offen ist
  handelFeld: null,        // Feld, für das gerade ein Angebot getippt wird

  meldung: '',
  rollt: false,

  meinIndex: 0,

/* ------------------------------------------------------------------ Hilfen */

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const andere = (i) => (i === 0 ? 1 : 0);
const name = (i) => esc(stand.spieler[i]?.name || (i === 0 ? 'Eins' : 'Zwei'));
const geld = (n) => `${n < 0 ? '−' : ''}${Math.abs(Math.round(n)).toLocaleString('de-DE')} €`;
const buzz = (ms) => { try { navigator.vibrate?.(ms); } catch { /* egal */ } };
const ichBinDran = () => ui.modus !== 'online' || stand.dran === ui.meinIndex;

function sichern() {
  try { localStorage.setItem(KEY, JSON.stringify(stand)); } catch { /* privater Modus */ }
}

function laden() {
  try {
    const roh = localStorage.getItem(KEY);
    if (!roh) return null;
    const s = JSON.parse(roh);
    if (s && s.v === 1 && Array.isArray(s.geld) && Array.isArray(s.ort)) return s;
  } catch { /* kaputter Stand wird ignoriert */ }
  return null;
}

function nachAenderung() {

/* ---------------------------------------------------- Zwei Handys, ein Spiel */

const gegenIndex = () => (ui.meinIndex === 0 ? 1 : 0);

function standSenden() {
  ui.netz?.senden({ typ: 'stand', stand });
}

function tun(name2, wert) {
  if (ui.modus === 'online' && !ui.gastgeber) {
    ui.netz?.senden({ typ: 'aktion', name: name2, wert });
    return false;
  }
  return true;
}

function nachrichtVerarbeiten(m) {
  if (m.typ === 'namen' && !ui.gastgeber) {
    ui.meinIndex = m.meinIndex === 1 ? 1 : 0;
    return;
  }
  if (m.typ === 'stand' && !ui.gastgeber) {
    stand = m.stand;
    render();
    return;
  }
  if (!ui.gastgeber || !stand) return;

  if (m.typ === 'aktion') {
    try {
      const w = m.wert;
      if (m.name === 'wuerfeln') { wuerfeln(stand); ziehen(stand); }
      else if (m.name === 'kaufen') kaufen(stand);
      else if (m.name === 'verzichten') kaufVerzichten(stand);
      else if (m.name === 'bauen') bauen(stand, w);
      else if (m.name === 'abreissen') abreissen(stand, w);
      else if (m.name === 'beleihen') beleihen(stand, w);
      else if (m.name === 'ausloesen') ausloesen(stand, w);
      else if (m.name === 'kaution') kautionZahlen(stand);
      else if (m.name === 'freikarte') freikarteNutzen(stand);
      else if (m.name === 'knastwurf') wuerfelnImKnast(stand);
      else if (m.name === 'weiter') zugBeenden(stand);
      else if (m.name === 'anbieten') handelAnbieten(stand, w);
      else if (m.name === 'annehmen') handelAnnehmen(stand);
      else if (m.name === 'ablehnen') handelAblehnen(stand);
      else if (m.name === 'partieNeu') stand = partieNeu(stand);
      else if (m.name === 'regel') stand.regeln = { ...stand.regeln, ...w };
      else return;
    } catch { return; }
    sichern();
    standSenden();
    render();
  }
}

function kopplungAbbrechen() {
  ui.netz?.schliessen();
  ui.netz = null;
  ui.kopplung = null;
  ui.modus = 'lokal';
  ui.meinIndex = 0;
  ui.gastgeber = true;
  render();
}

async function netzStarten(gastgeber, code) {
  ui.modus = 'online';
  ui.gastgeber = gastgeber;
  ui.meinIndex = gastgeber ? 0 : 1;
  ui.kopplung = { schritt: 'raum', gastgeber, code: '', hinweis: '', fehler: '' };
  render();

  ui.netz = netzAufbauen({
    gastgeber,
    code,
    aufZustand: (text, verbunden) => {
      if (verbunden) return verbindungSteht();
      if (ui.kopplung) { ui.kopplung.hinweis = text; render(); }
      return undefined;
    },
    aufNachricht: nachrichtVerarbeiten,
    aufCode: (c) => { if (ui.kopplung) { ui.kopplung.code = c; render(); } },
  });

  try {
    await ui.netz.bereit;
  } catch (fehler) {
    if (!ui.kopplung) return;
    ui.kopplung.fehler = fehler.message || 'Das hat nicht geklappt.';
    ui.kopplung.schritt = gastgeber ? 'raum' : 'code';
    render();
  }
}

function verbindungSteht() {
  if (!ui.kopplung) return;
  ui.kopplung = null;
  if (ui.gastgeber) {
    if (!stand) stand = neuerStand();
    ui.netz?.senden({ typ: 'namen', meinIndex: 1 });
    standSenden();
  }
  render();
}

function seitenQuelltext(cssId, jsId, ersatzTitel) {
  const css = document.getElementById(cssId)?.textContent || '';
  const js = document.getElementById(jsId)?.textContent || '';
  if (!css || !js) return null;
  const kopf = typeof SEITENKOPF === 'string'
    ? SEITENKOPF
    : `<meta charset="utf-8"><title>${ersatzTitel}</title>`;
  return [
    '<!doctype html>', '<html lang="de">', '<head>', kopf,
    `<style id="${cssId}">`, css, '</style>', '</head>', '<body>',
    '<div id="app"></div>',
    `<script id="${jsId}">`, js, '<' + '/script>',
    '</body>', '</html>', '',
  ].join('\n');
}

function browserDownload(dateiname, html) {
  const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  const a = document.createElement('a');
  a.href = url; a.download = dateiname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

/** Rückgabe: 'ok' | 'txt' | 'abgelehnt' | 'dev' */
async function seiteAlsDateiSichern(cssId, jsId, dateiname, ersatzTitel) {
  if (typeof OFFLINE_DATEI === 'string') {
    const a = document.createElement('a');
    a.href = OFFLINE_DATEI; a.download = dateiname;
    document.body.appendChild(a); a.click(); a.remove();
    return 'ok';
  }
  const html = seitenQuelltext(cssId, jsId, ersatzTitel);
  if (!html) return 'dev';
  const dl = typeof window !== 'undefined' && window.claude ? window.claude.downloads : null;
  if (dl) {
    try {
      await dl.save({ filename: dateiname, data: html });
      return 'ok';
    } catch (fehler) {
      const code = fehler && fehler.code;
      if (code === 'declined') return 'abgelehnt';
      if (code === 'rejected_extension' || code === 'extension_not_enabled') {
        try {
          await dl.save({ filename: dateiname.replace(/\.html$/, '') + '.txt', data: html });
          return 'txt';
        } catch (zweiterFehler) {
          if (zweiterFehler && zweiterFehler.code === 'declined') return 'abgelehnt';
        }
      }
    }
  }
  browserDownload(dateiname, html);
  return 'ok';
}

/* --------------------------------------------------------------- Das Brett */

const ZELLE = 10;
const MASS = RASTER * ZELLE;

const GRUPPENFARBE = (g) => (GRUPPEN[g] ? GRUPPEN[g].farbe : '#999');

/** Kurzzeichen für Felder ohne Farbband — damit man sie unterscheidet. */
const KUERZEL = { linie: 'U', werk: '⚡', ereignis: '?', kaffeehaus: '☕', steuer: '€',
  los: 'LOS', besuch: 'BES', parken: 'FREI', inHaft: '→', ort: '' };

function brettSvg() {
  const teile = [];

  FELDER.forEach((f, i) => {
    const [gx, gy] = FELDPUNKTE[i];
    const x = gx * ZELLE;
    const y = gy * ZELLE;
    const ecke = i % 10 === 0;
    const hier = stand.ort.includes(i);
    const klassen = ['zelle', ecke ? 'zelle--ecke' : '', hier ? 'zelle--jetzt' : '', 'zelle--wahl']
      .filter(Boolean).join(' ');
    teile.push(`<rect class="${klassen}" x="${x + 0.3}" y="${y + 0.3}"`
      + ` width="${ZELLE - 0.6}" height="${ZELLE - 0.6}" rx="1.2" data-feld="${i}"/>`);

    // Farbband auf der zur Mitte zeigenden Seite
    if (f.art === 'ort') {
      const dicke = 2.4;
      const kante = KANTE[i];
      const bx = kante === 'rechts' ? x + 0.3 : x + 0.3;
      const by = kante === 'unten' ? y + 0.3 : y + 0.3;
      const bw = kante === 'links' || kante === 'rechts' ? dicke : ZELLE - 0.6;
      const bh = kante === 'oben' || kante === 'unten' ? dicke : ZELLE - 0.6;
      const vx = kante === 'links' ? x + ZELLE - 0.3 - dicke : bx;
      const vy = kante === 'oben' ? y + ZELLE - 0.3 - dicke : by;
      teile.push(`<rect class="band" x="${vx}" y="${vy}" width="${bw}" height="${bh}"`
        + ` rx="0.6" fill="${GRUPPENFARBE(f.gruppe)}" pointer-events="none"/>`);
    } else if (KUERZEL[f.art]) {
      teile.push(`<text class="kuerzel" x="${x + ZELLE / 2}" y="${y + ZELLE / 2}"`
        + ` pointer-events="none">${KUERZEL[f.art]}</text>`);
    }

    // Besitzmarke am äußeren Rand
    const wem = besitzer(stand, i);
    if (wem !== null) {
      const kante = KANTE[i];
      const mx = kante === 'links' ? x + 1.2 : kante === 'rechts' ? x + ZELLE - 1.2 : x + ZELLE / 2;
      const my = kante === 'oben' ? y + 1.2 : kante === 'unten' ? y + ZELLE - 1.2 : y + ZELLE / 2;
      teile.push(`<circle class="marke marke--${wem}" cx="${mx}" cy="${my}" r="1.1"`
        + ' pointer-events="none"/>');
      if (beliehen(stand, i)) {
        teile.push(`<path class="hyp" d="M ${x + 1.4} ${y + 1.4} L ${x + ZELLE - 1.4} ${y + ZELLE - 1.4}"`
          + ' pointer-events="none"/>');
      }
    }

    // Häuser
    const h = haeuserAuf(stand, i);
    if (h === 5) {
      teile.push(`<rect class="hotel" x="${x + ZELLE / 2 - 2}" y="${y + ZELLE / 2 - 1.2}"`
        + ' width="4" height="2.4" rx="0.5" pointer-events="none"/>');
    } else if (h > 0) {
      for (let k = 0; k < h; k++) {
        teile.push(`<rect class="haus" x="${x + 1.4 + k * 2}" y="${y + ZELLE / 2 - 0.9}"`
          + ' width="1.6" height="1.8" rx="0.3" pointer-events="none"/>');
      }
    }
  });

  // Mitte
  const mx = MASS / 2;
  teile.push(`<text class="mitteschrift" x="${mx}" y="${mx - 6}">Wiener Runde</text>`);
  teile.push(`<text class="mittezeile" x="${mx}" y="${mx + 4}">RUNDE ${stand.runde}${
    stand.regeln.runden ? ` VON ${stand.regeln.runden}` : ''}</text>`);

  // Figuren — leicht versetzt, damit sie sich auf einem Feld nicht verdecken
  stand.ort.forEach((feld, spieler) => {
    const [cx, cy] = mitte(FELDPUNKTE[feld], ZELLE);
    const dx = spieler === 0 ? -1.8 : 1.8;
    teile.push(`<circle class="figur figur--${spieler}" cx="${cx + dx}" cy="${cy - 2.4}" r="1.9"`
      + ' pointer-events="none"/>');
  });

  return `<svg class="brett" viewBox="0 0 ${MASS} ${MASS}" role="img"
    aria-label="Spielbrett mit ${FELDER_GESAMT} Feldern">${teile.join('')}</svg>`;
}

const AUGEN = {
  1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8],
};

function wuerfelSvg(zahl) {
  if (!zahl) return '<span>?</span>';
  const gesetzt = new Set(AUGEN[zahl]);
  return Array.from({ length: 9 }, (_, i) =>
    `<span class="auge${gesetzt.has(i) ? '' : ' auge--leer'}"></span>`).join('');
}
/* ------------------------------------- Kopplung ohne Server: QR im selben WLAN */

/** Womit hängt dieses Handy gerade am Netz? Chrome kennt die Antwort. */
function netzArt() {
  const c = navigator.connection || navigator.mozConnection || {};
  if (c.type) return c.type === 'none' ? 'kein Netz' : c.type;
  return navigator.onLine ? 'verbunden' : 'kein Netz';
}

/** Was die Direktverbindung gerade weiß — in einer Zeile, für den Ernstfall. */
function lageText(l, ausfuehrlich) {
  if (!l) return '';
  const kamera = ui.kopplung?.kamera;
  const stumm = l.mdns && !l.eigene.length;         // nur .local statt echter Adresse
  const leer = !l.mdns && !l.eigene.length && l.sammeln === 'fertig';  // gar nichts gefunden
  if (!ausfuehrlich && !stumm && !leer) return '';  // läuft alles: keine Technik im Weg
  const teile = [];
  if (ausfuehrlich) {
    teile.push(`Eigene Adresse: ${l.eigene.length ? l.eigene.join('  ') : 'noch keine'}`,
      `Gegenseite: ${l.fremde}`, `Stand: ${l.stand}`,
      `Kamera: ${kamera === undefined ? '?' : (kamera ? 'frei' : 'abgelehnt')}`,
      `Netz: ${netzArt()}`);
  }
  if (stumm) {
    teile.push('Dieses Handy gibt seine WLAN-Adresse nicht heraus. Erlaube der Seite die '
      + 'Kamera (Schloss-Symbol neben der Adresse → Berechtigungen → Kamera) und koppelt neu.');
  }
  if (leer && kamera === false) {
    teile.push('Dieses Handy hat keine Netzwerkadresse gefunden — und die Kamera ist nicht '
      + 'freigegeben. Ohne sie gibt Chrome keine Adresse heraus. Erst freigeben, dann neu koppeln.');
  } else if (leer) {
    teile.push('Dieses Handy hat keine Netzwerkadresse gefunden, obwohl die Kamera frei ist. '
      + 'Chrome sieht hier also kein Netz. Läuft auf diesem Handy der Hotspot? Ein Handy, das '
      + 'selbst den Hotspot aufspannt, meldet Android oft gar kein Netz — dann kann es nicht '
      + 'mitspielen. Abhilfe: beide Handys in dasselbe WLAN einwählen. Gibt es keins, spielt '
      + 'an einem Handy und reicht es hin und her.');
  }
  return teile.join(' · ');
}

/** Zeigt den Kamera-Bildschirm und wartet, wie es weitergehen soll. */
function kameraFrage() {
  return new Promise((fertig) => {
    ui.kopplung.schritt = 'kamera';
    ui.kopplung.kameraAntwort = fertig;
    render();
  });
}

/** Hält die Technikzeile aktuell, solange gekoppelt wird. */
function lageTakten() {
  if (ui.lageTakt) clearInterval(ui.lageTakt);
  ui.lageTakt = setInterval(() => {
    if (!ui.kopplung || !ui.netz) { clearInterval(ui.lageTakt); ui.lageTakt = null; return; }
    const feld = document.getElementById('lage');
    if (feld) feld.textContent = lageText(ui.netz.lage, ui.kopplung.schritt === 'warten');
  }, 500);
}

/** Kopplung von vorn: alte Verbindung weg, gleiche Rolle noch einmal. */
function kopplungNeu() {
  const gastgeber = ui.kopplung?.gastgeber ?? true;
  ui.netz?.schliessen();
  ui.netz = null;
  funkStarten(gastgeber);
}

/**
 * Direktverbindung zwischen zwei Handys. Braucht keinen Server, dafür ein
 * gemeinsames WLAN — nach außen sieht sie aus wie die Durchreiche.
 */
async function funkStarten(gastgeber) {
  ui.modus = 'online';
  ui.gastgeber = gastgeber;
  ui.meinIndex = gastgeber ? 0 : 1;
  ui.kopplung = { schritt: 'moment', gastgeber, ueberQr: true, hinweis: '', fehler: '' };
  render();

  // Erst die Kamera-Erlaubnis, dann die Verbindung. Ohne sie gibt Chrome die eigene
  // Netzwerkadresse nicht heraus — das Handy findet dann gar keine oder nur einen
  // .local-Namen, den ein Hotspot nicht auflöst. Scannen müssen wir gleich ohnehin.
  let frei = await kameraFreigeben();
  while (!frei) {
    if (!ui.kopplung) return;                 // in der Zwischenzeit abgebrochen
    const wahl = await kameraFrage();
    if (!ui.kopplung || wahl === 'abbruch') return;
    if (wahl === 'weiter') break;
    frei = await kameraFreigeben();
  }
  if (!ui.kopplung) return;
  ui.kopplung.kamera = frei;
  ui.kopplung.schritt = 'moment';
  render();

  ui.netz = funkAufbauen({
    gastgeber,
    aufZustand: (text, verbunden) => {
      if (verbunden) return verbindungSteht();
      if (ui.kopplung && ui.kopplung.schritt !== 'scannen') {
        ui.kopplung.hinweis = text;
        render();
      }
      return undefined;
    },
    aufNachricht: nachrichtVerarbeiten,
  });
  lageTakten();

  if (gastgeber) {
    ui.kopplung.code = await ui.netz.eigenerCode();
    ui.kopplung.schritt = 'zeigen';
  } else {
    ui.kopplung.schritt = 'scannen';
  }
  render();
}

async function fremdenCodeAnnehmen(code) {
  const k = ui.kopplung;
  try {
    await ui.netz.codeLesen(code);
    if (!ui.kopplung) return;                  // war schon verbunden
    if (!k.gastgeber) {
      ui.kopplung.code = await ui.netz.eigenerCode();
      ui.kopplung.schritt = 'zeigen';
    } else {
      ui.kopplung.schritt = 'warten';
    }
    k.fehler = '';
  } catch (fehler) {
    if (!ui.kopplung) return;
    k.fehler = fehler.message || 'Der Code passt nicht.';
  }
  render();
}
