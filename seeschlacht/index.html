<style id="seeschlacht-css">
/* Seeschlacht — Seekarte bei Nacht: tiefes Petrol, Raster in Sandfarbe,
   Treffer in Signalrot. Bewusst einthemig, alles explizit gefärbt. */

:root {
  --see: #0c1f26;
  --see-2: #071318;
  --panel: #143039;
  --panel-2: #1b3e49;
  --naht: #24505e;
  --schrift: #e4eef0;
  --schrift-dim: #9fb6bd;
  --schrift-blass: #6d878f;

  --wasser: #143a49;
  --wasser-rand: #1e5568;
  --sand: #e8c98a;
  --sand-tief: #8a7440;
  --treffer: #e2603c;
  --treffer-tief: #6d2f20;
  --schiff: #8fa3ab;
  --schiff-rand: #b8c9cf;
  --wrack: #6b4038;
  --gut: #5fc0a0;

  --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
  --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-num: ui-monospace, SFMono-Regular, 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace;

  --r-md: 14px;
  --r-lg: 22px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: none; }

body {
  background: var(--see);
  background-image:
    radial-gradient(130% 60% at 50% -8%, #16323d 0%, rgba(22, 50, 61, 0) 62%),
    linear-gradient(180deg, var(--see) 0%, var(--see-2) 100%);
  background-attachment: fixed;
  color: var(--schrift-dim);
  font-family: var(--font-ui);
  font-size: 16px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
}

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--sand); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* ---------- Gerüst ---------- */

#app { min-height: 100dvh; display: flex; flex-direction: column; }
.screen { flex: 1; display: flex; flex-direction: column; min-height: 100dvh; }
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; min-height: 0; }
.scrollbar { overflow-y: auto; max-height: 100dvh; }
.wrap { width: 100%; max-width: 560px; margin-inline: auto; padding: 22px 18px calc(18px + var(--safe-b)); }
.blatt { padding: calc(var(--safe-t) + 16px) 18px calc(18px + var(--safe-b)); width: 100%; max-width: 560px; margin-inline: auto; }

h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; color: var(--schrift); margin: 0 0 6px; }
h3 { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sand-tief); font-weight: 700; margin: 24px 0 8px; }
p, li { font-size: 15px; line-height: 1.6; color: var(--schrift-dim); }
strong { color: var(--schrift); }
em { color: var(--sand); font-style: italic; }

.kopf {
  display: flex; align-items: center; gap: 12px;
  padding: calc(var(--safe-t) + 12px) 16px 10px;
  border-bottom: 1px solid var(--naht);
}
.kopf .titel { flex: 1; min-width: 0; }
.kopf .ober { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--schrift-blass); font-weight: 700; }
.kopf h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 23px;
  color: var(--schrift); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.werkzeuge { display: flex; gap: 7px; }
.werkzeug {
  width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
  background: var(--panel); border: 1px solid var(--naht); color: var(--schrift-dim); font-size: 15px;
}

/* ---------- Knöpfe ---------- */

.btn {
  display: flex; align-items: center; justify-content: center; gap: 9px;
  width: 100%; padding: 15px 18px; border-radius: var(--r-md);
  font-weight: 650; font-size: 16px; letter-spacing: -0.01em;
  transition: transform 0.1s ease, filter 0.15s ease;
}
.btn:active { transform: scale(0.985); }
.btn:disabled { opacity: 0.3; transform: none; box-shadow: none; filter: saturate(0.5); }
.btn--signal { background: var(--sand); color: #2b2007; box-shadow: 0 8px 26px rgba(232, 201, 138, 0.16); }
.btn--geist { background: var(--panel); color: var(--schrift); border: 1px solid var(--naht); }
.btn--leise { background: none; color: var(--schrift-blass); font-weight: 500; font-size: 15px; padding: 13px; }
.knopfsaeule { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.reihe { display: flex; gap: 10px; }
.reihe .btn { width: auto; flex: 1; }

/* ---------- Startbildschirm ---------- */

.start { justify-content: center; text-align: center; padding: 30px 20px calc(28px + var(--safe-b)); }
.wortmarke {
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(34px, 11vw, 52px); line-height: 1.03; margin: 0;
  color: var(--schrift); letter-spacing: -0.02em;
}
.wortmarke em { font-style: italic; color: var(--sand); }
.unterzeile { color: var(--schrift-blass); margin: 10px 0 26px; }

/* ---------- Das Meer ---------- */

.meerfeld { padding: 8px 12px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.meertitel {
  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--schrift-blass); font-weight: 700; text-align: center;
}
.meer {
  display: grid; gap: 2px;
  /* Die Spaltenzahl kommt aus dem Spielstand — die kurze Fassung ist 8 × 8. */
  grid-template-columns: 1.1em repeat(calc(var(--spalten, 11) - 1), 1fr);
  position: relative;
  width: 100%; max-width: min(92vw, 46dvh);
  font-size: clamp(9px, 2.6vw, 12px);
}
.meer--klein { max-width: min(58vw, 26dvh); font-size: 8px; opacity: 0.92; }
.meer .kopfzelle {
  display: grid; place-items: center; color: var(--schrift-blass);
  font-family: var(--font-num); font-size: 0.85em; font-weight: 700;
}
.zelle {
  aspect-ratio: 1; border-radius: 3px;
  background: var(--wasser); border: 1px solid var(--wasser-rand);
  display: grid; place-items: center; padding: 0;
  transition: background 0.12s ease;
}
.zelle--schiff { background: var(--schiff); border-color: var(--schiff-rand); }
.zelle--daneben::after {
  content: ""; width: 26%; height: 26%; border-radius: 50%;
  background: var(--schrift-blass); opacity: 0.75;
}
.zelle--treffer { background: var(--treffer-tief); border-color: var(--treffer); }
.zelle--treffer::after {
  content: ""; width: 58%; height: 58%; border-radius: 2px;
  background: var(--treffer);
}
.zelle--wrack { background: var(--wrack); border-color: var(--treffer); }
.zelle--letzter { box-shadow: 0 0 0 2px var(--sand); }
.zelle--frei { cursor: pointer; }
.zelle--frei:active { background: var(--wasser-rand); }
.zelle--sperr { opacity: 0.45; }

/* ---------- Flottenliste ---------- */

.flotte { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 4px; }
.pott {
  display: flex; align-items: center; gap: 4px; padding: 5px 9px; border-radius: 9px;
  background: var(--panel); border: 1px solid var(--naht); font-size: 12px; color: var(--schrift-dim);
}
.pott--dran { border-color: var(--sand); color: var(--sand); }
.pott--weg { opacity: 0.4; text-decoration: line-through; }
.pott .rumpf { display: flex; gap: 1px; }
.pott .planke { width: 6px; height: 10px; border-radius: 1px; background: var(--schiff); }
.pott--weg .planke { background: var(--wrack); }

.leiste {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px calc(12px + var(--safe-b));
  max-width: 560px; margin-inline: auto; width: 100%;
}
.sagt { flex: 1; min-width: 0; }
.sagt .zeile1 { color: var(--schrift); font-size: 15px; line-height: 1.35; }
.sagt .zeile2 { color: var(--schrift-blass); font-size: 13px; margin-top: 2px; }
.sagt .treff { color: var(--treffer); font-weight: 700; }
.sagt .senk { color: var(--sand); font-weight: 700; }

/* ---------- Punktetafel und Formulare ---------- */

.tafel {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  gap: 10px; background: var(--panel); border: 1px solid var(--naht);
  border-radius: var(--r-lg); padding: 16px 14px; margin: 16px 0;
}
.tafel .seite { text-align: center; min-width: 0; }
.tafel .wer { font-size: 12px; color: var(--schrift-blass); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tafel .zahl { font-family: var(--font-num); font-size: 34px; font-weight: 800; color: var(--sand); line-height: 1.1; }
.tafel .strichlein { width: 1px; height: 40px; background: var(--naht); }

.feld {
  background: var(--panel); border: 1px solid var(--naht);
  border-radius: var(--r-md); padding: 14px; color: var(--schrift); font-size: 16px;
  user-select: text; -webkit-user-select: text; width: 100%;
}
.feld::placeholder { color: var(--schrift-blass); }
.feld--code {
  width: 100%; text-align: center; letter-spacing: 0.3em;
  font-family: var(--font-num); font-size: 28px; text-transform: uppercase; margin-top: 8px;
}
.feldlabel { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--schrift-blass); font-weight: 700; text-align: left; margin: 18px 0 7px; }
.warnton { color: var(--treffer); }

.wahlliste { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.wahl {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: var(--panel); border: 1px solid var(--naht); border-radius: var(--r-md); padding: 13px 15px;
}
.wahl--an { border-color: var(--sand); background: #2c2a17; }
.wahl .haupt { flex: 1; min-width: 0; }
.wahl .oben { color: var(--schrift); font-weight: 650; }
.wahl .unten { font-size: 13px; color: var(--schrift-blass); }
.wahl .haken { color: var(--sand); font-size: 18px; }

/* ---------- Overlays ---------- */

.overlay {
  position: fixed; inset: 0; z-index: 50; background: var(--see-2);
  display: flex; flex-direction: column; animation: einblenden 0.18s ease-out;
}
@keyframes einblenden { from { opacity: 0; } }

.uebergabe, .jubel {
  justify-content: center; align-items: center; text-align: center;
  padding: 26px calc(24px + var(--safe-b));
  background-color: var(--see-2);
  background-image: radial-gradient(90% 50% at 50% 40%, #16323d 0%, rgba(22, 50, 61, 0) 70%);
}
.uebergabe .pfeil { font-size: 40px; animation: schubs 1.5s ease-in-out infinite; }
@keyframes schubs { 50% { transform: translateX(10px); } }
.uebergabe .lbl, .jubel .lbl { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--schrift-blass); font-weight: 700; }
.uebergabe .name, .jubel .name { font-family: var(--font-display); font-size: clamp(30px, 9vw, 42px); color: var(--schrift); line-height: 1.1; margin: 4px 0 6px; }
.uebergabe p, .jubel p { max-width: 32ch; }
.uebergabe .btn, .jubel .btn { width: min(340px, 100%); }
.jubel .krone { font-size: 46px; }

@media (prefers-reduced-motion: reduce) {
  .uebergabe .pfeil { animation: none; }
}

/* ---------- Kopplung per QR ---------- */

.qrfeld { display: grid; place-items: center; background: #dfe9e4; border-radius: 14px; padding: 14px; margin: 16px 0; }
.qrfeld canvas { width: 100%; max-width: 300px; height: auto; image-rendering: pixelated; display: block; }

.scanfenster {
  position: relative; overflow: hidden; border-radius: 14px; background: #000;
  aspect-ratio: 1; margin: 16px 0; border: 1px solid var(--naht);
}
.scanfenster video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scanfenster::after {
  content: ""; position: absolute; inset: 16%;
  border: 2px solid var(--sand); border-radius: 12px;
  box-shadow: 0 0 0 999px rgba(0, 0, 0, 0.45);
}

.raumcode {
  font-family: var(--font-num); font-size: clamp(38px, 13vw, 58px); font-weight: 800;
  letter-spacing: 0.14em; text-align: center; padding: 18px 10px; margin: 16px 0;
  border-radius: 14px; user-select: all; -webkit-user-select: all;
  background: var(--panel); color: var(--schrift); border: 2px solid var(--sand);
}

.codeklappe { margin-top: 6px; }
.codeklappe summary { font-size: 13px; color: var(--schrift-blass); cursor: pointer; padding: 8px 0; list-style: none; }
.codeklappe summary::before { content: "▸ "; }
.codeklappe[open] summary::before { content: "▾ "; }
.codeklappe .btn { margin-top: 8px; }
.codefeld {
  width: 100%; min-height: 84px; resize: vertical; margin-top: 6px;
  background: var(--panel); border: 1px solid var(--naht); border-radius: 10px;
  padding: 10px; color: var(--schrift-blass); font-family: var(--font-num); font-size: 11px;
  word-break: break-all; user-select: text; -webkit-user-select: text;
}
.lage { margin-top: 12px; font-size: 12px; line-height: 1.55; opacity: 0.62; word-break: break-word; }

/* ---------- Quer: beide Meere nebeneinander ---------- */

@media (orientation: landscape) and (max-height: 560px) {
  .kopf { padding-block: 6px; }
  .meerfeld { flex-direction: row; align-items: flex-start; justify-content: center; gap: 14px; }
  .meerspalte { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .meer { max-width: min(42vw, 82dvh); }
  .meer--klein { max-width: min(30vw, 60dvh); }
}

/* ---------- Salve, Sonderwaffen, Radar und Minen ---------- */

/* Vorgemerkte Ziele einer Salve: noch nichts passiert, aber sichtbar gesetzt. */
.zelle--markiert {
  background: var(--sand); border-color: var(--sand);
  box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.25);
}
.zelle--vorschau { background: rgba(226, 96, 60, 0.35); }

/* Eine eigene Mine — und dieselbe, nachdem sie hochgegangen ist. */
.zelle--mine { position: relative; }
.zelle--mine::after,
.zelle--mine-weg::after {
  content: "✱"; position: absolute; inset: 0;
  display: grid; place-items: center; font-size: 0.8em; line-height: 1;
  color: #f0c419; pointer-events: none;
}
.zelle--mine-weg::after { color: #b03a2e; content: "✸"; }

/* Radarbefund: die Zahl liegt auf der Mitte des abgesuchten Quadrats. */
.radarmarke {
  position: absolute; z-index: 2; pointer-events: none;
  grid-column: calc(var(--rx) + 1); grid-row: calc(var(--ry) + 1);
  display: grid; place-items: center;
  font-family: var(--font-num); font-size: 0.62em; font-weight: 800;
  color: #0b1a24; background: rgba(240, 196, 25, 0.92);
  border-radius: 50%; width: 1.5em; height: 1.5em; align-self: center; justify-self: center;
}

.waffenleiste {
  display: flex; gap: 8px; padding: 0 16px 8px;
  max-width: 560px; margin-inline: auto; width: 100%;
}
.waffe {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 11px 6px; border-radius: 12px; font-size: 13px; font-weight: 650;
  background: var(--panel); border: 1px solid var(--naht); color: var(--schrift-dim);
}
.waffe--an { background: var(--sand); border-color: var(--sand); color: #2b2007; }
.waffe:disabled { opacity: 0.32; }
.waffe .zahl { font-family: var(--font-num); font-size: 12px; opacity: 0.8; }

</style>

function qrZeichnen(canvas, text, { rand = 4, hell = '#f6f2e7', dunkel = '#16211e' } = {}) {

  canvas.height = kante;

  ctx.fillRect(0, 0, kante, kante);

    for (let c = 0; c < groesse; c++) {

function base64ZuHex(b64) {
  const roh = atob(b64.replace(/-/g, '+').replace(/_/g, '/'));
  return Array.from(roh, (c) => c.charCodeAt(0).toString(16).padStart(2, '0').toUpperCase()).join(':');
}

/** Aus einer vollständigen Beschreibung einen kurzen, scanbaren Code machen. */
function funkCodeBauen(sdp, rolle) {
  const hole = (muster) => (sdp.match(muster) || [])[1] || '';
  const ufrag = hole(/^a=ice-ufrag:(.+)$/m);
  const pwd = hole(/^a=ice-pwd:(.+)$/m);
  const fingerabdruck = hole(/^a=fingerprint:sha-256 (.+)$/m).trim();

  const kandidaten = [];
  for (const zeile of sdp.split(/\r?\n/)) {
    const t = zeile.match(/^a=candidate:\S+ \d+ (udp|UDP) \d+ (\S+) (\d+) typ (host|srflx)/);
    if (t && !kandidaten.some((k) => k === `${t[2]},${t[3]}`)) kandidaten.push(`${t[2]},${t[3]}`);
  }

  return [CODE_MARKE + rolle, ufrag, pwd, hexZuBase64(fingerabdruck), ...kandidaten].join('|');
}

/** Kurzcode wieder zu einer vollständigen Beschreibung aufblasen. */
function funkCodeLesen(code) {
  const teile = String(code).trim().split('|');
  const kopf = teile[0] || '';
  if (!kopf.startsWith(CODE_MARKE)) throw new Error('Das ist kein Seeschlacht-Verbindungscode.');
  const rolle = kopf.slice(CODE_MARKE.length);
  if (rolle !== 'O' && rolle !== 'A') throw new Error('Der Verbindungscode ist unvollständig.');

  const [, ufrag, pwd, fingerBase64, ...kandidaten] = teile;
  if (!ufrag || !pwd || !fingerBase64) throw new Error('Der Verbindungscode ist unvollständig.');

  const sdp = [
    'v=0',
    'o=- 1 2 IN IP4 127.0.0.1',
    's=-',
    't=0 0',
    'a=group:BUNDLE 0',
    'a=msid-semantic: WMS',
    'm=application 9 UDP/DTLS/SCTP webrtc-datachannel',
    'c=IN IP4 0.0.0.0',
    `a=ice-ufrag:${ufrag}`,
    `a=ice-pwd:${pwd}`,
    'a=ice-options:trickle',
    `a=fingerprint:sha-256 ${base64ZuHex(fingerBase64)}`,
    `a=setup:${rolle === 'O' ? 'actpass' : 'active'}`,
    'a=mid:0',
    'a=sctp-port:5000',
    'a=max-message-size:262144',
    '',
  ].join('\r\n');

  return {
    typ: rolle === 'O' ? 'offer' : 'answer',
    sdp,
    kandidaten: kandidaten.filter(Boolean).map((k) => {
      const [adresse, port] = k.split(',');
      return {
        candidate: `candidate:1 1 udp 2130706431 ${adresse} ${port} typ host generation 0 ufrag ${ufrag}`,
        sdpMid: '0',
        sdpMLineIndex: 0,
      };
    }),
  };
}

/* -------------------------------------------------------- Kamera-Freigabe */

// Chrome verrät die echte WLAN-Adresse eines Handys nicht einfach so: statt
// 192.168.x.y steht in den Verbindungsdaten ein zufälliger „….local"-Name
// (mDNS). Die Gegenseite müsste diesen Namen per Multicast auflösen — und
// genau das lassen Handy-Hotspots meistens nicht durch. Hat die Seite aber
// einmal die Erlaubnis für die Kamera, gibt Chrome die echte Adresse heraus.
// Also holen wir die Erlaubnis, *bevor* die Verbindung entsteht; die Kamera
// geht sofort wieder aus. Zum Scannen brauchen wir sie ohnehin gleich.
async function kameraFreigeben() {
  try {
    const strom = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: false,
    });
    strom.getTracks().forEach((spur) => spur.stop());
    return true;
  } catch {
    return false;
  }
}

/* ------------------------------------------------------------- Verbindung */

/**
 * Baut die Verbindung auf. `aufZustand(text, verbunden)` meldet Fortschritt,
 * `aufNachricht(objekt)` liefert eingehende Daten.
 */
function funkAufbauen({ gastgeber, aufZustand, aufNachricht }) {
  const pc = new RTCPeerConnection({ iceServers: [] });
  let kanal = null;
  let offen = false;
  const lage = { eigene: [], fremde: 0, mdns: false, stand: 'neu', sammeln: 'läuft' };

  const melde = (text) => aufZustand?.(text, offen);

  const kanalVerdrahten = (k) => {
    kanal = k;
    k.onopen = () => { offen = true; aufZustand?.('verbunden', true); };
    k.onclose = () => { offen = false; aufZustand?.('getrennt', false); };
    k.onmessage = (e) => {
      try { aufNachricht?.(JSON.parse(e.data)); } catch { /* kaputte Nachricht */ }
    };
  };

  if (gastgeber) kanalVerdrahten(pc.createDataChannel('seeschlacht', { ordered: true }));
  else pc.ondatachannel = (e) => kanalVerdrahten(e.channel);

  // Mitschreiben, was das Handy findet — sonst steht man bei „Verbinde …" im Dunkeln.
  pc.onicecandidate = (e) => {
    if (!e.candidate) return;
    const roh = e.candidate.candidate;
    if (/\.local\b/.test(roh)) { lage.mdns = true; return; }
    const t = roh.match(/ (\S+) (\d+) typ (?:host|srflx)/);
    if (t && !lage.eigene.includes(`${t[1]}:${t[2]}`)) lage.eigene.push(`${t[1]}:${t[2]}`);
  };

  pc.oniceconnectionstatechange = () => {
    lage.stand = pc.iceConnectionState;
    if (['failed', 'disconnected'].includes(pc.iceConnectionState) && !offen) {
      melde(lage.mdns && !lage.eigene.length
        ? 'Keine Verbindung — dieses Handy hat seine WLAN-Adresse nicht herausgegeben.'
        : 'Keine Verbindung — blockiert euer Hotspot vielleicht den direkten Weg?');
    }
  };

  /** Wartet, bis alle lokalen Adressen gesammelt sind (oder die Geduld endet). */
  const adressenSammeln = () => new Promise((fertig) => {
    if (pc.iceGatheringState === 'complete') { lage.sammeln = 'fertig'; return fertig(); }
    const stopp = setTimeout(() => { lage.sammeln = 'fertig'; fertig(); }, 6000);
    pc.onicegatheringstatechange = () => {
      lage.sammeln = pc.iceGatheringState === 'complete' ? 'fertig' : pc.iceGatheringState;
      if (pc.iceGatheringState === 'complete') { clearTimeout(stopp); fertig(); }
    };
    return undefined;
  });

  return {
    /** Gastgeber: eigenen Code erzeugen. Gast: erst nach codeLesen aufrufen. */
    async eigenerCode() {
      const beschreibung = gastgeber ? await pc.createOffer() : await pc.createAnswer();
      await pc.setLocalDescription(beschreibung);
      await adressenSammeln();
      return funkCodeBauen(pc.localDescription.sdp, gastgeber ? 'O' : 'A');
    },

    async codeLesen(code) {
      const { typ, sdp, kandidaten } = funkCodeLesen(code);
      if (gastgeber && typ !== 'answer') throw new Error('Das ist der Code des Gastgebers — du brauchst den vom Gast.');
      if (!gastgeber && typ !== 'offer') throw new Error('Das ist der Code des Gasts — du brauchst den vom Gastgeber.');
      await pc.setRemoteDescription({ type: typ, sdp });
      for (const k of kandidaten) {
        try { await pc.addIceCandidate(k); lage.fremde += 1; } catch { /* einzelne Adresse taugt nicht */ }
      }
      melde('verbinde …');
    },

    senden(objekt) {
      if (kanal && kanal.readyState === 'open') {
        kanal.send(JSON.stringify(objekt));
        return true;
      }
      return false;
    },

    get verbunden() { return offen; },

    /** Momentaufnahme für die Fehlersuche — reine Lesekopie. */
    get lage() { return { ...lage, eigene: lage.eigene.slice() }; },

    schliessen() {
      try { kanal?.close(); } catch { /* egal */ }
      try { pc.close(); } catch { /* egal */ }
    },
  };
}

/* ---------------------------------------------------------------- Scanner */

const scannerMoeglich = () => typeof window !== 'undefined'
  && 'BarcodeDetector' in window
  && !!navigator.mediaDevices?.getUserMedia;

/**
 * Startet die Kamera und meldet den ersten gefundenen QR-Code.
 * Gibt eine Funktion zum Abschalten zurück.
 */
async function scannerStarten(videoElement, aufTreffer, aufFehler) {
  if (!scannerMoeglich()) {
    aufFehler?.(new Error('Dieser Browser kann keine QR-Codes lesen — nimm den Textcode.'));
    return () => {};
  }
  let laeuft = true;
  let strom = null;

  try {
    strom = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: false,
    });
  } catch (fehler) {
    aufFehler?.(new Error('Kein Zugriff auf die Kamera. Erlaube ihn oder nimm den Textcode.'));
    return () => {};
  }

  videoElement.srcObject = strom;
  videoElement.setAttribute('playsinline', '');
  await videoElement.play().catch(() => {});

  const sucher = new window.BarcodeDetector({ formats: ['qr_code'] });
  const schauen = async () => {
    if (!laeuft) return;
    try {
      const treffer = await sucher.detect(videoElement);
      const code = treffer.find((t) => String(t.rawValue).startsWith(CODE_MARKE));
      if (code) { laeuft = false; aufTreffer(code.rawValue); return stoppen(); }
    } catch { /* einzelner Fehlversuch ist egal */ }
    setTimeout(schauen, 220);
    return undefined;
  };

  const stoppen = () => {
    laeuft = false;
    strom?.getTracks().forEach((t) => t.stop());
    videoElement.srcObject = null;
  };

  schauen();
  return stoppen;
}

// Zwei Handys über das Internet verbinden — für die Fassung auf der Webseite.
//
// Anders als funk.js braucht das kein gemeinsames WLAN und keine Kamera: Der
// Server hält nur einen Raum mit einem kurzen Code offen und reicht Nachrichten
// durch. Er versteht kein Spiel; er merkt sich, wer was noch nicht abgeholt hat.
//
// Nach außen sieht das genauso aus wie eine Direktverbindung — `senden`,
// `verbunden`, `schliessen` — damit die Oberfläche nichts davon wissen muss.

const NETZ_BASIS = (typeof SPIELE_BASIS === 'string' ? SPIELE_BASIS : '.').replace(/\/$/, '');

/** Steht dieser Weg überhaupt zur Verfügung? Nur in der Webfassung. */
const netzMoeglich = () => typeof SPIELE_BASIS === 'string';

async function ruf(pfad, optionen = {}) {
  const antwort = await fetch(`${NETZ_BASIS}/api${pfad}`, {
    cache: 'no-store',
    headers: { 'Content-Type': 'application/json' },
    ...optionen,
  });
  let daten = null;
  try { daten = await antwort.json(); } catch { /* leere Antwort */ }
  if (!antwort.ok) throw new Error((daten && daten.fehler) || `Server meldet ${antwort.status}.`);
  return daten || {};
}

/**
 * Raum aufmachen oder beitreten und danach dauerhaft lauschen.
 *
 * `aufZustand(text, verbunden)` meldet Fortschritt, `aufNachricht(objekt)`
 * liefert alles, was die Gegenseite schickt, `aufCode(code)` den Raumcode,
 * sobald er feststeht.
 */
function netzAufbauen({ gastgeber, code, aufZustand, aufNachricht, aufCode }) {
  let raum = null;         // { code, sitz, schluessel }
  let ab = 0;
  let offen = false;
  let laeuft = true;
  let fehlversuche = 0;

  const melde = (text, verbunden = offen) => aufZustand?.(text, verbunden);

  async function lauschen() {
    while (laeuft && raum) {
      try {
        const q = new URLSearchParams({
          sitz: String(raum.sitz),
          ab: String(ab),
          voll: offen ? '1' : '0',        // der Server meldet sich, sobald sich das ändert
          schluessel: raum.schluessel,
        });
        const daten = await ruf(`/raum/${raum.code}/holen?${q}`);
        if (!laeuft) return;
        fehlversuche = 0;

        if (daten.voll && !offen) { offen = true; aufZustand?.('verbunden', true); }
        if (!daten.voll && offen) { offen = false; aufZustand?.('getrennt', false); }

        for (const n of daten.nachrichten || []) {
          ab = Math.max(ab, n.nr);
          try { aufNachricht?.(n.inhalt); } catch { /* kaputte Nachricht */ }
        }
        if (typeof daten.stand === 'number') ab = Math.max(ab, Math.min(ab, daten.stand));
      } catch (fehler) {
        if (!laeuft) return;
        fehlversuche += 1;
        if (fehlversuche >= 4) {
          offen = false;
          aufZustand?.(`Verbindung abgerissen: ${fehler.message}`, false);
        }
        // Kurz warten, dann weiter — kurze Aussetzer sollen das Spiel nicht beenden.
        await new Promise((w) => setTimeout(w, Math.min(4000, 500 * fehlversuche)));
      }
    }
  }

  const bereit = (async () => {
    melde(gastgeber ? 'Raum wird geöffnet …' : 'Raum wird gesucht …', false);
    raum = gastgeber
      ? await ruf('/raum', { method: 'POST', body: '{}' })
      : await ruf(`/raum/${String(code || '').trim().toUpperCase()}/beitreten`,
        { method: 'POST', body: '{}' });
    aufCode?.(raum.code);
    melde(gastgeber ? 'Warte auf das zweite Handy …' : 'Verbinde …', false);
    lauschen();
    return raum.code;
  })();

  return {
    bereit,                                   // Promise: fertig, sobald der Raum steht
    get code() { return raum && raum.code; },
    get verbunden() { return offen; },

    senden(objekt) {
      if (!raum) return false;
      ruf(`/raum/${raum.code}/senden`, {
        method: 'POST',
        body: JSON.stringify({ sitz: raum.sitz, schluessel: raum.schluessel, nachricht: objekt }),
      }).catch(() => { /* der Lauscher merkt den Ausfall */ });
      return true;
    },

    schliessen() {
      laeuft = false;
      offen = false;
      raum = null;
    },
  };
}

// Seeschlacht — Spiellogik ohne DOM. Alles serialisierbar.
//
// Jede Seite hat ein eigenes Meer. Darin liegen die Schiffe (nur der Besitzer
// kennt sie) und die Schüsse, die auf dieses Meer abgegeben wurden (die sehen
// beide). Diese Trennung ist der ganze Trick: beim Verschicken an das andere
// Handy werden einfach die Schiffe herausgenommen.

const BREITE = 10;
const HOEHE = 10;
const SPALTEN = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];
const SAVE_VERSION = 1;

/** Die klassische deutsche Flotte. */
const FLOTTE = [
  { laenge: 5, anzahl: 1, name: 'Schlachtschiff' },
  { laenge: 4, anzahl: 2, name: 'Kreuzer' },
  { laenge: 3, anzahl: 3, name: 'Zerstörer' },
  { laenge: 2, anzahl: 4, name: 'U-Boot' },
];

const FELDER_GESAMT = FLOTTE.reduce((n, s) => n + s.laenge * s.anzahl, 0);

/** Alle Längen einzeln, längste zuerst — so wird gelegt und gezählt. */
const LAENGEN = FLOTTE.flatMap((s) => Array.from({ length: s.anzahl }, () => s.laenge));

const VORGABE = {
  abstand: true,          // Schiffe dürfen sich nicht berühren, auch nicht über Eck
  trefferNochmal: true,   // ein Treffer bringt einen weiteren Schuss
  breite: BREITE,
  hoehe: HOEHE,
  laengen: LAENGEN,       // die Flotte als Liste von Schiffslängen
  salve: false,           // wenn an: so viele Schüsse je Zug, wie man Schiffe hat
  waffen: false,          // wenn an: Luftschlag, Radar und Mine, je einmal
};

/** Die kleine Flotte für das 8 × 8-Meer: 16 Felder statt 30. */
const KURZE_LAENGEN = [4, 3, 3, 2, 2, 2];

const MODI = [
  {
    id: 'klassisch',
    titel: 'Klassisch',
    zeile: '10 × 10, zehn Schiffe, Treffer bringt einen Nachschuss',
    regeln: {},
  },
  {
    id: 'kurz',
    titel: 'Kurz',
    zeile: '8 × 8 und nur sechs Schiffe — halb so lang',
    regeln: { breite: 8, hoehe: 8, laengen: KURZE_LAENGEN },
  },
  {
    id: 'salve',
    titel: 'Salve',
    zeile: 'So viele Schüsse auf einmal, wie du noch Schiffe hast',
    regeln: { salve: true, trefferNochmal: false },
  },
  {
    id: 'waffen',
    titel: 'Sonderwaffen',
    zeile: 'Luftschlag, Radar und Mine — jede einmal je Partie',
    regeln: { waffen: true },
  },
];

const WAFFEN_LEER = { luftschlag: 0, radar: 0, mine: 0 };
const WAFFEN_VOLL = { luftschlag: 1, radar: 1, mine: 1 };

/* ---------------------------------------------------------------- Felder */

/**
 * Die Maße eines Meeres. Sie stehen am Meer selbst, nicht als Konstante —
 * nur so kann eine Fassung ein kleineres Brett haben. Ältere Spielstände
 * kennen die Felder nicht; für die gilt das klassische 10 × 10.
 */
const masse = (meer) => ({
  breite: meer && meer.breite ? meer.breite : BREITE,
  hoehe: meer && meer.hoehe ? meer.hoehe : HOEHE,
});

/** Die Flotte dieses Meeres als Liste von Schiffslängen. */
const flottenLaengen = (meer) =>
  (meer && Array.isArray(meer.laengen) ? meer.laengen : LAENGEN);

function imMeer(meer, x, y) {
  const { breite, hoehe } = masse(meer);
  return x >= 0 && y >= 0 && x < breite && y < hoehe;
}

const feldName = (x, y) => `${SPALTEN[x]}${y + 1}`;

function feldAus(text, meer = null) {
  const t = String(text || '').trim().toUpperCase();
  const m = t.match(/^([A-J])(10|[1-9])$/);
  if (!m) return null;
  const feld = { x: SPALTEN.indexOf(m[1]), y: Number(m[2]) - 1 };
  return meer && !imMeer(meer, feld.x, feld.y) ? null : feld;
}

/** Die Felder eines Schiffs, das an (x,y) beginnt. */
const felderVon = ({ x, y, laenge, quer }) =>
  Array.from({ length: laenge }, (_, i) => (quer ? { x: x + i, y } : { x, y: y + i }));

/** Alle Nachbarfelder einer Feldmenge — ohne die Felder selbst, ohne Rand. */
function umgebung(meer, felder) {
  const eigen = new Set(felder.map((f) => `${f.x},${f.y}`));
  const raus = new Map();
  for (const f of felder) {
    for (let dx = -1; dx <= 1; dx++) {
      for (let dy = -1; dy <= 1; dy++) {
        const x = f.x + dx;
        const y = f.y + dy;
        if (!imMeer(meer, x, y) || eigen.has(`${x},${y}`)) continue;
        raus.set(`${x},${y}`, { x, y });
      }
    }
  }
  return [...raus.values()];
}

/* ------------------------------------------------------------------ Meer */

function leeresMeer(regeln = {}) {
  const r = { ...VORGABE, ...regeln };
  return {
    schiffe: [], schuesse: {}, versenkte: [],
    abstand: r.abstand,
    breite: r.breite, hoehe: r.hoehe, laengen: [...r.laengen],
    minen: [], radare: [],
  };
}

const schiffAn = (meer, x, y) =>
  meer.schiffe.find((s) => s.felder.some((f) => f.x === x && f.y === y)) || null;

/** Passt ein Schiff an diese Stelle? */
function passt(meer, form) {
  const felder = felderVon(form);
  if (felder.some((f) => !imMeer(meer, f.x, f.y))) return false;
  if (felder.some((f) => schiffAn(meer, f.x, f.y))) return false;
  if (meer.abstand === false) return true;
  return !umgebung(meer, felder).some((n) => schiffAn(meer, n.x, n.y));
}

function setzen(meer, form) {
  if (!passt(meer, form)) return false;
  meer.schiffe.push({ ...form, felder: felderVon(form) });
  return true;
}

/** Nimmt das Schiff weg, das auf diesem Feld liegt. */
function entfernen(meer, x, y) {
  const s = schiffAn(meer, x, y);
  if (!s) return false;
  meer.schiffe = meer.schiffe.filter((o) => o !== s);
  return true;
}

const gelegteSchiffe = (meer) =>
  (typeof meer.anzahl === 'number' ? meer.anzahl : meer.schiffe.length);

const flotteFertig = (meer) => gelegteSchiffe(meer) === flottenLaengen(meer).length;

/**
 * Legt eine vollständige Flotte zufällig aus. Die langen Schiffe zuerst —
 * sonst verstellen die kurzen die letzten freien Bahnen.
 */
function zufallsflotte(meer, rnd = Math.random) {
  meer.schiffe = [];
  meer.schuesse = {};
  meer.versenkte = [];
  return flotteAuffuellen(meer, rnd);
}

/**
 * Legt die noch fehlenden Schiffe dazu und lässt liegen, was schon da ist.
 * Die langen zuerst — sonst verstellen die kurzen die letzten freien Bahnen.
 */
function flotteAuffuellen(meer, rnd = Math.random) {
  const { breite, hoehe } = masse(meer);
  const vorher = meer.schiffe.slice();
  // Schleife statt Rekursion, und mit Deckel: bei einem Zufallsgeber, der immer
  // dieselbe Zahl liefert, lief sich die alte Fassung in den Stapelüberlauf.
  // Mit echtem Zufall greift der Deckel praktisch nie — beim ersten Anlauf
  // klappt es fast immer.
  for (let anlauf = 0; anlauf < 60; anlauf++) {
    meer.schiffe = vorher.slice();
    const fehlt = flottenLaengen(meer).slice();
    for (const s of meer.schiffe) {
      const i = fehlt.indexOf(s.laenge);
      if (i >= 0) fehlt.splice(i, 1);
    }
    let alleGelegt = true;
    for (const laenge of fehlt) {
      let gelegt = false;
      for (let versuch = 0; versuch < 800 && !gelegt; versuch++) {
        const quer = rnd() < 0.5;
        const x = Math.floor(rnd() * (quer ? breite - laenge + 1 : breite));
        const y = Math.floor(rnd() * (quer ? hoehe : hoehe - laenge + 1));
        gelegt = setzen(meer, { x, y, laenge, quer });
      }
      if (!gelegt) { alleGelegt = false; break; }
    }
    if (alleGelegt) return meer;
  }
  meer.schiffe = vorher.slice();
  throw new Error('Für diese Flotte ist im Meer kein Platz.');
}

const versenkt = (meer, schiff) =>
  schiff.felder.every((f) => meer.schuesse[`${f.x},${f.y}`] === 'treffer');

const alleVersenkt = (meer) =>
  meer.schiffe.length > 0 && meer.schiffe.every((s) => versenkt(meer, s));

/* ------------------------------------------------------------------ Stand */

function neuerStand(namen = ['Monty', 'Christina'], regeln = {}) {
  const r = { ...VORGABE, ...regeln };
  return {
    v: SAVE_VERSION,
    spieler: namen.map((name) => ({ name })),
    meere: [leeresMeer(r), leeresMeer(r)],
    dran: 0,
    siege: [0, 0],
    partie: 1,
    regeln: r,
    waffen: [{ ...(r.waffen ? WAFFEN_VOLL : WAFFEN_LEER) },
      { ...(r.waffen ? WAFFEN_VOLL : WAFFEN_LEER) }],
    salve: [],
    aussetzen: [0, 0],
    letzterSchuss: null,
    letzteWaffe: null,
    fertig: null,
  };
}

const bereit = (stand, spieler) => flotteFertig(stand.meere[spieler]);

/**
 * 'legen', solange eine Flotte fehlt — danach 'schiessen'. Bewusst berechnet
 * und nicht im Zustand abgelegt: ein zweites Feld daneben könnte der Wahrheit
 * widersprechen, und genau das war schon einmal der Fall.
 */
function phase(stand) {
  if (stand.fertig !== null) return 'ende';
  return bereit(stand, 0) && bereit(stand, 1) ? 'schiessen' : 'legen';
}

// `fertig` ist der Index des Siegers und darf 0 sein — nie auf Wahrheit prüfen.
const vorbei = (stand) => stand.fertig !== null;

const anderer = (i) => (i === 0 ? 1 : 0);

/* --------------------------------------------------------------- Schießen */

/**
 * Ein Schuss auf das Meer der Gegenseite. Gibt zurück, was passiert ist,
 * oder null, wenn der Schuss gar nicht zulässig war.
 */
function schiessen(stand, x, y) {
  if (vorbei(stand)) return null;
  if (phase(stand) !== 'schiessen') return null;
  const ziel = anderer(stand.dran);
  const meer = stand.meere[ziel];
  if (!imMeer(meer, x, y)) return null;
  if (meer.schuesse[`${x},${y}`]) return null;
  return treffenUndPruefen(stand, x, y);
}

/**
 * Ein einzelnes Feld beschießen und alles daran hängende auflösen: versenkt,
 * Umgebung aufdecken, Mine ausgelöst, Sieg. Gibt weder ab noch prüft es, ob
 * geschossen werden darf — das machen die Aufrufer, weil Salve und Luftschlag
 * mehrere Felder auf einmal treffen.
 */
function treffenUndPruefen(stand, x, y, abgeben = true) {
  const ziel = anderer(stand.dran);
  const meer = stand.meere[ziel];
  const schiff = schiffAn(meer, x, y);
  meer.schuesse[`${x},${y}`] = schiff ? 'treffer' : 'wasser';

  let istVersenkt = false;
  if (schiff && versenkt(meer, schiff)) {
    istVersenkt = true;
    // Rund um ein versenktes Schiff kann nichts mehr liegen — das deckt sich auf.
    for (const n of umgebung(meer, schiff.felder)) {
      if (!meer.schuesse[`${n.x},${n.y}`]) meer.schuesse[`${n.x},${n.y}`] = 'wasser';
    }
    meer.versenkte.push({ laenge: schiff.laenge, felder: schiff.felder.map((f) => ({ ...f })) });
  }

  // Eine Mine der Gegenseite: sie fliegt auf, und der Schütze setzt aus.
  const mine = (meer.minen || []).find((m) => m.x === x && m.y === y && !m.ausgeloest);
  if (mine) {
    mine.ausgeloest = true;
    stand.aussetzen[stand.dran] = 1;
  }

  const ergebnis = {
    treffer: !!schiff, versenkt: istVersenkt, mine: !!mine, x, y, schuetze: stand.dran,
  };
  stand.letzterSchuss = ergebnis;

  if (alleVersenkt(meer)) {
    stand.fertig = stand.dran;
    stand.siege[stand.dran] += 1;
    return ergebnis;
  }
  if (abgeben && !(schiff && !mine && stand.regeln.trefferNochmal)) abgeben1(stand);
  return ergebnis;
}

/**
 * Den Zug abgeben — und dabei ein Aussetzen einlösen. Wer auf eine Mine
 * geschossen hat, wird beim nächsten Mal übersprungen; dadurch kommt die
 * Gegenseite zweimal hintereinander an die Reihe.
 */
function abgeben1(stand) {
  const naechster = anderer(stand.dran);
  if (stand.aussetzen && stand.aussetzen[naechster] > 0) {
    stand.aussetzen[naechster] -= 1;
    return;                                   // derselbe bleibt dran
  }
  stand.dran = naechster;
}

/* ------------------------------------------------------------------ Salve */

/** Wie viele Schüsse hat man diesen Zug? 0, wenn nicht im Salve-Modus. */
function salveGroesse(stand) {
  if (!stand.regeln.salve || vorbei(stand) || phase(stand) !== 'schiessen') return 0;
  return nochUebrig(stand.meere[stand.dran]);
}

/** Ein Feld für die Salve vormerken — oder die Vormerkung zurücknehmen. */
function markieren(stand, x, y) {
  if (!stand.regeln.salve) throw new Error('Diese Fassung kennt keine Salve.');
  if (salveGroesse(stand) <= 0) throw new Error('Gerade ist keine Salve möglich.');
  const meer = stand.meere[anderer(stand.dran)];
  if (!imMeer(meer, x, y)) return false;
  if (meer.schuesse[`${x},${y}`]) return false;
  const i = stand.salve.findIndex((f) => f.x === x && f.y === y);
  if (i >= 0) { stand.salve.splice(i, 1); return false; }
  if (stand.salve.length >= salveGroesse(stand)) return false;
  stand.salve.push({ x, y });
  return true;
}

/** Die vorgemerkten Felder alle auf einmal beschießen. */
function salveFeuern(stand) {
  if (!stand.regeln.salve) throw new Error('Diese Fassung kennt keine Salve.');
  const soll = salveGroesse(stand);
  const meer = stand.meere[anderer(stand.dran)];
  // Am Ende sind vielleicht weniger freie Felder übrig als Schüsse.
  const { breite, hoehe } = masse(meer);
  let frei = 0;
  for (let x = 0; x < breite; x++) {
    for (let y = 0; y < hoehe; y++) if (!meer.schuesse[`${x},${y}`]) frei += 1;
  }
  if (stand.salve.length < Math.min(soll, frei)) {
    throw new Error('Es fehlen noch Ziele für die Salve.');
  }
  const felder = stand.salve.slice();
  stand.salve = [];
  const ergebnisse = [];
  for (const f of felder) {
    // Kein Abgeben zwischendurch: erst wenn die ganze Salve draußen ist.
    ergebnisse.push(treffenUndPruefen(stand, f.x, f.y, false));
    if (vorbei(stand)) break;
  }
  if (!vorbei(stand)) abgeben1(stand);
  return ergebnisse;
}

/* ------------------------------------------------------------ Sonderwaffen */

const waffenVorrat = (stand, spieler) =>
  ({ ...WAFFEN_LEER, ...((stand.waffen || [])[spieler] || {}) });

function waffePruefen(stand, name) {
  if (vorbei(stand)) throw new Error('Die Partie ist vorbei.');
  if (phase(stand) !== 'schiessen') throw new Error('Erst müssen beide Flotten liegen.');
  if (stand.salve && stand.salve.length) throw new Error('Erst die Salve abschließen.');
  if (waffenVorrat(stand, stand.dran)[name] <= 0) {
    throw new Error('Diese Waffe ist schon verbraucht.');
  }
}

/**
 * Luftschlag: drei Felder in einer Reihe, waagerecht oder senkrecht.
 * Beendet den Zug in jedem Fall — auch bei Treffern. Sonst wäre er zu stark.
 */
function luftschlag(stand, x, y, quer) {
  waffePruefen(stand, 'luftschlag');
  const meer = stand.meere[anderer(stand.dran)];
  const felder = Array.from({ length: 3 }, (_, i) => (quer ? { x: x + i, y } : { x, y: y + i }));
  if (felder.some((f) => !imMeer(meer, f.x, f.y))) {
    throw new Error('Der Luftschlag ginge über den Rand hinaus.');
  }
  stand.waffen[stand.dran].luftschlag -= 1;
  const ergebnisse = [];
  for (const f of felder) {
    if (meer.schuesse[`${f.x},${f.y}`]) continue;      // schon beschossen: überspringen
    ergebnisse.push(treffenUndPruefen(stand, f.x, f.y, false));
    if (vorbei(stand)) break;
  }
  stand.letzteWaffe = { art: 'luftschlag', spieler: stand.dran, x, y, quer };
  if (!vorbei(stand)) abgeben1(stand);
  return ergebnisse;
}

/**
 * Radar: meldet, wie viele Schiffsfelder in einem 3 × 3-Feld liegen — mehr
 * nicht. Es deckt nichts auf und markiert nichts; man weiß danach nur, dass
 * dort etwas ist. Die Gegenseite sieht, wo geschaut wurde: in der Papierfassung
 * müsste sie die Frage ja beantworten.
 */
function radar(stand, x, y) {
  waffePruefen(stand, 'radar');
  const meer = stand.meere[anderer(stand.dran)];
  if (!imMeer(meer, x, y)) throw new Error('Dieses Feld gibt es nicht.');
  stand.waffen[stand.dran].radar -= 1;
  let anzahl = 0;
  for (let dx = -1; dx <= 1; dx++) {
    for (let dy = -1; dy <= 1; dy++) {
      if (imMeer(meer, x + dx, y + dy) && schiffAn(meer, x + dx, y + dy)) anzahl += 1;
    }
  }
  meer.radare = [...(meer.radare || []), { x, y, anzahl }];
  stand.letzteWaffe = { art: 'radar', spieler: stand.dran, x, y, anzahl };
  abgeben1(stand);
  return anzahl;
}

/**
 * Mine: auf das **eigene** Meer gelegt und bis zur Auslösung geheim. Wer
 * daraufschießt, setzt einen Zug aus.
 */
function mineLegen(stand, x, y) {
  waffePruefen(stand, 'mine');
  const meer = stand.meere[stand.dran];
  if (!imMeer(meer, x, y)) throw new Error('Dieses Feld gibt es nicht.');
  if (meer.schuesse[`${x},${y}`]) throw new Error('Auf dieses Feld wurde schon geschossen.');
  if ((meer.minen || []).some((m) => m.x === x && m.y === y)) {
    throw new Error('Dort liegt schon eine Mine.');
  }
  stand.waffen[stand.dran].mine -= 1;
  meer.minen = [...(meer.minen || []), { x, y, ausgeloest: false }];
  stand.letzteWaffe = { art: 'mine', spieler: stand.dran, x, y };
  abgeben1(stand);
  return true;
}

/** Wie viele Schiffe stehen hier noch? */
const nochUebrig = (meer) =>
  meer.schiffe.filter((s) => !versenkt(meer, s)).length;

/* -------------------------------------------- Was das andere Handy sehen darf */

/**
 * Der Stand aus Sicht eines Geräts. Die Schiffe des Gegners werden
 * herausgenommen — nur Treffer, Wasser und schon versenkte Schiffe bleiben.
 */
function gegnerSicht(stand, empfaenger) {
  const k = JSON.parse(JSON.stringify(stand));
  const gegner = anderer(empfaenger);
  // `anzahl` bleibt: wie viele Schiffe drüben liegen, weiß ohnehin jeder — und
  // ohne diese Zahl käme der Empfänger nie aus der Legephase heraus.
  k.meere[gegner] = {
    ...k.meere[gegner],
    schiffe: [],
    anzahl: stand.meere[gegner].schiffe.length,
    // Eine Mine ist so geheim wie ein Schiff — bis sie hochgeht.
    minen: (stand.meere[gegner].minen || []).filter((m) => m.ausgeloest).map((m) => ({ ...m })),
  };
  return k;
}

/* --------------------------------------------------- Punktestand mitnehmen */

function alsCode(stand) {
  const kern = {
    v: SAVE_VERSION, n: stand.spieler.map((s) => s.name),
    s: stand.siege, p: stand.partie, r: stand.regeln,
  };
  return `SEE1-${btoa(unescape(encodeURIComponent(JSON.stringify(kern))))}`;
}

function ausCode(code) {
  const roh = String(code || '').trim();
  if (!roh.startsWith('SEE1-')) throw new Error('Das ist kein Seeschlacht-Punktestand.');
  let kern;
  try {
    kern = JSON.parse(decodeURIComponent(escape(atob(roh.slice(5)))));
  } catch {
    throw new Error('Der Code ist unvollständig oder verrutscht.');
  }
  if (!kern || !Array.isArray(kern.s) || kern.s.length !== 2) {
    throw new Error('Der Code passt nicht zu diesem Spiel.');
  }
  const stand = neuerStand(
    Array.isArray(kern.n) && kern.n.length === 2 ? kern.n : undefined,
    kern.r && typeof kern.r === 'object' ? kern.r : {},
  );
  stand.siege = kern.s.map((n) => (Number.isFinite(n) ? n : 0));
  stand.partie = Number.isFinite(kern.p) ? kern.p : 1;
  return stand;
}

/** Neue Partie: Meere leer, Punkte bleiben. Der Verlierer beginnt. */
function partieNeu(stand) {
  const beginnt = stand.fertig === null ? stand.dran : anderer(stand.fertig);
  stand.meere = [leeresMeer(stand.regeln), leeresMeer(stand.regeln)];
  stand.dran = beginnt;
  stand.waffen = [0, 1].map(() => ({ ...(stand.regeln.waffen ? WAFFEN_VOLL : WAFFEN_LEER) }));
  stand.salve = [];
  stand.aussetzen = [0, 0];
  stand.letzterSchuss = null;
  stand.letzteWaffe = null;
  stand.fertig = null;
  stand.partie += 1;
  return stand;
}

// Seeschlacht — Oberfläche. Ein Handy zum Weiterreichen oder zwei zugleich.
//
// Der heikle Teil ist das Verstecken: An einem Handy darf die eigene Flotte nur
// zu sehen sein, wenn man sie selbst in der Hand hat. Darum zeigt der
// Schießbildschirm dort nur das gegnerische Meer — die eigene Flotte liegt
// hinter einem Übergabe-Bildschirm.


const KEY = 'seeschlacht.v1';
const app = document.getElementById('app');

let stand = null;
let ui = {
  modusWahl: 'klassisch',
  waffe: null,           // 'luftschlag' | 'radar' | 'mine', wenn eine gezielt wird
  waffeQuer: true,       // Ausrichtung des Luftschlags
  screen: 'start',
  overlay: null,
  halter: 0,          // wer das Handy in der Hand hat (nur an einem Gerät)
  legtGerade: 0,      // wer gerade seine Flotte legt (nur an einem Gerät)
  legenFertig: false, // beide Flotten bestätigt (an einem Gerät)
  bestaetigt: false,  // dieses Gerät hat „Fertig" gedrückt (auf zwei Geräten)
  uebergabeNoetig: false,
  quer: true,         // Ausrichtung beim Legen
  codeStatus: '',
  modus: 'lokal',
  meinIndex: 0,
  gastgeber: true,
  netz: null,
  kopplung: null,
};

/* ------------------------------------------------------------------ Hilfen */

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const andere = (i) => (i === 0 ? 1 : 0);
const name = (i) => esc(stand.spieler[i]?.name || (i === 0 ? 'Eins' : 'Zwei'));
const buzz = (ms) => { try { navigator.vibrate?.(ms); } catch { /* egal */ } };
const einHandy = () => ui.modus === 'lokal';

/** Wer ist auf diesem Gerät gerade der Handelnde? */
const ich = () => (einHandy() ? ui.legtGerade : ui.meinIndex);

function sichern() {
  // Am Gast hängt nur eine beschnittene Fassung — die darf auch so auf die Platte.
  try { localStorage.setItem(KEY, JSON.stringify(stand)); } catch { /* privater Modus */ }
}

function laden() {
  try {
    const roh = localStorage.getItem(KEY);
    if (!roh) return null;
    const s = JSON.parse(roh);
    if (s && s.v === 1 && Array.isArray(s.siege) && Array.isArray(s.meere)) return s;
  } catch { /* kaputter Stand wird ignoriert */ }
  return null;
}

function nachAenderung() {
  if (ui.modus === 'online') {
    if (ui.gastgeber) standSenden();
    render();
    return;
  }
  sichern();
  render();
}

/* ---------------------------------------------------- Zwei Handys, ein Spiel */

const gegenIndex = () => (ui.meinIndex === 0 ? 1 : 0);

function standSenden() {
  ui.netz?.senden({ typ: 'stand', stand: gegnerSicht(stand, gegenIndex()) });
}

function tun(name2, wert) {
  if (ui.modus === 'online' && !ui.gastgeber) {
    ui.netz?.senden({ typ: 'aktion', name: name2, wert });
    return false;
  }
  return true;
}

function nachrichtVerarbeiten(m) {
  if (m.typ === 'namen' && !ui.gastgeber) {
    ui.meinIndex = m.meinIndex === 1 ? 1 : 0;
    return;
  }
  if (m.typ === 'stand' && !ui.gastgeber) {
    // Die eigene Flotte kennt nur dieses Gerät — sie darf nicht überschrieben werden.
    const eigenesMeer = stand?.meere?.[ui.meinIndex];
    stand = m.stand;
    if (eigenesMeer && eigenesMeer.schiffe.length) {
      stand.meere[ui.meinIndex].schiffe = eigenesMeer.schiffe;
    }
    ui.screen = 'spiel';
    render();
    return;
  }
  if (!ui.gastgeber || !stand) return;

  if (m.typ === 'flotte') {
    // Der Gast schickt seine Flotte — anders kann der Gastgeber nicht rechnen.
    const meer = stand.meere[m.spieler];
    meer.schiffe = m.schiffe;
    sichern();
    standSenden();
    render();
    return;
  }

  if (m.typ === 'aktion') {
    try {
      if (m.name === 'schiessen') schiessen(stand, m.wert.x, m.wert.y);
      else if (m.name === 'markieren') markieren(stand, m.wert.x, m.wert.y);
      else if (m.name === 'feuern') salveFeuern(stand);
      else if (m.name === 'waffe') {
        if (m.wert.art === 'luftschlag') luftschlag(stand, m.wert.x, m.wert.y, m.wert.quer);
        else if (m.wert.art === 'radar') radar(stand, m.wert.x, m.wert.y);
        else if (m.wert.art === 'mine') mineLegen(stand, m.wert.x, m.wert.y);
      }
      else if (m.name === 'partieNeu') partieNeu(stand);
      else if (m.name === 'regel') stand.regeln = { ...stand.regeln, ...m.wert };
      else return;
    } catch { return; }
    sichern();
    standSenden();
    render();
  }
}

function kopplungAbbrechen() {
  ui.netz?.schliessen();
  ui.netz = null;
  ui.kopplung = null;
  ui.modus = 'lokal';
  ui.meinIndex = 0;
  ui.gastgeber = true;
  render();
}

async function netzStarten(gastgeber, code) {
  ui.modus = 'online';
  ui.gastgeber = gastgeber;
  ui.meinIndex = gastgeber ? 0 : 1;
  ui.kopplung = { schritt: 'raum', gastgeber, code: '', hinweis: '', fehler: '' };
  render();

  ui.netz = netzAufbauen({
    gastgeber,
    code,
    aufZustand: (text, verbunden) => {
      if (verbunden) return verbindungSteht();
      if (ui.kopplung) { ui.kopplung.hinweis = text; render(); }
      return undefined;
    },
    aufNachricht: nachrichtVerarbeiten,
    aufCode: (c) => { if (ui.kopplung) { ui.kopplung.code = c; render(); } },
  });

  try {
    await ui.netz.bereit;
  } catch (fehler) {
    if (!ui.kopplung) return;
    ui.kopplung.fehler = fehler.message || 'Das hat nicht geklappt.';
    ui.kopplung.schritt = gastgeber ? 'raum' : 'code';
    render();
  }
}

function verbindungSteht() {
  // Kann zweimal gemeldet werden — dann darf die Partie nicht erneut hochzählen.
  if (!ui.kopplung) return;
  ui.kopplung = null;
  ui.legenFertig = false;
  ui.bestaetigt = false;
  ui.uebergabeNoetig = false;
  // Beim Koppeln beginnt eine frische Partie: die Flotten müssen neu liegen,
  // schon damit keine halb gelegte Aufstellung durcheinandergerät.
  if (ui.gastgeber) {
    if (!stand) stand = neuerStand();
    partieNeu(stand);
    ui.screen = 'spiel';
    ui.netz?.senden({ typ: 'namen', meinIndex: 1 });
    standSenden();
  }
  render();
}

/* ------------------------------------------------- Seite als Datei sichern */

function seitenQuelltext(cssId, jsId, ersatzTitel) {
  const css = document.getElementById(cssId)?.textContent || '';
  const js = document.getElementById(jsId)?.textContent || '';
  if (!css || !js) return null;
  const kopf = typeof SEITENKOPF === 'string'
    ? SEITENKOPF
    : `<meta charset="utf-8"><title>${ersatzTitel}</title>`;
  return [
    '<!doctype html>', '<html lang="de">', '<head>', kopf,
    `<style id="${cssId}">`, css, '</style>', '</head>', '<body>',
    '<div id="app"></div>',
    `<script id="${jsId}">`, js, '<' + '/script>',
    '</body>', '</html>', '',
  ].join('\n');
}

function browserDownload(dateiname, html) {
  const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  const a = document.createElement('a');
  a.href = url; a.download = dateiname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

/** Rückgabe: 'ok' | 'txt' | 'abgelehnt' | 'dev' */
async function seiteAlsDateiSichern(cssId, jsId, dateiname, ersatzTitel) {
  if (typeof OFFLINE_DATEI === 'string') {
    const a = document.createElement('a');
    a.href = OFFLINE_DATEI; a.download = dateiname;
    document.body.appendChild(a); a.click(); a.remove();
    return 'ok';
  }
  const html = seitenQuelltext(cssId, jsId, ersatzTitel);
  if (!html) return 'dev';
  const dl = typeof window !== 'undefined' && window.claude ? window.claude.downloads : null;
  if (dl) {
    try {
      await dl.save({ filename: dateiname, data: html });
      return 'ok';
    } catch (fehler) {
      const code = fehler && fehler.code;
      if (code === 'declined') return 'abgelehnt';
      if (code === 'rejected_extension' || code === 'extension_not_enabled') {
        try {
          await dl.save({ filename: dateiname.replace(/\.html$/, '') + '.txt', data: html });
          return 'txt';
        } catch (zweiterFehler) {
          if (zweiterFehler && zweiterFehler.code === 'declined') return 'abgelehnt';
        }
      }
    }
  }
  browserDownload(dateiname, html);
  return 'ok';
}

const SICHER_TEXT = {
  ok: 'Gesichert — liegt in deinen Downloads',
  txt: 'Als .txt gesichert — bitte in %NAME% umbenennen',
  abgelehnt: 'Abgebrochen — nichts gespeichert',
  dev: 'Geht nur in der fertigen Version',
};

/* ----------------------------------------------------------- Erste Anlage */

function renderStart() {
  app.innerHTML = `
    <div class="screen"><div class="scroll"><div class="wrap" style="text-align:center">
      <h1 class="wortmarke">See<em>schlacht</em></h1>
      <p class="unterzeile">Flotte verstecken, Feld für Feld suchen. Wer zuerst
        die ganze gegnerische Flotte versenkt, gewinnt.</p>
      <div class="feldlabel">Wer spielt?</div>
      <input class="feld" id="n1" maxlength="14" placeholder="Erster Name" value="Monty">
      <div style="height:10px"></div>
      <input class="feld" id="n2" maxlength="14" placeholder="Zweiter Name" value="Christina">
      <div class="feldlabel">Welche Fassung?</div>
      <div class="wahlliste">
        ${MODI.map((m) => `
          <button class="wahl${m.id === ui.modusWahl ? ' wahl--an' : ''}" data-modus="${m.id}">
            <div class="haupt">
              <div class="oben">${esc(m.titel)}</div>
              <div class="unten">${esc(m.zeile)}</div>
            </div>
            <span class="haken">✓</span>
          </button>`).join('')}

/* ------------------------------------------------------------- Das Raster */

/**
 * Zeichnet ein Meer. `zeigeSchiffe` entscheidet über die eigenen Rümpfe,
 * `klickbar` schaltet die Zellen scharf.
 */
function meerGitter(meer, {
  zeigeSchiffe, klickbar, klasse = '', letzter = null,
  markiert = [], vorschau = [], zeigeMinen = false,
}) {
  // `zeigeMinen` ist absichtlich dreiwertig: auf dem **eigenen** Meer sieht man
  // alle eigenen Minen ('alle'), auf dem **fremden** nur die, die schon
  // hochgegangen sind ('ausgeloest'). Am einen Handy gibt es keine Redaktion
  // durch `gegnerSicht` — stünde hier `true`, verriete der Schießbildschirm die
  // gelegte Mine der Gegenseite, und man müsste das Feld nur meiden.
  const { breite, hoehe } = masse(meer);
  const istMarkiert = (x, y) => markiert.some((f) => f.x === x && f.y === y);
  const istVorschau = (x, y) => vorschau.some((f) => f.x === x && f.y === y);
  const zellen = [`<div class="kopfzelle"></div>`];
  for (const sp of SPALTEN.slice(0, breite)) zellen.push(`<div class="kopfzelle">${sp}</div>`);
  for (let y = 0; y < hoehe; y++) {
    zellen.push(`<div class="kopfzelle">${y + 1}</div>`);
    for (let x = 0; x < breite; x++) {
      const schuss = meer.schuesse[`${x},${y}`];
      const schiff = zeigeSchiffe ? schiffAn(meer, x, y) : null;
      const wrack = schuss === 'treffer'
        && (meer.versenkte || []).some((v) => v.felder.some((f) => f.x === x && f.y === y));
      const gefunden = zeigeMinen
        ? (meer.minen || []).find((m) => m.x === x && m.y === y) : null;
      const mine = gefunden && (zeigeMinen === 'alle' || gefunden.ausgeloest) ? gefunden : null;
      const teile = ['zelle'];
      if (schiff && !schuss) teile.push('zelle--schiff');
      if (schuss === 'wasser') teile.push('zelle--daneben');
      if (schuss === 'treffer') teile.push(wrack ? 'zelle--wrack' : 'zelle--treffer');
      if (letzter && letzter.x === x && letzter.y === y) teile.push('zelle--letzter');
      if (istMarkiert(x, y)) teile.push('zelle--markiert');
      if (istVorschau(x, y)) teile.push('zelle--vorschau');
      if (mine) teile.push(mine.ausgeloest ? 'zelle--mine-weg' : 'zelle--mine');
      const frei = klickbar && (!schuss || istMarkiert(x, y));
      if (frei) teile.push('zelle--frei');
      zellen.push(`<button class="${teile.join(' ')}" ${klickbar ? '' : 'disabled'}`
        + ` data-x="${x}" data-y="${y}" aria-label="${feldName(x, y)}"></button>`);
    }
  }
  // Radarbefunde: eine kleine Zahl auf der Mitte des abgesuchten Quadrats.
  const marken = (meer.radare || []).map((r) =>
    `<span class="radarmarke" style="--rx:${r.x + 1};--ry:${r.y + 1}"
      title="Radar: ${r.anzahl}">${r.anzahl}</span>`).join('');
  return `<div class="meer ${klasse}" style="--spalten:${breite + 1}">`
    + `${zellen.join('')}${marken}</div>`;
}

/** Die Flottenliste — welche Schiffe stehen noch, welche sind weg. */
function flottenLeiste(meer, { alsGegner = false } = {}) {
  const potts = [];
  const gelegt = meer.schiffe.map((s) => s.laenge);
  const versenkteLaengen = alsGegner
    ? (meer.versenkte || []).map((v) => v.laenge)
    : meer.schiffe.filter((s) => versenkt(meer, s)).map((s) => s.laenge);
  const offenVersenkt = versenkteLaengen.slice();
  const offenGelegt = gelegt.slice();

  for (const laenge of flottenLaengen(meer)) {
    const iw = offenVersenkt.indexOf(laenge);
    const weg = iw >= 0;
    if (weg) offenVersenkt.splice(iw, 1);
    let steht = true;
    if (!alsGegner) {
      const ig = offenGelegt.indexOf(laenge);
      steht = ig >= 0;
      if (steht) offenGelegt.splice(ig, 1);
    }
    const rumpf = Array.from({ length: laenge }, () => '<span class="planke"></span>').join('');
    const klassen = ['pott'];
    if (weg) klassen.push('pott--weg');
    else if (!steht) klassen.push('pott--dran');
    potts.push(`<span class="${klassen.join(' ')}"><span class="rumpf">${rumpf}</span></span>`);
  }
  return `<div class="flotte">${potts.join('')}</div>`;
}
/* ------------------------------------- Kopplung ohne Server: QR im selben WLAN */

/** Womit hängt dieses Handy gerade am Netz? Chrome kennt die Antwort. */
function netzArt() {
  const c = navigator.connection || navigator.mozConnection || {};
  if (c.type) return c.type === 'none' ? 'kein Netz' : c.type;
  return navigator.onLine ? 'verbunden' : 'kein Netz';
}

/** Was die Direktverbindung gerade weiß — in einer Zeile, für den Ernstfall. */
function lageText(l, ausfuehrlich) {
  if (!l) return '';
  const kamera = ui.kopplung?.kamera;
  const stumm = l.mdns && !l.eigene.length;         // nur .local statt echter Adresse
  const leer = !l.mdns && !l.eigene.length && l.sammeln === 'fertig';  // gar nichts gefunden
  if (!ausfuehrlich && !stumm && !leer) return '';  // läuft alles: keine Technik im Weg
  const teile = [];
  if (ausfuehrlich) {
    teile.push(`Eigene Adresse: ${l.eigene.length ? l.eigene.join('  ') : 'noch keine'}`,
      `Gegenseite: ${l.fremde}`, `Stand: ${l.stand}`,
      `Kamera: ${kamera === undefined ? '?' : (kamera ? 'frei' : 'abgelehnt')}`,
      `Netz: ${netzArt()}`);
  }
  if (stumm) {
    teile.push('Dieses Handy gibt seine WLAN-Adresse nicht heraus. Erlaube der Seite die '
      + 'Kamera (Schloss-Symbol neben der Adresse → Berechtigungen → Kamera) und koppelt neu.');
  }
  if (leer && kamera === false) {
    teile.push('Dieses Handy hat keine Netzwerkadresse gefunden — und die Kamera ist nicht '
      + 'freigegeben. Ohne sie gibt Chrome keine Adresse heraus. Erst freigeben, dann neu koppeln.');
  } else if (leer) {
    teile.push('Dieses Handy hat keine Netzwerkadresse gefunden, obwohl die Kamera frei ist. '
      + 'Chrome sieht hier also kein Netz. Läuft auf diesem Handy der Hotspot? Ein Handy, das '
      + 'selbst den Hotspot aufspannt, meldet Android oft gar kein Netz — dann kann es nicht '
      + 'mitspielen. Abhilfe: beide Handys in dasselbe WLAN einwählen. Gibt es keins, spielt '
      + 'an einem Handy und reicht es hin und her.');
  }
  return teile.join(' · ');
}

/** Zeigt den Kamera-Bildschirm und wartet, wie es weitergehen soll. */
function kameraFrage() {
  return new Promise((fertig) => {
    ui.kopplung.schritt = 'kamera';
    ui.kopplung.kameraAntwort = fertig;
    render();
  });
}

/** Hält die Technikzeile aktuell, solange gekoppelt wird. */
function lageTakten() {
  if (ui.lageTakt) clearInterval(ui.lageTakt);
  ui.lageTakt = setInterval(() => {
    if (!ui.kopplung || !ui.netz) { clearInterval(ui.lageTakt); ui.lageTakt = null; return; }
    const feld = document.getElementById('lage');
    if (feld) feld.textContent = lageText(ui.netz.lage, ui.kopplung.schritt === 'warten');
  }, 500);
}

/** Kopplung von vorn: alte Verbindung weg, gleiche Rolle noch einmal. */
function kopplungNeu() {
  const gastgeber = ui.kopplung?.gastgeber ?? true;
  ui.netz?.schliessen();
  ui.netz = null;
  funkStarten(gastgeber);
}

/**
 * Direktverbindung zwischen zwei Handys. Braucht keinen Server, dafür ein
 * gemeinsames WLAN — nach außen sieht sie aus wie die Durchreiche.
 */
async function funkStarten(gastgeber) {
  ui.modus = 'online';
  ui.gastgeber = gastgeber;
  ui.meinIndex = gastgeber ? 0 : 1;
  ui.kopplung = { schritt: 'moment', gastgeber, ueberQr: true, hinweis: '', fehler: '' };
  render();

  // Erst die Kamera-Erlaubnis, dann die Verbindung. Ohne sie gibt Chrome die eigene
  // Netzwerkadresse nicht heraus — das Handy findet dann gar keine oder nur einen
  // .local-Namen, den ein Hotspot nicht auflöst. Scannen müssen wir gleich ohnehin.
  let frei = await kameraFreigeben();
  while (!frei) {
    if (!ui.kopplung) return;                 // in der Zwischenzeit abgebrochen
    const wahl = await kameraFrage();
    if (!ui.kopplung || wahl === 'abbruch') return;
    if (wahl === 'weiter') break;
    frei = await kameraFreigeben();
  }
  if (!ui.kopplung) return;
  ui.kopplung.kamera = frei;
  ui.kopplung.schritt = 'moment';
  render();

  ui.netz = funkAufbauen({
    gastgeber,
    aufZustand: (text, verbunden) => {
      if (verbunden) return verbindungSteht();
      if (ui.kopplung && ui.kopplung.schritt !== 'scannen') {
        ui.kopplung.hinweis = text;
        render();
      }
      return undefined;
    },
    aufNachricht: nachrichtVerarbeiten,
  });
  lageTakten();

  if (gastgeber) {
    ui.kopplung.code = await ui.netz.eigenerCode();
    ui.kopplung.schritt = 'zeigen';
  } else {
    ui.kopplung.schritt = 'scannen';
  }
  render();
}

async function fremdenCodeAnnehmen(code) {
  const k = ui.kopplung;
  try {
    await ui.netz.codeLesen(code);
    if (!ui.kopplung) return;                  // war schon verbunden
    if (!k.gastgeber) {
      ui.kopplung.code = await ui.netz.eigenerCode();
      ui.kopplung.schritt = 'zeigen';
    } else {
      ui.kopplung.schritt = 'warten';
    }
    k.fehler = '';
  } catch (fehler) {
    if (!ui.kopplung) return;
    k.fehler = fehler.message || 'Der Code passt nicht.';
  }
  render();
}

/** Welche Länge kommt als Nächstes dran? */
function naechsteLaenge(meer) {
  const fehlt = flottenLaengen(meer).slice();
  for (const s of meer.schiffe) {
    const i = fehlt.indexOf(s.laenge);
    if (i >= 0) fehlt.splice(i, 1);
  }
  return fehlt[0] ?? null;
}

function legenTippen(x, y) {
  const meer = stand.meere[ich()];
  if (entfernen(meer, x, y)) { buzz(8); flottenAenderung(); return; }

  if (!laenge) return;
  if (!setzen(meer, { x, y, laenge, quer: ui.quer })) { buzz([30]); return; }
  buzz(10);
  flottenAenderung();
}

/** Die Flotte hat sich geändert — beim Gast muss sie hinüber. */
function flottenAenderung() {
  if (ui.modus === 'online' && !ui.gastgeber) {
    ui.netz?.senden({ typ: 'flotte', spieler: ui.meinIndex, schiffe: stand.meere[ui.meinIndex].schiffe });
    render();
    return;
  }
  nachAenderung();
}

function bereitTippen() {
  if (!einHandy()) {
    ui.bestaetigt = true;
    nachAenderung();
    return;
  }
  if (ui.legtGerade === 0) {
    ui.legtGerade = 1;
    ui.halter = 0;                    // erzwingt die Übergabe an den Zweiten
    render();
    return;
  }
  // Beide Flotten stehen. Das Handy liegt beim Zweiten, schießen darf der Erste.
  ui.legenFertig = true;
  ui.uebergabeNoetig = true;
  nachAenderung();
}

/** Wie viele Felder sind auf diesem Meer noch unbeschossen? */
function freieFelder(meer) {
  const { breite, hoehe } = masse(meer);
  let n = 0;
  for (let x = 0; x < breite; x++) {
    for (let y = 0; y < hoehe; y++) if (!meer.schuesse[`${x},${y}`]) n += 1;
  }
  return n;
}

function meldung() {
  const l = stand.letzterSchuss;
  if (vorbei(stand)) return `${name(stand.fertig)} hat die Flotte versenkt.`;
  if (ui.waffenFehler) return `<span class="senk">${esc(ui.waffenFehler)}</span>`;
  if (ui.waffe === 'luftschlag') return 'Luftschlag: linkes oberes der drei Felder antippen.';
  if (ui.waffe === 'radar') return 'Radar: Mitte des Quadrats antippen, das abgesucht wird.';
  if (ui.waffe === 'mine') return 'Mine: ein Feld im eigenen Meer antippen.';
  const w = stand.letzteWaffe;
  if (w && (!l || w.spieler !== undefined)) {
    if (w.art === 'radar' && w.spieler === stand.dran) {
      return `<span class="treff">Radar bei ${feldName(w.x, w.y)}: ${w.anzahl} Schiffsfelder.</span>`;
    }
  }
  if (salveGroesse(stand) > 0 && !(stand.salve || []).length) {
    return `Salve: ${salveGroesse(stand)} Felder antippen, dann feuern.`;
  }
  if (!l) return 'Ein Feld antippen.';
  if (l.mine) return `<span class="senk">${feldName(l.x, l.y)} — Mine! Ein Zug ausgesetzt.</span>`;
  const feld = feldName(l.x, l.y);
  if (l.versenkt) return `<span class="senk">${feld} — versenkt!</span>`;
  if (l.treffer) return `<span class="treff">${feld} — Treffer.</span> Noch einmal.`;
  return `${feld} — Wasser.`;
}

/**
 * Ein Feld antippen. Was dabei passiert, hängt davon ab, was gerade ansteht:
 * eine gezielte Waffe, eine Salve zum Vormerken, oder ein gewöhnlicher Schuss.
 */
function feldTippen(x, y) {
  if (ui.waffe) { waffeTippen(x, y); return; }
  if (salveGroesse(stand) > 0) {
    if (!tun('markieren', { x, y })) { render(); return; }
    markieren(stand, x, y);
    buzz(6);
    nachAenderung();
    return;
  }
  schussTippen(x, y);
}

function schussTippen(x, y) {
  if (!tun('schiessen', { x, y })) { render(); return; }
  const was = schiessen(stand, x, y);
  if (!was) return;
  buzz(was.mine ? [40, 60, 40, 60] : was.versenkt ? [30, 60, 30] : was.treffer ? 24 : 8);
  nachAenderung();
}

function feuernTippen() {
  if (!tun('feuern')) { render(); return; }
  try { salveFeuern(stand); } catch { render(); return; }
  buzz([25, 40, 25]);
  nachAenderung();
}

function waffeTippen(x, y) {
  const art = ui.waffe;
  const wert = { x, y, quer: ui.waffeQuer };
  if (!tun('waffe', { art, ...wert })) { ui.waffe = null; render(); return; }
  try {
    if (art === 'luftschlag') luftschlag(stand, x, y, ui.waffeQuer);
    else if (art === 'radar') radar(stand, x, y);
    else if (art === 'mine') mineLegen(stand, x, y);
  } catch (fehler) {
    ui.waffenFehler = fehler.message;
    render();
    return;
  }
  ui.waffe = null;
  ui.waffenFehler = '';
  buzz(art === 'luftschlag' ? [30, 40, 30, 40, 30] : [15, 30]);
  nachAenderung();
}

    <div class="feldlabel">Dieser Stand</div>
    <textarea class="codefeld" id="raus" readonly>${esc(alsCode(stand))}</textarea>
    <button class="btn btn--geist" id="kopieren">Kopieren</button>
    <div class="feldlabel">Anderen Stand übernehmen</div>
    <textarea class="codefeld" id="rein" placeholder="SEE1-…"></textarea>
    <button class="btn btn--geist" id="uebernehmen">Diesen Stand übernehmen</button>
    <p class="lage" id="status">${esc(ui.codeStatus)}</p>
    <div class="knopfsaeule"><button class="btn btn--leise" id="zu">Zurück</button></div>`);

  l.querySelector('#kopieren').onclick = async (e) => {
    try { await navigator.clipboard.writeText(alsCode(stand)); e.currentTarget.textContent = 'Kopiert'; }
    catch { l.querySelector('#raus').select(); }
  };
  l.querySelector('#uebernehmen').onclick = () => {
    try {
      stand = ausCode(l.querySelector('#rein').value);
      ui.overlay = null;
      ui.legtGerade = 0;
      ui.halter = 0;
      ui.codeStatus = '';
      nachAenderung();
    } catch (fehler) {
      ui.codeStatus = fehler.message;
      render();
    }
  };
  l.querySelector('#zu').onclick = () => { ui.overlay = 'menue'; ui.codeStatus = ''; render(); };
}

/**
 * Wird noch gelegt? Nicht allein an der Phase abzulesen: die zweite Flotte ist
 * fertig, sobald das letzte Schiff liegt — bestätigt hat sie damit aber
 * niemand, und an einem Handy hält sie noch der Falsche in der Hand.
 */
function zeigeLegen() {
  if (vorbei(stand)) return false;
  if (einHandy()) return !ui.legenFertig;
  return phase(stand) === 'legen' || !ui.bestaetigt;
}

/* ----------------------------------------------------------------- Render */

function render() {
  const k = ui.kopplung;
  if (k && k.scannerStoppen && k.schritt !== 'scannen') { k.scannerStoppen(); k.scannerStoppen = null; }

  if (!stand) { renderStart(); }
  else if (ui.kopplung) { renderKopplung(); }
  else if (zeigeLegen()) { renderLegen(); }
  else { renderSchiessen(); }

  if (ui.overlay === 'regeln') { renderRegeln(); return; }
  if (!stand || ui.kopplung) return;

  // An einem Handy: erst weiterreichen, dann weiterspielen.
  if (einHandy()) {
    if (zeigeLegen() && ui.halter !== ui.legtGerade) {
      renderUebergabe(ui.legtGerade, 'Leg deine Flotte, ohne dass jemand zusieht.');
      return;
    }
    if (ui.uebergabeNoetig && !vorbei(stand)) {
      renderUebergabe(stand.dran, 'Beide Flotten stehen. Du schießt zuerst.', () => {
        ui.uebergabeNoetig = false;
      });
      return;
    }
    if (ui.overlay === 'meineFlotte' && ui.halter !== stand.dran) {
      // absichtlich verdreht: „Meine Flotte" gehört dem, der nicht schießt
      renderUebergabe(ui.halter, 'Nur für deine Augen.');
      return;
    }
  }

  if (ui.overlay === 'meineFlotte') { renderMeineFlotte(); return; }
  if (ui.overlay === 'menue') { renderMenue(); return; }
  if (ui.overlay === 'code') { renderCode(); return; }
  if (vorbei(stand)) renderJubel();
}

stand = laden();
if (stand) {
  ui.screen = 'spiel';
  ui.legtGerade = bereit(stand, 0) && !bereit(stand, 1) ? 1 : 0;
  ui.halter = ui.legtGerade;
  ui.legenFertig = bereit(stand, 0) && bereit(stand, 1);
}
render();

})();
</script>
</body>
