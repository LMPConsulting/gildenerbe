<style id="hangman-css">
/* Galgenmännchen — Schultafel: dunkles Schiefergrün, Kreide, ein Hauch
   Kreidestaub. Bewusst einthemig, alles explizit gefärbt. */

:root {
  --tafel: #1b2422;
  --tafel-2: #121917;
  --panel: #242f2c;
  --panel-2: #2c3a36;
  --naht: #384845;
  --kreide: #eef3ef;
  --kreide-dim: #a9b8b2;
  --kreide-blass: #71847e;
  --mint: #7fd1b9;
  --mint-tief: #2f6b5c;
  --mint-dunkel: #102a24;
  --rot: #e08466;
  --rot-tief: #6b3a2f;
  --gut: #6fc08f;

  --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
  --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-num: ui-monospace, SFMono-Regular, 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace;

  --r-md: 14px;
  --r-lg: 22px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: none; }

body {
  background: var(--tafel);
  /* Zwei weiche Schlieren wie von einem Schwamm, der nie ganz sauber wischt. */
  background-image:
    radial-gradient(120% 55% at 22% 8%, rgba(255, 255, 255, 0.045) 0%, rgba(255, 255, 255, 0) 60%),
    radial-gradient(90% 45% at 80% 92%, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0) 65%),
    linear-gradient(180deg, var(--tafel) 0%, var(--tafel-2) 100%);
  background-attachment: fixed;
  color: var(--kreide-dim);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
}

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }

.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* ---------- Gerüst ---------- */

#app { min-height: 100dvh; display: flex; flex-direction: column; }
.screen { flex: 1; display: flex; flex-direction: column; min-height: 100dvh; }
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; min-height: 0; }
.scrollbar { overflow-y: auto; max-height: 100dvh; }
.wrap { width: 100%; max-width: 560px; margin-inline: auto; padding: 22px 18px calc(18px + var(--safe-b)); }
.blatt { padding: calc(var(--safe-t) + 16px) 18px calc(18px + var(--safe-b)); width: 100%; max-width: 560px; margin-inline: auto; }

h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; color: var(--kreide); margin: 0 0 6px; }
h3 {
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--mint-tief); font-weight: 700; margin: 24px 0 8px;
}
p, li { font-size: 15px; line-height: 1.6; color: var(--kreide-dim); }
strong { color: var(--kreide); }
em { color: var(--mint); font-style: italic; }

.kopf {
  display: flex; align-items: center; gap: 12px;
  padding: calc(var(--safe-t) + 12px) 18px 12px;
  border-bottom: 1px solid var(--naht);
}
.kopf .titel { flex: 1; min-width: 0; }
.kopf .ober {
  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--kreide-blass); font-weight: 700;
}
.kopf h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: 24px; letter-spacing: -0.01em; color: var(--kreide);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.werkzeuge { display: flex; gap: 7px; }
.werkzeug {
  width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
  background: var(--panel); border: 1px solid var(--naht); color: var(--kreide-dim); font-size: 15px;
}

/* ---------- Knöpfe ---------- */

.btn {
  display: flex; align-items: center; justify-content: center; gap: 9px;
  width: 100%; padding: 16px 18px; border-radius: var(--r-md);
  font-weight: 650; font-size: 16px; letter-spacing: -0.01em;
  transition: transform 0.1s ease, filter 0.15s ease;
}
.btn:active { transform: scale(0.985); }
.btn:disabled { opacity: 0.3; transform: none; box-shadow: none; filter: saturate(0.5); }
.btn--kreide { background: var(--mint); color: #08211b; box-shadow: 0 8px 26px rgba(127, 209, 185, 0.16); }
.btn--hell { background: var(--kreide); color: #16211e; }
.btn--geist { background: var(--panel); color: var(--kreide); border: 1px solid var(--naht); }
.btn--leise { background: none; color: var(--kreide-blass); font-weight: 500; font-size: 15px; padding: 13px; }
.knopfsaeule { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.reihe { display: flex; gap: 10px; }
.reihe .btn { width: auto; flex: 1; }

/* ---------- Startbildschirm ---------- */

.start { justify-content: center; text-align: center; padding: 30px 20px calc(28px + var(--safe-b)); }
.wortmarke {
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(34px, 11vw, 52px); line-height: 1.03; margin: 0;
  color: var(--kreide); letter-spacing: -0.02em;
}
.wortmarke em { font-style: italic; color: var(--mint); }
.unterzeile { color: var(--kreide-blass); margin: 10px 0 26px; }

/* ---------- Die Bühne: Zeichnung, Wort, Tastatur ---------- */

.buehne {
  display: flex; flex-direction: column; gap: 12px;
  padding: 12px 14px calc(10px + var(--safe-b));
  flex: 1; min-height: 0; overflow-y: auto;
}

.galgenfeld { display: grid; place-items: center; flex: 1; min-height: 0; }
.galgen { width: auto; height: 100%; max-height: 34dvh; max-width: 100%; display: block; }
.strich {
  fill: none; stroke: var(--kreide); stroke-width: 4.5;
  stroke-linecap: round; stroke-linejoin: round;
  /* Kreide franst aus — ein weicher Schatten reicht als Andeutung. */
  filter: drop-shadow(0 0 1.5px rgba(238, 243, 239, 0.5));
  stroke-dasharray: 1; stroke-dashoffset: 1;
  animation: zeichnen 0.4s ease-out forwards;
}
.strich--vorab { stroke: var(--kreide-blass); animation: none; stroke-dashoffset: 0; opacity: 0.7; }
.strich--gesicht { stroke-width: 3.5; animation-delay: 0.3s; }
.galgen--froh .strich { stroke: var(--gut); }
.galgen--weg .strich { stroke: var(--rot); }
@keyframes zeichnen { to { stroke-dashoffset: 0; } }

@media (prefers-reduced-motion: reduce) {
  .strich { animation: none; stroke-dashoffset: 0; }
}

.wortfeld {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 5px 6px;
  min-height: 46px; align-items: flex-end;
}
.zeichen {
  min-width: 24px; height: 38px; display: grid; place-items: center;
  font-family: var(--font-num); font-size: clamp(19px, 6vw, 26px); font-weight: 700;
  color: var(--kreide); border-bottom: 3px solid var(--naht);
  padding: 0 2px;
}
.zeichen--voll { border-bottom-color: var(--mint-tief); }
.zeichen--neu { animation: aufblitzen 0.35s ease-out; }
.zeichen--luecke { border-bottom: 0; min-width: 12px; }
.zeichen--strich { border-bottom: 0; color: var(--kreide-blass); }
.zeichen--verraten { color: var(--rot); }
@keyframes aufblitzen { from { transform: translateY(6px) scale(0.8); opacity: 0; } }

.tippzeile { text-align: center; font-size: 13px; color: var(--kreide-blass); min-height: 20px; }
.tippzeile b { color: var(--mint); font-weight: 600; }

.leiste {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--kreide-blass); font-weight: 700;
}
.leiste .punkte { display: flex; gap: 4px; }
.leiste .punkt { width: 9px; height: 9px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--naht); }
.leiste .punkt--weg { background: var(--rot); border-color: var(--rot); }

.tastatur {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(38px, 1fr));
  gap: 6px;
}
.taste {
  aspect-ratio: 1 / 1.12; min-height: 40px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--naht); color: var(--kreide);
  font-family: var(--font-num); font-size: 17px; font-weight: 700;
  display: grid; place-items: center;
  transition: transform 0.08s ease, background 0.15s ease, color 0.15s ease;
}
.taste:active { transform: scale(0.92); }
.taste--treffer { background: var(--mint-dunkel); border-color: var(--mint-tief); color: var(--mint); }
.taste--daneben { background: transparent; border-color: var(--rot-tief); color: var(--rot-tief); text-decoration: line-through; }
.taste:disabled { opacity: 1; }
.taste--treffer:disabled, .taste--daneben:disabled { transform: none; }

.wortknopf { margin-top: 10px; }

/* ---------- Wort eintippen ---------- */

.feld {
  background: var(--panel); border: 1px solid var(--naht);
  border-radius: var(--r-md); padding: 14px; color: var(--kreide); font-size: 16px;
  user-select: text; -webkit-user-select: text; width: 100%;
}
.feld::placeholder { color: var(--kreide-blass); }
.feld--wort {
  text-align: center; letter-spacing: 0.16em; text-transform: uppercase;
  font-family: var(--font-num); font-size: 22px;
}
.feld--code {
  width: 100%; text-align: center; letter-spacing: 0.3em;
  font-family: var(--font-num); font-size: 28px; text-transform: uppercase; margin-top: 8px;
}
.feldlabel {
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--kreide-blass); font-weight: 700; text-align: left; margin: 18px 0 7px;
}
.warnton { color: var(--rot); }
.geheim {
  display: flex; align-items: center; gap: 8px; margin-top: 10px;
  font-size: 13px; color: var(--kreide-blass);
}

/* ---------- Punktetafel ---------- */

.tafel {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  gap: 10px; background: var(--panel); border: 1px solid var(--naht);
  border-radius: var(--r-lg); padding: 16px 14px; margin: 16px 0;
}
.tafel .seite { text-align: center; min-width: 0; }
.tafel .wer { font-size: 12px; color: var(--kreide-blass); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tafel .zahl { font-family: var(--font-num); font-size: 34px; font-weight: 800; color: var(--kreide); line-height: 1.1; }
.tafel .fuehrt .zahl { color: var(--mint); }
.tafel .strichlein { width: 1px; height: 40px; background: var(--naht); }

.zeile {
  display: flex; align-items: baseline; gap: 10px; padding: 9px 0;
  border-bottom: 1px solid var(--naht); font-size: 14px;
}
.zeile:last-child { border-bottom: 0; }
.zeile .wort { font-family: var(--font-num); color: var(--kreide); letter-spacing: 0.06em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.zeile .pkt { font-family: var(--font-num); font-weight: 700; }
.pkt--plus { color: var(--gut); }
.pkt--null { color: var(--kreide-blass); }

/* ---------- Overlays und Übergabe ---------- */

.overlay {
  position: fixed; inset: 0; z-index: 50;
  background: var(--tafel-2);
  display: flex; flex-direction: column;
  animation: einblenden 0.18s ease-out;
}
@keyframes einblenden { from { opacity: 0; } }

.uebergabe {
  justify-content: center; align-items: center; text-align: center;
  padding: 26px calc(24px + var(--safe-b));
  background-image: radial-gradient(90% 50% at 50% 40%, #24302c 0%, rgba(36, 48, 44, 0) 70%);
}
.uebergabe .pfeil { font-size: 40px; animation: schubs 1.5s ease-in-out infinite; }
@keyframes schubs { 50% { transform: translateX(10px); } }
.uebergabe .lbl { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--kreide-blass); font-weight: 700; margin-top: 4px; }
.uebergabe .name { font-family: var(--font-display); font-size: clamp(30px, 9vw, 42px); color: var(--kreide); line-height: 1.1; margin: 4px 0 6px; }
.uebergabe .auftrag { color: var(--kreide-dim); margin: 0 0 26px; max-width: 30ch; }
.uebergabe .btn { max-width: 340px; }

.wahlliste { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.wahl {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: var(--panel); border: 1px solid var(--naht); border-radius: var(--r-md); padding: 13px 15px;
}
.wahl--an { border-color: var(--mint-tief); background: var(--mint-dunkel); }
.wahl .haupt { flex: 1; min-width: 0; }
.wahl .oben { color: var(--kreide); font-weight: 650; }
.wahl .unten { font-size: 13px; color: var(--kreide-blass); }
.wahl .haken { color: var(--mint); font-size: 18px; }

/* ---------- Kopplung per QR (zwei Handys im selben WLAN) ---------- */

.qrfeld { display: grid; place-items: center; background: var(--kreide); border-radius: 14px; padding: 14px; margin: 16px 0; }
.qrfeld canvas { width: 100%; max-width: 300px; height: auto; image-rendering: pixelated; display: block; }

.scanfenster {
  position: relative; overflow: hidden; border-radius: 14px; background: #000;
  aspect-ratio: 1; margin: 16px 0; border: 1px solid var(--naht);
}
.scanfenster video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scanfenster::after {
  content: ""; position: absolute; inset: 16%;
  border: 2px solid var(--mint); border-radius: 12px;
  box-shadow: 0 0 0 999px rgba(0, 0, 0, 0.45);
}

.raumcode {
  font-family: var(--font-num);
  font-size: clamp(38px, 13vw, 58px); font-weight: 800; letter-spacing: 0.14em;
  text-align: center; padding: 18px 10px; margin: 16px 0;
  border-radius: 14px; user-select: all; -webkit-user-select: all;
  background: var(--panel); color: var(--kreide); border: 2px solid var(--mint-tief);
}

.codeklappe { margin-top: 6px; }
.codeklappe summary { font-size: 13px; color: var(--kreide-blass); cursor: pointer; padding: 8px 0; list-style: none; }
.codeklappe summary::before { content: "▸ "; }
.codeklappe[open] summary::before { content: "▾ "; }
.codeklappe .btn { margin-top: 8px; }
.codefeld {
  width: 100%; min-height: 84px; resize: vertical; margin-top: 6px;
  background: var(--panel); border: 1px solid var(--naht); border-radius: 10px;
  padding: 10px; color: var(--kreide-blass); font-family: var(--font-num); font-size: 11px;
  word-break: break-all; user-select: text; -webkit-user-select: text;
}

/* Technikzeile beim Koppeln: klein, ruhig, darf umbrechen. */
.lage { margin-top: 12px; font-size: 12px; line-height: 1.55; opacity: 0.62; word-break: break-word; }

/* ---------- Quer: Zeichnung neben Wort und Tastatur ---------- */

@media (orientation: landscape) and (max-height: 560px) {
  .buehne { display: grid; grid-template-columns: minmax(0, 34%) minmax(0, 1fr); gap: 14px; align-items: center; }
  .galgenfeld { grid-row: span 4; }
  .galgen { max-height: 82dvh; }
  .taste { min-height: 34px; aspect-ratio: auto; padding: 6px 0; }
}

</style>
</head>

'use strict';
// Minimaler QR-Erzeuger: Byte-Modus, Fehlerkorrektur L, Versionen 1 bis 15.
// Eigenbau, weil das Spiel eine einzelne Datei ohne Netz bleiben soll.
//
// qrMatrix('text') -> { groesse, module: boolean[][] }   true = dunkel

// [Gesamt-Codewörter, EC-Codewörter je Block, [Blöcke, Datenwörter], [Blöcke, Datenwörter]?]
const VERSIONEN = {
  1: [26, 7, [1, 19]],
  2: [44, 10, [1, 34]],
  3: [70, 15, [1, 55]],
  4: [100, 20, [1, 80]],
  5: [134, 26, [1, 108]],
  6: [172, 18, [2, 68]],
  7: [196, 20, [2, 78]],
  8: [242, 24, [2, 97]],
  9: [292, 30, [2, 116]],
  10: [346, 18, [2, 68], [2, 69]],
  11: [404, 20, [4, 81]],
  12: [466, 24, [2, 92], [2, 93]],
  13: [532, 26, [4, 107]],
  14: [581, 30, [3, 115], [1, 116]],
  15: [655, 22, [5, 87], [1, 88]],
};

const AUSRICHTUNG = {
  1: [], 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30], 6: [6, 34],
  7: [6, 22, 38], 8: [6, 24, 42], 9: [6, 26, 46], 10: [6, 28, 50],
  11: [6, 30, 54], 12: [6, 32, 58], 13: [6, 34, 62], 14: [6, 26, 46, 66],
  15: [6, 26, 48, 70],
};

/* ------------------------------------------------------- Galois-Feld GF(256) */

const EXP = new Uint8Array(512);
const LOG = new Uint8Array(256);
(function tabellen() {
  let x = 1;
  for (let i = 0; i < 255; i++) {
    EXP[i] = x;
    LOG[x] = i;
    x <<= 1;
    if (x & 0x100) x ^= 0x11d;
  }
  for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
})();

const mul = (a, b) => (a === 0 || b === 0 ? 0 : EXP[LOG[a] + LOG[b]]);

function generator(grad) {
  let g = [1];
  for (let i = 0; i < grad; i++) {
    const next = new Array(g.length + 1).fill(0);
    // Multiplikation mit (x + α^i): der x-Anteil bleibt an Ort und Stelle,
    // der Faktor rutscht eine Stelle nach unten. Führender Koeffizient bleibt 1.
    for (let j = 0; j < g.length; j++) {
      next[j] ^= g[j];
      next[j + 1] ^= mul(g[j], EXP[i]);
    }
    g = next;
  }
  return g;
}

/** Reed-Solomon-Rest: die Fehlerkorrektur-Codewörter eines Blocks. */
function ecBlock(daten, ecAnzahl) {
  const g = generator(ecAnzahl);
  const rest = new Array(ecAnzahl).fill(0);
  for (const wort of daten) {
    const faktor = wort ^ rest[0];
    rest.shift();
    rest.push(0);
    if (faktor !== 0) for (let i = 0; i < ecAnzahl; i++) rest[i] ^= mul(g[i + 1], faktor);
  }
  return rest;
}

/* ------------------------------------------------------------- Datenkodierung */

function datenKapazitaet(version) {
  const [, , g1, g2] = VERSIONEN[version];
  return g1[0] * g1[1] + (g2 ? g2[0] * g2[1] : 0);
}

function versionWaehlen(byteLaenge) {
  for (let v = 1; v <= 15; v++) {
    const zaehlerBits = v < 10 ? 8 : 16;
    const noetig = Math.ceil((4 + zaehlerBits + byteLaenge * 8) / 8);
    if (noetig <= datenKapazitaet(v)) return v;
  }
  throw new Error('Text zu lang für einen QR-Code dieser Größe');
}

function codewoerter(bytes, version) {
  const zaehlerBits = version < 10 ? 8 : 16;
  const bits = [];
  const schiebe = (wert, anzahl) => {
    for (let i = anzahl - 1; i >= 0; i--) bits.push((wert >> i) & 1);
  };

  schiebe(0b0100, 4);              // Byte-Modus
  schiebe(bytes.length, zaehlerBits);
  for (const b of bytes) schiebe(b, 8);

  const kapazitaet = datenKapazitaet(version) * 8;
  for (let i = 0; i < 4 && bits.length < kapazitaet; i++) bits.push(0);   // Terminator
  while (bits.length % 8 !== 0) bits.push(0);

  const worte = [];
  for (let i = 0; i < bits.length; i += 8) {
    worte.push(bits.slice(i, i + 8).reduce((v, b) => (v << 1) | b, 0));
  }
  const fueller = [0xec, 0x11];
  let f = 0;
  while (worte.length < datenKapazitaet(version)) worte.push(fueller[f++ % 2]);
  return worte;
}

/** Datenwörter in Blöcke schneiden, EC anhängen, beides verschachteln. */
function endgueltigeWoerter(daten, version) {
  const [, ecAnzahl, g1, g2] = VERSIONEN[version];
  const gruppen = g2 ? [g1, g2] : [g1];

  const datenBloecke = [];
  let pos = 0;
  for (const [anzahl, laenge] of gruppen) {
    for (let i = 0; i < anzahl; i++) {
      datenBloecke.push(daten.slice(pos, pos + laenge));
      pos += laenge;
    }
  }
  const ecBloecke = datenBloecke.map((b) => ecBlock(b, ecAnzahl));

  const raus = [];
  const maxDaten = Math.max(...datenBloecke.map((b) => b.length));
  for (let i = 0; i < maxDaten; i++) {
    for (const b of datenBloecke) if (i < b.length) raus.push(b[i]);
  }
  for (let i = 0; i < ecAnzahl; i++) for (const b of ecBloecke) raus.push(b[i]);
  return raus;
}

/* -------------------------------------------------------------- Matrixaufbau */

function leereMatrix(groesse) {
  return Array.from({ length: groesse }, () => new Array(groesse).fill(null));
}

function sucherSetzen(m, zeile, spalte) {
  for (let r = -1; r <= 7; r++) {
    for (let c = -1; c <= 7; c++) {
      const y = zeile + r;
      const x = spalte + c;
      if (y < 0 || y >= m.length || x < 0 || x >= m.length) continue;
      const imSucher = r >= 0 && r <= 6 && c >= 0 && c <= 6;
      if (!imSucher) { m[y][x] = false; continue; }   // die helle Trennlinie ringsum
      const rahmen = r === 0 || r === 6 || c === 0 || c === 6;
      const kern = r >= 2 && r <= 4 && c >= 2 && c <= 4;
      m[y][x] = rahmen || kern;
    }
  }
}

function funktionsMuster(version) {
  const groesse = version * 4 + 17;
  const m = leereMatrix(groesse);

  sucherSetzen(m, 0, 0);
  sucherSetzen(m, 0, groesse - 7);
  sucherSetzen(m, groesse - 7, 0);

  for (let i = 8; i < groesse - 8; i++) {
    m[6][i] = i % 2 === 0;
    m[i][6] = i % 2 === 0;
  }

  const zentren = AUSRICHTUNG[version];
  const letzte = zentren[zentren.length - 1];
  // Nur die drei Ecken entfallen — dort sitzen schon die Suchmuster. Muster,
  // die bloß die Taktspur kreuzen, werden gezeichnet.
  const beimSucher = (y, x) => (y === 6 && x === 6)
    || (y === 6 && x === letzte) || (y === letzte && x === 6);
  for (const zy of zentren) {
    for (const zx of zentren) {
      if (beimSucher(zy, zx)) continue;
      for (let r = -2; r <= 2; r++) {
        for (let c = -2; c <= 2; c++) {
          m[zy + r][zx + c] = Math.max(Math.abs(r), Math.abs(c)) !== 1;
        }
      }
    }
  }

  m[groesse - 8][8] = true;                       // immer dunkles Modul

  // Plätze für Format- und Versionsinfo freihalten (später überschrieben)
  for (let i = 0; i < 9; i++) {
    if (m[8][i] === null) m[8][i] = false;
    if (m[i][8] === null) m[i][8] = false;
  }
  for (let i = 0; i < 8; i++) {
    if (m[8][groesse - 1 - i] === null) m[8][groesse - 1 - i] = false;
    if (m[groesse - 1 - i][8] === null) m[groesse - 1 - i][8] = false;
  }
  if (version >= 7) {
    for (let i = 0; i < 6; i++) {
      for (let j = 0; j < 3; j++) {
        m[groesse - 11 + j][i] = false;
        m[i][groesse - 11 + j] = false;
      }
    }
  }
  return m;
}

/** Merkt sich, welche Felder zu Funktionsmustern gehören. */
function reserviert(version) {
  const m = funktionsMuster(version);
  return m.map((zeile) => zeile.map((wert) => wert !== null));
}

function datenSetzen(m, belegt, worte) {
  const groesse = m.length;
  const bits = [];
  for (const w of worte) for (let i = 7; i >= 0; i--) bits.push((w >> i) & 1);

  let bit = 0;
  let aufwaerts = true;
  for (let spalte = groesse - 1; spalte > 0; spalte -= 2) {
    if (spalte === 6) spalte -= 1;               // die senkrechte Taktspur überspringen
    for (let i = 0; i < groesse; i++) {
      const zeile = aufwaerts ? groesse - 1 - i : i;
      for (const s of [spalte, spalte - 1]) {
        if (belegt[zeile][s]) continue;
        m[zeile][s] = bit < bits.length ? bits[bit++] === 1 : false;
      }
    }
    aufwaerts = !aufwaerts;
  }
}

const MASKEN = [
  (r, c) => (r + c) % 2 === 0,
  (r) => r % 2 === 0,
  (r, c) => c % 3 === 0,
  (r, c) => (r + c) % 3 === 0,
  (r, c) => (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0,
  (r, c) => ((r * c) % 2) + ((r * c) % 3) === 0,
  (r, c) => (((r * c) % 2) + ((r * c) % 3)) % 2 === 0,
  (r, c) => (((r + c) % 2) + ((r * c) % 3)) % 2 === 0,
];

function strafe(m) {
  const n = m.length;
  let punkte = 0;

  // Regel 1: Ketten gleicher Farbe
  for (let i = 0; i < n; i++) {
    for (const waagrecht of [true, false]) {
      let lauf = 1;
      for (let j = 1; j < n; j++) {
        const a = waagrecht ? m[i][j] : m[j][i];
        const b = waagrecht ? m[i][j - 1] : m[j - 1][i];
        if (a === b) lauf++;
        else { if (lauf >= 5) punkte += 3 + (lauf - 5); lauf = 1; }
      }
      if (lauf >= 5) punkte += 3 + (lauf - 5);
    }
  }

  // Regel 2: gleichfarbige 2x2-Blöcke
  for (let r = 0; r < n - 1; r++) {
    for (let c = 0; c < n - 1; c++) {
      const v = m[r][c];
      if (v === m[r][c + 1] && v === m[r + 1][c] && v === m[r + 1][c + 1]) punkte += 3;
    }
  }

  // Regel 3: sucherähnliche Folgen
  const muster = [true, false, true, true, true, false, true, false, false, false, false];
  const gedreht = muster.slice().reverse();
  const passt = (werte, soll) => soll.every((v, i) => werte[i] === v);
  for (let i = 0; i < n; i++) {
    for (let j = 0; j <= n - 11; j++) {
      const waagrecht = m[i].slice(j, j + 11);
      const senkrecht = Array.from({ length: 11 }, (_, k) => m[j + k][i]);
      for (const reihe of [waagrecht, senkrecht]) {
        if (passt(reihe, muster) || passt(reihe, gedreht)) punkte += 40;
      }
    }
  }

  // Regel 4: Abweichung vom Halbe-halbe-Verhältnis
  let dunkel = 0;
  for (const zeile of m) for (const v of zeile) if (v) dunkel++;
  const anteil = (dunkel * 100) / (n * n);
  punkte += Math.floor(Math.abs(anteil - 50) / 5) * 10;
  return punkte;
}

function formatBits(maske) {
  const daten = (0b01 << 3) | maske;             // Fehlerkorrektur L = 01
  let rest = daten << 10;
  for (let i = 14; i >= 10; i--) if ((rest >> i) & 1) rest ^= 0b10100110111 << (i - 10);
  return ((daten << 10) | rest) ^ 0b101010000010010;
}

function versionBits(version) {
  let rest = version << 12;
  for (let i = 17; i >= 12; i--) if ((rest >> i) & 1) rest ^= 0b1111100100101 << (i - 12);
  return (version << 12) | rest;
}

function infoSetzen(m, version, maske) {
  const n = m.length;
  const bits = formatBits(maske);
  // Die 15 Bits werden mit dem höchsten zuerst abgelegt, an zwei Stellen.
  const legen = (plaetze) => plaetze.forEach(([r, c], i) => {
    m[r][c] = ((bits >> (14 - i)) & 1) === 1;
  });

  legen([[8, 0], [8, 1], [8, 2], [8, 3], [8, 4], [8, 5], [8, 7], [8, 8],
    [7, 8], [5, 8], [4, 8], [3, 8], [2, 8], [1, 8], [0, 8]]);

  const zweite = [];
  for (let i = 1; i <= 7; i++) zweite.push([n - i, 8]);
  for (let i = 8; i >= 1; i--) zweite.push([8, n - i]);
  legen(zweite);

  m[n - 8][8] = true;                             // immer dunkles Modul

  if (version >= 7) {
    const vb = versionBits(version);
    for (let i = 0; i < 18; i++) {
      const wert = ((vb >> i) & 1) === 1;
      const zeile = Math.floor(i / 3);
      const spalte = i % 3;
      m[n - 11 + spalte][zeile] = wert;
      m[zeile][n - 11 + spalte] = wert;
    }
  }
}

function qrMatrix(text, maskeErzwingen = null) {
  const bytes = new TextEncoder().encode(text);
  const version = versionWaehlen(bytes.length);
  const worte = endgueltigeWoerter(codewoerter(bytes, version), version);

  const belegt = reserviert(version);
  const roh = funktionsMuster(version);
  datenSetzen(roh, belegt, worte);

  let beste = null;
  for (let maske = 0; maske < 8; maske++) {
    if (maskeErzwingen !== null && maske !== maskeErzwingen) continue;
    const m = roh.map((zeile, r) => zeile.map((wert, c) => (
      belegt[r][c] ? wert : wert !== MASKEN[maske](r, c)
    )));
    infoSetzen(m, version, maske);
    const p = strafe(m);
    if (!beste || p < beste.punkte) beste = { punkte: p, module: m };
  }

  return { groesse: beste.module.length, version, module: beste.module };
}

/** Zeichnet den Code in ein Canvas — mit der vorgeschriebenen ruhigen Zone. */
function qrZeichnen(canvas, text, { rand = 4, hell = '#f6f2e7', dunkel = '#16211e' } = {}) {
  const { groesse, module } = qrMatrix(text);
  const gesamt = groesse + rand * 2;
  const pixel = Math.max(1, Math.floor(canvas.width / gesamt));
  const kante = pixel * gesamt;

  canvas.width = kante;
  canvas.height = kante;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = hell;
  ctx.fillRect(0, 0, kante, kante);
  ctx.fillStyle = dunkel;
  for (let r = 0; r < groesse; r++) {
    for (let c = 0; c < groesse; c++) {
      if (module[r][c]) ctx.fillRect((c + rand) * pixel, (r + rand) * pixel, pixel, pixel);
    }
  }
  return { groesse, kante };
}

// Direktverbindung zwischen zwei Handys im selben WLAN oder Hotspot.
//
// Es gibt keinen Server, der vermittelt. Deshalb tauschen die Geräte ihre
// Verbindungsdaten einmalig per QR-Code aus: Gastgeber zeigt, Gast scannt,
// Gast zeigt zurück, Gastgeber scannt. Danach läuft alles direkt.
//
// Damit ein Code auf ein Handydisplay passt, wird die Beschreibung auf das
// Nötigste eingedampft und auf der Gegenseite aus einer Vorlage neu gebaut.

const CODE_MARKE = 'HM1';

/* ------------------------------------------------- Verbindungsdaten packen */

function hexZuBase64(hex) {
  const bytes = hex.split(':').map((h) => parseInt(h, 16));
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function base64ZuHex(b64) {
  const roh = atob(b64.replace(/-/g, '+').replace(/_/g, '/'));
  return Array.from(roh, (c) => c.charCodeAt(0).toString(16).padStart(2, '0').toUpperCase()).join(':');
}

/** Aus einer vollständigen Beschreibung einen kurzen, scanbaren Code machen. */
function funkCodeBauen(sdp, rolle) {
  const hole = (muster) => (sdp.match(muster) || [])[1] || '';
  const ufrag = hole(/^a=ice-ufrag:(.+)$/m);
  const pwd = hole(/^a=ice-pwd:(.+)$/m);
  const fingerabdruck = hole(/^a=fingerprint:sha-256 (.+)$/m).trim();

  const kandidaten = [];
  for (const zeile of sdp.split(/\r?\n/)) {
    const t = zeile.match(/^a=candidate:\S+ \d+ (udp|UDP) \d+ (\S+) (\d+) typ (host|srflx)/);
    if (t && !kandidaten.some((k) => k === `${t[2]},${t[3]}`)) kandidaten.push(`${t[2]},${t[3]}`);
  }

  return [CODE_MARKE + rolle, ufrag, pwd, hexZuBase64(fingerabdruck), ...kandidaten].join('|');
}

/** Kurzcode wieder zu einer vollständigen Beschreibung aufblasen. */
function funkCodeLesen(code) {
  const teile = String(code).trim().split('|');
  const kopf = teile[0] || '';
  if (!kopf.startsWith(CODE_MARKE)) throw new Error('Das ist kein Galgenmännchen-Verbindungscode.');
  const rolle = kopf.slice(CODE_MARKE.length);
  if (rolle !== 'O' && rolle !== 'A') throw new Error('Der Verbindungscode ist unvollständig.');

  const [, ufrag, pwd, fingerBase64, ...kandidaten] = teile;
  if (!ufrag || !pwd || !fingerBase64) throw new Error('Der Verbindungscode ist unvollständig.');

  const sdp = [
    'v=0',
    'o=- 1 2 IN IP4 127.0.0.1',
    's=-',
    't=0 0',
    'a=group:BUNDLE 0',
    'a=msid-semantic: WMS',
    'm=application 9 UDP/DTLS/SCTP webrtc-datachannel',
    'c=IN IP4 0.0.0.0',
    `a=ice-ufrag:${ufrag}`,
    `a=ice-pwd:${pwd}`,
    'a=ice-options:trickle',
    `a=fingerprint:sha-256 ${base64ZuHex(fingerBase64)}`,
    `a=setup:${rolle === 'O' ? 'actpass' : 'active'}`,
    'a=mid:0',
    'a=sctp-port:5000',
    'a=max-message-size:262144',
    '',
  ].join('\r\n');

  return {
    typ: rolle === 'O' ? 'offer' : 'answer',
    sdp,
    kandidaten: kandidaten.filter(Boolean).map((k) => {
      const [adresse, port] = k.split(',');
      return {
        candidate: `candidate:1 1 udp 2130706431 ${adresse} ${port} typ host generation 0 ufrag ${ufrag}`,
        sdpMid: '0',
        sdpMLineIndex: 0,
      };
    }),
  };
}

/* -------------------------------------------------------- Kamera-Freigabe */

// Chrome verrät die echte WLAN-Adresse eines Handys nicht einfach so: statt
// 192.168.x.y steht in den Verbindungsdaten ein zufälliger „….local"-Name
// (mDNS). Die Gegenseite müsste diesen Namen per Multicast auflösen — und
// genau das lassen Handy-Hotspots meistens nicht durch. Hat die Seite aber
// einmal die Erlaubnis für die Kamera, gibt Chrome die echte Adresse heraus.
// Also holen wir die Erlaubnis, *bevor* die Verbindung entsteht; die Kamera
// geht sofort wieder aus. Zum Scannen brauchen wir sie ohnehin gleich.
async function kameraFreigeben() {
  try {
    const strom = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: false,
    });
    strom.getTracks().forEach((spur) => spur.stop());
    return true;
  } catch {
    return false;
  }
}

/* ------------------------------------------------------------- Verbindung */

/**
 * Baut die Verbindung auf. `aufZustand(text, verbunden)` meldet Fortschritt,
 * `aufNachricht(objekt)` liefert eingehende Daten.
 */
function funkAufbauen({ gastgeber, aufZustand, aufNachricht }) {
  const pc = new RTCPeerConnection({ iceServers: [] });
  let kanal = null;
  let offen = false;
  const lage = { eigene: [], fremde: 0, mdns: false, stand: 'neu', sammeln: 'läuft' };

  const melde = (text) => aufZustand?.(text, offen);

  const kanalVerdrahten = (k) => {
    kanal = k;
    k.onopen = () => { offen = true; aufZustand?.('verbunden', true); };
    k.onclose = () => { offen = false; aufZustand?.('getrennt', false); };
    k.onmessage = (e) => {
      try { aufNachricht?.(JSON.parse(e.data)); } catch { /* kaputte Nachricht */ }
    };
  };

  if (gastgeber) kanalVerdrahten(pc.createDataChannel('hangman', { ordered: true }));
  else pc.ondatachannel = (e) => kanalVerdrahten(e.channel);

  // Mitschreiben, was das Handy findet — sonst steht man bei „Verbinde …" im Dunkeln.
  pc.onicecandidate = (e) => {
    if (!e.candidate) return;
    const roh = e.candidate.candidate;
    if (/\.local\b/.test(roh)) { lage.mdns = true; return; }
    const t = roh.match(/ (\S+) (\d+) typ (?:host|srflx)/);
    if (t && !lage.eigene.includes(`${t[1]}:${t[2]}`)) lage.eigene.push(`${t[1]}:${t[2]}`);
  };

  pc.oniceconnectionstatechange = () => {
    lage.stand = pc.iceConnectionState;
    if (['failed', 'disconnected'].includes(pc.iceConnectionState) && !offen) {
      melde(lage.mdns && !lage.eigene.length
        ? 'Keine Verbindung — dieses Handy hat seine WLAN-Adresse nicht herausgegeben.'
        : 'Keine Verbindung — blockiert euer Hotspot vielleicht den direkten Weg?');
    }
  };

  /** Wartet, bis alle lokalen Adressen gesammelt sind (oder die Geduld endet). */
  const adressenSammeln = () => new Promise((fertig) => {
    if (pc.iceGatheringState === 'complete') { lage.sammeln = 'fertig'; return fertig(); }
    const stopp = setTimeout(() => { lage.sammeln = 'fertig'; fertig(); }, 6000);
    pc.onicegatheringstatechange = () => {
      lage.sammeln = pc.iceGatheringState === 'complete' ? 'fertig' : pc.iceGatheringState;
      if (pc.iceGatheringState === 'complete') { clearTimeout(stopp); fertig(); }
    };
    return undefined;
  });

  return {
    /** Gastgeber: eigenen Code erzeugen. Gast: erst nach codeLesen aufrufen. */
    async eigenerCode() {
      const beschreibung = gastgeber ? await pc.createOffer() : await pc.createAnswer();
      await pc.setLocalDescription(beschreibung);
      await adressenSammeln();
      return funkCodeBauen(pc.localDescription.sdp, gastgeber ? 'O' : 'A');
    },

    async codeLesen(code) {
      const { typ, sdp, kandidaten } = funkCodeLesen(code);
      if (gastgeber && typ !== 'answer') throw new Error('Das ist der Code des Gastgebers — du brauchst den vom Gast.');
      if (!gastgeber && typ !== 'offer') throw new Error('Das ist der Code des Gasts — du brauchst den vom Gastgeber.');
      await pc.setRemoteDescription({ type: typ, sdp });
      for (const k of kandidaten) {
        try { await pc.addIceCandidate(k); lage.fremde += 1; } catch { /* einzelne Adresse taugt nicht */ }
      }
      melde('verbinde …');
    },

    senden(objekt) {
      if (kanal && kanal.readyState === 'open') {
        kanal.send(JSON.stringify(objekt));
        return true;
      }
      return false;
    },

    get verbunden() { return offen; },

    /** Momentaufnahme für die Fehlersuche — reine Lesekopie. */
    get lage() { return { ...lage, eigene: lage.eigene.slice() }; },

    schliessen() {
      try { kanal?.close(); } catch { /* egal */ }
      try { pc.close(); } catch { /* egal */ }
    },
  };
}

/* ---------------------------------------------------------------- Scanner */

const scannerMoeglich = () => typeof window !== 'undefined'
  && 'BarcodeDetector' in window
  && !!navigator.mediaDevices?.getUserMedia;

/**
 * Startet die Kamera und meldet den ersten gefundenen QR-Code.
 * Gibt eine Funktion zum Abschalten zurück.
 */
async function scannerStarten(videoElement, aufTreffer, aufFehler) {
  if (!scannerMoeglich()) {
    aufFehler?.(new Error('Dieser Browser kann keine QR-Codes lesen — nimm den Textcode.'));
    return () => {};
  }
  let laeuft = true;
  let strom = null;

  try {
    strom = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: false,
    });
  } catch (fehler) {
    aufFehler?.(new Error('Kein Zugriff auf die Kamera. Erlaube ihn oder nimm den Textcode.'));
    return () => {};
  }

  videoElement.srcObject = strom;
  videoElement.setAttribute('playsinline', '');
  await videoElement.play().catch(() => {});

  const sucher = new window.BarcodeDetector({ formats: ['qr_code'] });
  const schauen = async () => {
    if (!laeuft) return;
    try {
      const treffer = await sucher.detect(videoElement);
      const code = treffer.find((t) => String(t.rawValue).startsWith(CODE_MARKE));
      if (code) { laeuft = false; aufTreffer(code.rawValue); return stoppen(); }
    } catch { /* einzelner Fehlversuch ist egal */ }
    setTimeout(schauen, 220);
    return undefined;
  };

  const stoppen = () => {
    laeuft = false;
    strom?.getTracks().forEach((t) => t.stop());
    videoElement.srcObject = null;
  };

  schauen();
  return stoppen;
}

// Zwei Handys über das Internet verbinden — für die Fassung auf der Webseite.
//
// Anders als funk.js braucht das kein gemeinsames WLAN und keine Kamera: Der
// Server hält nur einen Raum mit einem kurzen Code offen und reicht Nachrichten
// durch. Er versteht kein Spiel; er merkt sich, wer was noch nicht abgeholt hat.
//
// Nach außen sieht das genauso aus wie eine Direktverbindung — `senden`,
// `verbunden`, `schliessen` — damit die Oberfläche nichts davon wissen muss.

const NETZ_BASIS = (typeof SPIELE_BASIS === 'string' ? SPIELE_BASIS : '.').replace(/\/$/, '');

/** Steht dieser Weg überhaupt zur Verfügung? Nur in der Webfassung. */
const netzMoeglich = () => typeof SPIELE_BASIS === 'string';

async function ruf(pfad, optionen = {}) {
  const antwort = await fetch(`${NETZ_BASIS}/api${pfad}`, {
    cache: 'no-store',
    headers: { 'Content-Type': 'application/json' },
    ...optionen,
  });
  let daten = null;
  try { daten = await antwort.json(); } catch { /* leere Antwort */ }
  if (!antwort.ok) throw new Error((daten && daten.fehler) || `Server meldet ${antwort.status}.`);
  return daten || {};
}

/**
 * Raum aufmachen oder beitreten und danach dauerhaft lauschen.
 *
 * `aufZustand(text, verbunden)` meldet Fortschritt, `aufNachricht(objekt)`
 * liefert alles, was die Gegenseite schickt, `aufCode(code)` den Raumcode,
 * sobald er feststeht.
 */
function netzAufbauen({ gastgeber, code, aufZustand, aufNachricht, aufCode }) {
  let raum = null;         // { code, sitz, schluessel }
  let ab = 0;
  let offen = false;
  let laeuft = true;
  let fehlversuche = 0;

  const melde = (text, verbunden = offen) => aufZustand?.(text, verbunden);

  async function lauschen() {
    while (laeuft && raum) {
      try {
        const q = new URLSearchParams({
          sitz: String(raum.sitz),
          ab: String(ab),
          voll: offen ? '1' : '0',        // der Server meldet sich, sobald sich das ändert
          schluessel: raum.schluessel,
        });
        const daten = await ruf(`/raum/${raum.code}/holen?${q}`);
        if (!laeuft) return;
        fehlversuche = 0;

        if (daten.voll && !offen) { offen = true; aufZustand?.('verbunden', true); }
        if (!daten.voll && offen) { offen = false; aufZustand?.('getrennt', false); }

        for (const n of daten.nachrichten || []) {
          ab = Math.max(ab, n.nr);
          try { aufNachricht?.(n.inhalt); } catch { /* kaputte Nachricht */ }
        }
        if (typeof daten.stand === 'number') ab = Math.max(ab, Math.min(ab, daten.stand));
      } catch (fehler) {
        if (!laeuft) return;
        fehlversuche += 1;
        if (fehlversuche >= 4) {
          offen = false;
          aufZustand?.(`Verbindung abgerissen: ${fehler.message}`, false);
        }
        // Kurz warten, dann weiter — kurze Aussetzer sollen das Spiel nicht beenden.
        await new Promise((w) => setTimeout(w, Math.min(4000, 500 * fehlversuche)));
      }
    }
  }

  const bereit = (async () => {
    melde(gastgeber ? 'Raum wird geöffnet …' : 'Raum wird gesucht …', false);
    raum = gastgeber
      ? await ruf('/raum', { method: 'POST', body: '{}' })
      : await ruf(`/raum/${String(code || '').trim().toUpperCase()}/beitreten`,
        { method: 'POST', body: '{}' });
    aufCode?.(raum.code);
    melde(gastgeber ? 'Warte auf das zweite Handy …' : 'Verbinde …', false);
    lauschen();
    return raum.code;
  })();

  return {
    bereit,                                   // Promise: fertig, sobald der Raum steht
    get code() { return raum && raum.code; },
    get verbunden() { return offen; },

    senden(objekt) {
      if (!raum) return false;
      ruf(`/raum/${raum.code}/senden`, {
        method: 'POST',
        body: JSON.stringify({ sitz: raum.sitz, schluessel: raum.schluessel, nachricht: objekt }),
      }).catch(() => { /* der Lauscher merkt den Ausfall */ });
      return true;
    },

    schliessen() {
      laeuft = false;
      offen = false;
      raum = null;
    },
  };
}

/**
 * Bringt Eingetipptes in die Form, in der gespielt wird: Großbuchstaben,
 * ß wird zu SS (Großschrift kennt kein ß), Mehrfach-Leerzeichen zusammen.
 */
function normalisieren(roh) {
  return String(roh ?? '')
    .toUpperCase()
    .replace(/ß/g, 'SS')
    .replace(/\s+/g, ' ')
    .trim();
}

const IST_BUCHSTABE = (z) => BUCHSTABEN.includes(z);

/** Alles, was von Anfang an sichtbar bleibt: Leerzeichen und Bindestriche. */
const IST_TRENNER = (z) => z === ' ' || z === '-';

/**
 * Prüft ein selbst gestelltes Wort. Gibt einen Klartext-Grund zurück oder
 * null, wenn es in Ordnung geht.
 */
function wortPruefen(roh) {
  const wort = normalisieren(roh);
  if (!wort) return 'Da steht noch nichts.';
  const buchstaben = [...wort].filter(IST_BUCHSTABE).length;
  if (buchstaben < 3) return 'Mindestens drei Buchstaben, sonst ist es kein Rätsel.';
  if (wort.length > 24) return 'Höchstens 24 Zeichen — sonst passt es nicht auf den Bildschirm.';
  for (const z of wort) {
    if (!IST_BUCHSTABE(z) && !IST_TRENNER(z)) {
      return `„${z}“ geht nicht — nur Buchstaben, Leerzeichen und Bindestriche.`;
    }
  }
  if (wort.split(' ').length > 3) return 'Höchstens drei Wörter.';
  return null;
}

function mischen(liste, rnd) {
  const a = liste.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/**
 * Zieht ein Wort aus einer Kategorie („alle“ = quer durch alles). Schon
 * benutzte werden übersprungen; ist alles durch, fängt die Kategorie von vorn
 * an — lieber eine Wiederholung als „keine Wörter mehr“ mitten im Urlaub.
 */
function wortZiehen(stand, kategorie = 'allerlei', rnd = Math.random) {
  const quelle = kategorie === 'alle'
    ? ALLE
    : (WOERTER[kategorie] || WOERTER.allerlei).map((wort) => ({ wort, kategorie }));
  const frisch = quelle.filter((e) => !stand.benutzt.includes(e.wort));
  const topf = frisch.length ? frisch : quelle;
  if (!frisch.length) stand.benutzt = [];
  return mischen(topf, rnd)[0];
}

/* ------------------------------------------------------------------- Stand */

function neuerStand(namen = ['Monty', 'Christina']) {
  return {
    v: SAVE_VERSION,
    spieler: namen.map((name) => ({ name })),
    punkte: namen.map(() => 0),
    runde: 1,
    dran: 0,               // wer als Nächstes rät (das Wort stellt der andere)
    stufe: 'normal',
    kategorie: 'allerlei',
    benutzt: [],
    stellt: null,          // wer gerade ein Wort eintippt (nur fürs zweite Handy)
    verlauf: [],
    statistik: { erraten: [0, 0], gescheitert: [0, 0], gestellt: [0, 0] },
    aktuell: null,
  };
}

const anderer = (i) => (i === 0 ? 1 : 0);

/** Wie viele Fehlgriffe diese Stufe zulässt. */
const erlaubteFehler = (stufe) => TEILE.length - (STUFEN[stufe] || STUFEN.normal).vorab;

/** Das sichtbare Muster: geratene Buchstaben und Trenner, sonst null. */
function musterBauen(wort, geraten) {
  return [...wort].map((z) => (IST_TRENNER(z) || geraten.includes(z) ? z : null));
}

/* -------------------------------------------------------------- Runde */

/**
 * Startet eine Runde. `wort` kommt entweder vom Mitspieler oder aus der Liste;
 * `setzer` ist -1, wenn das Handy es gezogen hat.
 */
function rundeStarten(stand, { wort, tipp = '', setzer, rater }) {
  const sauber = normalisieren(wort);
  const fehler = wortPruefen(sauber);
  if (fehler) throw new Error(fehler);
  const erlaubt = erlaubteFehler(stand.stufe);
  stand.aktuell = {
    setzer,
    rater,
    wort: sauber,
    tipp: String(tipp || '').slice(0, 60),
    geraten: [],
    daneben: [],
    fehler: 0,
    erlaubt,
    vorab: (STUFEN[stand.stufe] || STUFEN.normal).vorab,
    muster: musterBauen(sauber, []),
    fertig: null,
    gutschrift: null,
  };
  stand.stellt = null;
  if (setzer >= 0) stand.statistik.gestellt[setzer] += 1;
  // Nur gezogene Wörter merken — die Liste soll Wiederholungen aus dem Vorrat
  // verhindern. Selbst ausgedachte gehören da nicht hinein.
  if (setzer < 0 && !stand.benutzt.includes(sauber)) stand.benutzt.push(sauber);
  return stand.aktuell;
}

/** Wie viele Teile der Zeichnung gerade zu sehen sind. */
const gezeichnet = (r) => (r ? r.vorab + r.fehler : 0);

/** Steht der Buchstabe noch zur Wahl? */
function offen(runde, buchstabe) {
  return !!runde && !runde.fertig && !runde.geraten.includes(buchstabe)
    && !runde.daneben.includes(buchstabe);
}

/**
 * Ein Buchstabe wird geraten. Gibt zurück, was passiert ist:
 * `{ treffer, fertig }` — oder null, wenn der Zug gar nicht zulässig war.
 */
function raten(stand, buchstabe) {
  const r = stand.aktuell;
  const b = normalisieren(buchstabe);
  if (!r || r.fertig || !IST_BUCHSTABE(b) || !offen(r, b)) return null;

  const treffer = r.wort.includes(b);
  if (treffer) {
    r.geraten.push(b);
    r.muster = musterBauen(r.wort, r.geraten);
    if (r.muster.every((z) => z !== null)) beenden(stand, 'gewonnen');
  } else {
    r.daneben.push(b);
    r.fehler += 1;
    if (r.fehler >= r.erlaubt) beenden(stand, 'verloren');
  }
  return { treffer, fertig: r.fertig };
}

/**
 * Das ganze Wort auf einmal. Falsch geraten kostet einen Fehlversuch —
 * sonst wäre Durchprobieren gratis.
 */
function wortRaten(stand, versuch) {
  const r = stand.aktuell;
  if (!r || r.fertig) return null;
  const v = normalisieren(versuch);
  if (!v) return null;
  if (v === r.wort) {
    r.geraten = [...new Set([...r.geraten, ...[...r.wort].filter(IST_BUCHSTABE)])];
    r.muster = musterBauen(r.wort, r.geraten);
    beenden(stand, 'gewonnen');
    return { treffer: true, fertig: r.fertig };
  }
  r.fehler += 1;
  if (r.fehler >= r.erlaubt) beenden(stand, 'verloren');
  return { treffer: false, fertig: r.fertig };
}

/** Der Rater gibt auf — zählt wie verloren. */
function aufgeben(stand) {
  const r = stand.aktuell;
  if (!r || r.fertig) return null;
  r.fehler = r.erlaubt;
  beenden(stand, 'verloren');
  return r.fertig;
}

/** Punkte einer beendeten Runde, ohne sie schon gutzuschreiben. */
function punkteFuer(runde) {
  const gut = [0, 0];
  if (!runde || !runde.fertig) return gut;
  if (runde.fertig === 'gewonnen') {
    const uebrig = Math.max(0, runde.erlaubt - runde.fehler);
    const lang = [...runde.wort].filter(IST_BUCHSTABE).length >= 12 ? PUNKTE.langesWort : 0;
    gut[runde.rater] = PUNKTE.grundGewonnen + uebrig * PUNKTE.jeUebrigerFehler + lang;
  } else if (runde.setzer >= 0) {
    gut[runde.setzer] = PUNKTE.setzerGewinnt;
  }
  return gut;
}

function beenden(stand, wie) {
  const r = stand.aktuell;
  r.fertig = wie;
  r.gutschrift = punkteFuer(r);
  if (wie === 'gewonnen') stand.statistik.erraten[r.rater] += 1;
  else stand.statistik.gescheitert[r.rater] += 1;
}

/**
 * Runde abhaken: Punkte buchen, Rollen tauschen, Zähler weiter.
 * Danach ist `aktuell` leer und die nächste Runde kann gestellt werden.
 */
function rundeAbschliessen(stand) {
  const r = stand.aktuell;
  if (!r || !r.fertig) return stand;
  const gut = r.gutschrift || punkteFuer(r);
  stand.punkte = stand.punkte.map((p, i) => p + (gut[i] || 0));
  stand.verlauf.unshift({
    runde: stand.runde,
    wort: r.wort,
    rater: r.rater,
    setzer: r.setzer,
    fertig: r.fertig,
    fehler: r.fehler,
    gutschrift: gut,
  });
  stand.verlauf = stand.verlauf.slice(0, 40);
  stand.runde += 1;
  stand.dran = anderer(r.rater);
  stand.aktuell = null;
  return stand;
}

/** Runde wegwerfen, ohne dass jemand Punkte bekommt. */
function rundeAbbrechen(stand) {
  stand.aktuell = null;
  return stand;
}

/** Wer führt? `{ index, vorsprung }` oder null bei Gleichstand. */
function fuehrung(stand) {
  const [a, b] = stand.punkte;
  if (a === b) return null;
  return a > b ? { index: 0, vorsprung: a - b } : { index: 1, vorsprung: b - a };
}

/* --------------------------------------------------- Punktestand mitnehmen */

/** Kurzcode für den Punktestand — zum Sichern oder auf ein anderes Handy. */
function alsCode(stand) {
  const kern = {
    v: SAVE_VERSION,
    n: stand.spieler.map((s) => s.name),
    p: stand.punkte,
    r: stand.runde,
    d: stand.dran,
    s: stand.statistik,
  };
  return `HMS1-${btoa(unescape(encodeURIComponent(JSON.stringify(kern))))}`;
}

/** Kurzcode zurück in einen Spielstand. Wirft bei Unsinn. */
function ausCode(code) {
  const roh = String(code || '').trim();
  if (!roh.startsWith('HMS1-')) throw new Error('Das ist kein Galgenmännchen-Punktestand.');
  let kern;
  try {
    kern = JSON.parse(decodeURIComponent(escape(atob(roh.slice(5)))));
  } catch {
    throw new Error('Der Code ist unvollständig oder verrutscht.');
  }
  if (!kern || !Array.isArray(kern.p) || kern.p.length !== 2) {
    throw new Error('Der Code passt nicht zu diesem Spiel.');
  }
  const stand = neuerStand(Array.isArray(kern.n) && kern.n.length === 2 ? kern.n : undefined);
  stand.punkte = kern.p.map((n) => (Number.isFinite(n) ? n : 0));
  stand.runde = Number.isFinite(kern.r) ? kern.r : 1;
  stand.dran = kern.d === 1 ? 1 : 0;
  if (kern.s && Array.isArray(kern.s.erraten)) stand.statistik = kern.s;
  return stand;
}

// Die Zeichnung. Elf Teile, in fester Reihenfolge — jeder Fehlgriff einen mehr.
//
// Reines SVG als Zeichenkette, kein DOM: so lässt es sich testen und
// notfalls auch woanders einsetzen. Gezeichnet wird mit Kreide auf Tafel.

const RAHMEN = { breite: 200, hoehe: 220 };

/** Die Striche in genau der Reihenfolge, in der sie erscheinen. */
const TEIL_PFADE = [
  { id: 'boden', d: 'M 22 202 L 132 202' },
  { id: 'pfosten', d: 'M 46 202 L 46 24' },
  { id: 'querbalken', d: 'M 44 24 L 128 24' },
  { id: 'strebe', d: 'M 46 56 L 78 24' },
  { id: 'seil', d: 'M 126 24 L 126 48' },
  { id: 'kopf', d: 'M 126 63 m -15 0 a 15 15 0 1 0 30 0 a 15 15 0 1 0 -30 0' },
  { id: 'rumpf', d: 'M 126 78 L 126 134' },
  { id: 'armLinks', d: 'M 126 94 L 100 118' },
  { id: 'armRechts', d: 'M 126 94 L 152 118' },
  { id: 'beinLinks', d: 'M 126 134 L 103 174' },
  { id: 'beinRechts', d: 'M 126 134 L 149 174' },
];

const KOPF_INDEX = TEIL_PFADE.findIndex((t) => t.id === 'kopf');

// Gesichter: erst wenn der Kopf steht. Vorher gibt es nichts zu zeigen.
const GESICHTER = {
  offen: 'M 120 60 l 0 0 M 132 60 l 0 0',
  froh: 'M 119 59 l 0.1 0 M 133 59 l 0.1 0 M 118 69 q 8 6 16 0',
  weg: 'M 116 56 l 6 6 M 122 56 l -6 6 M 130 56 l 6 6 M 136 56 l -6 6 M 118 71 q 8 -5 16 0',
};

/**
 * Baut die Zeichnung.
 *
 * @param {number} teile     wie viele Striche zu sehen sind (0 … 11)
 * @param {object} optionen  `vorab` = Striche, die zur Stufe gehören und
 *                           blasser stehen; `zustand` = 'laeuft'|'froh'|'weg'
 */
function galgenSvg(teile, { vorab = 0, zustand = 'laeuft' } = {}) {
  const sichtbar = Math.max(0, Math.min(TEIL_PFADE.length, Math.round(teile)));
  const striche = TEIL_PFADE.slice(0, sichtbar).map((t, i) => {
    const blass = i < vorab;
    // pathLength normiert die Länge auf 1 — dann zeichnen sich alle Striche gleich schnell.
    return `<path d="${t.d}" pathLength="1" class="strich${blass ? ' strich--vorab' : ''}"`
      + ` style="animation-delay:${Math.max(0, i - vorab) * 60}ms"/>`;
  });

  if (sichtbar > KOPF_INDEX) {
    const gesicht = zustand === 'froh' ? GESICHTER.froh
      : zustand === 'weg' ? GESICHTER.weg : GESICHTER.offen;
    striche.push(`<path d="${gesicht}" pathLength="1" class="strich strich--gesicht"/>`);
  }

  return `<svg viewBox="0 0 ${RAHMEN.breite} ${RAHMEN.hoehe}" class="galgen galgen--${zustand}"`
    + ` role="img" aria-label="${beschriftung(sichtbar, zustand)}">${striche.join('')}</svg>`;
}

/** Was ein Screenreader vorlesen soll. */
function beschriftung(sichtbar, zustand) {
  if (zustand === 'froh') return 'Gerettet — das Wort ist erraten.';
  if (zustand === 'weg') return 'Das Männchen hängt — die Fehlversuche sind aufgebraucht.';
  if (sichtbar === 0) return 'Noch kein Strich gezeichnet.';
  return `${sichtbar} von ${TEIL_PFADE.length} Strichen gezeichnet.`;
}

// Galgenmännchen — Oberfläche. Ein Handy zum Weiterreichen oder zwei zugleich.


const KEY = 'hangman.v1';
const app = document.getElementById('app');

let stand = null;
let ui = {
  screen: 'start',    // 'start' | 'hub' | 'stellen' | 'spiel'
  overlay: null,
  halter: 0,          // wer das Handy gerade in der Hand hat (nur lokal)
  entwurf: '',        // was gerade als Wort eingetippt wird
  entwurfTipp: '',
  verdeckt: true,     // Wort beim Tippen verbergen
  eingabefehler: '',
  letzter: null,      // zuletzt geratener Buchstabe — für die kleine Animation
  codeStatus: '',
  modus: 'lokal',     // 'lokal' | 'online'
  meinIndex: 0,
  gastgeber: true,
  netz: null,
  kopplung: null,
};

/* ------------------------------------------------------------------ Hilfen */

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const andere = (i) => (i === 0 ? 1 : 0);
const name = (i) => esc(stand.spieler[i]?.name || (i === 0 ? 'Eins' : 'Zwei'));
const buzz = (ms) => { try { navigator.vibrate?.(ms); } catch { /* egal */ } };

function sichern() {
  // Auf zwei Handys rechnet der Gastgeber für beide und hat das Wort deshalb im
  // Speicher — auf die Platte muss es dort aber nicht. Gesichert wird die
  // Fassung, die dieses Gerät auch sehen dürfte.
  const raus = ui.modus === 'online' ? standFuer(stand, ui.meinIndex) : stand;
  try { localStorage.setItem(KEY, JSON.stringify(raus)); } catch { /* privater Modus */ }
}

function laden() {
  try {
    const roh = localStorage.getItem(KEY);
    if (!roh) return null;
    const s = JSON.parse(roh);
    if (s && s.v === 1 && Array.isArray(s.punkte) && s.punkte.length === 2) return s;
  } catch { /* kaputter Stand wird ignoriert */ }
  return null;
}

/** Wer stellt in der kommenden Runde das Wort? */
const setzerIndex = () => andere(stand.dran);

/** Wer muss das Handy in der Hand haben? null = beide dürfen schauen. */
function braucht() {
  if (ui.screen === 'stellen') return setzerIndex();
  const r = stand?.aktuell;
  if (r && !r.fertig && r.setzer >= 0) return r.rater;   // Wort kam vom anderen
  return null;
}

function nachAenderung() {
  if (ui.modus === 'online') {
    if (ui.gastgeber) standSenden();
    render();
    return;
  }
  sichern();
  render();
}

/* ---------------------------------------------------- Zwei Handys, ein Spiel */

const gegenIndex = () => (ui.meinIndex === 0 ? 1 : 0);

/**
 * Der Stand, wie ihn ein bestimmtes Gerät sehen darf. Das Wort ist das ganze
 * Geheimnis dieses Spiels — wer rät, bekommt es nicht mitgeschickt, sondern
 * nur das Muster mit den schon aufgedeckten Buchstaben.
 */
function standFuer(quelle, empfaenger) {
  const k = JSON.parse(JSON.stringify(quelle));
  const r = k.aktuell;
  if (r && !r.fertig && r.rater === empfaenger) {
    const geheim = r.wort;
    r.wort = null;
    // Ein gezogenes Wort steht auch in der Liste der schon benutzten — dort
    // wäre es sonst das jüngste und damit sofort abzulesen.
    k.benutzt = k.benutzt.filter((w) => w !== geheim);
  }
  return k;
}

function standSenden() {
  ui.netz?.senden({ typ: 'stand', stand: standFuer(stand, gegenIndex()) });
}

/** Zug ausführen (Gastgeber) oder hinüberschicken (Gast). */
function tun(name, wert) {
  if (ui.modus === 'online' && !ui.gastgeber) {
    ui.netz?.senden({ typ: 'aktion', name, wert });
    return false;
  }
  return true;
}

function nachrichtVerarbeiten(m) {
  if (m.typ === 'namen' && !ui.gastgeber) {
    ui.meinIndex = m.meinIndex === 1 ? 1 : 0;
    return;
  }
  if (m.typ === 'stand' && !ui.gastgeber) {
    stand = m.stand;
    ui.halter = ui.meinIndex;
    // Wer gerade selbst ein Wort eintippt, bleibt auf seinem Bildschirm.
    if (ui.screen !== 'stellen') ui.screen = stand.aktuell ? 'spiel' : 'hub';
    if (stand.aktuell && ui.screen === 'stellen') ui.screen = 'spiel';
    render();
    return;
  }
  if (!ui.gastgeber || !stand) return;

  if (m.typ === 'aktion') {
    if (m.name === 'raten') raten(stand, m.wert);
    else if (m.name === 'wortRaten') wortRaten(stand, m.wert);
    else if (m.name === 'aufgeben') aufgeben(stand);
    else if (m.name === 'weiter') rundeAbschliessen(stand);
    else if (m.name === 'stellt') stand.stellt = m.wert;
    else if (m.name === 'stufe' && STUFEN[m.wert]) stand.stufe = m.wert;
    else if (m.name === 'kategorie') stand.kategorie = m.wert;
    else return;
    sichern();
    standSenden();
    render();
    return;
  }

  if (m.typ === 'wort') {
    try {
      rundeStarten(stand, { wort: m.wort, tipp: m.tipp, setzer: m.setzer, rater: andere(m.setzer) });
    } catch { return; }                      // unsinniges Wort einfach verwerfen
    ui.screen = 'spiel';
    sichern();
    standSenden();
    render();
  }
}

function kopplungAbbrechen() {
  ui.netz?.schliessen();
  ui.netz = null;
  ui.kopplung = null;
  ui.modus = 'lokal';
  ui.meinIndex = 0;
  ui.gastgeber = true;
  render();
}

async function netzStarten(gastgeber, code) {
  ui.modus = 'online';
  ui.gastgeber = gastgeber;
  ui.meinIndex = gastgeber ? 0 : 1;
  ui.kopplung = { schritt: 'raum', gastgeber, code: '', hinweis: '', fehler: '' };
  render();

  ui.netz = netzAufbauen({
    gastgeber,
    code,
    aufZustand: (text, verbunden) => {
      if (verbunden) return verbindungSteht();
      if (ui.kopplung) { ui.kopplung.hinweis = text; render(); }
      return undefined;
    },
    aufNachricht: nachrichtVerarbeiten,
    aufCode: (c) => { if (ui.kopplung) { ui.kopplung.code = c; render(); } },
  });

  try {
    await ui.netz.bereit;
  } catch (fehler) {
    if (!ui.kopplung) return;
    ui.kopplung.fehler = fehler.message || 'Das hat nicht geklappt.';
    ui.kopplung.schritt = gastgeber ? 'raum' : 'code';
    render();
  }
}

function verbindungSteht() {
  ui.kopplung = null;
  if (ui.gastgeber) {
    if (!stand) stand = neuerStand();
    ui.halter = ui.meinIndex;
    ui.screen = stand.aktuell ? 'spiel' : 'hub';
    ui.netz?.senden({ typ: 'namen', meinIndex: 1 });
    standSenden();
  }
  render();
}

/* ------------------------------------------------- Seite als Datei sichern */

/** Baut aus <style> und <script> der laufenden Seite wieder ein vollständiges Dokument. */
function seitenQuelltext(cssId, jsId, ersatzTitel) {
  const css = document.getElementById(cssId)?.textContent || '';
  const js = document.getElementById(jsId)?.textContent || '';
  if (!css || !js) return null;
  const kopf = typeof SEITENKOPF === 'string'
    ? SEITENKOPF
    : `<meta charset="utf-8"><title>${ersatzTitel}</title>`;
  return [
    '<!doctype html>', '<html lang="de">', '<head>',
    kopf,
    `<style id="${cssId}">`, css, '</style>', '</head>', '<body>',
    '<div id="app"></div>',
    `<script id="${jsId}">`, js, '<' + '/script>',
    '</body>', '</html>', '',
  ].join('\n');
}

function browserDownload(dateiname, html) {
  const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = dateiname;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

/** Rückgabe: 'ok' | 'txt' | 'abgelehnt' | 'dev' */
async function seiteAlsDateiSichern(cssId, jsId, dateiname, ersatzTitel) {
  if (typeof OFFLINE_DATEI === 'string') {
    const a = document.createElement('a');
    a.href = OFFLINE_DATEI;
    a.download = dateiname;
    document.body.appendChild(a);
    a.click();
    a.remove();
    return 'ok';
  }
  const html = seitenQuelltext(cssId, jsId, ersatzTitel);
  if (!html) return 'dev';

  const dl = typeof window !== 'undefined' && window.claude ? window.claude.downloads : null;
  if (dl) {
    try {
      await dl.save({ filename: dateiname, data: html });
      return 'ok';
    } catch (fehler) {
      const code = fehler && fehler.code;
      if (code === 'declined') return 'abgelehnt';
      if (code === 'rejected_extension' || code === 'extension_not_enabled') {
        try {
          await dl.save({ filename: dateiname.replace(/\.html$/, '') + '.txt', data: html });
          return 'txt';
        } catch (zweiterFehler) {
          if (zweiterFehler && zweiterFehler.code === 'declined') return 'abgelehnt';
        }
      }
    }
  }
  browserDownload(dateiname, html);
  return 'ok';
}

const SICHER_TEXT = {
  ok: 'Gesichert — liegt in deinen Downloads',
  txt: 'Als .txt gesichert — bitte in %NAME% umbenennen',
  abgelehnt: 'Abgebrochen — nichts gespeichert',

};

  const zeichen = r.muster.map((z, i) => {
    const echt = r.wort ? r.wort[i] : null;
    if (z === ' ') return '<span class="zeichen zeichen--luecke"></span>';
    if (z === '-') return '<span class="zeichen zeichen--strich">-</span>';
    if (z) {
      const frisch = z === ui.letzter ? ' zeichen--neu' : '';
      return `<span class="zeichen zeichen--voll${frisch}">${esc(z)}</span>`;
    }
    // Nach dem Ende wird aufgedeckt, was gefehlt hat.
    if (zeigen && echt) return `<span class="zeichen zeichen--verraten">${esc(echt)}</span>`;
    return '<span class="zeichen"></span>';
  });
  return `<div class="wortfeld">${zeichen.join('')}</div>`;
}

function fehlerLeiste(r) {
  const uebrig = Math.max(0, r.erlaubt - r.fehler);
  const punkte = Array.from({ length: r.erlaubt }, (_, i) =>
    `<span class="punkt ${i < r.fehler ? 'punkt--weg' : ''}"></span>`).join('');
  return `<div class="leiste"><span>${uebrig} übrig</span><span class="punkte">${punkte}</span></div>`;
}

  const r = stand.aktuell;

  }).join('');

  app.innerHTML = `

            <div class="reihe wortknopf">
              <button class="btn btn--geist" id="ganzesWort">Ganzes Wort</button>
              <button class="btn btn--leise" id="aufgeben">Aufgeben</button>

function abschluss(r) {

/* ------------------------------------- Kopplung ohne Server: QR im selben WLAN */

/** Womit hängt dieses Handy gerade am Netz? Chrome kennt die Antwort. */
function netzArt() {
  const c = navigator.connection || navigator.mozConnection || {};
  if (c.type) return c.type === 'none' ? 'kein Netz' : c.type;
  return navigator.onLine ? 'verbunden' : 'kein Netz';
}

/** Was die Direktverbindung gerade weiß — in einer Zeile, für den Ernstfall. */
function lageText(l, ausfuehrlich) {
  if (!l) return '';
  const kamera = ui.kopplung?.kamera;
  const stumm = l.mdns && !l.eigene.length;         // nur .local statt echter Adresse
  const leer = !l.mdns && !l.eigene.length && l.sammeln === 'fertig';  // gar nichts gefunden
  if (!ausfuehrlich && !stumm && !leer) return '';  // läuft alles: keine Technik im Weg
  const teile = [];
  if (ausfuehrlich) {
    teile.push(`Eigene Adresse: ${l.eigene.length ? l.eigene.join('  ') : 'noch keine'}`,
      `Gegenseite: ${l.fremde}`, `Stand: ${l.stand}`,
      `Kamera: ${kamera === undefined ? '?' : (kamera ? 'frei' : 'abgelehnt')}`,
      `Netz: ${netzArt()}`);
  }
  if (stumm) {
    teile.push('Dieses Handy gibt seine WLAN-Adresse nicht heraus. Erlaube der Seite die '
      + 'Kamera (Schloss-Symbol neben der Adresse → Berechtigungen → Kamera) und koppelt neu.');
  }
  if (leer && kamera === false) {
    teile.push('Dieses Handy hat keine Netzwerkadresse gefunden — und die Kamera ist nicht '
      + 'freigegeben. Ohne sie gibt Chrome keine Adresse heraus. Erst freigeben, dann neu koppeln.');
  } else if (leer) {
    teile.push('Dieses Handy hat keine Netzwerkadresse gefunden, obwohl die Kamera frei ist. '
      + 'Chrome sieht hier also kein Netz. Läuft auf diesem Handy der Hotspot? Ein Handy, das '
      + 'selbst den Hotspot aufspannt, meldet Android oft gar kein Netz — dann kann es nicht '
      + 'mitspielen. Abhilfe: beide Handys in dasselbe WLAN einwählen. Gibt es keins, spielt '
      + 'an einem Handy und reicht es hin und her.');
  }
  return teile.join(' · ');
}

/** Zeigt den Kamera-Bildschirm und wartet, wie es weitergehen soll. */
function kameraFrage() {
  return new Promise((fertig) => {
    ui.kopplung.schritt = 'kamera';
    ui.kopplung.kameraAntwort = fertig;
    render();
  });
}

/** Hält die Technikzeile aktuell, solange gekoppelt wird. */
function lageTakten() {
  if (ui.lageTakt) clearInterval(ui.lageTakt);
  ui.lageTakt = setInterval(() => {
    if (!ui.kopplung || !ui.netz) { clearInterval(ui.lageTakt); ui.lageTakt = null; return; }
    const feld = document.getElementById('lage');
    if (feld) feld.textContent = lageText(ui.netz.lage, ui.kopplung.schritt === 'warten');
  }, 500);
}

/** Kopplung von vorn: alte Verbindung weg, gleiche Rolle noch einmal. */
function kopplungNeu() {
  const gastgeber = ui.kopplung?.gastgeber ?? true;
  ui.netz?.schliessen();
  ui.netz = null;
  funkStarten(gastgeber);
}

/**
 * Direktverbindung zwischen zwei Handys. Braucht keinen Server, dafür ein
 * gemeinsames WLAN — nach außen sieht sie aus wie die Durchreiche.
 */
async function funkStarten(gastgeber) {
  ui.modus = 'online';
  ui.gastgeber = gastgeber;
  ui.meinIndex = gastgeber ? 0 : 1;
  ui.kopplung = { schritt: 'moment', gastgeber, ueberQr: true, hinweis: '', fehler: '' };
  render();

  // Erst die Kamera-Erlaubnis, dann die Verbindung. Ohne sie gibt Chrome die eigene
  // Netzwerkadresse nicht heraus — das Handy findet dann gar keine oder nur einen
  // .local-Namen, den ein Hotspot nicht auflöst. Scannen müssen wir gleich ohnehin.
  let frei = await kameraFreigeben();
  while (!frei) {
    if (!ui.kopplung) return;                 // in der Zwischenzeit abgebrochen
    const wahl = await kameraFrage();
    if (!ui.kopplung || wahl === 'abbruch') return;
    if (wahl === 'weiter') break;
    frei = await kameraFreigeben();
  }
  if (!ui.kopplung) return;
  ui.kopplung.kamera = frei;
  ui.kopplung.schritt = 'moment';
  render();

  ui.netz = funkAufbauen({
    gastgeber,
    aufZustand: (text, verbunden) => {
      if (verbunden) return verbindungSteht();
      if (ui.kopplung && ui.kopplung.schritt !== 'scannen') {
        ui.kopplung.hinweis = text;
        render();
      }
      return undefined;
    },
    aufNachricht: nachrichtVerarbeiten,
  });
  lageTakten();

  if (gastgeber) {
    ui.kopplung.code = await ui.netz.eigenerCode();
    ui.kopplung.schritt = 'zeigen';
  } else {
    ui.kopplung.schritt = 'scannen';
  }
  render();
}

async function fremdenCodeAnnehmen(code) {
  const k = ui.kopplung;
  try {
    await ui.netz.codeLesen(code);
    if (!ui.kopplung) return;                  // war schon verbunden
    if (!k.gastgeber) {
      ui.kopplung.code = await ui.netz.eigenerCode();
      ui.kopplung.schritt = 'zeigen';
    } else {
      ui.kopplung.schritt = 'warten';
    }
    k.fehler = '';
  } catch (fehler) {
    if (!ui.kopplung) return;
    k.fehler = fehler.message || 'Der Code passt nicht.';
  }
  render();
}

  const k = ui.kopplung;

  if (k.schritt === 'rolle') {
    app.innerHTML = `
