<style id="cabo-css">
/* Cabo — „Kartentisch bei Nacht“: dunkler Filz, burgunderrote Rückseiten,
   cremefarbene Kartenflächen, Messing als Akzent. Bewusst einthemig. */

:root {
  --filz: #0e1a17;
  --filz-2: #07110e;
  --feld: #16241f;
  --feld-2: #1d2f28;
  --naht: #2b423a;
  --nebel: #93a8a0;
  --nebel-dim: #62776f;

  --karton: #f6f2e7;
  --karton-2: #e6e0d0;
  --tinte: #16211e;
  --ruecken: #6b2230;
  --ruecken-hell: #8a2c3d;

  --messing: #c9a227;
  --messing-dim: #7e661a;
  --gut: #3e9b6b;
  --schlecht: #c4553f;

  --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-num: ui-monospace, SFMono-Regular, 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace;

  --r-md: 13px;
  --r-lg: 20px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: none; }

body {
  background: var(--filz);
  background-image:
    radial-gradient(120% 55% at 50% 42%, #1a2c26 0%, rgba(26, 44, 38, 0) 70%),
    linear-gradient(180deg, var(--filz) 0%, var(--filz-2) 100%);
  background-attachment: fixed;
  color: var(--nebel);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
}

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--messing); outline-offset: 3px; }

.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* ---------- Gerüst ---------- */

#app { min-height: 100dvh; display: flex; flex-direction: column; }
.screen { flex: 1; display: flex; flex-direction: column; min-height: 100dvh; }
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; }
.wrap { width: 100%; max-width: 520px; margin-inline: auto; padding: 0 18px; }

.kopf {
  display: flex; align-items: center; gap: 12px;
  padding: calc(var(--safe-t) + 11px) 18px 11px;
  border-bottom: 1px solid var(--naht);
}
.kopf .titel { flex: 1; min-width: 0; }
.kopf .ober { font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--nebel-dim); font-weight: 700; }
.kopf h1 {
  margin: 0; font-size: 17px; font-weight: 650; color: var(--karton);
  letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.werkzeuge { display: flex; gap: 7px; }
.werkzeug {
  width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
  background: var(--feld); border: 1px solid var(--naht); color: var(--nebel); font-size: 14px;
}

/* ---------- Knöpfe ---------- */

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 15px 16px; border-radius: var(--r-md);
  font-weight: 650; font-size: 15.5px; letter-spacing: -0.01em;
  transition: transform 0.1s ease, filter 0.15s ease;
}
.btn:active { transform: scale(0.985); }
.btn:disabled { opacity: 0.3; transform: none; box-shadow: none; }
.btn--messing { background: var(--messing); color: #241c00; box-shadow: 0 8px 24px rgba(201, 162, 39, 0.16); }
.btn--karton { background: var(--karton); color: var(--tinte); }
.btn--geist { background: var(--feld); color: var(--karton); border: 1px solid var(--naht); }
.btn--leise { background: none; color: var(--nebel-dim); font-weight: 500; font-size: 15px; padding: 12px; }
.btn--warn { background: var(--feld); color: #f0a79d; border: 1px solid #4b2b28; }
.reihe { display: flex; gap: 9px; }
.reihe .btn { width: auto; flex: 1; }

/* ---------- Startbildschirm ---------- */

.start { justify-content: center; text-align: center; padding: 30px 20px calc(28px + var(--safe-b)); }
.wortmarke {
  font-size: clamp(44px, 15vw, 66px); font-weight: 800; margin: 0;
  letter-spacing: 0.22em; text-indent: 0.22em; color: var(--messing); line-height: 1;
}
.unterzeile { margin: 12px 0 26px; font-size: 13.5px; color: var(--nebel-dim); }

.feldreihe { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.feld {
  flex: 1; width: 100%; background: var(--feld); border: 1px solid var(--naht);
  border-radius: var(--r-md); padding: 13px 14px; color: var(--karton); font-size: 16px;
  user-select: text; -webkit-user-select: text;
}
.feld::placeholder { color: var(--nebel-dim); }
.feldlabel {
  font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--nebel-dim); font-weight: 700; text-align: left; margin: 18px 0 7px;
}

/* ---------- Der Tisch ---------- */

/* Gegner oben, Stapel in der Mitte, eigene Hand unten am Daumen. */
.tisch {
  flex: 1; display: flex; flex-direction: column; justify-content: space-between;
  gap: 4px; padding: 12px 14px 6px; min-height: 0;
}

.gegner { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.gegnerblock { text-align: center; }
.gegnerblock .wer {
  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--nebel-dim); font-weight: 700; margin-bottom: 5px;
}
.gegnerblock .wer b { color: var(--karton); font-weight: 700; }

.mitte {
  display: flex; align-items: center; justify-content: center; gap: 26px;
  padding: 12px 0; margin: 4px 0;
  position: relative;
}
.mitte::before, .mitte::after {
  content: ""; position: absolute; left: 8%; right: 8%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--naht), transparent);
}
.mitte::before { top: 0; }
.mitte::after { bottom: 0; }

.platz { text-align: center; }
.platz .lbl {
  font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--nebel-dim); font-weight: 700; margin-top: 6px;
}

.eigene { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 4px; }
.eigene .wer { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--messing); font-weight: 700; }

.hand { display: flex; gap: 9px; justify-content: center; }

/* ---------- Karten ---------- */

.karte {
  --b: 76px;
  width: var(--b); aspect-ratio: 2 / 3; flex: none;
  border-radius: 9px; position: relative;
  transform-style: preserve-3d;
  transition: transform 0.32s cubic-bezier(0.3, 0.8, 0.3, 1);
  padding: 0;
}
.karte--klein { --b: 52px; }
.karte--gross { --b: 116px; }

.karte .seite {
  position: absolute; inset: 0; border-radius: 9px;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: grid; place-items: center;
  box-shadow: 0 5px 14px rgba(0, 0, 0, 0.45);
  overflow: hidden;
}

/* Rückseite: burgunderrot mit feinem Rautenmuster und Kartonrand */
.karte .zu {
  background:
    repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.05) 0 3px, transparent 3px 7px),
    repeating-linear-gradient(-45deg, rgba(0, 0, 0, 0.09) 0 3px, transparent 3px 7px),
    var(--ruecken);
  border: 2.5px solid var(--karton);
}
.karte .zu::after {
  content: ""; position: absolute; inset: 5px; border-radius: 4px;
  border: 1px solid rgba(246, 242, 231, 0.35);
}

/* Vorderseite: Kartonweiß mit großer Zahl */
.karte .auf {
  background: linear-gradient(160deg, var(--karton) 0%, var(--karton-2) 100%);
  color: var(--tinte);
  transform: rotateY(180deg);
  font-family: var(--font-ui);
  font-weight: 800;
  font-size: calc(var(--b) * 0.44);
  letter-spacing: -0.05em;
  border: 1px solid rgba(0, 0, 0, 0.12);
}
.karte .auf .ecke {
  position: absolute; top: 4px; left: 6px;
  font-size: calc(var(--b) * 0.16); font-weight: 700; opacity: 0.5; letter-spacing: 0;
}
.karte .auf .kraftzeichen {
  position: absolute; bottom: 4px; right: 6px;
  font-size: calc(var(--b) * 0.12); font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.55;
}

.karte--offen { transform: rotateY(180deg); }

.karte--waehlbar .zu, .karte--waehlbar .auf {
  box-shadow: 0 0 0 2.5px var(--messing), 0 6px 16px rgba(0, 0, 0, 0.5);
  animation: pochen 1.5s ease-in-out infinite;
}
@keyframes pochen { 50% { box-shadow: 0 0 0 4.5px var(--messing), 0 6px 16px rgba(0, 0, 0, 0.5); } }

.karte--markiert { transform: translateY(-10px); }
.karte--markiert .zu { box-shadow: 0 0 0 3px var(--karton), 0 10px 20px rgba(0, 0, 0, 0.55); }

.karte--leer .zu {
  background: none; border: 2px dashed var(--naht); box-shadow: none;
}
.karte--leer .zu::after { display: none; }

.stapelhaufen { position: relative; }
.stapelhaufen::before, .stapelhaufen::after {
  content: ""; position: absolute; inset: 0; border-radius: 9px;
  background: var(--ruecken); border: 2.5px solid rgba(246, 242, 231, 0.55);
  z-index: -1;
}
.stapelhaufen::before { transform: translate(3px, 3px); }
.stapelhaufen::after { transform: translate(6px, 6px); opacity: 0.6; }

.austeilen { animation: einfliegen 0.4s cubic-bezier(0.2, 0.8, 0.25, 1) both; }
@keyframes einfliegen { from { opacity: 0; transform: translateY(-40px) scale(0.8) rotate(-8deg); } }

/* ---------- Statuszeile und Aktionen ---------- */

.cabobanner {
  text-align: center; font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase;
  font-weight: 700; color: var(--messing);
  background: rgba(201, 162, 39, 0.1); border: 1px solid var(--messing-dim);
  border-radius: 999px; padding: 5px 12px; margin: 0 auto;
}

.fuss {
  padding: 10px 14px calc(12px + var(--safe-b));
  border-top: 1px solid var(--naht);
  background: rgba(7, 17, 14, 0.86); backdrop-filter: blur(8px);
  display: flex; flex-direction: column; gap: 8px;
}
.ansage { text-align: center; font-size: 14px; color: var(--nebel); min-height: 20px; text-wrap: balance; }
.ansage b { color: var(--karton); font-weight: 650; }
.ansage .kraftname { color: var(--messing); font-weight: 700; }

/* ---------- Aufdeck-Moment ---------- */

.merken {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(7, 17, 14, 0.94);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; padding: 24px calc(24px + var(--safe-b));
  animation: aufblenden 0.2s ease-out;
}
@keyframes aufblenden { from { opacity: 0; } }
.merken .lbl { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--nebel-dim); font-weight: 700; }
.merken .karten { display: flex; gap: 14px; }
.merken .karte { animation: drehen 0.45s cubic-bezier(0.3, 0.8, 0.3, 1) both; }
@keyframes drehen { from { transform: rotateY(0deg) scale(0.9); } to { transform: rotateY(180deg) scale(1); } }
.merken .hinweis { font-size: 13.5px; color: var(--nebel-dim); text-align: center; max-width: 30ch; }
.merken .btn { max-width: 320px; }

/* ---------- Punktetafel und Auswertung ---------- */

.tafel {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
  background: var(--feld); border: 1px solid var(--naht);
  border-radius: var(--r-lg); padding: 18px 14px; margin: 18px 0 6px;
}
.tafel .seite { text-align: center; min-width: 0; }
.tafel .name {
  font-size: 13.5px; line-height: 19px; height: 19px; color: var(--nebel);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tafel .zahl { font-family: var(--font-num); font-size: clamp(30px, 10vw, 42px); font-weight: 700; color: var(--karton); line-height: 1.1; }
.tafel .seite--vorn .zahl { color: var(--gut); }
.tafel .gegen { font-size: 13px; color: var(--nebel-dim); letter-spacing: 0.1em; }
.hinweiszeile { text-align: center; font-size: 12.5px; color: var(--nebel-dim); margin: 0 0 18px; }

.rundenzeile {
  display: flex; align-items: center; gap: 12px;
  background: var(--feld); border: 1px solid var(--naht);
  border-radius: var(--r-md); padding: 11px 13px; margin-bottom: 8px;
}
.rundenzeile.gewinner { border-color: var(--messing); background: var(--feld-2); }
.rundenzeile .wer { flex: 1; min-width: 0; }
.rundenzeile .wer b { display: block; color: var(--karton); font-weight: 650; }
.rundenzeile .wer small { display: block; font-size: 12px; color: var(--nebel-dim); }
.rundenzeile .karten { display: flex; gap: 4px; }
.rundenzeile .mini {
  font-family: var(--font-num); font-size: 12px; font-weight: 700;
  background: var(--karton); color: var(--tinte);
  border-radius: 4px; padding: 3px 5px; min-width: 22px; text-align: center;
}
.rundenzeile .pkt { font-family: var(--font-num); font-weight: 700; font-size: 17px; flex: none; min-width: 40px; text-align: right; }
.pkt--null { color: var(--gut); }
.pkt--viel { color: var(--schlecht); }
.pkt--mittel { color: var(--karton); }

.blatt { padding: calc(var(--safe-t) + 16px) 18px calc(18px + var(--safe-b)); width: 100%; max-width: 520px; margin-inline: auto; }
.blatt h2 { font-size: 23px; color: var(--karton); margin: 0 0 6px; font-weight: 700; letter-spacing: -0.01em; }
.blatt h3 {
  font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--messing-dim); font-weight: 700; margin: 22px 0 8px;
}
.blatt p, .blatt li { font-size: 15px; line-height: 1.6; color: var(--nebel); }
.blatt p { margin: 0 0 10px; }
.blatt ul { margin: 0 0 10px; padding-left: 20px; }
.blatt li { margin-bottom: 6px; }
.blatt strong { color: var(--karton); font-weight: 650; }
.lesbar { user-select: text; -webkit-user-select: text; }

.kraftliste { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
.kraftzeile {
  display: flex; align-items: center; gap: 12px;
  background: var(--feld); border: 1px solid var(--naht); border-radius: var(--r-md); padding: 10px 12px;
}
.kraftzeile .werte {
  font-family: var(--font-num); font-weight: 700; font-size: 14px;
  background: var(--karton); color: var(--tinte); border-radius: 6px; padding: 4px 8px; flex: none;
}
.kraftzeile b { color: var(--karton); display: block; font-size: 14.5px; }
.kraftzeile small { color: var(--nebel-dim); font-size: 12.5px; }

/* ---------- Übergabe ---------- */

.overlay {
  position: fixed; inset: 0; z-index: 50;
  background: var(--filz-2);
  display: flex; flex-direction: column;
  animation: aufblenden 0.18s ease-out;
}
.uebergabe {
  justify-content: center; align-items: center; text-align: center;
  padding: 26px calc(24px + var(--safe-b));
  background-image: radial-gradient(90% 50% at 50% 40%, #1a2c26 0%, rgba(26, 44, 38, 0) 70%);
}
.uebergabe .pfeil { font-size: 38px; animation: schubs 1.5s ease-in-out infinite; }
@keyframes schubs { 50% { transform: translateX(10px); } }
.uebergabe .lbl { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--nebel-dim); font-weight: 700; margin-top: 4px; }
.uebergabe .name { font-size: clamp(28px, 9vw, 40px); font-weight: 700; color: var(--karton); line-height: 1.1; margin: 4px 0 6px; }
.uebergabe .auftrag { color: var(--nebel); margin: 0 0 26px; max-width: 30ch; }
.uebergabe .btn { max-width: 320px; }

@media (max-height: 700px) {
  .karte { --b: 66px; }
  .karte--klein { --b: 46px; }
  .mitte { padding: 8px 0; gap: 20px; }
  .tisch { gap: 2px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ---------- Kopplung zweier Geräte ---------- */

.qrfeld {
  display: grid; place-items: center;
  background: var(--karton); border-radius: var(--r-md);
  padding: 14px; margin: 16px 0;
}
.qrfeld canvas { width: 100%; max-width: 300px; height: auto; image-rendering: pixelated; display: block; }

.scanfenster {
  position: relative; overflow: hidden;
  border-radius: var(--r-md); background: #000;
  aspect-ratio: 1; margin: 16px 0;
  border: 1px solid var(--naht);
}
.scanfenster video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scanfenster::after {
  content: ""; position: absolute; inset: 16%;
  border: 2px solid var(--messing); border-radius: 12px;
  box-shadow: 0 0 0 999px rgba(7, 17, 14, 0.45);
}

.codeklappe { margin-top: 6px; }
.codeklappe summary {
  font-size: 13px; color: var(--nebel-dim); cursor: pointer;
  padding: 8px 0; list-style: none;
}
.codeklappe summary::before { content: "▸ "; }
.codeklappe[open] summary::before { content: "▾ "; }

.codefeld {
  width: 100%; min-height: 84px; resize: vertical; margin-top: 6px;
  background: var(--feld); border: 1px solid var(--naht); border-radius: 10px;
  padding: 10px; color: var(--nebel); font-family: var(--font-num); font-size: 11px;
  word-break: break-all; user-select: text; -webkit-user-select: text;
}

  2: [44, 10, [1, 34]],
  3: [70, 15, [1, 55]],
  4: [100, 20, [1, 80]],

  9: [292, 30, [2, 116]],

  12: [466, 24, [2, 92], [2, 93]],
  13: [532, 26, [4, 107]],

  7: [6, 22, 38], 8: [6, 24, 42], 9: [6, 26, 46], 10: [6, 28, 50],

/* ------------------------------------------------------- Galois-Feld GF(256) */

const EXP = new Uint8Array(512);
const LOG = new Uint8Array(256);

    rest.shift();
    rest.push(0);

    for (const waagrecht of [true, false]) {
      let lauf = 1;
      for (let j = 1; j < n; j++) {

        const b = waagrecht ? m[i][j - 1] : m[j - 1][i];

function formatBits(maske) {
  const daten = (0b01 << 3) | maske;             // Fehlerkorrektur L = 01
  let rest = daten << 10;

function versionBits(version) {
  let rest = version << 12;
  for (let i = 17; i >= 12; i--) if ((rest >> i) & 1) rest ^= 0b1111100100101 << (i - 12);
  return (version << 12) | rest;

function infoSetzen(m, version, maske) {
  const n = m.length;
  const bits = formatBits(maske);
  // Die 15 Bits werden mit dem höchsten zuerst abgelegt, an zwei Stellen.
  const legen = (plaetze) => plaetze.forEach(([r, c], i) => {

  const bytes = new TextEncoder().encode(text);
  const version = versionWaehlen(bytes.length);
  const worte = endgueltigeWoerter(codewoerter(bytes, version), version);

  const belegt = reserviert(version);
  const roh = funktionsMuster(version);
  datenSetzen(roh, belegt, worte);

  let beste = null;
  for (let maske = 0; maske < 8; maske++) {
    if (maskeErzwingen !== null && maske !== maskeErzwingen) continue;
    const m = roh.map((zeile, r) => zeile.map((wert, c) => (
      belegt[r][c] ? wert : wert !== MASKEN[maske](r, c)
    )));
    infoSetzen(m, version, maske);
    const p = strafe(m);
    if (!beste || p < beste.punkte) beste = { punkte: p, module: m };
  }

  return { groesse: beste.module.length, version, module: beste.module };
}

/** Zeichnet den Code in ein Canvas — mit der vorgeschriebenen ruhigen Zone. */
function qrZeichnen(canvas, text, { rand = 4, hell = '#f6f2e7', dunkel = '#16211e' } = {}) {
  const { groesse, module } = qrMatrix(text);
  const gesamt = groesse + rand * 2;
  const pixel = Math.max(1, Math.floor(canvas.width / gesamt));
  const kante = pixel * gesamt;

  canvas.width = kante;
  canvas.height = kante;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = hell;
  ctx.fillRect(0, 0, kante, kante);
  ctx.fillStyle = dunkel;
  for (let r = 0; r < groesse; r++) {
    for (let c = 0; c < groesse; c++) {
      if (module[r][c]) ctx.fillRect((c + rand) * pixel, (r + rand) * pixel, pixel, pixel);
    }
  }
  return { groesse, kante };
}

// Direktverbindung zwischen zwei Handys im selben WLAN oder Hotspot.
//
// Es gibt keinen Server, der vermittelt. Deshalb tauschen die Geräte ihre
// Verbindungsdaten einmalig per QR-Code aus: Gastgeber zeigt, Gast scannt,
// Gast zeigt zurück, Gastgeber scannt. Danach läuft alles direkt.
//
// Damit ein Code auf ein Handydisplay passt, wird die Beschreibung auf das
// Nötigste eingedampft und auf der Gegenseite aus einer Vorlage neu gebaut.

const CODE_MARKE = 'CB1';

/* ------------------------------------------------- Verbindungsdaten packen */

function hexZuBase64(hex) {
  const bytes = hex.split(':').map((h) => parseInt(h, 16));
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function base64ZuHex(b64) {
  const roh = atob(b64.replace(/-/g, '+').replace(/_/g, '/'));
  return Array.from(roh, (c) => c.charCodeAt(0).toString(16).padStart(2, '0').toUpperCase()).join(':');
}

/** Aus einer vollständigen Beschreibung einen kurzen, scanbaren Code machen. */
function alsCode(sdp, rolle) {
  const hole = (muster) => (sdp.match(muster) || [])[1] || '';
  const ufrag = hole(/^a=ice-ufrag:(.+)$/m);
  const pwd = hole(/^a=ice-pwd:(.+)$/m);
  const fingerabdruck = hole(/^a=fingerprint:sha-256 (.+)$/m).trim();

  const kandidaten = [];
  for (const zeile of sdp.split(/\r?\n/)) {
    const t = zeile.match(/^a=candidate:\S+ \d+ (udp|UDP) \d+ (\S+) (\d+) typ (host|srflx)/);
    if (t && !kandidaten.some((k) => k === `${t[2]},${t[3]}`)) kandidaten.push(`${t[2]},${t[3]}`);
  }

  return [CODE_MARKE + rolle, ufrag, pwd, hexZuBase64(fingerabdruck), ...kandidaten].join('|');
}

/** Kurzcode wieder zu einer vollständigen Beschreibung aufblasen. */
function ausCode(code) {
  const teile = String(code).trim().split('|');
  const kopf = teile[0] || '';
  if (!kopf.startsWith(CODE_MARKE)) throw new Error('Das ist kein Cabo-Verbindungscode.');
  const rolle = kopf.slice(CODE_MARKE.length);
  if (rolle !== 'O' && rolle !== 'A') throw new Error('Der Verbindungscode ist unvollständig.');

  const [, ufrag, pwd, fingerBase64, ...kandidaten] = teile;
  if (!ufrag || !pwd || !fingerBase64) throw new Error('Der Verbindungscode ist unvollständig.');

  const sdp = [
    'v=0',
    'o=- 1 2 IN IP4 127.0.0.1',
    's=-',
    't=0 0',
    'a=group:BUNDLE 0',
    'a=msid-semantic: WMS',
    'm=application 9 UDP/DTLS/SCTP webrtc-datachannel',
    'c=IN IP4 0.0.0.0',
    `a=ice-ufrag:${ufrag}`,
    `a=ice-pwd:${pwd}`,
    'a=ice-options:trickle',
    `a=fingerprint:sha-256 ${base64ZuHex(fingerBase64)}`,
    `a=setup:${rolle === 'O' ? 'actpass' : 'active'}`,
    'a=mid:0',
    'a=sctp-port:5000',
    'a=max-message-size:262144',
    '',
  ].join('\r\n');

  return {
    typ: rolle === 'O' ? 'offer' : 'answer',
    sdp,
    kandidaten: kandidaten.filter(Boolean).map((k) => {
      const [adresse, port] = k.split(',');
      return {
        candidate: `candidate:1 1 udp 2130706431 ${adresse} ${port} typ host generation 0 ufrag ${ufrag}`,
        sdpMid: '0',
        sdpMLineIndex: 0,
      };
    }),
  };
}

/* ------------------------------------------------------------- Verbindung */

/**
 * Baut die Verbindung auf. `aufZustand(text, verbunden)` meldet Fortschritt,
 * `aufNachricht(objekt)` liefert eingehende Daten.
 */
function funkAufbauen({ gastgeber, aufZustand, aufNachricht }) {
  const pc = new RTCPeerConnection({ iceServers: [] });
  let kanal = null;
  let offen = false;

  const melde = (text) => aufZustand?.(text, offen);

  const kanalVerdrahten = (k) => {
    kanal = k;
    k.onopen = () => { offen = true; aufZustand?.('verbunden', true); };
    k.onclose = () => { offen = false; aufZustand?.('getrennt', false); };
    k.onmessage = (e) => {
      try { aufNachricht?.(JSON.parse(e.data)); } catch { /* kaputte Nachricht */ }
    };
  };

  if (gastgeber) kanalVerdrahten(pc.createDataChannel('cabo', { ordered: true }));
  else pc.ondatachannel = (e) => kanalVerdrahten(e.channel);

  pc.oniceconnectionstatechange = () => {
    if (['failed', 'disconnected'].includes(pc.iceConnectionState) && !offen) {
      melde('Keine Verbindung — blockiert euer Hotspot vielleicht den direkten Weg?');
    }
  };

  /** Wartet, bis alle lokalen Adressen gesammelt sind (oder die Geduld endet). */
  const adressenSammeln = () => new Promise((fertig) => {
    if (pc.iceGatheringState === 'complete') return fertig();
    const stopp = setTimeout(fertig, 3000);
    pc.onicegatheringstatechange = () => {
      if (pc.iceGatheringState === 'complete') { clearTimeout(stopp); fertig(); }
    };
    return undefined;
  });

  return {
    /** Gastgeber: eigenen Code erzeugen. Gast: erst nach codeLesen aufrufen. */
    async eigenerCode() {
      const beschreibung = gastgeber ? await pc.createOffer() : await pc.createAnswer();
      await pc.setLocalDescription(beschreibung);
      await adressenSammeln();
      return alsCode(pc.localDescription.sdp, gastgeber ? 'O' : 'A');
    },

    async codeLesen(code) {
      const { typ, sdp, kandidaten } = ausCode(code);
      if (gastgeber && typ !== 'answer') throw new Error('Das ist der Code des Gastgebers — du brauchst den vom Gast.');
      if (!gastgeber && typ !== 'offer') throw new Error('Das ist der Code des Gasts — du brauchst den vom Gastgeber.');
      await pc.setRemoteDescription({ type: typ, sdp });
      for (const k of kandidaten) {
        try { await pc.addIceCandidate(k); } catch { /* einzelne Adresse taugt nicht */ }
      }
      melde('verbinde …');
    },

    senden(objekt) {
      if (kanal && kanal.readyState === 'open') {
        kanal.send(JSON.stringify(objekt));
        return true;
      }
      return false;
    },

    get verbunden() { return offen; },

    schliessen() {
      try { kanal?.close(); } catch { /* egal */ }
      try { pc.close(); } catch { /* egal */ }
    },
  };
}

/* ---------------------------------------------------------------- Scanner */

const scannerMoeglich = () => typeof window !== 'undefined'
  && 'BarcodeDetector' in window
  && !!navigator.mediaDevices?.getUserMedia;

/**
 * Startet die Kamera und meldet den ersten gefundenen QR-Code.
 * Gibt eine Funktion zum Abschalten zurück.
 */
async function scannerStarten(videoElement, aufTreffer, aufFehler) {
  if (!scannerMoeglich()) {
    aufFehler?.(new Error('Dieser Browser kann keine QR-Codes lesen — nimm den Textcode.'));
    return () => {};
  }
  let laeuft = true;
  let strom = null;

  try {
    strom = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: false,
    });
  } catch (fehler) {
    aufFehler?.(new Error('Kein Zugriff auf die Kamera. Erlaube ihn oder nimm den Textcode.'));
    return () => {};
  }

  videoElement.srcObject = strom;
  videoElement.setAttribute('playsinline', '');
  await videoElement.play().catch(() => {});

  const sucher = new window.BarcodeDetector({ formats: ['qr_code'] });
  const schauen = async () => {
    if (!laeuft) return;
    try {
      const treffer = await sucher.detect(videoElement);
      const code = treffer.find((t) => String(t.rawValue).startsWith(CODE_MARKE));
      if (code) { laeuft = false; aufTreffer(code.rawValue); return stoppen(); }
    } catch { /* einzelner Fehlversuch ist egal */ }
    setTimeout(schauen, 220);
    return undefined;
  };

  const stoppen = () => {
    laeuft = false;
    strom?.getTracks().forEach((t) => t.stop());
    videoElement.srcObject = null;
  };

  schauen();
  return stoppen;
}

// Zwei Handys über das Internet verbinden — für die Fassung auf der Webseite.
//
// Anders als funk.js braucht das kein gemeinsames WLAN und keine Kamera: Der
// Server hält nur einen Raum mit einem kurzen Code offen und reicht Nachrichten
// durch. Er versteht kein Spiel; er merkt sich, wer was noch nicht abgeholt hat.
//
// Nach außen sieht das genauso aus wie eine Direktverbindung — `senden`,
// `verbunden`, `schliessen` — damit die Oberfläche nichts davon wissen muss.

const NETZ_BASIS = (typeof SPIELE_BASIS === 'string' ? SPIELE_BASIS : '.').replace(/\/$/, '');

/** Steht dieser Weg überhaupt zur Verfügung? Nur in der Webfassung. */
const netzMoeglich = () => typeof SPIELE_BASIS === 'string';

async function ruf(pfad, optionen = {}) {
  const antwort = await fetch(`${NETZ_BASIS}/api${pfad}`, {
    cache: 'no-store',
    headers: { 'Content-Type': 'application/json' },
    ...optionen,
  });
  let daten = null;
  try { daten = await antwort.json(); } catch { /* leere Antwort */ }
  if (!antwort.ok) throw new Error((daten && daten.fehler) || `Server meldet ${antwort.status}.`);
  return daten || {};
}

/**
 * Raum aufmachen oder beitreten und danach dauerhaft lauschen.
 *
 * `aufZustand(text, verbunden)` meldet Fortschritt, `aufNachricht(objekt)`
 * liefert alles, was die Gegenseite schickt, `aufCode(code)` den Raumcode,
 * sobald er feststeht.
 */
function netzAufbauen({ gastgeber, code, aufZustand, aufNachricht, aufCode }) {
  let raum = null;         // { code, sitz, schluessel }
  let ab = 0;
  let offen = false;
  let laeuft = true;
  let fehlversuche = 0;

  const melde = (text, verbunden = offen) => aufZustand?.(text, verbunden);

  async function lauschen() {
    while (laeuft && raum) {
      try {
        const q = new URLSearchParams({
          sitz: String(raum.sitz), ab: String(ab), schluessel: raum.schluessel,
        });
        const daten = await ruf(`/raum/${raum.code}/holen?${q}`);
        if (!laeuft) return;
        fehlversuche = 0;

        if (daten.voll && !offen) { offen = true; aufZustand?.('verbunden', true); }
        if (!daten.voll && offen) { offen = false; aufZustand?.('getrennt', false); }

        for (const n of daten.nachrichten || []) {
          ab = Math.max(ab, n.nr);
          try { aufNachricht?.(n.inhalt); } catch { /* kaputte Nachricht */ }
        }
        if (typeof daten.stand === 'number') ab = Math.max(ab, Math.min(ab, daten.stand));
      } catch (fehler) {
        if (!laeuft) return;
        fehlversuche += 1;
        if (fehlversuche >= 4) {
          offen = false;
          aufZustand?.(`Verbindung abgerissen: ${fehler.message}`, false);
        }
        // Kurz warten, dann weiter — kurze Aussetzer sollen das Spiel nicht beenden.
        await new Promise((w) => setTimeout(w, Math.min(4000, 500 * fehlversuche)));
      }
    }
  }

  const bereit = (async () => {
    melde(gastgeber ? 'Raum wird geöffnet …' : 'Raum wird gesucht …', false);
    raum = gastgeber
      ? await ruf('/raum', { method: 'POST', body: '{}' })
      : await ruf(`/raum/${String(code || '').trim().toUpperCase()}/beitreten`,
        { method: 'POST', body: '{}' });
    aufCode?.(raum.code);
    melde(gastgeber ? 'Warte auf das zweite Handy …' : 'Verbinde …', false);
    lauschen();
    return raum.code;
  })();

  return {
    bereit,                                   // Promise: fertig, sobald der Raum steht
    get code() { return raum && raum.code; },
    get verbunden() { return offen; },

    senden(objekt) {
      if (!raum) return false;
      ruf(`/raum/${raum.code}/senden`, {
        method: 'POST',
        body: JSON.stringify({ sitz: raum.sitz, schluessel: raum.schluessel, nachricht: objekt }),
      }).catch(() => { /* der Lauscher merkt den Ausfall */ });
      return true;
    },

    schliessen() {
      laeuft = false;
      offen = false;
      raum = null;
    },
  };
}

// Cabo — Spiellogik ohne DOM. Alles serialisierbar (localStorage-tauglich).

// 52 Karten: 0 und 13 je zweimal, 1 bis 12 je viermal.
const DECK_AUFBAU = [[0, 2], [13, 2], ...Array.from({ length: 12 }, (_, i) => [i + 1, 4])];

const KRAEFTE = {
  peek: { titel: 'Peek', werte: [7, 8], text: 'Sieh dir eine eigene Karte an.' },
  spy: { titel: 'Spy', werte: [9, 10], text: 'Sieh dir eine Karte einer anderen Person an.' },
  swap: { titel: 'Swap', werte: [11, 12], text: 'Tausche eine eigene Karte blind gegen eine fremde.' },
};

const HANDGROESSE = 4;
const START_ANSEHEN = 2;      // die beiden unteren Karten
const CABO_STRAFE = 5;
const SPIELENDE_AB = 100;
const HALBIERUNG_BEI = 100;   // genau 100 wird zu 50

function kraftVon(wert) {
  for (const [art, k] of Object.entries(KRAEFTE)) if (k.werte.includes(wert)) return art;
  return null;
}

function neuesDeck() {
  const deck = [];
  let n = 0;
  for (const [wert, anzahl] of DECK_AUFBAU) {
    for (let i = 0; i < anzahl; i++) deck.push({ id: `k${n++}`, w: wert });
  }
  return deck;
}

function mischen(liste, rnd = Math.random) {
  const a = liste.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const naechster = (i, n) => (i + 1) % n;

function neuesSpiel(namen = ['Monty', 'Christina']) {
  return {
    v: 1,
    spieler: namen.map((name) => ({ name, hand: [] })),
    punkte: namen.map(() => 0),
    runde: 1,
    geber: 0,
    dran: 0,
    stapel: [],
    ablage: [],
    phase: 'aus',       // 'aus' | 'einpraegen' | 'zug' | 'gezogen' | 'paar' | 'kraft' | 'auswertung' | 'ende'
    gezogene: null,
    quelle: null,       // 'stapel' | 'ablage'
    kraft: null,        // { art, eigene: index|null }
    paar: null,         // { gewaehlt: [index], ergebnis }
    caboVon: null,
    restZuege: null,
    einpraegenIndex: 0,
    aufdecken: null,    // { wer, index, karte, text }
    auswertung: null,
    verlauf: [],
  };
}

/* ------------------------------------------------------------ Runde starten */

function neueRunde(s, rnd = Math.random) {
  const n = s.spieler.length;
  const deck = mischen(neuesDeck(), rnd);
  for (const p of s.spieler) p.hand = deck.splice(0, HANDGROESSE);
  s.ablage = [deck.pop()];
  s.stapel = deck;

  s.phase = 'einpraegen';
  s.einpraegenIndex = 0;
  s.dran = naechster(s.geber, n);   // links vom Geber beginnt
  s.gezogene = null;
  s.quelle = null;
  s.kraft = null;
  s.paar = null;
  s.caboVon = null;
  s.restZuege = null;
  s.aufdecken = null;
  s.auswertung = null;
  return s;
}

/** Die Karten, die man sich zu Beginn ansehen darf: die beiden unteren. */
function startKarten(s, wer) {
  const hand = s.spieler[wer].hand;
  return Array.from({ length: START_ANSEHEN }, (_, i) => HANDGROESSE - START_ANSEHEN + i)
    .map((index) => ({ index, karte: hand[index] }));
}

function einpraegenFertig(s) {
  s.einpraegenIndex += 1;
  if (s.einpraegenIndex >= s.spieler.length) {
    s.einpraegenIndex = 0;
    s.phase = 'zug';
  }
  return s;
}

/* ------------------------------------------------------------------- Zug */

/** Ist der Nachziehstapel leer, wandert die Ablage bis auf die oberste Karte zurück. */
function stapelAuffuellen(s, rnd) {
  if (s.stapel.length > 0 || s.ablage.length <= 1) return;
  const oben = s.ablage.pop();
  s.stapel = mischen(s.ablage, rnd);
  s.ablage = [oben];
}

function obenAufAblage(s) {
  return s.ablage.length ? s.ablage[s.ablage.length - 1] : null;
}

function ziehen(s, quelle, rnd = Math.random) {
  if (s.phase !== 'zug') return s;
  if (quelle === 'ablage') {
    if (!s.ablage.length) return s;
    s.gezogene = s.ablage.pop();
  } else {
    stapelAuffuellen(s, rnd);
    if (!s.stapel.length) return s;
    s.gezogene = s.stapel.pop();
  }
  s.quelle = quelle;
  s.phase = 'gezogen';
  return s;
}

/** Gezogene Karte gegen eine eigene tauschen. Die alte Karte kommt offen auf die Ablage. */
function tauschen(s, index) {
  if (s.phase !== 'gezogen') return s;
  const hand = s.spieler[s.dran].hand;
  if (index < 0 || index >= hand.length) return s;
  const raus = hand[index];
  hand[index] = s.gezogene;
  s.ablage.push(raus);
  s.gezogene = null;
  s.quelle = null;
  return zugEnde(s);
}

/** Gezogene Karte abwerfen. Nur vom Stapel erlaubt, und nur so gibt es Kräfte. */
function abwerfen(s) {
  if (s.phase !== 'gezogen' || s.quelle !== 'stapel') return s;
  const karte = s.gezogene;
  s.ablage.push(karte);
  s.gezogene = null;
  s.quelle = null;

  const art = kraftVon(karte.w);
  if (art) {
    s.kraft = { art, eigene: null };
    s.phase = 'kraft';
    return s;
  }
  return zugEnde(s);
}

/* --------------------------------------------------- Gleiche Karten werfen */

const PAAR_MINDESTENS = 2;

/** Nach dem Ziehen: behaupten, mehrere eigene Karten hätten denselben Wert. */
function paarStarten(s) {
  if (s.phase !== 'gezogen') return s;
  if (s.spieler[s.dran].hand.length < PAAR_MINDESTENS) return s;
  s.paar = { gewaehlt: [], ergebnis: null };
  s.phase = 'paar';
  return s;
}

function paarWaehlen(s, index) {
  if (s.phase !== 'paar' || s.paar.ergebnis) return s;
  const i = s.paar.gewaehlt.indexOf(index);
  if (i === -1) s.paar.gewaehlt.push(index);
  else s.paar.gewaehlt.splice(i, 1);
  return s;
}

function paarAbbrechen(s) {
  if (s.phase !== 'paar' || s.paar.ergebnis) return s;
  s.paar = null;
  s.phase = 'gezogen';
  return s;
}

/** Aufdecken — ab hier sehen alle die Karten, egal wie es ausgeht. */
function paarAufdecken(s) {
  if (s.phase !== 'paar' || s.paar.ergebnis) return s;
  const idx = s.paar.gewaehlt.slice().sort((a, b) => a - b);
  if (idx.length < PAAR_MINDESTENS) return s;
  const hand = s.spieler[s.dran].hand;
  const karten = idx.map((i) => hand[i]);
  s.paar.ergebnis = {
    stimmt: karten.every((k) => k.w === karten[0].w),
    karten,
    indizes: idx,
  };
  return s;
}

/**
 * Stimmt die Behauptung, wandern alle Karten auf die Ablage und die gezogene
 * Karte rückt auf den ersten frei gewordenen Platz — die Hand wird kleiner.
 * Stimmt sie nicht, bleibt alles liegen und der Zug ist verloren.
 */
function paarBestaetigen(s) {
  if (s.phase !== 'paar' || !s.paar.ergebnis) return s;
  const { stimmt, indizes } = s.paar.ergebnis;
  const hand = s.spieler[s.dran].hand;

  if (stimmt) {
    for (const i of indizes) s.ablage.push(hand[i]);
    hand[indizes[0]] = s.gezogene;
    for (const i of indizes.slice(1).reverse()) hand.splice(i, 1);
  } else {
    s.ablage.push(s.gezogene);
  }

  s.gezogene = null;
  s.quelle = null;
  s.paar = null;
  return zugEnde(s);
}

/* ------------------------------------------------------------------ Kräfte */

function kraftAuslassen(s) {
  if (s.phase !== 'kraft') return s;
  s.kraft = null;
  return zugEnde(s);
}

/** Peek: eigene Karte ansehen. */
function peek(s, index) {
  if (s.phase !== 'kraft' || s.kraft.art !== 'peek') return s;
  s.aufdecken = { wer: s.dran, index, karte: s.spieler[s.dran].hand[index], text: 'Deine Karte' };
  s.kraft.erledigt = true;
  return s;
}

/** Spy: fremde Karte ansehen. */
function spy(s, wer, index) {
  if (s.phase !== 'kraft' || s.kraft.art !== 'spy' || wer === s.dran) return s;
  s.aufdecken = {
    wer, index, karte: s.spieler[wer].hand[index],
    text: `Karte von ${s.spieler[wer].name}`,
  };
  s.kraft.erledigt = true;
  return s;
}

/** Swap, Schritt 1: eigene Karte vormerken. */
function swapEigene(s, index) {
  if (s.phase !== 'kraft' || s.kraft.art !== 'swap') return s;
  s.kraft.eigene = s.kraft.eigene === index ? null : index;
  return s;
}

/** Swap, Schritt 2: fremde Karte wählen — getauscht wird blind. */
function swapFremde(s, wer, index) {
  if (s.phase !== 'kraft' || s.kraft.art !== 'swap') return s;
  if (s.kraft.eigene === null || wer === s.dran) return s;
  const meine = s.spieler[s.dran].hand;
  const deine = s.spieler[wer].hand;
  const i = s.kraft.eigene;
  [meine[i], deine[index]] = [deine[index], meine[i]];
  s.kraft = null;
  return zugEnde(s);
}

/** Eine Enthüllung wegtippen. Danach ist der Zug vorbei. */
function aufdeckenSchliessen(s) {
  if (!s.aufdecken) return s;
  s.aufdecken = null;
  if (s.phase === 'kraft') return zugEnde(s);
  return s;
}

/* -------------------------------------------------------------------- Cabo */

function caboRufen(s) {
  if (s.phase !== 'zug' || s.caboVon !== null) return s;
  s.caboVon = s.dran;
  s.restZuege = s.spieler.length - 1;   // alle anderen bekommen genau einen Zug
  return zugEnde(s, true);
}

function zugEnde(s, warCabo = false) {
  s.kraft = null;
  s.paar = null;
  s.gezogene = null;
  s.quelle = null;

  if (s.caboVon !== null && !warCabo) {
    s.restZuege -= 1;
    if (s.restZuege <= 0) return auswerten(s);
  }
  s.dran = naechster(s.dran, s.spieler.length);
  s.phase = 'zug';
  return s;
}

/* --------------------------------------------------------------- Auswertung */

function handSumme(spieler) {
  return spieler.hand.reduce((sum, k) => sum + k.w, 0);
}

function auswerten(s) {
  const summen = s.spieler.map(handSumme);
  const niedrigste = Math.min(...summen);
  const rufer = s.caboVon;
  // Bei Gleichstand gewinnt, wer Cabo gerufen hat.
  const caboGeglueckt = rufer !== null && summen[rufer] <= niedrigste;

  const zeilen = s.spieler.map((p, i) => {
    if (rufer === i) {
      return caboGeglueckt
        ? { p: i, summe: summen[i], punkte: 0, text: 'Cabo gerufen und behalten' }
        : { p: i, summe: summen[i], punkte: summen[i] + CABO_STRAFE, text: `Cabo verpatzt — ${summen[i]} + ${CABO_STRAFE}` };
    }
    return { p: i, summe: summen[i], punkte: summen[i], text: 'Kartenwert' };
  });

  for (const z of zeilen) s.punkte[z.p] += z.punkte;

  // Genau 100 ist ein Geschenk: zurück auf 50.
  for (let i = 0; i < s.punkte.length; i++) {
    if (s.punkte[i] === HALBIERUNG_BEI) s.punkte[i] = HALBIERUNG_BEI / 2;
  }

  s.auswertung = { zeilen, caboVon: rufer, caboGeglueckt, niedrigste };
  s.verlauf.unshift({
    runde: s.runde,
    caboVon: rufer,
    caboGeglueckt,
    punkte: zeilen.map((z) => z.punkte),
    summen,
  });
  if (s.verlauf.length > 100) s.verlauf.length = 100;

  s.phase = Math.max(...s.punkte) >= SPIELENDE_AB ? 'ende' : 'auswertung';
  return s;
}

function naechsteRunde(s, rnd = Math.random) {
  if (s.phase !== 'auswertung') return s;
  s.runde += 1;
  s.geber = naechster(s.geber, s.spieler.length);
  return neueRunde(s, rnd);
}

function endstand(s) {
  return s.spieler
    .map((p, i) => ({ index: i, name: p.name, punkte: s.punkte[i] }))
    .sort((a, b) => a.punkte - b.punkte);
}

/** Wer muss das Handy in der Hand haben? */
function amZug(s) {
  if (s.phase === 'einpraegen') return s.einpraegenIndex;
  if (['zug', 'gezogen', 'kraft', 'paar'].includes(s.phase)) return s.dran;
  return null;
}

}

function laden() {

/** Baut aus <style> und <script> der laufenden Seite wieder ein vollständiges Dokument. */
function seitenQuelltext(cssId, jsId, ersatzTitel) {
  const css = document.getElementById(cssId)?.textContent || '';
  const js = document.getElementById(jsId)?.textContent || '';
  if (!css || !js) return null;
  const kopf = typeof SEITENKOPF === 'string'
    ? SEITENKOPF
    : `<meta charset="utf-8"><title>${ersatzTitel}</title>`;
  return [
    '<!doctype html>', '<html lang="de">', '<head>',
    kopf,
    `<style id="${cssId}">`, css, '</style>', '</head>', '<body>',
    '<div id="app"></div>',
    `<script id="${jsId}">`, js, '<' + '/script>',
    '</body>', '</html>', ''
  ].join('\n');
}

function browserDownload(dateiname, html) {
  const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = dateiname;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

/**
 * Speichert die laufende Seite als eigenständige HTML-Datei.
 * In der Claude-App über deren Speichern-Dialog, sonst als Browser-Download.
 */
async function seiteAlsDateiSichern(cssId, jsId, dateiname, ersatzTitel) {
  // Auf der Webseite liegt die Einzeldatei fertig daneben — dann einfach die holen.
  if (typeof OFFLINE_DATEI === 'string') {
    const a = document.createElement('a');
    a.href = OFFLINE_DATEI;
    a.download = dateiname;
    document.body.appendChild(a);
    a.click();
    a.remove();
    return 'ok';
  }
  const html = seitenQuelltext(cssId, jsId, ersatzTitel);
  if (!html) return 'dev';
  const dl = typeof window !== 'undefined' && window.claude ? window.claude.downloads : null;
  if (dl) {
    try {
      await dl.save({ filename: dateiname, data: html });
      return 'ok';
    } catch (fehler) {
      const code = fehler && fehler.code;
      if (code === 'declined') return 'abgelehnt';
      if (code === 'rejected_extension' || code === 'extension_not_enabled') {
        try {
          await dl.save({ filename: dateiname.replace(/\.html$/, '') + '.txt', data: html });
          return 'txt';
        } catch (zweiter) {
          if (zweiter && zweiter.code === 'declined') return 'abgelehnt';
        }
      }
    }
  }
  browserDownload(dateiname, html);
  return 'ok';
}

/**
 * Gibt die Spieldatei an das Teilen-Menü des Handys weiter — damit landet sie
 * per Nearby Share, WhatsApp oder Bluetooth direkt auf dem zweiten Gerät.
 * Rückgabe: 'ok' | 'abgelehnt' | 'geht-nicht' | 'dev'
 */
async function spielTeilen(cssId, jsId, dateiname, titel) {
  // Auf der Webseite ist der Link das Nützlichste, was man weitergeben kann.
  if (typeof OFFLINE_DATEI === 'string') {
    try {
      if (navigator.share) {
        await navigator.share({ title: titel, url: location.href });
        return 'ok';
      }
      await navigator.clipboard.writeText(location.href);
      return 'kopiert';
    } catch (fehler) {
      return fehler && fehler.name === 'AbortError' ? 'abgelehnt' : 'geht-nicht';
    }
  }
  const html = seitenQuelltext(cssId, jsId, titel);
  if (!html) return 'dev';
  try {
    const datei = new File([html], dateiname, { type: 'text/html' });
    if (navigator.canShare && navigator.canShare({ files: [datei] })) {
      await navigator.share({ files: [datei], title: titel });
      return 'ok';
    }
  } catch (fehler) {
    if (fehler && fehler.name === 'AbortError') return 'abgelehnt';
  }
  return 'geht-nicht';
}

/* ------------------------------------------------- Züge ausführen oder senden */

const AKTIONEN = {
  ziehen, tauschen, abwerfen, kraftAuslassen, peek, spy, swapEigene, swapFremde,
  aufdeckenSchliessen, caboRufen, einpraegenFertig, naechsteRunde,
  paarStarten, paarWaehlen, paarAbbrechen, paarAufdecken, paarBestaetigen,
};

/** Der Gastgeber rechnet, der Gast schickt nur seine Absicht hinüber. */
function tun(name, ...args) {
  if (ui.modus === 'online' && ui.meinIndex !== 0) {
    ui.funk?.senden({ typ: 'aktion', name, args });
    return;
  }
  AKTIONEN[name](spiel, ...args);
  if (ui.modus === 'online') standSenden();
  weiter();
}

/**
 * Was der Gast zu sehen bekommt: alle Handkarten und der Nachziehstapel sind
 * wertlos gemacht. Nur was ihm zusteht — seine gezogene Karte, seine
 * Enthüllung, seine Startkarten — kommt im Klartext mit.
 */
function standFuer(s, empfaenger) {
  const k = JSON.parse(JSON.stringify(s));
  if (k.phase === 'auswertung' || k.phase === 'ende') return k;

  const zu = (karte) => ({ id: karte.id, w: null });
  for (const p of k.spieler) p.hand = p.hand.map(zu);
  k.stapel = k.stapel.map(zu);

  if (k.dran !== empfaenger) {
    if (k.gezogene) k.gezogene = zu(k.gezogene);
    if (k.aufdecken) k.aufdecken = { ...k.aufdecken, karte: zu(k.aufdecken.karte) };
  }
  if (k.phase === 'einpraegen' && k.einpraegenIndex === empfaenger) {
    const echt = s.spieler[empfaenger].hand;
    k.spieler[empfaenger].hand = echt.map((c, i) => (
      i >= echt.length - START_ANSEHEN ? { ...c } : zu(c)));
  }
  return k;                                   // aufgedeckte Paare sehen ohnehin alle
}

function standSenden() {
  ui.funk?.senden({ typ: 'stand', spiel: standFuer(spiel, 1) });
}

/** Wessen Blatt zeigt dieses Gerät als „meins“? */
function michSelbst() {
  return ui.modus === 'online' ? ui.meinIndex : spiel.dran;
}

/** Darf an diesem Gerät gerade überhaupt getippt werden? */
function ichBinDran() {
  return ui.modus !== 'online' || spiel.dran === ui.meinIndex;
}

function karteHtml(karte, { offen = false, klasse = '', attrs = '', waehlbar = false } = {}) {
  const w = karte ? karte.w : null;
  const art = w != null ? kraftVon(w) : null;
  const tag = waehlbar ? 'button' : 'div';
  const kl = ['karte', offen ? 'karte--offen' : '', waehlbar ? 'karte--waehlbar' : '', klasse]
    .filter(Boolean).join(' ');
  const vorderseite = w != null
    ? `<span class="ecke">${w}</span>${w}${art ? `<span class="kraftzeichen">${KRAEFTE[art].titel}</span>` : ''}`
    : '';
  return `<${tag} class="${kl}"${attrs}${waehlbar ? ' type="button"' : ''}>
    <span class="seite zu"></span><span class="seite auf">${vorderseite}</span>
  </${tag}>`;
}

function kopplungAbbrechen() {
  ui.kopplung?.scannerStoppen?.();
  ui.funk?.schliessen();
  ui.funk = null;
  ui.kopplung = null;
  ui.modus = 'lokal';
  ui.meinIndex = 0;
  render();
}

async function kopplungStarten(rolle) {
  ui.modus = 'online';
  ui.meinIndex = rolle === 'gastgeber' ? 0 : 1;
  ui.kopplung = { schritt: 'moment', rolle, hinweis: '', fehler: '' };
  render();

  ui.funk = funkAufbauen({
    gastgeber: rolle === 'gastgeber',
    aufZustand: (text, verbunden) => {
      if (verbunden) return verbindungSteht();
      if (ui.kopplung && ui.kopplung.schritt !== 'scannen') {
        ui.kopplung.hinweis = text;
        render();
      }
      return undefined;
    },
    aufNachricht: nachrichtVerarbeiten,
  });

  if (rolle === 'gastgeber') {
    ui.kopplung.code = await ui.funk.eigenerCode();
    ui.kopplung.schritt = 'zeigen';
  } else {
    ui.kopplung.schritt = 'scannen';
  }
  render();
}

async function fremdenCodeAnnehmen(code) {
  const k = ui.kopplung;
  try {
    await ui.funk.codeLesen(code);
    if (!ui.kopplung) return;            // war schon verbunden
    if (k.rolle === 'gast') {
      ui.kopplung.code = await ui.funk.eigenerCode();
      ui.kopplung.schritt = 'zeigen';
    } else {
      ui.kopplung.schritt = 'warten';
    }
    k.fehler = '';
  } catch (fehler) {
    if (!ui.kopplung) return;
    k.fehler = fehler.message || 'Der Code passt nicht.';
  }
  render();
}

function verbindungSteht() {
  ui.kopplung?.scannerStoppen?.();
  ui.kopplung = null;
  if (ui.meinIndex === 0) {
    const namen = ui.namen || ['Gastgeber', 'Gast'];
    spiel = neuesSpiel(namen);
    spiel.geber = namen.length - 1;
    neueRunde(spiel);
    ui.animRunde = 0;
    standSenden();
  }
  render();
}

function nachrichtVerarbeiten(m) {
  if (m.typ === 'stand' && ui.meinIndex !== 0) {
    spiel = m.spiel;
    render();
    return;
  }
  if (m.typ === 'aktion' && ui.meinIndex === 0 && spiel) {
    const erlaubt = amZug(spiel) === 1 || spiel.phase === 'auswertung';
    if (!erlaubt || !AKTIONEN[m.name]) return;
    AKTIONEN[m.name](spiel, ...(m.args || []));
    standSenden();
    render();
  }
}

/**

async function netzStarten(gastgeber, rolle, code) {
  ui.modus = 'online';
  ui.gastgeber = gastgeber;
  ui.meinIndex = rolle;
  ui.kopplung = { schritt: 'raum', gastgeber, ueberNetz: true, code: '', hinweis: '', fehler: '' };
  render();

  ui.funk = netzAufbauen({
    gastgeber,
    code,
    aufZustand: (text, verbunden) => {
      if (verbunden) return verbindungSteht();
      if (ui.kopplung) { ui.kopplung.hinweis = text; render(); }
      return undefined;
    },
    aufNachricht: nachrichtVerarbeiten,
    aufCode: (c) => { if (ui.kopplung) { ui.kopplung.code = c; render(); } },
  });

  try {
    await ui.funk.bereit;
  } catch (fehler) {
    if (!ui.kopplung) return;
    ui.kopplung.fehler = fehler.message || 'Das hat nicht geklappt.';
    ui.kopplung.schritt = gastgeber ? 'raum' : 'code';
    render();

}

        <h2>${k.gastgeber ? 'Dein Raum steht' : 'Verbinde …'}</h2>
        ${k.gastgeber
          ? `<p>Gib diesen Code an das andere Handy. Dort auf dieser Seite
               <b>„Mit Code beitreten“</b> wählen und eintippen.</p>
             <div class="raumcode">${esc(k.code || '·····')}</div>
             <p class="hinweiszeile">Ihr müsst <b>nicht</b> im selben WLAN sein — das geht
               von überall, solange beide Handys online sind.</p>`
          : `<p>${esc(k.hinweis || 'Der Raum wird gesucht …')}</p>`}
        ${k.fehler ? `<div class="hinweis hinweis--warn">${esc(k.fehler)}</div>` : ''}
        <div class="knopfsaeule">
          ${k.gastgeber && k.code
            ? '<button class="btn btn--geist" id="codeTeilen">Code weitergeben</button>' : ''}
          <button class="btn btn--leise" id="abbruch">Abbrechen</button>
        </div>
      </div></div></div>`;
    app.querySelector('#abbruch').onclick = kopplungAbbrechen;
    app.querySelector('#codeTeilen')?.addEventListener('click', async (e) => {
      const text = `Spielen? Geh auf ${location.href} und tipp den Code ${k.code} ein.`;
      try {
        if (navigator.share) await navigator.share({ text });
        else { await navigator.clipboard.writeText(text); e.currentTarget.textContent = 'Kopiert'; }
      } catch { /* abgebrochen */ }
    });
    return;
  }

  if (k.schritt === 'moment') {
    app.innerHTML = `<div class="screen"><div class="scroll"><div class="blatt">
      <h2>Einen Moment</h2><p>Verbindungsdaten werden vorbereitet …</p></div></div></div>`;
    return;
  }

  if (k.schritt === 'warten') {
    app.innerHTML = `<div class="screen"><div class="scroll"><div class="blatt">
      <h2>Verbinde …</h2>
      <p>${esc(k.hinweis || 'Die Handys suchen sich gerade.')}</p>
      <div class="hinweis" style="margin-top:16px">Dauert es länger als ein paar Sekunden,
        blockiert der Hotspot vermutlich die direkte Verbindung. Dann hilft nur: beide ins
        gleiche WLAN, oder doch an einem Handy spielen.</div>
      <div style="margin-top:20px"><button class="btn btn--geist" id="abbruch">Abbrechen</button></div>
    </div></div></div>`;
    app.querySelector('#abbruch').onclick = kopplungAbbrechen;
    return;
  }

  if (k.schritt === 'zeigen') {
    const weiterText = gastgeber ? 'Weiter — jetzt den anderen Code scannen' : 'Fertig, warte auf Verbindung';
    app.innerHTML = `
      <div class="screen"><div class="scroll"><div class="blatt">
        <h2>${gastgeber ? 'Zeig diesen Code' : 'Jetzt du zurück'}</h2>
        <p>${gastgeber
          ? 'Die andere Person scannt ihn mit „Dieses Handy macht mit“.'
          : 'Halt den Code dem Gastgeber hin — er scannt ihn.'}</p>
        <div class="qrfeld"><canvas id="qr" width="720" height="720"></canvas></div>
        <details class="codeklappe">
          <summary>Kamera streikt? Code als Text</summary>
          <textarea class="codefeld" id="raus" readonly>${esc(k.code || '')}</textarea>
          <button class="btn btn--geist" id="kopieren" style="margin-top:8px">Kopieren</button>
        </details>
        <div style="margin-top:20px;display:flex;flex-direction:column;gap:10px">
          <button class="btn btn--messing" id="weiterKoppeln">${weiterText}</button>
          <button class="btn btn--leise" id="abbruch">Abbrechen</button>
        </div>
      </div></div></div>`;

    try {
      qrZeichnen(app.querySelector('#qr'), k.code, { hell: '#f6f2e7', dunkel: '#16211e' });
    } catch {
      app.querySelector('.qrfeld').textContent = 'Code zu lang für einen QR — nimm den Textcode.';
    }
    app.querySelector('#kopieren').onclick = async (e) => {
      try { await navigator.clipboard.writeText(k.code); e.currentTarget.textContent = 'Kopiert'; }
      catch { app.querySelector('#raus').select(); }
    };
    app.querySelector('#weiterKoppeln').onclick = () => {
      ui.kopplung.schritt = gastgeber ? 'scannen' : 'warten';
      ui.kopplung.scannerVersucht = false;
      render();
    };
    app.querySelector('#abbruch').onclick = kopplungAbbrechen;
    return;
  }

  // schritt === 'scannen'
  app.innerHTML = `
    <div class="screen"><div class="scroll"><div class="blatt">
      <h2>Code scannen</h2>
      <p>${gastgeber ? 'Halte die Kamera auf den Code des Gasts.' : 'Halte die Kamera auf den Code des Gastgebers.'}</p>
      <div class="scanfenster"><video id="kamera" muted playsinline></video></div>
      ${k.fehler ? `<div class="hinweis" style="border-color:#4b2b28;color:#f0a79d">${esc(k.fehler)}</div>` : ''}
      <details class="codeklappe" ${scannerMoeglich() ? '' : 'open'}>
        <summary>Kamera streikt? Code eintippen oder einfügen</summary>
        <textarea class="codefeld" id="rein" placeholder="CB1O|…"></textarea>
        <button class="btn btn--geist" id="uebernehmen" style="margin-top:8px">Code übernehmen</button>
      </details>
      <div style="margin-top:20px"><button class="btn btn--leise" id="abbruch">Abbrechen</button></div>
    </div></div></div>`;

  app.querySelector('#uebernehmen').onclick = () => {
    const code = app.querySelector('#rein').value.trim();
    if (code) fremdenCodeAnnehmen(code);
  };
  app.querySelector('#abbruch').onclick = kopplungAbbrechen;

  // Nur einmal versuchen: ein fehlgeschlagener Start rendert neu und würde sich
  // sonst selbst wieder aufrufen.
  if (!k.scannerVersucht) {
    k.scannerVersucht = true;
    scannerStarten(
      app.querySelector('#kamera'),
      (code) => { k.scannerStoppen = null; fremdenCodeAnnehmen(code); },
      (fehler) => { k.fehler = fehler.message; render(); },
    ).then((stoppen) => { if (ui.kopplung === k) k.scannerStoppen = stoppen; else stoppen(); });
  }
}

/* ------------------------------------------------------------------- Tisch */

/** Darf diese Karte gerade angetippt werden? */
function waehlbar(besitzer, index) {
  if (spiel.aufdecken) return false;
  if (!ichBinDran()) return false;
  const ich = spiel.dran;
  if (spiel.phase === 'gezogen') return besitzer === ich;
  if (spiel.phase === 'paar') return besitzer === ich && !spiel.paar.ergebnis;
  if (spiel.phase === 'paar') {
    const n = spiel.paar.gewaehlt.length;
    return n < PAAR_MINDESTENS
      ? `Tippe die Karten an, von denen du glaubst, dass sie <b>gleich</b> sind. Mindestens ${PAAR_MINDESTENS}.`
      : `<b>${n} Karten</b> gewählt. Aufdecken sehen alle — auch wenn du danebenliegst.`;
  }
  if (spiel.phase === 'kraft') {
    const art = spiel.kraft?.art;
    if (art === 'peek') return besitzer === ich;
    if (art === 'spy') return besitzer !== ich;
    if (art === 'swap') return besitzer === ich || spiel.kraft.eigene !== null;
    return false;
  }
  return false;
}

function handHtml(p, klein) {
  const frisch = ui.animRunde !== spiel.runde ? ' austeilen' : '';
  return spiel.spieler[p].hand.map((k, i) => {
    const w = waehlbar(p, i);
    const markiert = p === spiel.dran && (
      (spiel.phase === 'kraft' && spiel.kraft?.art === 'swap' && spiel.kraft.eigene === i)
      || (spiel.phase === 'paar' && spiel.paar.gewaehlt.includes(i)));
    return karteHtml(k, {
      klasse: `${klein ? 'karte--klein' : ''}${markiert ? ' karte--markiert' : ''}${frisch}`,
      waehlbar: w,
      attrs: w ? ` data-p="${p}" data-i="${i}"` : '',
    });
  }).join('');
}

function renderTisch() {
  const ich = michSelbst();
  const gegner = spiel.spieler.map((_, i) => i).filter((i) => i !== ich);
  const oben = obenAufAblage(spiel);
  const ziehbar = spiel.phase === 'zug';

  const gegnerHtml = gegner.map((p) => `
    <div class="gegnerblock">
      <div class="wer"><b>${name(p)}</b> · ${spiel.punkte[p]}</div>
      <div class="hand">${handHtml(p, true)}</div>
    </div>`).join('');

  app.innerHTML = `
    <div class="screen">
      <header class="kopf">
        <div class="titel">
          <div class="ober">Runde ${spiel.runde} · bis ${SPIELENDE_AB}${
            ui.modus === 'online' ? ' · zwei Geräte' : ''}</div>
          <h1>${name(spiel.dran)} ist dran</h1>
        </div>
        <div class="werkzeuge">
          <button class="werkzeug" id="btnRegeln" aria-label="Regeln">?</button>
          <button class="werkzeug" id="btnMenue" aria-label="Menü">⋯</button>
        </div>
      </header>

      <div class="tisch">
        <div class="gegner">${gegnerHtml}</div>

        <div class="mitte">
          <div class="platz">
            <div class="stapelhaufen">
              ${karteHtml(null, {
                waehlbar: ziehbar && spiel.stapel.length > 0,
                attrs: ' data-zug="stapel"',
                klasse: spiel.stapel.length ? '' : 'karte--leer',
              })}
            </div>
            <div class="lbl">Stapel · ${spiel.stapel.length}</div>
          </div>

          <div class="platz">
            ${oben
              ? karteHtml(oben, { offen: true, waehlbar: ziehbar, attrs: ' data-zug="ablage"' })
              : karteHtml(null, { klasse: 'karte--leer' })}
            <div class="lbl">Ablage</div>
          </div>

          ${spiel.gezogene ? `<div class="platz">
            ${karteHtml(spiel.gezogene, { offen: true })}
            <div class="lbl" style="color:var(--messing)">Gezogen</div>
          </div>` : ''}
        </div>

        ${spiel.caboVon !== null
          ? `<div class="cabobanner">Cabo von ${name(spiel.caboVon)} — letzte Züge</div>`
          : ''}

        <div class="eigene">
          <div class="wer">${name(ich)} · ${spiel.punkte[ich]} Punkte</div>
          <div class="hand">${handHtml(ich, false)}</div>
        </div>
      </div>

      <div class="fuss">
        <p class="ansage">${ansage()}</p>
        ${knoepfe()}
      </div>
    </div>`;

  ui.animRunde = spiel.runde;

  app.querySelector('#btnRegeln').onclick = () => { ui.overlay = 'regeln'; render(); };
  app.querySelector('#btnMenue').onclick = () => { ui.overlay = 'menue'; render(); };
  app.querySelectorAll('[data-zug]').forEach((b) => {
    b.onclick = () => { tun('ziehen', b.dataset.zug); buzz(10); };
  });
  app.querySelectorAll('[data-p]').forEach((b) => {
    b.onclick = () => karteGetippt(Number(b.dataset.p), Number(b.dataset.i));
  });
  app.querySelector('#btnCabo')?.addEventListener('click', () => {
    if (!confirm('Cabo rufen? Alle anderen bekommen noch genau einen Zug.')) return;
    tun('caboRufen');
    buzz([20, 50, 30]);
  });
  app.querySelector('#btnAbwerfen')?.addEventListener('click', () => { tun('abwerfen'); buzz(10); });
  app.querySelector('#btnKraftAus')?.addEventListener('click', () => { tun('kraftAuslassen'); });
  app.querySelector('#btnPaar')?.addEventListener('click', () => { tun('paarStarten'); buzz(8); });
  app.querySelector('#btnPaarAb')?.addEventListener('click', () => { tun('paarAbbrechen'); });
  app.querySelector('#btnPaarAuf')?.addEventListener('click', () => { tun('paarAufdecken'); buzz(18); });
}

function karteGetippt(p, i) {
  buzz(10);
  if (spiel.phase === 'gezogen') return tun('tauschen', i);
  if (spiel.phase === 'paar') return tun('paarWaehlen', i);
  if (spiel.phase !== 'kraft' || !spiel.kraft || spiel.kraft.erledigt) return undefined;
  const art = spiel.kraft.art;
  if (art === 'peek') return tun('peek', i);
  if (art === 'spy') return tun('spy', p, i);
  if (art === 'swap') return p === spiel.dran ? tun('swapEigene', i) : tun('swapFremde', p, i);
  return undefined;
}

function ansage() {
  if (spiel.phase === 'einpraegen') {
    return `<b>${name(spiel.einpraegenIndex)}</b> prägt sich gerade zwei Karten ein.`;
  }
  if (!ichBinDran()) return `<b>${name(spiel.dran)}</b> ist am Zug. Schau zu.`;
  if (spiel.phase === 'zug') {
    return 'Zieh vom <b>Stapel</b> oder nimm die <b>Ablage</b>.';
  }
  if (spiel.phase === 'gezogen') {
    const art = kraftVon(spiel.gezogene.w);
    if (spiel.quelle === 'ablage') return 'Tippe die eigene Karte an, die du dafür hergibst.';
    return art
      ? `Tauschen: eigene Karte antippen. Oder abwerfen und <span class="kraftname">${KRAEFTE[art].titel}</span> nutzen.`
      : 'Tauschen: eigene Karte antippen. Oder einfach abwerfen.';
  }
  if (spiel.phase === 'paar') {
    const n = spiel.paar.gewaehlt.length;
    return n < PAAR_MINDESTENS
      ? `Tippe die Karten an, von denen du glaubst, dass sie <b>gleich</b> sind. Mindestens ${PAAR_MINDESTENS}.`
      : `<b>${n} Karten</b> gewählt. Aufdecken sehen alle — auch wenn du danebenliegst.`;
  }
  if (spiel.phase === 'kraft') {
    const art = spiel.kraft?.art;
    if (!art || spiel.kraft.erledigt) return 'Merk es dir — dann geht es weiter.';
    if (art === 'swap' && spiel.kraft.eigene === null) {
      return `<span class="kraftname">Swap</span> — erst eine <b>eigene</b> Karte wählen.`;
    }
    if (art === 'swap') return `<span class="kraftname">Swap</span> — jetzt die fremde Karte antippen. Blind.`;
    return `<span class="kraftname">${KRAEFTE[art].titel}</span> — ${KRAEFTE[art].text}`;
  }
  return '';
}

function knoepfe() {
  if (!ichBinDran()) return '';
  if (spiel.phase === 'zug') {
    return `<button class="btn btn--geist" id="btnCabo">Cabo rufen</button>`;
  }
  if (spiel.phase === 'gezogen') {
    const paarKnopf = spiel.spieler[spiel.dran].hand.length >= PAAR_MINDESTENS
      ? `<button class="btn btn--geist" id="btnPaar">Gleiche Karten abwerfen</button>` : '';
    if (spiel.quelle !== 'stapel') return paarKnopf;
    const art = kraftVon(spiel.gezogene.w);
    return `<button class="btn ${art ? 'btn--messing' : 'btn--geist'}" id="btnAbwerfen">
      ${art ? `Abwerfen und ${KRAEFTE[art].titel} nutzen` : 'Abwerfen'}</button>${paarKnopf}`;
  }
  if (spiel.phase === 'paar') {
    const genug = spiel.paar.gewaehlt.length >= PAAR_MINDESTENS;
    return `<div class="reihe">
      <button class="btn btn--geist" id="btnPaarAb">Doch nicht</button>
      <button class="btn btn--messing" id="btnPaarAuf" ${genug ? '' : 'disabled'}>
        Aufdecken${genug ? ` (${spiel.paar.gewaehlt.length})` : ''}</button>
    </div>`;
  }
  if (spiel.phase === 'kraft' && spiel.kraft && !spiel.kraft.erledigt) {
    return `<button class="btn btn--geist" id="btnKraftAus">Kraft auslassen</button>`;
  }
  return '';
}

/* -------------------------------------------------------------- Auswertung */

function bilanzZeilen() {
  return spiel.auswertung.zeilen.map((z) => {
    const klasse = z.punkte === 0 ? 'pkt--null' : z.punkte >= 15 ? 'pkt--viel' : 'pkt--mittel';
    const karten = spiel.spieler[z.p].hand.map((k) => `<span class="mini">${k.w}</span>`).join('');
    return `<div class="rundenzeile ${z.punkte === 0 ? 'gewinner' : ''}">
      <span class="wer"><b>${name(z.p)}${spiel.auswertung.caboVon === z.p ? ' · Cabo' : ''}</b>
        <small>${esc(z.text)} · Summe ${z.summe}</small></span>
      <span class="karten">${karten}</span>
      <span class="pkt ${klasse}">+${z.punkte}</span>
    </div>`;
  }).join('');
}

function renderRundenende() {

      neueRunde(spiel);
      ui.animRunde = 0;
      standSenden();
      render();
      return;
    }
    spielAnlegen(namen);
  };
  app.querySelector('#zumStart').onclick = () => {
    spiel = null;
    try { localStorage.removeItem(KEY); } catch { /* egal */ }
    render();
  };
}

/* --------------------------------------------------------------- Overlays */

function huelle(inhalt) {
  const layer = document.createElement('div');
  layer.className = 'overlay';
  layer.innerHTML = `<div class="scroll"><div class="blatt">${inhalt}</div></div>`;
  app.appendChild(layer);
  return layer;
}

function renderRegeln() {
  const kraftliste = Object.values(KRAEFTE).map((k) => `
    <div class="kraftzeile">
      <span class="werte">${k.werte.join(' · ')}</span>
      <span><b>${k.titel}</b><small>${k.text}</small></span>
    </div>`).join('');

  const l = huelle(`
    <div class="lesbar">
      <h2>Cabo — so geht's</h2>
      <p>Jeder hat <strong>vier Karten</strong>, alle verdeckt. Am Anfang darfst du dir
         <strong>zwei davon</strong> ansehen — danach musst du dich erinnern. Wer am Ende die
         <strong>niedrigste Summe</strong> hat, gewinnt die Runde.</p>

      <h3>Die Karten</h3>
      <p>52 Stück: die <strong>0</strong> und die <strong>13</strong> je zweimal, alle Werte von
         1 bis 12 je viermal. Der Wert ist gleichzeitig der Punktwert — <strong>wenig ist gut</strong>.</p>

      <h3>Dein Zug</h3>
      <ul>
        <li><strong>Vom Stapel ziehen:</strong> Du siehst die Karte. Entweder tauschst du sie
            gegen eine deiner vier (die alte kommt offen auf die Ablage), oder du wirfst sie ab.</li>
        <li><strong>Von der Ablage nehmen:</strong> Nur tauschen — keine Kraft.</li>
        <li>Eine abgeworfene <strong>7 bis 12</strong> darfst du als Kraft nutzen.</li>
      </ul>

      <h3>Die Kräfte</h3>
      <div class="kraftliste">${kraftliste}</div>
      <p>Nutzen ist freiwillig. Beim <strong>Swap</strong> siehst du keine der beiden Karten —
         du tauschst blind.</p>

      <h3>Gleiche Karten abwerfen</h3>
      <p>Wenn du glaubst, <strong>mehrere gleiche Werte</strong> auf der Hand zu haben: nach dem
         Ziehen antippen und aufdecken. Alle sehen die Karten — so oder so.</p>
      <ul>
        <li><strong>Richtig geraten:</strong> Die Karten wandern auf die Ablage, die gezogene
            Karte rückt auf den ersten frei gewordenen Platz. Deine Hand wird
            <strong>kleiner</strong> — und damit deine Summe.</li>
        <li><strong>Danebengelegen:</strong> Alles bleibt liegen, die gezogene Karte kommt auf
            die Ablage, dein Zug ist verloren. Und die Gegenseite weiß jetzt Bescheid.</li>
      </ul>

      <h3>Cabo rufen</h3>
      <p>Statt zu ziehen, kannst du <strong>Cabo</strong> rufen. Alle anderen bekommen noch
         <strong>genau einen Zug</strong>, dann wird aufgedeckt.</p>
      <ul>
        <li>Hast du wirklich die niedrigste Summe: <strong>0 Punkte</strong> für dich.
            Bei Gleichstand gewinnst du.</li>
        <li>Lagst du daneben: deine Summe <strong>plus ${CABO_STRAFE} Strafpunkte</strong>.</li>
        <li>Alle anderen bekommen ihre Kartensumme als Punkte.</li>
      </ul>

      <h3>Spielende</h3>
      <p>Sobald jemand <strong>${SPIELENDE_AB} Punkte</strong> erreicht, ist Schluss — es gewinnt,
         wer am <strong>wenigsten</strong> hat. Landet man genau auf ${SPIELENDE_AB}, geht es
         zurück auf ${SPIELENDE_AB / 2}.</p>

      <h3>An einem Handy</h3>
      <p>Das Handy wandert reihum. Alles, was nur du sehen darfst — die Startkarten, Peek und
         Spy — kommt als Vollbild und verschwindet danach wieder. Die App merkt sich nichts
         für dich: <strong>erinnern musst du dich selbst</strong>.</p>

      <div style="margin-top:24px"><button class="btn btn--messing" id="zu">Verstanden</button></div>
    </div>`);
  l.querySelector('#zu').onclick = () => { ui.overlay = null; render(); };
}

function renderMenue() {
  const l = huelle(`
    <h2>Menü</h2>
    <div style="margin-top:18px;display:flex;flex-direction:column;gap:9px">
      <button class="btn btn--geist" id="regeln">Regeln</button>
      <button class="btn btn--geist" id="datei">Spiel als Datei sichern</button>
      <button class="btn btn--messing" id="weitergeben">Aufs zweite Handy schicken</button>
      <button class="btn btn--warn" id="abbruch">Spiel abbrechen</button>
      <button class="btn btn--messing" id="zu">Weiterspielen</button>
    </div>
    <p class="hinweiszeile" style="margin-top:22px">
      Der Spielstand liegt auf diesem Gerät — die App darf zwischendurch zugehen.</p>`);

  l.querySelector('#regeln').onclick = () => { ui.overlay = 'regeln'; render(); };
  l.querySelector('#zu').onclick = () => { ui.overlay = null; render(); };
  l.querySelector('#weitergeben').onclick = async (e) => {
    const knopf = e.currentTarget;
    knopf.disabled = true;
    knopf.textContent = 'Teilen-Menü …';
    const erg = await spielTeilen('cabo-css', 'cabo-js', 'Cabo.html', 'Cabo');
    knopf.textContent = TEILEN_TEXT[erg];
    knopf.disabled = erg === 'ok';
  };
  l.querySelector('#datei').onclick = async (e) => {
    const knopf = e.currentTarget;
    knopf.disabled = true;
    knopf.textContent = 'Wird gespeichert …';
    const erg = await seiteAlsDateiSichern('cabo-css', 'cabo-js', 'Cabo.html', 'Cabo');
    knopf.textContent = SICHER_TEXT[erg].replace('%NAME%', 'Cabo.html');
    knopf.disabled = erg === 'ok' || erg === 'txt';
  };
  l.querySelector('#abbruch').onclick = () => {
    if (!confirm('Laufendes Spiel verwerfen?')) return;
    spiel = null;
    ui.overlay = null;
    try { localStorage.removeItem(KEY); } catch { /* egal */ }
    render();
  };
}

/* ----------------------------------------------------------------- Render */

function render() {
  if (ui.kopplung) { renderKopplung(); return; }
  if (!spiel && ui.modus === 'online') {
    app.innerHTML = `<div class="screen"><div class="scroll"><div class="blatt">
      <h2>Verbunden</h2><p>Warte auf die Karten vom Gastgeber …</p></div></div></div>`;
    return;
  }
  if (!spiel) { renderStart(); return; }
  if (spiel.phase === 'ende') { renderEnde(); return; }

  renderTisch();

  if (ui.overlay === 'regeln') { renderRegeln(); return; }
  if (ui.overlay === 'menue') { renderMenue(); return; }
  if (spiel.phase === 'auswertung') { renderRundenende(); return; }

  const wer = amZug(spiel);
  if (ui.modus === 'lokal' && wer !== null && wer !== ui.halter) { renderUebergabe(wer); return; }

  // Das aufgedeckte Paar sehen beide, alles andere nur das betroffene Gerät.
  if (spiel.phase === 'paar' && spiel.paar.ergebnis) { renderPaarErgebnis(); return; }
  if (spiel.aufdecken && spiel.dran === michSelbst()) { renderAufdecken(); return; }
  if (spiel.phase === 'einpraegen' && spiel.einpraegenIndex === michSelbst()) {
    renderEinpraegen();
  }
}

spiel = laden();
if (spiel) {
  const wer = amZug(spiel);
  ui.halter = wer === null ? 0 : wer;
}
render();

})();
</script>
</body>
</html>
