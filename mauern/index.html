<style id="mauern-css">
/* Mauern — helles Gitter auf tiefem Petrol. Figuren in Koralle und Himmelblau,
   die Mauern in warmem Holz. Bewusst einthemig, alles explizit gefärbt. */

:root {
  --tisch: #10262b;
  --tisch-2: #071619;
  --panel: #1a3940;
  --panel-2: #22484f;
  --naht: #2e5761;
  --schrift: #e9f2f2;
  --schrift-dim: #a6bec2;
  --schrift-blass: #7a9599;

  --brett: #f0ece0;
  --brett-rand: #c4bda9;
  --linie: #d6cfbd;
  --feld: #fbf9f2;

  --rot: #e0603f;              /* Koralle — Spieler 0 */
  --rot-hell: #f07d5f;
  --blau: #3e93c4;             /* Himmelblau — Spieler 1 */
  --blau-hell: #5fb0dd;
  --gold: #35b3a0;             /* Akzent: Petrolgrün, die Farbe dieses Spiels */
  --gut: #6aa96f;

  --mauer: #a9743c;
  --mauer-rand: #7d5228;
  --mauer-blass: rgba(169, 116, 60, 0.34);

  --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
  --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-num: ui-monospace, SFMono-Regular, 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace;

  --r-md: 14px;
  --r-lg: 22px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: none; }

body {
  background: var(--tisch);
  background-image:
    radial-gradient(120% 60% at 50% -10%, #1c4149 0%, rgba(28, 65, 73, 0) 60%),
    linear-gradient(180deg, var(--tisch) 0%, var(--tisch-2) 100%);
  background-attachment: fixed;
  color: var(--schrift-dim);
  font-family: var(--font-ui);
  font-size: 16px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
}

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* ---------- Gerüst ---------- */

#app { min-height: 100dvh; display: flex; flex-direction: column; }
.screen { flex: 1; display: flex; flex-direction: column; min-height: 100dvh; }
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; min-height: 0; }
.scrollbar { overflow-y: auto; max-height: 100dvh; }
.wrap { width: 100%; max-width: 560px; margin-inline: auto; padding: 22px 18px calc(18px + var(--safe-b)); }
.blatt { padding: calc(var(--safe-t) + 16px) 18px calc(18px + var(--safe-b)); width: 100%; max-width: 560px; margin-inline: auto; }

h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; color: var(--schrift); margin: 0 0 6px; }
h3 { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin: 24px 0 8px; }
p, li { font-size: 15px; line-height: 1.6; color: var(--schrift-dim); }
strong { color: var(--schrift); }
em { color: var(--gold); font-style: italic; }

.kopf {
  display: flex; align-items: center; gap: 12px;
  padding: calc(var(--safe-t) + 12px) 16px 10px;
  border-bottom: 1px solid var(--naht);
}
.kopf .titel { flex: 1; min-width: 0; }
.kopf .ober { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--schrift-blass); font-weight: 700; }
.kopf h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 23px;
  color: var(--schrift); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.kopf h1 .wer--0 { color: var(--rot-hell); }
.kopf h1 .wer--1 { color: var(--blau-hell); }
.werkzeuge { display: flex; gap: 7px; }
.werkzeug {
  width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
  background: var(--panel); border: 1px solid var(--naht); color: var(--schrift-dim); font-size: 15px;
}

/* ---------- Knöpfe ---------- */

.btn {
  display: flex; align-items: center; justify-content: center; gap: 9px;
  width: 100%; padding: 16px 18px; border-radius: var(--r-md);
  font-weight: 650; font-size: 16px; letter-spacing: -0.01em;
  transition: transform 0.1s ease, filter 0.15s ease;
}
.btn:active { transform: scale(0.985); }
.btn:disabled { opacity: 0.3; transform: none; box-shadow: none; filter: saturate(0.5); }
.btn--filz { background: var(--gold); color: #04211d; box-shadow: 0 8px 26px rgba(53, 179, 160, 0.2); }
.btn--hell { background: var(--brett); color: #241c17; }
.btn--geist { background: var(--panel); color: var(--schrift); border: 1px solid var(--naht); }
.btn--leise { background: none; color: var(--schrift-blass); font-weight: 500; font-size: 15px; padding: 13px; }
.knopfsaeule { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.reihe { display: flex; gap: 10px; }
.reihe .btn { width: auto; flex: 1; }

/* ---------- Startbildschirm und Moduswahl ---------- */

.start { justify-content: center; text-align: center; padding: 30px 20px calc(28px + var(--safe-b)); }
.wortmarke {
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(38px, 13vw, 56px); line-height: 1.02; margin: 0;
  color: var(--schrift); letter-spacing: -0.02em;
}
.wortmarke em { font-style: italic; color: var(--gold); }
.unterzeile { color: var(--schrift-blass); margin: 10px 0 26px; }

.wahlliste { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.wahl {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: var(--panel); border: 1px solid var(--naht); border-radius: var(--r-md); padding: 13px 15px;
}
.wahl--an { border-color: var(--gold); background: var(--panel-2); }
.wahl .haupt { flex: 1; min-width: 0; }
.wahl .oben { color: var(--schrift); font-weight: 650; }
.wahl .unten { font-size: 13px; color: var(--schrift-blass); }
.wahl .haken { color: var(--gold); font-size: 18px; visibility: hidden; }
.wahl--an .haken { visibility: visible; }

/* ---------- Das Brett ---------- */

.tischplatte { flex: 1; display: grid; padding: 8px 12px 0; min-height: 0; }
.brett {
  width: 100%; height: 100%; min-height: 0;
  /* Wie bei den Sperrsteinen: `height: 100 %` hängt an der Elternhöhe, die am
     Inhalt hängt. Ein Maß, das nur am Fenster hängt, bricht den Ring. */
  max-height: 74dvh;
  background: none; border: 0; display: block;
  filter: drop-shadow(0 12px 26px rgba(0, 0, 0, 0.5));
}
.brett .karton { fill: var(--brett); stroke: var(--brett-rand); stroke-width: 1.4; }
.brett .zelle { fill: var(--feld); stroke: var(--linie); stroke-width: 0.35; }
.brett .zelle--ziel0 { fill: #fbe4dd; }
.brett .zelle--ziel1 { fill: #dcecf7; }
.brett .zelle--beide { fill: #e7ecdf; }
.brett .zielmarke--0 { fill: var(--rot); }
.brett .zielmarke--1 { fill: var(--blau); }

.brett .figur { stroke: rgba(0, 0, 0, 0.4); stroke-width: 0.5; transition: transform 0.18s ease; }
.brett .figur--0 { fill: var(--rot); }
.brett .figur--1 { fill: var(--blau); }
.brett .zielpunkt { fill: var(--gold); opacity: 0.85; cursor: pointer; }
.brett .tippfeld { fill: transparent; cursor: pointer; }

.brett .mauer {
  fill: var(--mauer); stroke: var(--mauer-rand); stroke-width: 0.4;
  filter: drop-shadow(0 0.5px 0.5px rgba(0, 0, 0, 0.4));
}
.brett .mauer--neu { animation: aufblitzen 0.5s ease; }
@keyframes aufblitzen { from { fill: var(--gold); } }
.brett .fuge { fill: var(--mauer-blass); cursor: pointer; }
.brett .fuge--gewaehlt { fill: var(--mauer); opacity: 0.95; }
.brett .fugenpunkt { fill: var(--mauer); opacity: 0.4; cursor: pointer; }
@media (prefers-reduced-motion: reduce) {
  .brett .figur { transition: none; }
  .brett .mauer--neu { animation: none; }
}

/* ---------- Leiste unten ---------- */

.leiste {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px calc(12px + var(--safe-b));
  max-width: 560px; margin-inline: auto; width: 100%;
}
.sagt { flex: 1; min-width: 0; }
.sagt .zeile1 { color: var(--schrift); font-size: 15px; line-height: 1.35; }
.sagt .zeile2 { color: var(--schrift-blass); font-size: 13px; margin-top: 2px; }
.sagt .warnung { color: var(--gold); }

.modusleiste { display: flex; gap: 8px; padding: 0 14px 6px; max-width: 560px; margin-inline: auto; width: 100%; }
.modusknopf {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
  padding: 11px 8px; border-radius: 12px; font-size: 14px; font-weight: 650;
  background: var(--panel); border: 1px solid var(--naht); color: var(--schrift-dim);
}
.modusknopf--an { background: var(--gold); border-color: var(--gold); color: #04211d; }
.modusknopf:disabled { opacity: 0.35; }
.modusknopf .zahl { font-family: var(--font-num); font-size: 13px; opacity: 0.85; }

.vorratsbalken { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 2px 14px 0; font-size: 11px; color: var(--schrift-blass); }
.vorratsbalken .seite { display: inline-flex; align-items: center; gap: 5px; }
.vorratsbalken i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.vorratsbalken .v-0 { background: var(--rot); }
.vorratsbalken .v-1 { background: var(--blau); }

/* ---------- Punktetafel und Felder ---------- */

.tafel {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  gap: 10px; background: var(--panel); border: 1px solid var(--naht);
  border-radius: var(--r-lg); padding: 16px 14px; margin: 16px 0;
}
.tafel .seite { text-align: center; min-width: 0; }
.tafel .wer { font-size: 12px; color: var(--schrift-blass); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tafel .zahl { font-family: var(--font-num); font-size: 34px; font-weight: 800; line-height: 1.1; }
.tafel .seite--0 .zahl { color: var(--rot-hell); }
.tafel .seite--1 .zahl { color: var(--blau-hell); }
.tafel .strichlein { width: 1px; height: 40px; background: var(--naht); }

.feld {
  background: var(--panel); border: 1px solid var(--naht);
  border-radius: var(--r-md); padding: 14px; color: var(--schrift); font-size: 16px;
  user-select: text; -webkit-user-select: text; width: 100%;
}
.feld::placeholder { color: var(--schrift-blass); }
.feld--code {
  width: 100%; text-align: center; letter-spacing: 0.3em;
  font-family: var(--font-num); font-size: 28px; text-transform: uppercase; margin-top: 8px;
}
.feldlabel { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--schrift-blass); font-weight: 700; text-align: left; margin: 18px 0 7px; }
.warnton { color: var(--rot-hell); }

/* ---------- Overlays ---------- */

.overlay {
  position: fixed; inset: 0; z-index: 50; background: var(--tisch-2);
  display: flex; flex-direction: column; animation: einblenden 0.18s ease-out;
}
@keyframes einblenden { from { opacity: 0; } }

.jubel {
  justify-content: center; align-items: center; text-align: center;
  padding: 26px calc(24px + var(--safe-b));
  background-color: var(--tisch-2);
  background-image: radial-gradient(90% 50% at 50% 40%, #1c4149 0%, rgba(28, 65, 73, 0) 70%);
}
.jubel p { max-width: 30ch; }
.jubel .btn { width: min(340px, 100%); max-width: 340px; }
.jubel .krone { font-size: 46px; }
.jubel .name { font-family: var(--font-display); font-size: clamp(30px, 9vw, 44px); color: var(--schrift); line-height: 1.1; margin: 6px 0; }

/* ---------- Kopplung per QR ---------- */

.qrfeld { display: grid; place-items: center; background: var(--brett); border-radius: 14px; padding: 14px; margin: 16px 0; }
.qrfeld canvas { width: 100%; max-width: 300px; height: auto; image-rendering: pixelated; display: block; }

.scanfenster {
  position: relative; overflow: hidden; border-radius: 14px; background: #000;
  aspect-ratio: 1; margin: 16px 0; border: 1px solid var(--naht);
}
.scanfenster video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scanfenster::after {
  content: ""; position: absolute; inset: 16%;
  border: 2px solid var(--gold); border-radius: 12px;
  box-shadow: 0 0 0 999px rgba(0, 0, 0, 0.45);
}

.raumcode {
  font-family: var(--font-num); font-size: clamp(38px, 13vw, 58px); font-weight: 800;
  letter-spacing: 0.14em; text-align: center; padding: 18px 10px; margin: 16px 0;
  border-radius: 14px; user-select: all; -webkit-user-select: all;
  background: var(--panel); color: var(--schrift); border: 2px solid var(--gold);
}

.codeklappe { margin-top: 6px; }
.codeklappe summary { font-size: 13px; color: var(--schrift-blass); cursor: pointer; padding: 8px 0; list-style: none; }
.codeklappe summary::before { content: "▸ "; }
.codeklappe[open] summary::before { content: "▾ "; }
.codeklappe .btn { margin-top: 8px; }
.codefeld {
  width: 100%; min-height: 84px; resize: vertical; margin-top: 6px;
  background: var(--panel); border: 1px solid var(--naht); border-radius: 10px;
  padding: 10px; color: var(--schrift-blass); font-family: var(--font-num); font-size: 11px;
  word-break: break-all; user-select: text; -webkit-user-select: text;
}
.lage { margin-top: 12px; font-size: 12px; line-height: 1.55; opacity: 0.62; word-break: break-word; }

/* ---------- Quer: Brett links, Bedienung rechts ---------- */

@media (orientation: landscape) and (max-height: 560px) {
  .screen--spiel { flex-direction: row; align-items: stretch; }
  .screen--spiel .kopf { display: none; }
  .tischplatte { padding: 6px; }
  .brett { max-width: 52vw; max-height: 94dvh; justify-self: center; }
  .rechts { display: flex; flex-direction: column; justify-content: center; max-width: 340px; }
  .leiste, .modusleiste { max-width: 340px; }
  .vorratsbalken { padding-top: 8px; }
}

</style>
</head>
<body>

'use strict';
// Minimaler QR-Erzeuger: Byte-Modus, Fehlerkorrektur L, Versionen 1 bis 15.
// Eigenbau, weil das Spiel eine einzelne Datei ohne Netz bleiben soll.
//
// qrMatrix('text') -> { groesse, module: boolean[][] }   true = dunkel

// [Gesamt-Codewörter, EC-Codewörter je Block, [Blöcke, Datenwörter], [Blöcke, Datenwörter]?]
const VERSIONEN = {
  1: [26, 7, [1, 19]],
  2: [44, 10, [1, 34]],
  3: [70, 15, [1, 55]],
  4: [100, 20, [1, 80]],
  5: [134, 26, [1, 108]],
  6: [172, 18, [2, 68]],
  7: [196, 20, [2, 78]],
  8: [242, 24, [2, 97]],
  9: [292, 30, [2, 116]],
  10: [346, 18, [2, 68], [2, 69]],
  11: [404, 20, [4, 81]],
  12: [466, 24, [2, 92], [2, 93]],
  13: [532, 26, [4, 107]],
  14: [581, 30, [3, 115], [1, 116]],
  15: [655, 22, [5, 87], [1, 88]],
};

const AUSRICHTUNG = {
  1: [], 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30], 6: [6, 34],
  7: [6, 22, 38], 8: [6, 24, 42], 9: [6, 26, 46], 10: [6, 28, 50],
  11: [6, 30, 54], 12: [6, 32, 58], 13: [6, 34, 62], 14: [6, 26, 46, 66],
  15: [6, 26, 48, 70],
};

/* ------------------------------------------------------- Galois-Feld GF(256) */

const EXP = new Uint8Array(512);
const LOG = new Uint8Array(256);
(function tabellen() {
  let x = 1;
  for (let i = 0; i < 255; i++) {
    EXP[i] = x;
    LOG[x] = i;
    x <<= 1;
    if (x & 0x100) x ^= 0x11d;
  }
  for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
})();

const mul = (a, b) => (a === 0 || b === 0 ? 0 : EXP[LOG[a] + LOG[b]]);

function generator(grad) {
  let g = [1];
  for (let i = 0; i < grad; i++) {
    const next = new Array(g.length + 1).fill(0);
    // Multiplikation mit (x + α^i): der x-Anteil bleibt an Ort und Stelle,
    // der Faktor rutscht eine Stelle nach unten. Führender Koeffizient bleibt 1.
    for (let j = 0; j < g.length; j++) {
      next[j] ^= g[j];
      next[j + 1] ^= mul(g[j], EXP[i]);
    }
    g = next;
  }
  return g;
}

/** Reed-Solomon-Rest: die Fehlerkorrektur-Codewörter eines Blocks. */
function ecBlock(daten, ecAnzahl) {
  const g = generator(ecAnzahl);
  const rest = new Array(ecAnzahl).fill(0);
  for (const wort of daten) {
    const faktor = wort ^ rest[0];
    rest.shift();
    rest.push(0);
    if (faktor !== 0) for (let i = 0; i < ecAnzahl; i++) rest[i] ^= mul(g[i + 1], faktor);
  }
  return rest;
}

/* ------------------------------------------------------------- Datenkodierung */

function datenKapazitaet(version) {
  const [, , g1, g2] = VERSIONEN[version];
  return g1[0] * g1[1] + (g2 ? g2[0] * g2[1] : 0);
}

function versionWaehlen(byteLaenge) {
  for (let v = 1; v <= 15; v++) {
    const zaehlerBits = v < 10 ? 8 : 16;
    const noetig = Math.ceil((4 + zaehlerBits + byteLaenge * 8) / 8);
    if (noetig <= datenKapazitaet(v)) return v;
  }
  throw new Error('Text zu lang für einen QR-Code dieser Größe');
}

function codewoerter(bytes, version) {
  const zaehlerBits = version < 10 ? 8 : 16;
  const bits = [];
  const schiebe = (wert, anzahl) => {
    for (let i = anzahl - 1; i >= 0; i--) bits.push((wert >> i) & 1);
  };

  schiebe(0b0100, 4);              // Byte-Modus
  schiebe(bytes.length, zaehlerBits);
  for (const b of bytes) schiebe(b, 8);

  const kapazitaet = datenKapazitaet(version) * 8;
  for (let i = 0; i < 4 && bits.length < kapazitaet; i++) bits.push(0);   // Terminator
  while (bits.length % 8 !== 0) bits.push(0);

  const worte = [];
  for (let i = 0; i < bits.length; i += 8) {
    worte.push(bits.slice(i, i + 8).reduce((v, b) => (v << 1) | b, 0));
  }
  const fueller = [0xec, 0x11];
  let f = 0;
  while (worte.length < datenKapazitaet(version)) worte.push(fueller[f++ % 2]);
  return worte;
}

/** Datenwörter in Blöcke schneiden, EC anhängen, beides verschachteln. */
function endgueltigeWoerter(daten, version) {
  const [, ecAnzahl, g1, g2] = VERSIONEN[version];
  const gruppen = g2 ? [g1, g2] : [g1];

  const datenBloecke = [];
  let pos = 0;
  for (const [anzahl, laenge] of gruppen) {
    for (let i = 0; i < anzahl; i++) {
      datenBloecke.push(daten.slice(pos, pos + laenge));
      pos += laenge;
    }
  }
  const ecBloecke = datenBloecke.map((b) => ecBlock(b, ecAnzahl));

  const raus = [];
  const maxDaten = Math.max(...datenBloecke.map((b) => b.length));
  for (let i = 0; i < maxDaten; i++) {
    for (const b of datenBloecke) if (i < b.length) raus.push(b[i]);
  }
  for (let i = 0; i < ecAnzahl; i++) for (const b of ecBloecke) raus.push(b[i]);
  return raus;
}

/* -------------------------------------------------------------- Matrixaufbau */

function leereMatrix(groesse) {
  return Array.from({ length: groesse }, () => new Array(groesse).fill(null));
}

function sucherSetzen(m, zeile, spalte) {
  for (let r = -1; r <= 7; r++) {
    for (let c = -1; c <= 7; c++) {
      const y = zeile + r;
      const x = spalte + c;
      if (y < 0 || y >= m.length || x < 0 || x >= m.length) continue;
      const imSucher = r >= 0 && r <= 6 && c >= 0 && c <= 6;
      if (!imSucher) { m[y][x] = false; continue; }   // die helle Trennlinie ringsum
      const rahmen = r === 0 || r === 6 || c === 0 || c === 6;
      const kern = r >= 2 && r <= 4 && c >= 2 && c <= 4;
      m[y][x] = rahmen || kern;
    }
  }
}

function funktionsMuster(version) {
  const groesse = version * 4 + 17;
  const m = leereMatrix(groesse);

  sucherSetzen(m, 0, 0);
  sucherSetzen(m, 0, groesse - 7);
  sucherSetzen(m, groesse - 7, 0);

  for (let i = 8; i < groesse - 8; i++) {
    m[6][i] = i % 2 === 0;
    m[i][6] = i % 2 === 0;
  }

  const zentren = AUSRICHTUNG[version];
  const letzte = zentren[zentren.length - 1];
  // Nur die drei Ecken entfallen — dort sitzen schon die Suchmuster. Muster,
  // die bloß die Taktspur kreuzen, werden gezeichnet.
  const beimSucher = (y, x) => (y === 6 && x === 6)
    || (y === 6 && x === letzte) || (y === letzte && x === 6);
  for (const zy of zentren) {
    for (const zx of zentren) {
      if (beimSucher(zy, zx)) continue;
      for (let r = -2; r <= 2; r++) {
        for (let c = -2; c <= 2; c++) {
          m[zy + r][zx + c] = Math.max(Math.abs(r), Math.abs(c)) !== 1;
        }
      }
    }
  }

  m[groesse - 8][8] = true;                       // immer dunkles Modul

  // Plätze für Format- und Versionsinfo freihalten (später überschrieben)
  for (let i = 0; i < 9; i++) {
    if (m[8][i] === null) m[8][i] = false;
    if (m[i][8] === null) m[i][8] = false;
  }
  for (let i = 0; i < 8; i++) {
    if (m[8][groesse - 1 - i] === null) m[8][groesse - 1 - i] = false;
    if (m[groesse - 1 - i][8] === null) m[groesse - 1 - i][8] = false;
  }
  if (version >= 7) {
    for (let i = 0; i < 6; i++) {
      for (let j = 0; j < 3; j++) {
        m[groesse - 11 + j][i] = false;
        m[i][groesse - 11 + j] = false;
      }
    }
  }
  return m;
}

/** Merkt sich, welche Felder zu Funktionsmustern gehören. */
function reserviert(version) {
  const m = funktionsMuster(version);
  return m.map((zeile) => zeile.map((wert) => wert !== null));
}

function datenSetzen(m, belegt, worte) {
  const groesse = m.length;
  const bits = [];
  for (const w of worte) for (let i = 7; i >= 0; i--) bits.push((w >> i) & 1);

  let bit = 0;
  let aufwaerts = true;
  for (let spalte = groesse - 1; spalte > 0; spalte -= 2) {
    if (spalte === 6) spalte -= 1;               // die senkrechte Taktspur überspringen
    for (let i = 0; i < groesse; i++) {
      const zeile = aufwaerts ? groesse - 1 - i : i;
      for (const s of [spalte, spalte - 1]) {
        if (belegt[zeile][s]) continue;
        m[zeile][s] = bit < bits.length ? bits[bit++] === 1 : false;
      }
    }
    aufwaerts = !aufwaerts;
  }
}

const MASKEN = [
  (r, c) => (r + c) % 2 === 0,
  (r) => r % 2 === 0,
  (r, c) => c % 3 === 0,
  (r, c) => (r + c) % 3 === 0,
  (r, c) => (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0,
  (r, c) => ((r * c) % 2) + ((r * c) % 3) === 0,
  (r, c) => (((r * c) % 2) + ((r * c) % 3)) % 2 === 0,
  (r, c) => (((r + c) % 2) + ((r * c) % 3)) % 2 === 0,
];

function strafe(m) {
  const n = m.length;
  let punkte = 0;

  // Regel 1: Ketten gleicher Farbe
  for (let i = 0; i < n; i++) {
    for (const waagrecht of [true, false]) {
      let lauf = 1;
      for (let j = 1; j < n; j++) {
        const a = waagrecht ? m[i][j] : m[j][i];
        const b = waagrecht ? m[i][j - 1] : m[j - 1][i];
        if (a === b) lauf++;
        else { if (lauf >= 5) punkte += 3 + (lauf - 5); lauf = 1; }
      }
      if (lauf >= 5) punkte += 3 + (lauf - 5);
    }
  }

  // Regel 2: gleichfarbige 2x2-Blöcke
  for (let r = 0; r < n - 1; r++) {
    for (let c = 0; c < n - 1; c++) {
      const v = m[r][c];
      if (v === m[r][c + 1] && v === m[r + 1][c] && v === m[r + 1][c + 1]) punkte += 3;
    }
  }

  // Regel 3: sucherähnliche Folgen
  const muster = [true, false, true, true, true, false, true, false, false, false, false];
  const gedreht = muster.slice().reverse();
  const passt = (werte, soll) => soll.every((v, i) => werte[i] === v);
  for (let i = 0; i < n; i++) {
    for (let j = 0; j <= n - 11; j++) {
      const waagrecht = m[i].slice(j, j + 11);
      const senkrecht = Array.from({ length: 11 }, (_, k) => m[j + k][i]);
      for (const reihe of [waagrecht, senkrecht]) {
        if (passt(reihe, muster) || passt(reihe, gedreht)) punkte += 40;
      }
    }
  }

  // Regel 4: Abweichung vom Halbe-halbe-Verhältnis
  let dunkel = 0;
  for (const zeile of m) for (const v of zeile) if (v) dunkel++;
  const anteil = (dunkel * 100) / (n * n);
  punkte += Math.floor(Math.abs(anteil - 50) / 5) * 10;
  return punkte;
}

function formatBits(maske) {
  const daten = (0b01 << 3) | maske;             // Fehlerkorrektur L = 01
  let rest = daten << 10;
  for (let i = 14; i >= 10; i--) if ((rest >> i) & 1) rest ^= 0b10100110111 << (i - 10);
  return ((daten << 10) | rest) ^ 0b101010000010010;
}

function versionBits(version) {
  let rest = version << 12;
  for (let i = 17; i >= 12; i--) if ((rest >> i) & 1) rest ^= 0b1111100100101 << (i - 12);
  return (version << 12) | rest;
}

function infoSetzen(m, version, maske) {
  const n = m.length;
  const bits = formatBits(maske);
  // Die 15 Bits werden mit dem höchsten zuerst abgelegt, an zwei Stellen.
  const legen = (plaetze) => plaetze.forEach(([r, c], i) => {
    m[r][c] = ((bits >> (14 - i)) & 1) === 1;
  });

  legen([[8, 0], [8, 1], [8, 2], [8, 3], [8, 4], [8, 5], [8, 7], [8, 8],
    [7, 8], [5, 8], [4, 8], [3, 8], [2, 8], [1, 8], [0, 8]]);

  const zweite = [];
  for (let i = 1; i <= 7; i++) zweite.push([n - i, 8]);
  for (let i = 8; i >= 1; i--) zweite.push([8, n - i]);
  legen(zweite);

  m[n - 8][8] = true;                             // immer dunkles Modul

  if (version >= 7) {
    const vb = versionBits(version);
    for (let i = 0; i < 18; i++) {
      const wert = ((vb >> i) & 1) === 1;
      const zeile = Math.floor(i / 3);
      const spalte = i % 3;
      m[n - 11 + spalte][zeile] = wert;
      m[zeile][n - 11 + spalte] = wert;
    }
  }
}

function qrMatrix(text, maskeErzwingen = null) {
  const bytes = new TextEncoder().encode(text);
  const version = versionWaehlen(bytes.length);
  const worte = endgueltigeWoerter(codewoerter(bytes, version), version);

  const belegt = reserviert(version);
  const roh = funktionsMuster(version);
  datenSetzen(roh, belegt, worte);

  let beste = null;
  for (let maske = 0; maske < 8; maske++) {
    if (maskeErzwingen !== null && maske !== maskeErzwingen) continue;
    const m = roh.map((zeile, r) => zeile.map((wert, c) => (
      belegt[r][c] ? wert : wert !== MASKEN[maske](r, c)
    )));
    infoSetzen(m, version, maske);
    const p = strafe(m);
    if (!beste || p < beste.punkte) beste = { punkte: p, module: m };
  }

  return { groesse: beste.module.length, version, module: beste.module };
}

/** Zeichnet den Code in ein Canvas — mit der vorgeschriebenen ruhigen Zone. */
function qrZeichnen(canvas, text, { rand = 4, hell = '#f6f2e7', dunkel = '#16211e' } = {}) {
  const { groesse, module } = qrMatrix(text);
  const gesamt = groesse + rand * 2;
  const pixel = Math.max(1, Math.floor(canvas.width / gesamt));
  const kante = pixel * gesamt;

  canvas.width = kante;
  canvas.height = kante;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = hell;
  ctx.fillRect(0, 0, kante, kante);
  ctx.fillStyle = dunkel;
  for (let r = 0; r < groesse; r++) {
    for (let c = 0; c < groesse; c++) {
      if (module[r][c]) ctx.fillRect((c + rand) * pixel, (r + rand) * pixel, pixel, pixel);
    }
  }
  return { groesse, kante };
}

// Direktverbindung zwischen zwei Handys im selben WLAN oder Hotspot.
//
// Es gibt keinen Server, der vermittelt. Deshalb tauschen die Geräte ihre
// Verbindungsdaten einmalig per QR-Code aus: Gastgeber zeigt, Gast scannt,
// Gast zeigt zurück, Gastgeber scannt. Danach läuft alles direkt.
//
// Damit ein Code auf ein Handydisplay passt, wird die Beschreibung auf das
// Nötigste eingedampft und auf der Gegenseite aus einer Vorlage neu gebaut.

const CODE_MARKE = 'MA1';

/* ------------------------------------------------- Verbindungsdaten packen */

function hexZuBase64(hex) {
  const bytes = hex.split(':').map((h) => parseInt(h, 16));
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function base64ZuHex(b64) {
  const roh = atob(b64.replace(/-/g, '+').replace(/_/g, '/'));
  return Array.from(roh, (c) => c.charCodeAt(0).toString(16).padStart(2, '0').toUpperCase()).join(':');
}

/** Aus einer vollständigen Beschreibung einen kurzen, scanbaren Code machen. */
function funkCodeBauen(sdp, rolle) {
  const hole = (muster) => (sdp.match(muster) || [])[1] || '';
  const ufrag = hole(/^a=ice-ufrag:(.+)$/m);
  const pwd = hole(/^a=ice-pwd:(.+)$/m);
  const fingerabdruck = hole(/^a=fingerprint:sha-256 (.+)$/m).trim();

  const kandidaten = [];
  for (const zeile of sdp.split(/\r?\n/)) {
    const t = zeile.match(/^a=candidate:\S+ \d+ (udp|UDP) \d+ (\S+) (\d+) typ (host|srflx)/);
    if (t && !kandidaten.some((k) => k === `${t[2]},${t[3]}`)) kandidaten.push(`${t[2]},${t[3]}`);
  }

  return [CODE_MARKE + rolle, ufrag, pwd, hexZuBase64(fingerabdruck), ...kandidaten].join('|');
}

/** Kurzcode wieder zu einer vollständigen Beschreibung aufblasen. */
function funkCodeLesen(code) {
  const teile = String(code).trim().split('|');
  const kopf = teile[0] || '';
  if (!kopf.startsWith(CODE_MARKE)) throw new Error('Das ist kein Mauern-Verbindungscode.');
  const rolle = kopf.slice(CODE_MARKE.length);
  if (rolle !== 'O' && rolle !== 'A') throw new Error('Der Verbindungscode ist unvollständig.');

  const [, ufrag, pwd, fingerBase64, ...kandidaten] = teile;
  if (!ufrag || !pwd || !fingerBase64) throw new Error('Der Verbindungscode ist unvollständig.');

  const sdp = [
    'v=0',
    'o=- 1 2 IN IP4 127.0.0.1',
    's=-',
    't=0 0',
    'a=group:BUNDLE 0',
    'a=msid-semantic: WMS',
    'm=application 9 UDP/DTLS/SCTP webrtc-datachannel',
    'c=IN IP4 0.0.0.0',
    `a=ice-ufrag:${ufrag}`,
    `a=ice-pwd:${pwd}`,
    'a=ice-options:trickle',
    `a=fingerprint:sha-256 ${base64ZuHex(fingerBase64)}`,
    `a=setup:${rolle === 'O' ? 'actpass' : 'active'}`,
    'a=mid:0',
    'a=sctp-port:5000',
    'a=max-message-size:262144',
    '',
  ].join('\r\n');

  return {
    typ: rolle === 'O' ? 'offer' : 'answer',
    sdp,
    kandidaten: kandidaten.filter(Boolean).map((k) => {
      const [adresse, port] = k.split(',');
      return {
        candidate: `candidate:1 1 udp 2130706431 ${adresse} ${port} typ host generation 0 ufrag ${ufrag}`,
        sdpMid: '0',
        sdpMLineIndex: 0,
      };
    }),
  };
}

/* -------------------------------------------------------- Kamera-Freigabe */

// Chrome verrät die echte WLAN-Adresse eines Handys nicht einfach so: statt
// 192.168.x.y steht in den Verbindungsdaten ein zufälliger „….local"-Name
// (mDNS). Die Gegenseite müsste diesen Namen per Multicast auflösen — und
// genau das lassen Handy-Hotspots meistens nicht durch. Hat die Seite aber
// einmal die Erlaubnis für die Kamera, gibt Chrome die echte Adresse heraus.
// Also holen wir die Erlaubnis, *bevor* die Verbindung entsteht; die Kamera
// geht sofort wieder aus. Zum Scannen brauchen wir sie ohnehin gleich.
async function kameraFreigeben() {
  try {
    const strom = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: false,
    });
    strom.getTracks().forEach((spur) => spur.stop());
    return true;
  } catch {
    return false;
  }
}

/* ------------------------------------------------------------- Verbindung */

/**
 * Baut die Verbindung auf. `aufZustand(text, verbunden)` meldet Fortschritt,
 * `aufNachricht(objekt)` liefert eingehende Daten.
 */
function funkAufbauen({ gastgeber, aufZustand, aufNachricht }) {
  const pc = new RTCPeerConnection({ iceServers: [] });
  let kanal = null;
  let offen = false;
  const lage = { eigene: [], fremde: 0, mdns: false, stand: 'neu', sammeln: 'läuft' };

  const melde = (text) => aufZustand?.(text, offen);

  const kanalVerdrahten = (k) => {
    kanal = k;
    k.onopen = () => { offen = true; aufZustand?.('verbunden', true); };
    k.onclose = () => { offen = false; aufZustand?.('getrennt', false); };
    k.onmessage = (e) => {
      try { aufNachricht?.(JSON.parse(e.data)); } catch { /* kaputte Nachricht */ }
    };
  };

  if (gastgeber) kanalVerdrahten(pc.createDataChannel('hut', { ordered: true }));
  else pc.ondatachannel = (e) => kanalVerdrahten(e.channel);

  // Mitschreiben, was das Handy findet — sonst steht man bei „Verbinde …" im Dunkeln.
  pc.onicecandidate = (e) => {
    if (!e.candidate) return;
    const roh = e.candidate.candidate;
    if (/\.local\b/.test(roh)) { lage.mdns = true; return; }
    const t = roh.match(/ (\S+) (\d+) typ (?:host|srflx)/);
    if (t && !lage.eigene.includes(`${t[1]}:${t[2]}`)) lage.eigene.push(`${t[1]}:${t[2]}`);
  };

  pc.oniceconnectionstatechange = () => {
    lage.stand = pc.iceConnectionState;
    if (['failed', 'disconnected'].includes(pc.iceConnectionState) && !offen) {
      melde(lage.mdns && !lage.eigene.length
        ? 'Keine Verbindung — dieses Handy hat seine WLAN-Adresse nicht herausgegeben.'
        : 'Keine Verbindung — blockiert euer Hotspot vielleicht den direkten Weg?');
    }
  };

  /** Wartet, bis alle lokalen Adressen gesammelt sind (oder die Geduld endet). */
  const adressenSammeln = () => new Promise((fertig) => {
    if (pc.iceGatheringState === 'complete') { lage.sammeln = 'fertig'; return fertig(); }
    const stopp = setTimeout(() => { lage.sammeln = 'fertig'; fertig(); }, 6000);
    pc.onicegatheringstatechange = () => {
      lage.sammeln = pc.iceGatheringState === 'complete' ? 'fertig' : pc.iceGatheringState;
      if (pc.iceGatheringState === 'complete') { clearTimeout(stopp); fertig(); }
    };
    return undefined;
  });

  return {
    /** Gastgeber: eigenen Code erzeugen. Gast: erst nach codeLesen aufrufen. */
    async eigenerCode() {
      const beschreibung = gastgeber ? await pc.createOffer() : await pc.createAnswer();
      await pc.setLocalDescription(beschreibung);
      await adressenSammeln();
      return funkCodeBauen(pc.localDescription.sdp, gastgeber ? 'O' : 'A');
    },

    async codeLesen(code) {
      const { typ, sdp, kandidaten } = funkCodeLesen(code);
      if (gastgeber && typ !== 'answer') throw new Error('Das ist der Code des Gastgebers — du brauchst den vom Gast.');
      if (!gastgeber && typ !== 'offer') throw new Error('Das ist der Code des Gasts — du brauchst den vom Gastgeber.');
      await pc.setRemoteDescription({ type: typ, sdp });
      for (const k of kandidaten) {
        try { await pc.addIceCandidate(k); lage.fremde += 1; } catch { /* einzelne Adresse taugt nicht */ }
      }
      melde('verbinde …');
    },

    senden(objekt) {
      if (kanal && kanal.readyState === 'open') {
        kanal.send(JSON.stringify(objekt));
        return true;
      }
      return false;
    },

    get verbunden() { return offen; },

    /** Momentaufnahme für die Fehlersuche — reine Lesekopie. */
    get lage() { return { ...lage, eigene: lage.eigene.slice() }; },

    schliessen() {
      try { kanal?.close(); } catch { /* egal */ }
      try { pc.close(); } catch { /* egal */ }
    },
  };
}

/* ---------------------------------------------------------------- Scanner */

const scannerMoeglich = () => typeof window !== 'undefined'
  && 'BarcodeDetector' in window
  && !!navigator.mediaDevices?.getUserMedia;

/**
 * Startet die Kamera und meldet den ersten gefundenen QR-Code.
 * Gibt eine Funktion zum Abschalten zurück.
 */
async function scannerStarten(videoElement, aufTreffer, aufFehler) {
  if (!scannerMoeglich()) {
    aufFehler?.(new Error('Dieser Browser kann keine QR-Codes lesen — nimm den Textcode.'));
    return () => {};
  }
  let laeuft = true;
  let strom = null;

  try {
    strom = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: false,
    });
  } catch (fehler) {
    aufFehler?.(new Error('Kein Zugriff auf die Kamera. Erlaube ihn oder nimm den Textcode.'));
    return () => {};
  }

  videoElement.srcObject = strom;
  videoElement.setAttribute('playsinline', '');
  await videoElement.play().catch(() => {});

  const sucher = new window.BarcodeDetector({ formats: ['qr_code'] });
  const schauen = async () => {
    if (!laeuft) return;
    try {
      const treffer = await sucher.detect(videoElement);
      const code = treffer.find((t) => String(t.rawValue).startsWith(CODE_MARKE));
      if (code) { laeuft = false; aufTreffer(code.rawValue); return stoppen(); }
    } catch { /* einzelner Fehlversuch ist egal */ }
    setTimeout(schauen, 220);
    return undefined;
  };

  const stoppen = () => {
    laeuft = false;
    strom?.getTracks().forEach((t) => t.stop());
    videoElement.srcObject = null;
  };

  schauen();
  return stoppen;
}

// Zwei Handys über das Internet verbinden — für die Fassung auf der Webseite.
//
// Anders als funk.js braucht das kein gemeinsames WLAN und keine Kamera: Der
// Server hält nur einen Raum mit einem kurzen Code offen und reicht Nachrichten
// durch. Er versteht kein Spiel; er merkt sich, wer was noch nicht abgeholt hat.
//
// Nach außen sieht das genauso aus wie eine Direktverbindung — `senden`,
// `verbunden`, `schliessen` — damit die Oberfläche nichts davon wissen muss.

const NETZ_BASIS = (typeof SPIELE_BASIS === 'string' ? SPIELE_BASIS : '.').replace(/\/$/, '');

/** Steht dieser Weg überhaupt zur Verfügung? Nur in der Webfassung. */
const netzMoeglich = () => typeof SPIELE_BASIS === 'string';

async function ruf(pfad, optionen = {}) {
  const antwort = await fetch(`${NETZ_BASIS}/api${pfad}`, {
    cache: 'no-store',
    headers: { 'Content-Type': 'application/json' },
    ...optionen,
  });
  let daten = null;
  try { daten = await antwort.json(); } catch { /* leere Antwort */ }
  if (!antwort.ok) throw new Error((daten && daten.fehler) || `Server meldet ${antwort.status}.`);
  return daten || {};
}

/**
 * Raum aufmachen oder beitreten und danach dauerhaft lauschen.
 *
 * `aufZustand(text, verbunden)` meldet Fortschritt, `aufNachricht(objekt)`
 * liefert alles, was die Gegenseite schickt, `aufCode(code)` den Raumcode,
 * sobald er feststeht.
 */
function netzAufbauen({ gastgeber, code, aufZustand, aufNachricht, aufCode }) {
  let raum = null;         // { code, sitz, schluessel }
  let ab = 0;
  let offen = false;
  let laeuft = true;
  let fehlversuche = 0;

  const melde = (text, verbunden = offen) => aufZustand?.(text, verbunden);

  async function lauschen() {
    while (laeuft && raum) {
      try {
        const q = new URLSearchParams({
          sitz: String(raum.sitz),
          ab: String(ab),
          voll: offen ? '1' : '0',        // der Server meldet sich, sobald sich das ändert
          schluessel: raum.schluessel,
        });
        const daten = await ruf(`/raum/${raum.code}/holen?${q}`);
        if (!laeuft) return;
        fehlversuche = 0;

        if (daten.voll && !offen) { offen = true; aufZustand?.('verbunden', true); }
        if (!daten.voll && offen) { offen = false; aufZustand?.('getrennt', false); }

        for (const n of daten.nachrichten || []) {
          ab = Math.max(ab, n.nr);
          try { aufNachricht?.(n.inhalt); } catch { /* kaputte Nachricht */ }
        }
        if (typeof daten.stand === 'number') ab = Math.max(ab, Math.min(ab, daten.stand));
      } catch (fehler) {
        if (!laeuft) return;
        fehlversuche += 1;
        if (fehlversuche >= 4) {
          offen = false;
          aufZustand?.(`Verbindung abgerissen: ${fehler.message}`, false);
        }
        // Kurz warten, dann weiter — kurze Aussetzer sollen das Spiel nicht beenden.
        await new Promise((w) => setTimeout(w, Math.min(4000, 500 * fehlversuche)));
      }
    }
  }

  const bereit = (async () => {
    melde(gastgeber ? 'Raum wird geöffnet …' : 'Raum wird gesucht …', false);
    raum = gastgeber
      ? await ruf('/raum', { method: 'POST', body: '{}' })
      : await ruf(`/raum/${String(code || '').trim().toUpperCase()}/beitreten`,
        { method: 'POST', body: '{}' });
    aufCode?.(raum.code);
    melde(gastgeber ? 'Warte auf das zweite Handy …' : 'Verbinde …', false);
    lauschen();
    return raum.code;
  })();

  return {
    bereit,                                   // Promise: fertig, sobald der Raum steht
    get code() { return raum && raum.code; },
    get verbunden() { return offen; },

    senden(objekt) {
      if (!raum) return false;
      ruf(`/raum/${raum.code}/senden`, {
        method: 'POST',
        body: JSON.stringify({ sitz: raum.sitz, schluessel: raum.schluessel, nachricht: objekt }),
      }).catch(() => { /* der Lauscher merkt den Ausfall */ });
      return true;
    },

    schliessen() {
      laeuft = false;
      offen = false;
      raum = null;
    },
  };
}

// Mauern — Spiellogik ohne DOM. Alles serialisierbar.
//
// Nach dem Vorbild von Quoridor (Gigamic, Mirko Marchesi, 1997) — das Spiel,
// das auf barricade.gg gespielt wird. Regeln sind frei; Name und Gestaltung
// nicht, deshalb heißt es hier Mauern.
//
// Mit den Sperrsteinen hat es nur das Wort gemeinsam: kein Würfel, eine
// einzige Figur je Seite, und in jedem Zug entweder **ein Feld gehen** oder
// **eine Mauer bauen**. Wer zuerst die gegenüberliegende Reihe erreicht,
// gewinnt.
//
// Die Fugen: eine Mauer ist zwei Felder lang und sitzt zwischen den Feldern.
// Sie wird über ihre linke obere Fuge (r, c) angesprochen, mit
// 0 ≤ r, c ≤ groesse − 2:
//
//   waagerecht bei (r,c)  trennt (r,c)|(r+1,c)  und  (r,c+1)|(r+1,c+1)
//   senkrecht  bei (r,c)  trennt (r,c)|(r,c+1)  und  (r+1,c)|(r+1,c+1)
//
// Die wichtigste Regel im ganzen Spiel ist die Wegregel: eine Mauer darf
// niemals die letzte Verbindung einer Seite zu ihrer Zielreihe kappen. Ohne
// sie wäre das Spiel kaputt — man mauerte die Gegenseite einfach ein. Sie wird
// vor jedem Setzen mit einer Breitensuche geprüft, für **beide** Seiten.

const SAVE_VERSION = 1;

const VORGABE = {
  groesse: 9,        // Kantenlänge des Bretts
  mauern: 10,        // Mauern je Seite
  wettlauf: false,   // beide starten nebeneinander und wollen zur selben Reihe
};

const MODI = [
  {
    id: 'klassisch',
    titel: 'Klassisch',
    zeile: '9 × 9, zehn Mauern, gegenüberliegende Seiten',
    regeln: {},
  },
  {
    id: 'kurz',
    titel: 'Kurz',
    zeile: '7 × 7 und sieben Mauern — für zwischendurch',
    regeln: { groesse: 7, mauern: 7 },
  },
  {
    id: 'wettlauf',
    titel: 'Wettlauf',
    zeile: 'Beide starten nebeneinander und wollen auf dieselbe Seite',
    regeln: { wettlauf: true },
  },
  {
    id: 'sparsam',
    titel: 'Sparsam',
    zeile: 'Großes Brett, nur fünf Mauern — fast ein Wettrennen',
    regeln: { mauern: 5 },
  },
  {
    id: 'festung',
    titel: 'Festung',
    zeile: 'Vierzehn Mauern je Seite — jeder Weg wird zum Labyrinth',
    regeln: { mauern: 14 },
  },
];

// Ausprobiert und wieder verworfen: ein Modus **ohne Springen**, in dem die
// Figuren einander wie Mauern blockieren. Er ist eine bekannte Hausregel, aber
// gemessen gewinnt die anziehende Seite 71 % der Partien: ohne Sprung müssen
// zwei Figuren einander frontal ausweichen, und wer ausweichen muss, entscheidet
// allein die Zugparität. Ein Modus, den der Anwurf zu zwei Dritteln entscheidet,
// ist kein besseres Spiel, sondern ein schlechteres.

const anderer = (i) => (i === 0 ? 1 : 0);

function neuerStand(namen = ['Monty', 'Christina'], regeln = {}) {
  const r = { ...VORGABE, ...regeln };
  return {
    v: SAVE_VERSION,
    spieler: namen.map((name) => ({ name })),
    regeln: r,
    figuren: startfelder(r),
    ziele: zielreihen(r),
    mauern: [],
    vorrat: [r.mauern, r.mauern],
    dran: 0,
    siege: [0, 0],
    partie: 1,
    letzteAktion: null,
    fertig: null,
  };
}

/** Wo beide beginnen. Im Wettlauf nebeneinander auf derselben Grundreihe. */
function startfelder(r) {
  const n = r.groesse;
  const mitte = (n - 1) / 2;
  if (r.wettlauf) {
    return [{ r: n - 1, c: mitte - 1 }, { r: n - 1, c: mitte + 1 }];
  }
  return [{ r: n - 1, c: mitte }, { r: 0, c: mitte }];
}

/** Welche Reihe jede Seite erreichen muss. Im Wettlauf für beide dieselbe. */
function zielreihen(r) {
  return r.wettlauf ? [0, 0] : [0, r.groesse - 1];
}

/* ---------------------------------------------------------------- Abfragen */

// `fertig` ist der Index des Siegers und darf 0 sein — nie auf Wahrheit prüfen.
const vorbei = (stand) => stand.fertig !== null;
const gewinner = (stand) => stand.fertig;
const mauernUebrig = (stand, spieler) => stand.vorrat[spieler];

const imBrett = (stand, r, c) =>
  r >= 0 && c >= 0 && r < stand.regeln.groesse && c < stand.regeln.groesse;

const hatMauer = (stand, r, c, a) =>
  stand.mauern.some((m) => m.r === r && m.c === c && m.a === a);

/**
 * Steht zwischen zwei benachbarten Feldern eine Mauer?
 *
 * Jede Kante wird von zwei möglichen Mauern versperrt — die Mauer ist zwei
 * Felder lang, also kann sie mit ihrer linken oder ihrer rechten Hälfte hier
 * liegen. Genau das ist die Stelle, an der man sich beim Nachbauen leicht
 * vertut.
 */
function versperrt(stand, von, nach) {
  const dr = nach.r - von.r;
  const dc = nach.c - von.c;
  if (dr === 1) return hatMauer(stand, von.r, von.c, 'waagerecht')
    || hatMauer(stand, von.r, von.c - 1, 'waagerecht');
  if (dr === -1) return hatMauer(stand, nach.r, von.c, 'waagerecht')
    || hatMauer(stand, nach.r, von.c - 1, 'waagerecht');
  if (dc === 1) return hatMauer(stand, von.r, von.c, 'senkrecht')
    || hatMauer(stand, von.r - 1, von.c, 'senkrecht');
  if (dc === -1) return hatMauer(stand, von.r, nach.c, 'senkrecht')
    || hatMauer(stand, von.r - 1, nach.c, 'senkrecht');
  return true;                                   // kein Nachbarfeld
}

/** Erreichbare Nachbarfelder ohne Rücksicht auf Figuren — für die Wegsuche. */
function nachbarn(stand, feld) {
  const raus = [];
  for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
    const n = { r: feld.r + dr, c: feld.c + dc };
    if (imBrett(stand, n.r, n.c) && !versperrt(stand, feld, n)) raus.push(n);
  }
  return raus;
}

/* --------------------------------------------------------------- Wegsuche */

/**
 * Kürzester Weg dieser Seite zu ihrer Zielreihe, in Schritten.
 * `Infinity`, wenn es keinen gibt. Figuren werden dabei ignoriert — eine
 * Figur kann übersprungen werden und versperrt darum nie dauerhaft.
 */
function wegLaenge(stand, spieler) {
  const ziel = stand.ziele[spieler];
  const start = stand.figuren[spieler];
  if (start.r === ziel) return 0;
  const n = stand.regeln.groesse;
  const gesehen = new Uint8Array(n * n);
  let welle = [start];
  gesehen[start.r * n + start.c] = 1;
  let schritte = 0;
  while (welle.length) {
    schritte += 1;
    const naechste = [];
    for (const feld of welle) {
      for (const nb of nachbarn(stand, feld)) {
        const i = nb.r * n + nb.c;
        if (gesehen[i]) continue;
        if (nb.r === ziel) return schritte;
        gesehen[i] = 1;
        naechste.push(nb);
      }
    }
    welle = naechste;
  }
  return Infinity;
}

/* ----------------------------------------------------------- Züge finden */

/**
 * Wohin darf die Figur, die dran ist?
 *
 * Auf die Gegenfigur nie. Steht sie im Weg, springt man über sie hinweg;
 * geht das nicht (Mauer oder Rand dahinter), weicht man schräg an ihr vorbei.
 * Im Modus „Ohne Sprung" entfällt beides und die Figur blockiert schlicht.
 */
function zuege(stand) {
  if (vorbei(stand)) return [];
  const ich = stand.figuren[stand.dran];
  const du = stand.figuren[anderer(stand.dran)];
  const raus = [];
  const merken = (f) => {
    if (!raus.some((x) => x.r === f.r && x.c === f.c)) raus.push(f);
  };

  for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
    const nah = { r: ich.r + dr, c: ich.c + dc };
    if (!imBrett(stand, nah.r, nah.c) || versperrt(stand, ich, nah)) continue;
    if (nah.r !== du.r || nah.c !== du.c) { merken(nah); continue; }

    const weit = { r: nah.r + dr, c: nah.c + dc };
    if (imBrett(stand, weit.r, weit.c) && !versperrt(stand, nah, weit)) {
      merken(weit);                                    // gerade darüber hinweg
      continue;
    }
    // Dahinter geht es nicht weiter — also schräg an der Gegenfigur vorbei.
    for (const [qr, qc] of dr === 0 ? [[-1, 0], [1, 0]] : [[0, -1], [0, 1]]) {
      const schraeg = { r: nah.r + qr, c: nah.c + qc };
      if (imBrett(stand, schraeg.r, schraeg.c) && !versperrt(stand, nah, schraeg)) {
        merken(schraeg);
      }
    }
  }
  return raus;
}

const ziehbar = (stand, r, c) => zuege(stand).some((z) => z.r === r && z.c === c);

function ziehen(stand, r, c) {
  if (!ziehbar(stand, r, c)) throw new Error('Dieser Zug ist nicht erlaubt.');
  const spieler = stand.dran;
  stand.figuren[spieler] = { r, c };
  stand.letzteAktion = { art: 'gezogen', spieler, r, c };

  if (r === stand.ziele[spieler]) {
    stand.fertig = spieler;
    stand.siege[spieler] += 1;
    stand.letzteAktion = { art: 'gewonnen', spieler, r, c };
    return stand;
  }
  stand.dran = anderer(spieler);
  return stand;
}

/* ------------------------------------------------------------------ Mauern */

/**
 * Darf hier eine Mauer stehen?
 *
 * Vier Bedingungen: im Gitter, Vorrat da, keine Überschneidung — und die
 * Wegregel. Die letzte kostet zwei Breitensuchen und ist trotzdem die
 * billigste Stelle, sie zu prüfen.
 */
function mauerErlaubt(stand, r, c, a) {
  if (vorbei(stand)) return false;
  if (a !== 'waagerecht' && a !== 'senkrecht') return false;
  const grenze = stand.regeln.groesse - 1;
  if (!Number.isInteger(r) || !Number.isInteger(c)) return false;
  if (r < 0 || c < 0 || r >= grenze || c >= grenze) return false;
  if (mauernUebrig(stand, stand.dran) <= 0) return false;

  // Dieselbe Fuge ist belegt — gleiche Richtung oder gekreuzt.
  if (stand.mauern.some((m) => m.r === r && m.c === c)) return false;
  // Gleiche Richtung, um ein Feld versetzt: die beiden überlappen sich.
  if (a === 'waagerecht' && (hatMauer(stand, r, c - 1, a) || hatMauer(stand, r, c + 1, a))) return false;
  if (a === 'senkrecht' && (hatMauer(stand, r - 1, c, a) || hatMauer(stand, r + 1, c, a))) return false;

  const probe = { ...stand, mauern: [...stand.mauern, { r, c, a }] };
  return Number.isFinite(wegLaenge(probe, 0)) && Number.isFinite(wegLaenge(probe, 1));
}

function mauerZuege(stand) {
  if (vorbei(stand) || mauernUebrig(stand, stand.dran) <= 0) return [];
  const raus = [];
  const grenze = stand.regeln.groesse - 1;
  for (let r = 0; r < grenze; r++) {
    for (let c = 0; c < grenze; c++) {
      for (const a of ['waagerecht', 'senkrecht']) {
        if (mauerErlaubt(stand, r, c, a)) raus.push({ r, c, a });
      }
    }
  }
  return raus;
}

function mauerSetzen(stand, r, c, a) {
  if (!mauerErlaubt(stand, r, c, a)) throw new Error('Dort darf keine Mauer stehen.');
  const spieler = stand.dran;
  stand.mauern = [...stand.mauern, { r, c, a }];
  stand.vorrat[spieler] -= 1;
  stand.letzteAktion = { art: 'gemauert', spieler, r, c, a };
  stand.dran = anderer(spieler);
  return stand;
}

/* --------------------------------------------------------- Neue Partie */

function partieNeu(stand) {
  const beginnt = stand.fertig === null ? stand.dran : anderer(stand.fertig);
  stand.figuren = startfelder(stand.regeln);
  stand.ziele = zielreihen(stand.regeln);
  stand.mauern = [];
  stand.vorrat = [stand.regeln.mauern, stand.regeln.mauern];
  stand.dran = beginnt;
  stand.letzteAktion = null;
  stand.fertig = null;
  stand.partie += 1;
  return stand;
}

/* --------------------------------------------------- Punktestand mitnehmen */

function alsCode(stand) {
  const kern = {
    v: SAVE_VERSION, n: stand.spieler.map((s) => s.name),
    s: stand.siege, p: stand.partie, r: stand.regeln,
  };
  return `MAU1-${btoa(unescape(encodeURIComponent(JSON.stringify(kern))))}`;
}

function ausCode(code) {
  const roh = String(code || '').trim();
  if (!roh.startsWith('MAU1-')) throw new Error('Das ist kein Mauern-Punktestand.');
  let kern;
  try {
    kern = JSON.parse(decodeURIComponent(escape(atob(roh.slice(5)))));
  } catch {
    throw new Error('Der Code ist unvollständig oder verrutscht.');
  }
  if (!kern || !Array.isArray(kern.s) || kern.s.length !== 2) {
    throw new Error('Der Code passt nicht zu diesem Spiel.');
  }
  const stand = neuerStand(
    Array.isArray(kern.n) && kern.n.length === 2 ? kern.n : undefined,
    kern.r && typeof kern.r === 'object' ? kern.r : {},
  );
  stand.siege = kern.s.map((n) => (Number.isFinite(n) ? n : 0));
  stand.partie = Number.isFinite(kern.p) ? kern.p : 1;
  return stand;
}

// Mauern — Oberfläche. Ein Handy zum Weiterreichen oder zwei zugleich.
//
// Hier gibt es nichts zu verbergen: beide sehen dasselbe Brett. Darum kein
// Übergabe-Bildschirm — die Kopfzeile sagt, wer dran ist.
//
// Die Bedienung ist die eigentliche Aufgabe dieses Spiels: eine Mauer sitzt
// **zwischen** den Feldern, und auf einem Handy ist so eine Fuge kein Ziel, das
// man treffen kann. Darum in drei klaren Schritten statt in einer Geste:
//
//   1. unten umschalten: Laufen oder Mauern
//   2. beim Mauern die Richtung wählen (quer oder längs)
//   3. einen Punkt antippen — die Mauer erscheint als Vorschau — und bestätigen
//
// Eine Mauer ist unwiderruflich und oft spielentscheidend. Der Bestätigungs-
// schritt ist deshalb Absicht, kein überflüssiger Tipp.


const KEY = 'mauern.v1';
const app = document.getElementById('app');

let stand = null;
let ui = {
  screen: 'start',
  overlay: null,
  codeStatus: '',
  modusWahl: 'klassisch',
  werkzeug: 'laufen',          // 'laufen' | 'mauern'
  ausrichtung: 'waagerecht',
  vorschau: null,              // { r, c, a } — Mauer, die noch bestätigt wird
  modus: 'lokal',
  meinIndex: 0,
  gastgeber: true,
  netz: null,
  kopplung: null,
};

/* ------------------------------------------------------------------ Hilfen */

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const name = (i) => esc(stand.spieler[i]?.name || (i === 0 ? 'Koralle' : 'Blau'));
const buzz = (ms) => { try { navigator.vibrate?.(ms); } catch { /* egal */ } };
const modusInfo = () => MODI.find((m) => m.id === stand?.modusId) || MODI[0];

function sichern() {
  try { localStorage.setItem(KEY, JSON.stringify(stand)); } catch { /* privater Modus */ }
}

function laden() {
  try {
    const roh = localStorage.getItem(KEY);
    if (!roh) return null;
    const s = JSON.parse(roh);
    if (s && s.v === 1 && Array.isArray(s.siege) && Array.isArray(s.figuren)
      && Array.isArray(s.mauern) && s.regeln) return s;
  } catch { /* kaputter Stand wird ignoriert */ }
  return null;
}

function nachAenderung() {
  ui.vorschau = null;
  if (ui.modus === 'online') {
    if (ui.gastgeber) standSenden();
    render();
    return;
  }
  sichern();
  render();
}

/** Darf dieses Gerät gerade handeln? */
const ichBinDran = () => ui.modus !== 'online' || stand.dran === ui.meinIndex;

/* ---------------------------------------------------- Zwei Handys, ein Spiel */

// Bei Mauern ist nichts geheim — der Stand geht unverändert hinüber.
const standFuer = (quelle) => quelle;

function standSenden() {
  ui.netz?.senden({ typ: 'stand', stand: standFuer(stand) });
}

/** Zug ausführen (Gastgeber) oder hinüberschicken (Gast). */
function tun(was, wert) {
  if (ui.modus === 'online' && !ui.gastgeber) {
    ui.netz?.senden({ typ: 'aktion', name: was, wert });
    return false;
  }
  return true;
}

function nachrichtVerarbeiten(m) {
  if (m.typ === 'namen' && !ui.gastgeber) {
    ui.meinIndex = m.meinIndex === 1 ? 1 : 0;
    return;
  }
  if (m.typ === 'stand' && !ui.gastgeber) {
    stand = m.stand;
    ui.vorschau = null;
    ui.screen = 'spiel';
    render();
    return;
  }
  if (!ui.gastgeber || !stand) return;

  if (m.typ === 'aktion') {
    try {
      if (m.name === 'ziehen') ziehen(stand, m.wert.r, m.wert.c);
      else if (m.name === 'mauer') mauerSetzen(stand, m.wert.r, m.wert.c, m.wert.a);
      else if (m.name === 'partieNeu') partieNeu(stand);
      else return;
    } catch { return; }            // ein Zug, der nicht geht, wird verworfen
    sichern();
    standSenden();
    render();
  }
}

function kopplungAbbrechen() {
  ui.netz?.schliessen();
  ui.netz = null;
  ui.kopplung = null;
  ui.modus = 'lokal';
  ui.meinIndex = 0;
  ui.gastgeber = true;
  render();
}

async function netzStarten(gastgeber, code) {
  ui.modus = 'online';
  ui.gastgeber = gastgeber;
  ui.meinIndex = gastgeber ? 0 : 1;
  ui.kopplung = { schritt: 'raum', gastgeber, code: '', hinweis: '', fehler: '' };
  render();

  ui.netz = netzAufbauen({
    gastgeber,
    code,
    aufZustand: (text, verbunden) => {
      if (verbunden) return verbindungSteht();
      if (ui.kopplung) { ui.kopplung.hinweis = text; render(); }
      return undefined;
    },
    aufNachricht: nachrichtVerarbeiten,
    aufCode: (c) => { if (ui.kopplung) { ui.kopplung.code = c; render(); } },
  });

  try {
    await ui.netz.bereit;
  } catch (fehler) {
    if (!ui.kopplung) return;
    ui.kopplung.fehler = fehler.message || 'Das hat nicht geklappt.';
    ui.kopplung.schritt = gastgeber ? 'raum' : 'code';
    render();
  }
}

function verbindungSteht() {
  if (!ui.kopplung) return;                 // kann zweimal feuern
  ui.kopplung = null;
  if (ui.gastgeber) {
    if (!stand) stand = neuerStand();
    ui.screen = 'spiel';
    ui.netz?.senden({ typ: 'namen', meinIndex: 1 });
    standSenden();
  }
  render();
}

/* ------------------------------------------------- Seite als Datei sichern */

function seitenQuelltext(cssId, jsId, ersatzTitel) {
  const css = document.getElementById(cssId)?.textContent || '';
  const js = document.getElementById(jsId)?.textContent || '';
  if (!css || !js) return null;
  const kopf = typeof SEITENKOPF === 'string'
    ? SEITENKOPF
    : `<meta charset="utf-8"><title>${ersatzTitel}</title>`;
  return [
    '<!doctype html>', '<html lang="de">', '<head>', kopf,
    `<style id="${cssId}">`, css, '</style>', '</head>', '<body>',
    '<div id="app"></div>',
    `<script id="${jsId}">`, js, '<' + '/script>',
    '</body>', '</html>', '',
  ].join('\n');
}

function browserDownload(dateiname, html) {
  const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  const a = document.createElement('a');
  a.href = url; a.download = dateiname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

/** Rückgabe: 'ok' | 'txt' | 'abgelehnt' | 'dev' */
async function seiteAlsDateiSichern(cssId, jsId, dateiname, ersatzTitel) {
  if (typeof OFFLINE_DATEI === 'string') {
    const a = document.createElement('a');
    a.href = OFFLINE_DATEI; a.download = dateiname;
    document.body.appendChild(a); a.click(); a.remove();
    return 'ok';
  }
  const html = seitenQuelltext(cssId, jsId, ersatzTitel);
  if (!html) return 'dev';
  const dl = typeof window !== 'undefined' && window.claude ? window.claude.downloads : null;
  if (dl) {
    try {
      await dl.save({ filename: dateiname, data: html });
      return 'ok';
    } catch (fehler) {
      const code = fehler && fehler.code;
      if (code === 'declined') return 'abgelehnt';
      if (code === 'rejected_extension' || code === 'extension_not_enabled') {
        try {
          await dl.save({ filename: dateiname.replace(/\.html$/, '') + '.txt', data: html });
          return 'txt';
        } catch (zweiterFehler) {
          if (zweiterFehler && zweiterFehler.code === 'declined') return 'abgelehnt';
        }
      }
    }
  }
  browserDownload(dateiname, html);
  return 'ok';
}

const SICHER_TEXT = {
  ok: 'Gesichert — liegt in deinen Downloads',
  txt: 'Als .txt gesichert — bitte in %NAME% umbenennen',
  abgelehnt: 'Abgebrochen — nichts gespeichert',
  dev: 'Geht nur in der fertigen Version',
};

/* --------------------------------------------------------------- Das Brett */

// Feld 10 breit, dazwischen 2 Einheiten Fuge — genau dort sitzen die Mauern.
const ZELLE = 10;
const FUGE = 2;
const TAKT = ZELLE + FUGE;
const RAND = 4;

const brettMass = () => stand.regeln.groesse * TAKT - FUGE + 2 * RAND;
const zelleXY = (r, c) => [c * TAKT, r * TAKT];
const zelleMitte = (r, c) => [c * TAKT + ZELLE / 2, r * TAKT + ZELLE / 2];
const fugeMitte = (r, c) => [c * TAKT + ZELLE + FUGE / 2, r * TAKT + ZELLE + FUGE / 2];

/** Rechteck einer Mauer im Zeichenraster. */
function mauerRechteck(m) {
  const [x, y] = zelleXY(m.r, m.c);
  return m.a === 'waagerecht'
    ? { x, y: y + ZELLE, breite: 2 * ZELLE + FUGE, hoehe: FUGE }
    : { x: x + ZELLE, y, breite: FUGE, hoehe: 2 * ZELLE + FUGE };
}

function brettSvg() {
  const n = stand.regeln.groesse;
  const mass = brettMass();
  const meins = ichBinDran() && !vorbei(stand);
  const laufziele = meins && ui.werkzeug === 'laufen' ? zuege(stand) : [];
  const teile = [`<rect class="karton" x="${-RAND + 1}" y="${-RAND + 1}"`
    + ` width="${mass - 2}" height="${mass - 2}" rx="5"/>`];

  // 1. Felder. Die Zielreihen sind eingefärbt — sonst weiß man nicht, wohin.
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      const [x, y] = zelleXY(r, c);
      const fuerA = stand.ziele[0] === r;
      const fuerB = stand.ziele[1] === r;
      const klasse = fuerA && fuerB ? ' zelle--beide' : fuerA ? ' zelle--ziel0' : fuerB ? ' zelle--ziel1' : '';
      teile.push(`<rect class="zelle${klasse}" x="${x}" y="${y}"`
        + ` width="${ZELLE}" height="${ZELLE}" rx="1.6"/>`);
    }
  }

  // 1b. Zielmarken am Rand. Die Tönung allein sagt nicht, *wessen* Reihe das
  // ist — die Marken in Spielerfarbe sagen es. Zielen beide auf dieselbe Reihe
  // (Wettlauf), steht links die eine und rechts die andere Farbe.
  const markeFuer = (r, seite) => {
    const beide = stand.ziele[0] === stand.ziele[1];
    if (beide) return seite === 'links' ? 0 : 1;
    return stand.ziele[0] === r ? 0 : 1;
  };
  for (const r of [...new Set(stand.ziele)]) {
    const [, y] = zelleXY(r, 0);
    for (const [seite, x] of [['links', -RAND + 1.4], ['rechts', mass - 2 * RAND + 1.2]]) {
      teile.push(`<rect class="zielmarke zielmarke--${markeFuer(r, seite)}" x="${x}" y="${y + 1.5}"`
        + ` width="1.6" height="${ZELLE - 3}" rx="0.8"/>`);
    }
  }

  // 2. Beim Mauern: alle erlaubten Fugen als kleine Punkte.
  if (meins && ui.werkzeug === 'mauern') {
    for (let r = 0; r < n - 1; r++) {
      for (let c = 0; c < n - 1; c++) {
        if (!mauerErlaubt(stand, r, c, ui.ausrichtung)) continue;
        const [cx, cy] = fugeMitte(r, c);
        const gewaehlt = ui.vorschau && ui.vorschau.r === r && ui.vorschau.c === c;
        if (!gewaehlt) teile.push(`<circle class="fugenpunkt" cx="${cx}" cy="${cy}" r="1.5"/>`);
        teile.push(`<circle class="tippfeld" cx="${cx}" cy="${cy}" r="4.6"`
          + ` data-fuge="${r},${c}"/>`);
      }
    }
  }

  // 3. Gesetzte Mauern, dann die Vorschau darüber.
  // Die neue Mauer blitzt einmal auf — aber wirklich nur einmal. Ohne die
  // Merkzeile unten liefe die Animation bei jedem Neuzeichnen wieder los, also
  // auch beim bloßen Umschalten zwischen Laufen und Mauern.
  const neueste = stand.letzteAktion?.art === 'gemauert' ? stand.letzteAktion : null;
  const marke = neueste ? `${neueste.r},${neueste.c},${neueste.a}` : null;
  const blitzen = marke && marke !== ui.geflasht;
  ui.geflasht = marke;
  for (const m of stand.mauern) {
    const q = mauerRechteck(m);
    const frisch = blitzen && neueste.r === m.r && neueste.c === m.c && neueste.a === m.a;
    teile.push(`<rect class="mauer${frisch ? ' mauer--neu' : ''}" x="${q.x}" y="${q.y}"`
      + ` width="${q.breite}" height="${q.hoehe}" rx="0.8"/>`);
  }
  if (ui.vorschau) {
    const q = mauerRechteck(ui.vorschau);
    teile.push(`<rect class="fuge fuge--gewaehlt" x="${q.x}" y="${q.y}"`
      + ` width="${q.breite}" height="${q.hoehe}" rx="0.8"/>`);
  }

  // 4. Figuren.
  stand.figuren.forEach((f, spieler) => {
    const [cx, cy] = zelleMitte(f.r, f.c);
    teile.push(`<circle class="figur figur--${spieler}" cx="${cx}" cy="${cy}" r="3.6"/>`);
  });

  // 5. Laufziele zuletzt, damit sie obenauf liegen.
  for (const z of laufziele) {
    const [cx, cy] = zelleMitte(z.r, z.c);
    teile.push(`<circle class="zielpunkt" cx="${cx}" cy="${cy}" r="2"/>`);
    teile.push(`<circle class="tippfeld" cx="${cx}" cy="${cy}" r="5" data-ziel="${z.r},${z.c}"/>`);
  }

  return `<svg class="brett" viewBox="${-RAND} ${-RAND} ${mass} ${mass}" role="img"
    aria-label="Spielbrett ${n} mal ${n} Felder">${teile.join('')}</svg>`;
}

/* ------------------------------------- Kopplung ohne Server: QR im selben WLAN */

/** Womit hängt dieses Handy gerade am Netz? Chrome kennt die Antwort. */
function netzArt() {
  const c = navigator.connection || navigator.mozConnection || {};
  if (c.type) return c.type === 'none' ? 'kein Netz' : c.type;
  return navigator.onLine ? 'verbunden' : 'kein Netz';
}

/** Was die Direktverbindung gerade weiß — in einer Zeile, für den Ernstfall. */
function lageText(l, ausfuehrlich) {
  if (!l) return '';
  const kamera = ui.kopplung?.kamera;
  const stumm = l.mdns && !l.eigene.length;
  const leer = !l.mdns && !l.eigene.length && l.sammeln === 'fertig';
  if (!ausfuehrlich && !stumm && !leer) return '';
  const teile = [];
  if (ausfuehrlich) {
    teile.push(`Eigene Adresse: ${l.eigene.length ? l.eigene.join('  ') : 'noch keine'}`,
      `Gegenseite: ${l.fremde}`, `Stand: ${l.stand}`,
      `Kamera: ${kamera === undefined ? '?' : (kamera ? 'frei' : 'abgelehnt')}`,
      `Netz: ${netzArt()}`);
  }
  if (stumm) {
    teile.push('Dieses Handy gibt seine WLAN-Adresse nicht heraus. Erlaube der Seite die '
      + 'Kamera (Schloss-Symbol neben der Adresse → Berechtigungen → Kamera) und koppelt neu.');
  }
  if (leer && kamera === false) {
    teile.push('Dieses Handy hat keine Netzwerkadresse gefunden — und die Kamera ist nicht '
      + 'freigegeben. Ohne sie gibt Chrome keine Adresse heraus. Erst freigeben, dann neu koppeln.');
  } else if (leer) {
    teile.push('Dieses Handy hat keine Netzwerkadresse gefunden, obwohl die Kamera frei ist. '
      + 'Chrome sieht hier also kein Netz. Läuft auf diesem Handy der Hotspot? Ein Handy, das '
      + 'selbst den Hotspot aufspannt, meldet Android oft gar kein Netz — dann kann es nicht '
      + 'mitspielen. Abhilfe: beide Handys in dasselbe WLAN einwählen. Gibt es keins, spielt '
      + 'an einem Handy und reicht es hin und her.');
  }
  return teile.join(' · ');
}

/** Zeigt den Kamera-Bildschirm und wartet, wie es weitergehen soll. */
function kameraFrage() {
  return new Promise((fertig) => {
    ui.kopplung.schritt = 'kamera';
    ui.kopplung.kameraAntwort = fertig;
    render();
  });
}

/** Hält die Technikzeile aktuell, solange gekoppelt wird. */
function lageTakten() {
  if (ui.lageTakt) clearInterval(ui.lageTakt);
  ui.lageTakt = setInterval(() => {
    if (!ui.kopplung || !ui.netz) { clearInterval(ui.lageTakt); ui.lageTakt = null; return; }
    const feld = document.getElementById('lage');
    if (feld) feld.textContent = lageText(ui.netz.lage, ui.kopplung.schritt === 'warten');
  }, 500);
}

/** Kopplung von vorn: alte Verbindung weg, gleiche Rolle noch einmal. */
function kopplungNeu() {
  const gastgeber = ui.kopplung?.gastgeber ?? true;
  ui.netz?.schliessen();
  ui.netz = null;
  funkStarten(gastgeber);
}

/**
 * Direktverbindung zwischen zwei Handys. Braucht keinen Server, dafür ein
 * gemeinsames WLAN — nach außen sieht sie aus wie die Durchreiche.
 */
async function funkStarten(gastgeber) {
  ui.modus = 'online';
  ui.gastgeber = gastgeber;
  ui.meinIndex = gastgeber ? 0 : 1;
  ui.kopplung = { schritt: 'moment', gastgeber, ueberQr: true, hinweis: '', fehler: '' };
  render();

  // Erst die Kamera-Erlaubnis, dann die Verbindung. Ohne sie gibt Chrome die eigene
  // Netzwerkadresse nicht heraus — das Handy findet dann gar keine oder nur einen
  // .local-Namen, den ein Hotspot nicht auflöst. Scannen müssen wir gleich ohnehin.
  let frei = await kameraFreigeben();
  while (!frei) {
    if (!ui.kopplung) return;
    const wahl = await kameraFrage();
    if (!ui.kopplung || wahl === 'abbruch') return;
    if (wahl === 'weiter') break;
    frei = await kameraFreigeben();
  }
  if (!ui.kopplung) return;
  ui.kopplung.kamera = frei;
  ui.kopplung.schritt = 'moment';
  render();

  ui.netz = funkAufbauen({
    gastgeber,
    aufZustand: (text, verbunden) => {
      if (verbunden) return verbindungSteht();
      if (ui.kopplung && ui.kopplung.schritt !== 'scannen') {
        ui.kopplung.hinweis = text;
        render();
      }
      return undefined;
    },
    aufNachricht: nachrichtVerarbeiten,
  });
  lageTakten();

  if (gastgeber) {
    ui.kopplung.code = await ui.netz.eigenerCode();
    ui.kopplung.schritt = 'zeigen';
  } else {
    ui.kopplung.schritt = 'scannen';
  }
  render();
}

async function fremdenCodeAnnehmen(code) {
  const k = ui.kopplung;
  try {
    await ui.netz.codeLesen(code);
    if (!ui.kopplung) return;
    if (!k.gastgeber) {
      ui.kopplung.code = await ui.netz.eigenerCode();
      ui.kopplung.schritt = 'zeigen';
    } else {
      ui.kopplung.schritt = 'warten';
    }
    k.fehler = '';
  } catch (fehler) {
    if (!ui.kopplung) return;
    k.fehler = fehler.message || 'Der Code passt nicht.';
  }
  render();
}

/* ---------------------------------------------------------- Der Spieltisch */

/** Was steht gerade an? Zwei Zeilen Klartext unter dem Brett. */
function ansage() {
  const dran = stand.dran;
  const meins = ichBinDran();
  const wer = meins && ui.modus === 'online' ? 'Du bist' : `${name(dran)} ist`;
  if (vorbei(stand)) return { eins: `${name(stand.fertig)} hat gewonnen.`, zwei: '' };

  if (!meins) {
    return { eins: `${name(dran)} überlegt.`, zwei: 'Laufen oder mauern — beides ist möglich.' };
  }
  if (ui.werkzeug === 'mauern') {
    if (ui.vorschau) {
      return { eins: 'Mauer hier?', zwei: 'Unten bestätigen — danach steht sie fest.', warnung: true };
    }
    if (mauernUebrig(stand, dran) <= 0) {
      return { eins: 'Keine Mauern mehr übrig.', zwei: 'Ab jetzt hilft nur noch laufen.', warnung: true };
    }
    return {
      eins: `Mauer setzen — noch ${mauernUebrig(stand, dran)}.`,
      zwei: 'Richtung wählen, dann einen Punkt antippen.',
    };
  }
  const rest = wegLaenge(stand, dran);
  return {
    eins: `${wer} dran.`,
    zwei: `Noch ${rest} ${rest === 1 ? 'Schritt' : 'Schritte'} bis ans andere Ende.`,
  };
}

function renderSpiel() {
  const a = ansage();
  const meins = ichBinDran() && !vorbei(stand);
  const kannMauern = meins && mauernUebrig(stand, stand.dran) > 0;

  app.innerHTML = `
    <div class="screen screen--spiel">

    ? `<span class="wer--${stand.fertig}">${name(stand.fertig)}</span> gewinnt`
    : `<span class="wer--${stand.dran}">${name(stand.dran)}</span> ist dran`}</h1>
        </div>
        <div class="werkzeuge">
          <button class="werkzeug" id="wRegeln" aria-label="Regeln">?</button>
          <button class="werkzeug" id="wMenue" aria-label="Menü">⋯</button>
        </div>
      </div>

          <span class="seite"><i class="v-1"></i>${name(1)}: <b class="num">${mauernUebrig(stand, 1)}</b> Mauern</span>
        </div>
        <div class="leiste">

            <div class="zeile2">${esc(a.zwei || '')}</div>
          </div>
        </div>
        ${meins ? modusleiste(kannMauern) : ''}

    </div>`;

  app.querySelector('#wRegeln').onclick = () => { ui.overlay = 'regeln'; render(); };
  app.querySelector('#wMenue').onclick = () => { ui.overlay = 'menue'; render(); };
  app.querySelector('#zuLaufen')?.addEventListener('click', () => {
    ui.werkzeug = 'laufen'; ui.vorschau = null; render();
  });
  app.querySelector('#zuMauern')?.addEventListener('click', () => {
    ui.werkzeug = 'mauern'; ui.vorschau = null; render();
  });
  app.querySelector('#quer')?.addEventListener('click', () => {
    ui.ausrichtung = 'waagerecht'; ui.vorschau = null; render();
  });
  app.querySelector('#laengs')?.addEventListener('click', () => {
    ui.ausrichtung = 'senkrecht'; ui.vorschau = null; render();
  });
  app.querySelector('#setzen')?.addEventListener('click', mauerBestaetigen);
  app.querySelector('#zurueck')?.addEventListener('click', () => { ui.vorschau = null; render(); });
  app.querySelectorAll('[data-ziel]').forEach((k) => {
    k.onclick = () => {
      const [r, c] = k.dataset.ziel.split(',').map(Number);
      zielTippen(r, c);
    };
  });
  app.querySelectorAll('[data-fuge]').forEach((k) => {
    k.onclick = () => {
      const [r, c] = k.dataset.fuge.split(',').map(Number);
      ui.vorschau = { r, c, a: ui.ausrichtung };
      buzz(8);
      render();
    };
  });
}

/** Die Knopfzeile unten — sie ändert sich mit dem Schritt, in dem man ist. */
function modusleiste(kannMauern) {
  if (ui.werkzeug === 'mauern' && ui.vorschau) {
    return `<div class="modusleiste">
      <button class="modusknopf modusknopf--an" id="setzen">Mauer setzen</button>
      <button class="modusknopf" id="zurueck">Doch nicht</button>
    </div>`;
  }
  if (ui.werkzeug === 'mauern') {
    return `<div class="modusleiste">
      <button class="modusknopf" id="zuLaufen">Doch laufen</button>
      <button class="modusknopf${ui.ausrichtung === 'waagerecht' ? ' modusknopf--an' : ''}"
        id="quer">▬ quer</button>
      <button class="modusknopf${ui.ausrichtung === 'senkrecht' ? ' modusknopf--an' : ''}"
        id="laengs">▮ längs</button>
    </div>`;
  }
  return `<div class="modusleiste">
    <button class="modusknopf modusknopf--an" id="zuLaufen">Laufen</button>
    <button class="modusknopf" id="zuMauern" ${kannMauern ? '' : 'disabled'}>Mauer bauen
      <span class="zahl">${mauernUebrig(stand, stand.dran)}</span></button>
  </div>`;
}

function zielTippen(r, c) {
  if (!ziehbar(stand, r, c)) return;
  const gewinnt = stand.ziele[stand.dran] === r;
  if (!tun('ziehen', { r, c })) { render(); return; }
  try { ziehen(stand, r, c); } catch { render(); return; }
  buzz(gewinnt ? [30, 60, 30, 60, 30] : 10);
  nachAenderung();
}

function mauerBestaetigen() {
  const v = ui.vorschau;
  if (!v) return;
  if (!tun('mauer', v)) { ui.vorschau = null; render(); return; }
  try { mauerSetzen(stand, v.r, v.c, v.a); } catch { ui.vorschau = null; render(); return; }
  buzz([15, 40]);
  ui.werkzeug = 'laufen';
  nachAenderung();
}

    <p>Unten schaltest du zwischen <b>Laufen</b> und <b>Mauer bauen</b> um. Beim Laufen
      erscheinen Punkte auf den erreichbaren Feldern. Beim Mauern wählst du erst die
      <b>Richtung</b> (quer oder längs), tippst dann einen Punkt zwischen den Feldern an —
      die Mauer erscheint als Vorschau — und bestätigst mit <b>Mauer setzen</b>. Die
      Bestätigung ist Absicht: eine gesetzte Mauer bleibt, wo sie ist.</p>

    <h3>Die Fassungen</h3>
    <ul>${MODI.map((m) => `<li><b>${esc(m.titel)}</b> — ${esc(m.zeile)}</li>`).join('')}</ul>

    <h3>Woher die Regeln kommen</h3>
    <p>Von <em>Quoridor</em> (Gigamic, Mirko Marchesi, 1997) — dasselbe Spiel, das online
      als <em>Barricade</em> läuft. Spielregeln sind frei, Name und Gestaltung nicht.
      Deshalb heißt es hier Mauern.</p>

    <div class="knopfsaeule"><button class="btn btn--filz" id="zu">Verstanden</button></div>`);
  l.querySelector('#zu').onclick = () => { ui.overlay = null; render(); };
}

function renderMenue() {
  const m = modusInfo();
  const l = overlayHuelle(`
    <h2>Menü</h2>
    <div class="tafel">
      <div class="seite seite--0"><div class="wer">${name(0)}</div>
        <div class="zahl num">${stand.siege[0]}</div></div>
      <div class="strichlein"></div>
      <div class="seite seite--1"><div class="wer">${name(1)}</div>
        <div class="zahl num">${stand.siege[1]}</div></div>
    </div>
    <p style="text-align:center"><b>${esc(m.titel)}</b> — ${esc(m.zeile)}<br>
      Noch ${wegLaenge(stand, 0)} zu ${wegLaenge(stand, 1)} Schritte.
      Mauern übrig: ${mauernUebrig(stand, 0)} zu ${mauernUebrig(stand, 1)}.</p>

    <div class="knopfsaeule">
      ${ui.modus === 'lokal'
    ? '<button class="btn btn--geist" id="zweiGeraete">Auf zwei Handys spielen</button>'
    : '<button class="btn btn--geist" id="trennen">Verbindung trennen</button>'}
      <button class="btn btn--geist" id="neuePartie">Neue Partie</button>
      <button class="btn btn--geist" id="andereFassung">Andere Fassung wählen</button>
      <button class="btn btn--geist" id="code">Punktestand sichern oder laden</button>
      <button class="btn btn--geist" id="sichern">Spiel als Datei sichern</button>
      <button class="btn btn--geist" id="nullen">Siege zurücksetzen</button>
      <button class="btn btn--leise" id="zu">Zurück</button>
    </div>
    <p class="lage" id="status">${esc(ui.codeStatus)}</p>`);

  l.querySelector('#zu').onclick = () => { ui.overlay = null; ui.codeStatus = ''; render(); };
  l.querySelector('#zweiGeraete')?.addEventListener('click', () => {
    ui.overlay = null;
    ui.kopplung = { schritt: 'rolle', gastgeber: true, code: '', fehler: '' };
    render();
  });
  l.querySelector('#trennen')?.addEventListener('click', () => { ui.overlay = null; kopplungAbbrechen(); });
  l.querySelector('#neuePartie').onclick = () => {
    ui.werkzeug = 'laufen';
    if (!tun('partieNeu')) { ui.overlay = null; render(); return; }
    partieNeu(stand);
    ui.overlay = null;
    nachAenderung();
  };
  l.querySelector('#andereFassung').onclick = () => {
    // Die Fassung bestimmt Brettgröße und Vorrat — das geht nur mit neuer Partie.
    ui.modusWahl = stand.modusId || 'klassisch';
    ui.overlay = null;
    stand = null;
    ui.screen = 'start';
    try { localStorage.removeItem(KEY); } catch { /* privater Modus */ }
    render();
  };
  l.querySelector('#code').onclick = () => { ui.overlay = 'code'; render(); };
  l.querySelector('#sichern').onclick = async (e) => {
    e.currentTarget.disabled = true;
    const wie = await seiteAlsDateiSichern('mauern-css', 'mauern-js', 'Mauern.html', 'Mauern');
    ui.codeStatus = SICHER_TEXT[wie].replace('%NAME%', 'Mauern.html');
    render();
  };
  l.querySelector('#nullen').onclick = () => {
    stand.siege = [0, 0];
    stand.partie = 1;
    ui.overlay = null;
    nachAenderung();
  };
}

function renderCode() {
  const l = overlayHuelle(`
    <h2>Punktestand mitnehmen</h2>
    <p>Der Code enthält Namen, Siege und die gewählte Fassung — sonst nichts. Auf einem
      anderen Handy einfügen, und ihr zählt dort weiter.</p>
    <div class="feldlabel">Dieser Stand</div>
    <textarea class="codefeld" id="raus" readonly>${esc(alsCode(stand))}</textarea>
    <button class="btn btn--geist" id="kopieren">Kopieren</button>
    <div class="feldlabel">Anderen Stand übernehmen</div>
    <textarea class="codefeld" id="rein" placeholder="MAU1-…"></textarea>
    <button class="btn btn--geist" id="uebernehmen">Diesen Stand übernehmen</button>
    <p class="lage" id="status">${esc(ui.codeStatus)}</p>
    <div class="knopfsaeule"><button class="btn btn--leise" id="zu">Zurück</button></div>`);

  l.querySelector('#kopieren').onclick = async (e) => {
    try { await navigator.clipboard.writeText(alsCode(stand)); e.currentTarget.textContent = 'Kopiert'; }
    catch { l.querySelector('#raus').select(); }
  };
  l.querySelector('#uebernehmen').onclick = () => {
    try {
      const neu = ausCode(l.querySelector('#rein').value);
      neu.modusId = stand.modusId;
      stand = neu;
      ui.overlay = null;
      ui.screen = 'spiel';
      ui.codeStatus = '';
      nachAenderung();
    } catch (fehler) {
      ui.codeStatus = fehler.message;
      render();
    }
  };
  l.querySelector('#zu').onclick = () => { ui.overlay = 'menue'; ui.codeStatus = ''; render(); };
}

/* ----------------------------------------------------------------- Render */

function render() {
  const k = ui.kopplung;
  if (k && k.scannerStoppen && k.schritt !== 'scannen') { k.scannerStoppen(); k.scannerStoppen = null; }

  if (!stand) renderStart();
  else if (ui.kopplung) renderKopplung();
  else renderSpiel();

  if (ui.overlay === 'regeln') { renderRegeln(); return; }
  if (!stand || ui.kopplung) return;

  if (ui.overlay === 'menue') renderMenue();
  else if (ui.overlay === 'code') renderCode();
  else if (vorbei(stand)) renderJubel();
}

stand = laden();
if (stand) ui.screen = 'spiel';
render();

})();
</script>
</body>
</html>
