<style id="dreikampf-css">
/* Dreikampf — „Wiener Abend“: tiefes Aubergine als Grund, die drei Disziplinen
   als Karten in Juwelenfarben. Bewusst einthemig, alles explizit gefärbt. */

:root {
  --ground: #17111c;
  --ground-2: #0e0a12;
  --panel: #221a29;
  --panel-2: #2b2134;
  --hairline: #3b2d46;
  --fog: #b1a2bd;
  --fog-dim: #7a6a87;
  --paper: #f2edea;
  --gold: #e2b459;
  --gold-dim: #8e6f2e;

  --wissen: #0e6f77;
  --wissen-hell: #14929c;
  --wahrheit: #a83a5c;
  --wahrheit-hell: #c94f74;
  --wagnis: #cf8f1a;
  --wagnis-hell: #eaa92c;

  --gut: #3fa46a;
  --schlecht: #cf5a4e;

  --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
  --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-num: ui-monospace, SFMono-Regular, 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace;

  --r-md: 14px;
  --r-lg: 22px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: none; }

body {
  background: var(--ground);
  background-image:
    radial-gradient(130% 60% at 50% -8%, #2c1f36 0%, rgba(44, 31, 54, 0) 62%),
    linear-gradient(180deg, var(--ground) 0%, var(--ground-2) 100%);
  background-attachment: fixed;
  color: var(--fog);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
}

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* ---------- Gerüst ---------- */

#app { min-height: 100dvh; display: flex; flex-direction: column; }
.screen { flex: 1; display: flex; flex-direction: column; min-height: 100dvh; }
/* Flex-Spalte, damit die Bühne den Rest füllt und die Karte mittig sitzt. */
.scroll {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  display: flex; flex-direction: column;
}
.wrap { width: 100%; max-width: 560px; margin-inline: auto; padding: 0 18px; }

.kopf {
  display: flex; align-items: center; gap: 12px;
  padding: calc(var(--safe-t) + 12px) 18px 12px;
  border-bottom: 1px solid var(--hairline);
}
.kopf .titel { flex: 1; min-width: 0; }
.kopf .ober {
  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--fog-dim); font-weight: 700;
}
.kopf h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: 25px; letter-spacing: -0.01em; color: var(--paper);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.werkzeuge { display: flex; gap: 7px; }
.werkzeug {
  width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
  background: var(--panel); border: 1px solid var(--hairline); color: var(--fog); font-size: 15px;
}

/* ---------- Knöpfe ---------- */

.btn {
  display: flex; align-items: center; justify-content: center; gap: 9px;
  width: 100%; padding: 16px 18px; border-radius: var(--r-md);
  font-weight: 650; font-size: 16px; letter-spacing: -0.01em;
  transition: transform 0.1s ease, filter 0.15s ease;
}
.btn:active { transform: scale(0.985); }
.btn:disabled { opacity: 0.3; transform: none; box-shadow: none; filter: saturate(0.5); }
.btn--gold { background: var(--gold); color: #2a1c02; box-shadow: 0 8px 26px rgba(226, 180, 89, 0.18); }
.btn--hell { background: var(--paper); color: #1d1524; }
.btn--geist { background: var(--panel); color: var(--paper); border: 1px solid var(--hairline); }
.btn--leise { background: none; color: var(--fog-dim); font-weight: 500; font-size: 15px; padding: 13px; }
.btn--ja { background: var(--gut); color: #05210f; }
.btn--nein { background: var(--panel); color: #eda79d; border: 1px solid #4c2f2c; }
.reihe { display: flex; gap: 10px; }
.reihe .btn { width: auto; flex: 1; }

/* ---------- Startbildschirm ---------- */

.start { justify-content: center; text-align: center; padding: 30px 20px calc(28px + var(--safe-b)); gap: 0; }
.wortmarke {
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(38px, 12vw, 58px); line-height: 1.02; margin: 0;
  color: var(--paper); letter-spacing: -0.02em;
}
.wortmarke em { font-style: italic; color: var(--gold); }
.dreiwort {
  display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
  margin: 14px 0 26px; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 700;
}
.dreiwort span:nth-child(1) { color: var(--wissen-hell); }
.dreiwort span:nth-child(2) { color: var(--wahrheit-hell); }
.dreiwort span:nth-child(3) { color: var(--wagnis-hell); }
.dreiwort i { color: var(--fog-dim); font-style: normal; }

.feldreihe { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.feld {
  flex: 1; background: var(--panel); border: 1px solid var(--hairline);
  border-radius: var(--r-md); padding: 14px; color: var(--paper); font-size: 16px;
  user-select: text; -webkit-user-select: text; width: 100%;
}
.feld::placeholder { color: var(--fog-dim); }
.feldlabel {
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--fog-dim); font-weight: 700; text-align: left; margin: 18px 0 7px;
}

/* ---------- Punktetafel ---------- */

.tafel {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  gap: 10px; margin: 20px 0 8px;
  background: var(--panel); border: 1px solid var(--hairline);
  border-radius: var(--r-lg); padding: 20px 14px;
}
.tafel .seite { text-align: center; min-width: 0; }
.tafel .name {
  font-size: 14px; line-height: 20px; height: 20px; color: var(--fog);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px;
}
.tafel .zahl {
  font-family: var(--font-num); font-size: clamp(34px, 11vw, 46px);
  font-weight: 700; line-height: 1; color: var(--paper); letter-spacing: -0.03em;
}
.tafel .seite--vorn .zahl { color: var(--gold); }
.tafel .seite--vorn .name::before { content: "♛ "; color: var(--gold); font-size: 12px; }
.tafel .gegen { font-family: var(--font-display); font-size: 15px; color: var(--fog-dim); font-style: italic; }
.tafel .dranmarke {
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--gold); font-weight: 700; margin-top: 4px; min-height: 14px;
}

.abstand { text-align: center; font-size: 13px; color: var(--fog-dim); margin-bottom: 20px; }

/* ---------- Disziplin-Karten ---------- */

.disziplinen { display: flex; flex-direction: column; gap: 12px; }

.dis {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 14px;
  width: 100%; text-align: left;
  padding: 18px 18px; border-radius: var(--r-lg);
  color: #fff; background: var(--c);
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.35);
  transition: transform 0.12s ease;
}
.dis:active { transform: scale(0.985); }
.dis--wissen { --c: var(--wissen); }
.dis--wahrheit { --c: var(--wahrheit); }
.dis--wagnis { --c: var(--wagnis); color: #2a1c02; }
.dis .zahl {
  font-family: var(--font-num); font-size: 24px; font-weight: 700;
  width: 62px; flex: none; text-align: center; opacity: 0.92;
}
.dis .txt { flex: 1; min-width: 0; }
.dis .txt b { display: block; font-family: var(--font-display); font-size: 21px; font-weight: 400; letter-spacing: 0.01em; }
.dis .txt small { display: block; font-size: 12.5px; opacity: 0.82; line-height: 1.35; }
.dis .rest { font-family: var(--font-num); font-size: 11px; opacity: 0.7; }

/* ---------- Die Frage-Karte ---------- */

.buehne { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 18px; gap: 14px; }

.karte {
  border-radius: var(--r-lg);
  background: var(--c); color: var(--ct);
  padding: 24px 22px 22px;
  box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
  animation: geben 0.4s cubic-bezier(0.2, 0.8, 0.25, 1) both;
}
.karte--wissen { --c: var(--wissen); --ct: #fff; }
.karte--wahrheit { --c: var(--wahrheit); --ct: #fff; }
.karte--wagnis { --c: var(--wagnis); --ct: #2a1c02; }
@keyframes geben {
  from { opacity: 0; transform: translateY(24px) rotateY(-10deg) scale(0.95); }
}

.karte .marke {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase;
  font-weight: 700; opacity: 0.78; margin-bottom: 14px;
}
.karte .marke .pille {
  padding: 3px 9px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.2); letter-spacing: 0.1em;
}
.karte--wagnis .marke .pille { background: rgba(42, 28, 2, 0.16); }
.karte .frage {
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(21px, 5.6vw, 28px); line-height: 1.32;
  text-wrap: balance; margin: 0;
}

.optionen { display: flex; flex-direction: column; gap: 9px; margin-top: 18px; }
.opt {
  display: flex; align-items: center; gap: 12px;
  width: 100%; text-align: left; padding: 13px 15px;
  border-radius: 12px; font-size: 15.5px; line-height: 1.3;
  background: rgba(255, 255, 255, 0.14); color: inherit;
  border: 1.5px solid rgba(255, 255, 255, 0.2);
}
.karte--wagnis .opt { background: rgba(42, 28, 2, 0.1); border-color: rgba(42, 28, 2, 0.2); }
.opt .buchstabe {
  width: 25px; height: 25px; flex: none; border-radius: 7px;
  display: grid; place-items: center;
  font-family: var(--font-num); font-size: 12px; font-weight: 700;
  background: rgba(255, 255, 255, 0.22);
}
.opt--gewaehlt { background: rgba(255, 255, 255, 0.95); color: #1d1524; border-color: #fff; }
.opt--gewaehlt .buchstabe { background: rgba(0, 0, 0, 0.12); }
.opt--richtig { background: var(--gut); border-color: var(--gut); color: #fff; }
.opt--richtig .buchstabe { background: rgba(0, 0, 0, 0.2); }
.opt--falsch { background: rgba(0, 0, 0, 0.28); border-color: rgba(0, 0, 0, 0.3); color: rgba(255, 255, 255, 0.72); }
.opt .wer {
  margin-left: auto; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
  font-weight: 700; opacity: 0.85; text-align: right; flex: none;
}

.anweisung {
  text-align: center; font-size: 14.5px; color: var(--fog);
  padding: 0 4px; text-wrap: balance;
}
.anweisung b { color: var(--paper); font-weight: 650; }

.fuss {
  padding: 12px 18px calc(14px + var(--safe-b));
  border-top: 1px solid var(--hairline);
  display: flex; flex-direction: column; gap: 9px;
  background: rgba(14, 10, 18, 0.86); backdrop-filter: blur(8px);
}

/* ---------- Ergebnis ---------- */

.bilanz { display: flex; flex-direction: column; gap: 10px; margin: 16px 0 4px; }
.bilanzzeile {
  display: flex; align-items: center; gap: 12px;
  background: var(--panel); border: 1px solid var(--hairline);
  border-radius: var(--r-md); padding: 13px 15px;
}
.bilanzzeile .wer { flex: 1; color: var(--paper); font-weight: 600; min-width: 0; }
.bilanzzeile .was { font-size: 13px; color: var(--fog-dim); }
.bilanzzeile .pkt { font-family: var(--font-num); font-weight: 700; font-size: 18px; flex: none; }
.pkt--plus { color: var(--gut); }
.pkt--null { color: var(--fog-dim); }
.pkt--minus { color: var(--schlecht); }

/* ---------- Verlauf ---------- */

.verlauf { display: flex; flex-direction: column; gap: 7px; }
.eintrag {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--hairline);
}
.eintrag .marker { width: 4px; align-self: stretch; border-radius: 3px; flex: none; }
.eintrag--wissen .marker { background: var(--wissen-hell); }
.eintrag--wahrheit .marker { background: var(--wahrheit-hell); }
.eintrag--wagnis .marker { background: var(--wagnis-hell); }
.eintrag .txt { flex: 1; min-width: 0; }
.eintrag .txt b { display: block; font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--fog-dim); }
.eintrag .txt span {
  display: block; font-size: 13.5px; color: var(--fog);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.eintrag .delta { font-family: var(--font-num); font-size: 12.5px; flex: none; text-align: right; line-height: 1.3; }

/* ---------- Overlays ---------- */

.overlay {
  position: fixed; inset: 0; z-index: 50;
  background: var(--ground-2);
  display: flex; flex-direction: column;
  animation: einblenden 0.18s ease-out;
}
@keyframes einblenden { from { opacity: 0; } }

.uebergabe {
  justify-content: center; align-items: center; text-align: center;
  padding: 26px calc(24px + var(--safe-b));
  background-image: radial-gradient(90% 50% at 50% 40%, #2c1f36 0%, rgba(44, 31, 54, 0) 70%);
}
.uebergabe .pfeil { font-size: 40px; animation: schubs 1.5s ease-in-out infinite; }
@keyframes schubs { 50% { transform: translateX(10px); } }
.uebergabe .lbl { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fog-dim); font-weight: 700; margin-top: 4px; }
.uebergabe .name {
  font-family: var(--font-display); font-size: clamp(30px, 9vw, 42px);
  color: var(--paper); line-height: 1.1; margin: 4px 0 6px;
}
.uebergabe .auftrag { color: var(--fog); margin: 0 0 26px; max-width: 30ch; }
.uebergabe .btn { max-width: 340px; }

.blatt { padding: calc(var(--safe-t) + 16px) 18px calc(18px + var(--safe-b)); width: 100%; max-width: 560px; margin-inline: auto; }
.blatt h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; color: var(--paper); margin: 0 0 6px; }
.blatt h3 {
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--gold-dim); font-weight: 700; margin: 24px 0 8px;
}
.blatt p, .blatt li { font-size: 15px; line-height: 1.6; color: var(--fog); }
.blatt p { margin: 0 0 10px; }
.blatt ul { margin: 0 0 10px; padding-left: 20px; }
.blatt li { margin-bottom: 6px; }
.blatt strong { color: var(--paper); font-weight: 650; }
.lesbar { user-select: text; -webkit-user-select: text; }

.wahlreihe { display: flex; flex-direction: column; gap: 8px; }
.wahl {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 13px 15px; border-radius: var(--r-md);
  background: var(--panel); border: 1px solid var(--hairline); color: var(--fog);
}
.wahl b { display: block; color: var(--paper); font-size: 15px; }
.wahl small { display: block; font-size: 12.5px; color: var(--fog-dim); }
.wahl--an { border-color: var(--gold); background: var(--panel-2); }
.wahl--an::after { content: "✓"; margin-left: auto; color: var(--gold); font-weight: 700; }

.code {
  width: 100%; min-height: 116px; resize: vertical;
  background: var(--panel); border: 1px solid var(--hairline); border-radius: 12px;
  padding: 12px; color: var(--fog); font-family: var(--font-num); font-size: 11px;
  word-break: break-all; user-select: text; -webkit-user-select: text;
}

.statz { display: grid; grid-template-columns: 1fr auto auto; gap: 8px 14px; align-items: baseline; }
.statz .k { font-size: 13.5px; color: var(--fog); }
.statz .v { font-family: var(--font-num); font-size: 14px; color: var(--paper); text-align: right; min-width: 34px; }

// Dreikampf — Spiellogik ohne DOM. Alles serialisierbar.


const STAPEL = { wissen: WISSEN, wahrheit: WAHRHEIT, wagnis: WAGNIS };

const TYPEN = ['wissen', 'wahrheit', 'wagnis'];

const TYP_INFO = {
  wissen:   { titel: 'Wissen',   unter: 'Beide antworten — Richtige punkten' },
  wahrheit: { titel: 'Wahrheit', unter: 'Beide antworten, der andere bewertet' },
  wagnis:   { titel: 'Wagnis',   unter: 'Einer macht es, der andere entscheidet' },
};

const PUNKTE = {
  wissenRichtig: 10,     // richtige Antwort
  wissenAllein: 5,       // Bonus, wenn nur einer richtig lag
  wahrheitEhrlich: 20,   // ehrlich geantwortet, vom anderen bestätigt
  wagnisGemacht: 40,     // Mutprobe durchgezogen und anerkannt
  wagnisVerweigert: -15, // gekniffen
};

const ORTE = {
  egal:  { titel: 'Egal',      unter: 'Alle Mutproben' },
  flug:  { titel: 'Unterwegs', unter: 'Flieger, Bahn, Flughafen' },
  stadt: { titel: 'In Wien',   unter: 'Draußen unter Leuten' },
  abend: { titel: 'Abends',    unter: 'Bar, Restaurant, spät' },
};

const SAVE_VERSION = 1;

function neuerStand(namen = ['Monty', 'Christina'], reise = 'Wien') {
  return {
    v: SAVE_VERSION,
    reise,
    spieler: namen.map((name) => ({ name })),
    punkte: namen.map(() => 0),
    dran: 0,
    runde: 1,
    ort: 'egal',
    benutzt: { wissen: [], wahrheit: [], wagnis: [] },
    verlauf: [],
    statistik: {
      wissenRichtig: [0, 0],
      wahrheitEhrlich: [0, 0],
      wagnisGemacht: [0, 0],
      wagnisVerweigert: [0, 0],
    },
    aktuell: null,
  };
}

const gegner = (i) => (i === 0 ? 1 : 0);

/* ------------------------------------------------------------ Karten ziehen */

function mischen(liste, rnd) {
  const a = liste.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/** Karten des Stapels, die zum aktuellen Ort passen (nur für Wagnis relevant). */
function passend(typ, ort) {
  if (typ !== 'wagnis' || ort === 'egal') return STAPEL[typ];
  return STAPEL.wagnis.filter((k) => k.ort === ort || k.ort === 'überall');
}

/**
 * Zieht eine ungenutzte Karte. Ist der Stapel durch, wird er zurückgesetzt —
 * lieber Wiederholung als „keine Karten mehr“ mitten im Urlaub.
 */
function ziehen(stand, typ, rnd = Math.random) {
  const auswahl = passend(typ, stand.ort);
  let frei = auswahl.filter((k) => !stand.benutzt[typ].includes(k.id));
  if (frei.length === 0) {
    stand.benutzt[typ] = stand.benutzt[typ].filter(
      (id) => !auswahl.some((k) => k.id === id),
    );
    frei = auswahl;
  }
  const karte = frei[Math.floor(rnd() * frei.length)];
  stand.benutzt[typ].push(karte.id);
  return karte;
}

/** Wissenskarte für die Anzeige: Optionen gemischt, richtige Position gemerkt. */
function aufbereiten(karte, rnd = Math.random) {
  const richtigeAntwort = karte.o[0];
  const optionen = mischen(karte.o, rnd);
  return {
    id: karte.id,
    cat: karte.cat,
    q: karte.q,
    optionen,
    richtig: optionen.indexOf(richtigeAntwort),
  };
}

/* ----------------------------------------------------------------- Runde */

function neueRunde(stand, typ, rnd = Math.random) {
  const roh = ziehen(stand, typ, rnd);
  const ich = stand.dran;
  const du = gegner(ich);

  const runde = {
    typ,
    wer: ich,
    antworten: [null, null],
    urteile: [null, null],   // urteile[i] = Urteil ÜBER Spieler i
    gemacht: null,
    i: 0,
  };

  if (typ === 'wissen') {
    runde.karte = aufbereiten(roh, rnd);
    runde.schritte = [
      { art: 'antwort', p: ich },
      { art: 'antwort', p: du },
      { art: 'auflösung' },
    ];
  } else if (typ === 'wahrheit') {
    runde.karte = { id: roh.id, q: roh.q, tiefe: roh.tiefe, thema: roh.thema };
    runde.schritte = [
      { art: 'reden' },
      { art: 'urteil', p: ich, ueber: du },
      { art: 'urteil', p: du, ueber: ich },
      { art: 'auflösung' },
    ];
  } else {
    runde.karte = { id: roh.id, q: roh.q, ort: roh.ort };
    runde.schritte = [
      { art: 'ausführen', p: ich },
      { art: 'urteil', p: du, ueber: ich },
      { art: 'auflösung' },
    ];
  }

  stand.aktuell = runde;
  return stand;
}

function schritt(stand) {
  const r = stand.aktuell;
  return r ? r.schritte[r.i] : null;
}

/** Antwort auf eine Wissensfrage abgeben. */
function antworten(stand, optionIndex) {
  const r = stand.aktuell;
  const s = schritt(stand);
  if (!r || !s || s.art !== 'antwort') return stand;
  r.antworten[s.p] = optionIndex;
  r.i += 1;
  return stand;
}

/** Urteil abgeben: bei Wahrheit „ehrlich?“, bei Wagnis „gemacht?“. */
function bewerten(stand, ja) {
  const r = stand.aktuell;
  const s = schritt(stand);
  if (!r || !s || s.art !== 'urteil') return stand;
  if (r.typ === 'wagnis') r.gemacht = !!ja;
  else r.urteile[s.ueber] = !!ja;
  r.i += 1;
  return stand;
}

/** Schritte ohne Eingabe („beide antworten jetzt mündlich“) abhaken. */
function weiter(stand) {
  const r = stand.aktuell;
  const s = schritt(stand);
  if (!r || !s) return stand;
  if (s.art === 'reden' || s.art === 'ausführen') r.i += 1;
  return stand;
}

/** Punkte der laufenden Runde — reine Rechnung, ändert nichts. */
function ergebnis(runde) {
  const deltas = [0, 0];
  const zeilen = [];

  if (runde.typ === 'wissen') {
    const richtig = [0, 1].map((i) => runde.antworten[i] === runde.karte.richtig);
    const allein = richtig[0] !== richtig[1];
    for (const i of [0, 1]) {
      if (!richtig[i]) { zeilen.push({ p: i, text: 'daneben', punkte: 0 }); continue; }
      const p = PUNKTE.wissenRichtig + (allein ? PUNKTE.wissenAllein : 0);
      deltas[i] = p;
      zeilen.push({ p: i, text: allein ? 'als Einzige richtig' : 'richtig', punkte: p });
    }
  } else if (runde.typ === 'wahrheit') {
    for (const i of [0, 1]) {
      const ehrlich = runde.urteile[i] === true;
      const p = ehrlich ? PUNKTE.wahrheitEhrlich : 0;
      deltas[i] = p;
      zeilen.push({ p: i, text: ehrlich ? 'ehrlich geantwortet' : 'ausgewichen', punkte: p });
    }
  } else {
    const p = runde.gemacht ? PUNKTE.wagnisGemacht : PUNKTE.wagnisVerweigert;
    deltas[runde.wer] = p;
    zeilen.push({
      p: runde.wer,
      text: runde.gemacht ? 'Mutprobe bestanden' : 'gekniffen',
      punkte: p,
    });
  }

  return { deltas, zeilen };
}

function rundeFertig(stand) {
  const s = schritt(stand);
  return !!s && s.art === 'auflösung';
}

/** Punkte gutschreiben, Runde in den Verlauf legen, Zug wechseln. */
function rundeAbschliessen(stand) {
  const r = stand.aktuell;
  if (!r) return stand;
  const { deltas, zeilen } = ergebnis(r);

  for (const i of [0, 1]) stand.punkte[i] += deltas[i];

  const st = stand.statistik;
  if (r.typ === 'wissen') {
    for (const i of [0, 1]) if (r.antworten[i] === r.karte.richtig) st.wissenRichtig[i] += 1;
  } else if (r.typ === 'wahrheit') {
    for (const i of [0, 1]) if (r.urteile[i] === true) st.wahrheitEhrlich[i] += 1;
  } else if (r.gemacht) {
    st.wagnisGemacht[r.wer] += 1;
  } else {
    st.wagnisVerweigert[r.wer] += 1;
  }

  stand.verlauf.unshift({
    runde: stand.runde,
    typ: r.typ,
    wer: r.wer,
    frage: r.karte.q,
    deltas,
    zeilen,
  });
  if (stand.verlauf.length > 200) stand.verlauf.length = 200;

  stand.runde += 1;
  stand.dran = gegner(stand.dran);
  stand.aktuell = null;
  return stand;
}

/** Laufende Runde verwerfen, ohne Punkte und ohne Zugwechsel. */
function rundeAbbrechen(stand) {
  stand.aktuell = null;
  return stand;
}

/* -------------------------------------------------------------- Auswertung */

function fuehrung(stand) {
  const [a, b] = stand.punkte;
  if (a === b) return { gleich: true, vorne: null, abstand: 0 };
  const vorne = a > b ? 0 : 1;
  return { gleich: false, vorne, abstand: Math.abs(a - b) };
}

function stapelRest(stand, typ) {
  const auswahl = passend(typ, stand.ort);
  const offen = auswahl.filter((k) => !stand.benutzt[typ].includes(k.id)).length;
  return { offen, gesamt: auswahl.length };
}

/* ------------------------------------------------ Sichern & Wiederherstellen */

/** Punktestand als Text, der sich kopieren und woanders einfügen lässt. */
function alsCode(stand) {
  const json = JSON.stringify(stand);
  const bytes = new TextEncoder().encode(json);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}

function ausCode(code) {
  try {
    const bin = atob(String(code).trim());
    const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
    const stand = JSON.parse(new TextDecoder().decode(bytes));
    if (stand && stand.v === SAVE_VERSION && Array.isArray(stand.punkte)) return stand;
  } catch { /* unbrauchbarer Code */ }
  return null;
}

/** Baut aus <style> und <script> der laufenden Seite wieder ein vollständiges Dokument. */
function seitenQuelltext(cssId, jsId, ersatzTitel) {
  const css = document.getElementById(cssId)?.textContent || '';
  const js = document.getElementById(jsId)?.textContent || '';
  if (!css || !js) return null;
  const kopf = typeof SEITENKOPF === 'string'
    ? SEITENKOPF
    : `<meta charset="utf-8"><title>${ersatzTitel}</title>`;
  return [
    '<!doctype html>', '<html lang="de">', '<head>',
    kopf,
    `<style id="${cssId}">`, css, '</style>', '</head>', '<body>',
    '<div id="app"></div>',
    `<script id="${jsId}">`, js, '<' + '/script>',
    '</body>', '</html>', ''
  ].join('\n');
}

function browserDownload(dateiname, html) {
  const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = dateiname;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

/**
 * Speichert die laufende Seite als eigenständige HTML-Datei.
 * In der Claude-App läuft das über deren Speichern-Dialog (landet dann im
 * normalen Download-Ordner des Handys), sonst über einen Browser-Download.
 * Rückgabe: 'ok' | 'txt' | 'abgelehnt' | 'dev'
 */
async function seiteAlsDateiSichern(cssId, jsId, dateiname, ersatzTitel) {
  const html = seitenQuelltext(cssId, jsId, ersatzTitel);
  if (!html) return 'dev';

  const dl = typeof window !== 'undefined' && window.claude ? window.claude.downloads : null;
  if (dl) {
    try {
      await dl.save({ filename: dateiname, data: html });
      return 'ok';
    } catch (fehler) {
      const code = fehler && fehler.code;
      if (code === 'declined') return 'abgelehnt';
      // Manche Ansichten erlauben kein .html — dann eben als Textdatei zum Umbenennen.
      if (code === 'rejected_extension' || code === 'extension_not_enabled') {
        try {
          await dl.save({ filename: dateiname.replace(/\.html$/, '') + '.txt', data: html });
          return 'txt';
        } catch (zweiterFehler) {
          if (zweiterFehler && zweiterFehler.code === 'declined') return 'abgelehnt';
        }
      }
      // alles andere: normaler Browser-Download als Rückfallebene
    }
  }
  browserDownload(dateiname, html);
  return 'ok';
}

/**
 * Gibt die Spieldatei an das Teilen-Menü des Handys weiter — damit landet sie
 * per Nearby Share, WhatsApp oder Bluetooth direkt auf dem zweiten Gerät.
 * Rückgabe: 'ok' | 'abgelehnt' | 'geht-nicht' | 'dev'
 */
async function spielTeilen(cssId, jsId, dateiname, titel) {
  const html = seitenQuelltext(cssId, jsId, titel);
  if (!html) return 'dev';
  try {
    const datei = new File([html], dateiname, { type: 'text/html' });
    if (navigator.canShare && navigator.canShare({ files: [datei] })) {
      await navigator.share({ files: [datei], title: titel });
      return 'ok';
    }
  } catch (fehler) {
    if (fehler && fehler.name === 'AbortError') return 'abgelehnt';
  }
  return 'geht-nicht';
}

/* --------------------------------------------------------------- Die Runde */

function renderRunde() {
  const r = stand.aktuell;
  const s = schritt(stand);
  if (!r || !s) { ui.screen = 'hub'; return render(); }

  const koerper = s.art === 'auflösung' ? aufloesung(r) : karteAnsicht(r, s);

  app.innerHTML = `
    <div class="screen">
      <header class="kopf">
        <div class="titel">
          <div class="ober">Runde ${stand.runde} · ${TYP_INFO[r.typ].titel}</div>
          <h1>${kopfzeile(r, s)}</h1>
        </div>
        <div class="werkzeuge"><button class="werkzeug" id="btnAbbruch" aria-label="Runde abbrechen">✕</button></div>
      </header>
      <div class="scroll"><div class="buehne">${koerper.inhalt}</div></div>
      <div class="fuss">
        ${koerper.anweisung ? `<p class="anweisung">${koerper.anweisung}</p>` : ''}
        ${koerper.knoepfe}
      </div>
    </div>`;

  app.querySelector('#btnAbbruch').onclick = () => {
    rundeAbbrechen(stand);
    ui.screen = 'hub';
    nachAenderung();
  };
  koerper.binden?.();
}

function kopfzeile(r, s) {
  if (s.art === 'auflösung') return 'Auswertung';
  if (s.art === 'antwort') return `${name(s.p)} antwortet`;
  if (s.art === 'urteil') return `${name(s.p)} entscheidet`;
  if (s.art === 'ausführen') return `${name(r.wer)} ist dran`;
  return 'Beide antworten';
}

function karteAnsicht(r, s) {
  const k = r.karte;

  if (r.typ === 'wissen') {
    const gewaehlt = r.antworten[s.p];
    const optionen = k.optionen.map((o, i) => `
      <button class="opt ${gewaehlt === i ? 'opt--gewaehlt' : ''}" data-opt="${i}">
        <span class="buchstabe">${'ABCD'[i]}</span><span>${esc(o)}</span>
      </button>`).join('');

    return {
      inhalt: `<div class="karte karte--wissen">
        <div class="marke"><span class="pille">${esc(k.cat)}</span></div>
        <p class="frage">${esc(k.q)}</p>
        <div class="optionen">${optionen}</div>
      </div>`,
      anweisung: gewaehlt === null
        ? `<b>${name(s.p)}</b>, tipp deine Antwort an. Die andere Person sieht sie nicht.`
        : 'Antwort steht — abgeben, ohne dass jemand mitliest.',
      knoepfe: `<button class="btn btn--gold" id="btnAbgeben" ${gewaehlt === null ? 'disabled' : ''}>
        Antwort abgeben</button>`,
      binden() {
        app.querySelectorAll('[data-opt]').forEach((b) => {
          b.onclick = () => {
            r.antworten[s.p] = Number(b.dataset.opt);
            buzz(8);
            nachAenderung();
          };
        });
        app.querySelector('#btnAbgeben').onclick = () => {
          antworten(stand, r.antworten[s.p]);
          nachAenderung();
        };
      },
    };
  }

  if (r.typ === 'wahrheit') {
    const tiefeText = { leicht: 'Zum Warmwerden', ehrlich: 'Ehrlich jetzt', tief: 'Tief' };
    const karte = `<div class="karte karte--wahrheit">
      <div class="marke">
        <span class="pille">${esc(k.thema)}</span><span>${tiefeText[k.tiefe] || ''}</span>
      </div>
      <p class="frage">${esc(k.q)}</p>
    </div>`;

    if (s.art === 'reden') {
      return {
        inhalt: karte,
        anweisung: `Beide antworten — laut und nacheinander. <b>${name(r.wer)}</b> fängt an.`,
        knoepfe: `<button class="btn btn--gold" id="btnFertig">Beide haben geantwortet</button>`,
        binden() { app.querySelector('#btnFertig').onclick = () => { weiter(stand); nachAenderung(); }; },
      };
    }

    return {
      inhalt: karte,
      anweisung: `<b>${name(s.p)}</b>: War die Antwort von <b>${name(s.ueber)}</b> ehrlich?`,
      knoepfe: `<div class="reihe">
        <button class="btn btn--nein" id="btnNein">Ausgewichen</button>
        <button class="btn btn--ja" id="btnJa">Ehrlich · ${vz(PUNKTE.wahrheitEhrlich)}</button>
      </div>`,
      binden() {
        app.querySelector('#btnJa').onclick = () => { bewerten(stand, true); buzz(12); nachAenderung(); };
        app.querySelector('#btnNein').onclick = () => { bewerten(stand, false); nachAenderung(); };
      },
    };
  }

  // Wagnis
  const karte = `<div class="karte karte--wagnis">
    <div class="marke"><span class="pille">${esc(ORTE[k.ort]?.titel || 'Überall')}</span><span>Mutprobe</span></div>
    <p class="frage">${esc(k.q)}</p>
  </div>`;

  if (s.art === 'ausführen') {
    return {
      inhalt: karte,
      anweisung: `<b>${name(r.wer)}</b>, das ist deins. ${name(andere(r.wer))} entscheidet danach, ob es zählt.`,
      knoepfe: `<div class="reihe">
        <button class="btn btn--nein" id="btnKneifen">Kneifen · ${PUNKTE.wagnisVerweigert}</button>
        <button class="btn btn--gold" id="btnErledigt">Erledigt</button>
      </div>`,
      binden() {
        app.querySelector('#btnErledigt').onclick = () => { weiter(stand); nachAenderung(); };
        app.querySelector('#btnKneifen').onclick = () => {
          r.gemacht = false;
          r.i = r.schritte.length - 1;
          nachAenderung();
        };
      },
    };
  }

  return {
    inhalt: karte,
    anweisung: `<b>${name(s.p)}</b>: Hat <b>${name(s.ueber)}</b> das wirklich durchgezogen?`,
    knoepfe: `<div class="reihe">
      <button class="btn btn--nein" id="btnNein">Nein · ${PUNKTE.wagnisVerweigert}</button>
      <button class="btn btn--ja" id="btnJa">Ja · ${vz(PUNKTE.wagnisGemacht)}</button>
    </div>`,
    binden() {
      app.querySelector('#btnJa').onclick = () => { bewerten(stand, true); buzz([15, 40, 20]); nachAenderung(); };
      app.querySelector('#btnNein').onclick = () => { bewerten(stand, false); nachAenderung(); };
    },
  };
}

function aufloesung(r) {
  const { deltas, zeilen } = ergebnis(r);
  let inhalt = '';

  if (r.typ === 'wissen') {
    const k = r.karte;
    const optionen = k.optionen.map((o, i) => {
      const wer = [0, 1].filter((p) => r.antworten[p] === i).map((p) => name(p)).join(' & ');
      const kl = i === k.richtig ? 'opt--richtig' : (wer ? 'opt--falsch' : '');
      return `<div class="opt ${kl}">
        <span class="buchstabe">${'ABCD'[i]}</span><span>${esc(o)}</span>
        ${wer ? `<span class="wer">${wer}</span>` : ''}
      </div>`;
    }).join('');
    inhalt = `<div class="karte karte--wissen">
      <div class="marke"><span class="pille">${esc(k.cat)}</span><span>Auflösung</span></div>
      <p class="frage">${esc(k.q)}</p>
      <div class="optionen">${optionen}</div>
    </div>`;
  } else {
    inhalt = `<div class="karte karte--${r.typ}">
      <div class="marke"><span>${TYP_INFO[r.typ].titel}</span></div>
      <p class="frage">${esc(r.karte.q)}</p>
    </div>`;
  }

  const bilanz = zeilen.map((z) => `
    <div class="bilanzzeile">
      <span class="wer">${name(z.p)}<br><span class="was">${esc(z.text)}</span></span>
      <span class="pkt ${pktKlasse(z.punkte)}">${vz(z.punkte)}</span>
    </div>`).join('');

  const neu = [0, 1].map((i) => stand.punkte[i] + deltas[i]);

  return {
    inhalt: `${inhalt}
      <div class="bilanz">${bilanz}</div>
      <p class="abstand" style="margin:0">
        Danach: ${name(0)} ${neu[0]} · ${name(1)} ${neu[1]}
      </p>`,
    anweisung: '',
    knoepfe: `<button class="btn btn--gold" id="btnBuchen">Punkte gutschreiben</button>`,
    binden() {
      app.querySelector('#btnBuchen').onclick = () => {
        rundeAbschliessen(stand);
        ui.screen = 'hub';
        ui.halter = stand.dran;
        buzz(15);
        nachAenderung();
      };
    },
  };
}

      <span><b>${v.titel}</b><small>${v.unter} · ${rest} Karten</small></span>
    </button>`;
  }).join('');

  const l = overlayHuelle(`
    <h2>Wo seid ihr gerade?</h2>
    <p>Das filtert nur die Mutproben. Wissen und Wahrheit gehen überall.</p>
    <div class="wahlreihe" style="margin-top:16px">${knoepfe}</div>
    <div style="margin-top:22px"><button class="btn btn--gold" id="zu">Passt</button></div>`);
  l.querySelectorAll('[data-ort]').forEach((b) => {
    b.onclick = () => { stand.ort = b.dataset.ort; nachAenderung(); };
  });
  l.querySelector('#zu').onclick = () => { ui.overlay = 'menue'; render(); };
}

function renderStatistik() {
  const st = stand.statistik;
  const zeile = (k, werte, suffix = '') => `
    <span class="k">${k}</span>
    <span class="v">${werte[0]}${suffix}</span>
    <span class="v">${werte[1]}${suffix}</span>`;

  const l = overlayHuelle(`
    <h2>Statistik</h2>
    <div class="statz" style="margin-top:16px">
      <span class="kopfz" style="text-align:left">&nbsp;</span>
      <span class="kopfz">${name(0)}</span>
      <span class="kopfz">${name(1)}</span>
      ${zeile('Punkte gesamt', stand.punkte)}
      ${zeile('Wissen richtig', st.wissenRichtig)}
      ${zeile('Ehrlich geantwortet', st.wahrheitEhrlich)}
      ${zeile('Mutproben bestanden', st.wagnisGemacht)}
      ${zeile('Gekniffen', st.wagnisVerweigert)}
    </div>
    <p style="margin-top:20px">${stand.runde - 1} gespielte Runden in „${esc(stand.reise)}“.</p>
    <div style="margin-top:16px"><button class="btn btn--gold" id="zu">Zurück</button></div>`);
  l.querySelector('#zu').onclick = () => { ui.overlay = 'menue'; render(); };
}

function renderCode() {
  const code = alsCode(stand);
  const l = overlayHuelle(`
    <h2>Punktestand mitnehmen</h2>
    <p>Kopiert den Code oder sichert ihn als Datei. Auf einem anderen Gerät oder unter einer
       anderen Adresse fügt ihr ihn unten wieder ein.</p>

    <div class="feldlabel">Euer Code</div>
    <textarea class="code" id="raus" readonly>${esc(code)}</textarea>
    <div class="reihe" style="margin-top:9px">
      <button class="btn btn--geist" id="kopieren">Kopieren</button>
      <button class="btn btn--geist" id="datei">Als Datei</button>
    </div>

    <div class="feldlabel">Code einspielen</div>
    <textarea class="code" id="rein" placeholder="Code hier einfügen"></textarea>
    <button class="btn btn--nein" id="laden" style="margin-top:9px">Diesen Stand übernehmen</button>

    ${ui.codeStatus ? `<p class="hinweis" style="margin-top:14px">${esc(ui.codeStatus)}</p>` : ''}
    <div style="margin-top:22px"><button class="btn btn--gold" id="zu">Zurück</button></div>`);

  l.querySelector('#kopieren').onclick = async () => {
    const feld = l.querySelector('#raus');
    try {
      await navigator.clipboard.writeText(feld.value);
      ui.codeStatus = 'Code liegt in der Zwischenablage.';
    } catch {
      feld.select();
      ui.codeStatus = 'Code ist markiert — jetzt kopieren.';
    }
    render();
  };
  l.querySelector('#datei').onclick = () => {
    const blob = new Blob([code], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `dreikampf-${stand.reise.replace(/\W+/g, '-').toLowerCase()}.txt`;
    a.click();
    URL.revokeObjectURL(url);
    ui.codeStatus = 'Datei gesichert.';
    render();
  };
  l.querySelector('#laden').onclick = () => {
    const neu = ausCode(l.querySelector('#rein').value);
    if (!neu) { ui.codeStatus = 'Der Code lässt sich nicht lesen. Vollständig eingefügt?'; return render(); }
    stand = neu;
    ui.overlay = null;
    ui.screen = stand.aktuell ? 'runde' : 'hub';
    ui.halter = braucht() ?? stand.dran;
    ui.codeStatus = '';
    nachAenderung();
  };
  l.querySelector('#zu').onclick = () => { ui.overlay = 'menue'; render(); };
}

/* ----------------------------------------------------------------- Render */

function render() {
  if (!stand) { renderStart(); }
  else if (ui.screen === 'runde' && stand.aktuell) { renderRunde(); }
  else if (ui.screen === 'wahl') { renderWahl(); }
  else { ui.screen = 'hub'; renderHub(); }

  if (ui.overlay === 'regeln') renderRegeln();
  else if (ui.overlay === 'menue') renderMenue();
  else if (ui.overlay === 'orte') renderOrte();
  else if (ui.overlay === 'statistik') renderStatistik();
  else if (ui.overlay === 'code') renderCode();
  else if (ui.screen === 'runde' && stand?.aktuell) {
    const wer = braucht();
    if (wer !== null && wer !== ui.halter) renderUebergabe(wer);
  }
}

stand = laden();
if (stand) {
  ui.screen = stand.aktuell ? 'runde' : 'hub';
  ui.halter = braucht() ?? stand.dran;
}
render();

})();
</script>
</body>
</html>
