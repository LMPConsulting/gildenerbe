<style id="heuhaufen-css">
/* Heuhaufen — Lagerhalle bei Nacht: dunkles Wellblech, Heugold, cremiges
   Licht aus einer einzigen Lampe. Bewusst einthemig, alles explizit gefärbt. */

:root {
  --grund: #17120d;
  --grund-2: #0f0b08;
  --panel: #231b14;
  --panel-2: #2d231a;
  --naht: #3d3024;
  --text: #f4ead8;
  --text-dim: #c9b99c;
  --leise: #8f7f66;
  --heu: #e8b64c;
  --heu-hell: #f6da86;
  --heu-tief: #7a5520;
  --blau: #5b8fd6;
  --gruen: #7cc47f;
  --rot: #e06a4f;
  --orange: #ffb36b;

  --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-display: 'Arial Black', 'Helvetica Neue', system-ui, sans-serif;
  --font-num: ui-monospace, SFMono-Regular, 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace;

  --r: 14px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --kopf-h: 54px;
  --reiter-h: 60px;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: none; }

body {
  background: var(--grund);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
}

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--heu); outline-offset: 2px; }
[hidden] { display: none !important; }

.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.leise { color: var(--leise); }

.symhalter { display: inline-flex; width: 22px; height: 22px; flex: none; }
.sym { width: 100%; height: 100%; }

/* ---------- Gerüst ---------- */

#app {
  height: 100%;
  display: grid;
  grid-template-rows: calc(var(--kopf-h) + var(--safe-t)) 1fr calc(var(--reiter-h) + var(--safe-b));
  max-width: 720px;
  margin-inline: auto;
  overflow: hidden;
  position: relative;
}

.kopf {
  display: flex; align-items: center; gap: 10px;
  padding: var(--safe-t) 12px 0;
  background: linear-gradient(180deg, #120d09, #1b140e);
  border-bottom: 1px solid var(--naht);
}
.kasse { display: flex; align-items: center; gap: 5px; color: var(--heu-hell); font-weight: 700; font-size: 15px; min-width: 0; white-space: nowrap; }
.kasse .symhalter { color: var(--heu); }
.zaehler { flex: 1; display: flex; flex-direction: column; align-items: center; line-height: 1.1; min-width: 0; }
.zaehler span { font-size: 14px; font-weight: 700; white-space: nowrap; }
.zaehler small { font-size: 9.5px; color: var(--leise); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
.nadelreihe { display: flex; gap: 1px; }
.nadelmarke { width: 13px; height: 13px; color: #4a3d30; }
.nadelmarke.gefunden { color: var(--heu-hell); filter: drop-shadow(0 0 3px rgba(246, 218, 134, 0.6)); }
.nadelmarke.ausschuss { color: var(--rot); animation: puls 1s ease-in-out infinite; }
.rund {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  background: var(--panel-2); border: 1px solid var(--naht); flex: none;
}

.buehne { min-height: 0; overflow: hidden; position: relative; }
.bild { height: 100%; }

.reiter {
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding-bottom: var(--safe-b);
  background: #120d09; border-top: 1px solid var(--naht);
}
.reiterknopf {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--leise); font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
}
.reiterknopf .symhalter { width: 24px; height: 24px; }
.reiterknopf.aktiv { color: var(--heu); }
.reiterknopf.aktiv::before {
  content: ''; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; border-radius: 0 0 3px 3px; background: var(--heu);
}
.reiterknopf.zu { opacity: 0.55; }
.marke {
  position: absolute; top: 6px; left: calc(50% + 8px);
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--rot); color: #fff; font-size: 11px; font-weight: 800; line-height: 18px; text-align: center;
  display: none;
}
.marke.sichtbar { display: block; }

/* ---------- Knöpfe ---------- */

.knopf {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 42px; padding: 8px 14px; border-radius: 12px;
  background: var(--panel-2); border: 1px solid var(--naht); color: var(--text);
  font-weight: 650;
}
.knopf:active:not(:disabled) { transform: scale(0.98); }
.knopf:disabled { opacity: 0.45; }
.knopf.primaer { background: linear-gradient(180deg, #f0c45a, #d49a30); border-color: #f6da86; color: #2a1c08; }
.knopf.gefahr { background: #4a1e16; border-color: #7a3325; color: #ffcbbd; }
.knopf.breit { width: 100%; }
.knopf.klein { min-height: 32px; padding: 4px 10px; font-size: 13px; border-radius: 9px; }

/* ---------- Haufen ---------- */

.haufenbild { display: flex; flex-direction: column; }
.szene { position: relative; flex: 1; min-height: 0; }
.haufencanvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
.hinweis {
  position: absolute; top: 10px; left: 10px; right: 10px;
  background: rgba(18, 13, 9, 0.82); border: 1px solid var(--naht); border-left: 3px solid var(--heu);
  border-radius: 10px; padding: 7px 10px; font-size: 13px; color: var(--text);
  pointer-events: none; opacity: 0; transform: translateY(-6px); transition: opacity 0.25s, transform 0.25s;
}
.hinweis.sichtbar { opacity: 1; transform: none; }
.werkzeugschild {
  position: absolute; right: 10px; bottom: 44px; font-size: 11px; color: var(--text-dim);
  background: rgba(18, 13, 9, 0.7); border-radius: 8px; padding: 3px 8px; pointer-events: none;
}
.taschebalken {
  position: absolute; left: 10px; right: 10px; bottom: 10px; height: 26px;
  border-radius: 13px; background: rgba(18, 13, 9, 0.85); border: 1px solid var(--naht);
  display: flex; align-items: center; gap: 6px; padding: 0 10px; overflow: hidden;
  font-size: 12px; font-weight: 700; pointer-events: none;
}
.taschebalken .fuellung {
  position: absolute; left: 0; top: 0; bottom: 0; width: 0;
  background: linear-gradient(90deg, rgba(232, 182, 76, 0.35), rgba(232, 182, 76, 0.6));
  transition: width 0.15s;
}
.taschebalken .symhalter, .taschebalken span { position: relative; }
.taschebalken .symhalter { width: 16px; height: 16px; color: var(--heu); }
.taschebalken.voll { border-color: var(--orange); }
.taschebalken.voll .fuellung { background: linear-gradient(90deg, rgba(255, 179, 107, 0.5), rgba(255, 179, 107, 0.75)); }

.detektorleiste {
  display: flex; align-items: center; gap: 8px; padding: 7px 12px;
  background: var(--panel); border-top: 1px solid var(--naht); font-size: 12px; color: var(--text-dim);
}
.detektorleiste > .symhalter { width: 20px; height: 20px; color: var(--leise); }
.segmente { display: flex; gap: 2px; }
.seg { width: 9px; height: 12px; border-radius: 2px; background: #3a2e23; }
.seg.an { background: #d9c24a; box-shadow: 0 0 5px rgba(217, 194, 74, 0.5); }
.seg.heiss { background: var(--rot); box-shadow: 0 0 6px rgba(224, 106, 79, 0.7); }
.dtext { flex: 1; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.aktionen {
  display: flex; gap: 6px; padding: 8px 8px 10px;
  background: var(--panel);
}
.aktion {
  position: relative; overflow: hidden; flex: 1;
  display: flex; align-items: center; gap: 6px; min-height: 58px; padding: 8px 8px;
  border-radius: var(--r); background: var(--panel-2); border: 1px solid var(--naht); text-align: left;
}
.aktion.gross { flex: 1.5; }
.aktion .symhalter { width: 24px; height: 24px; color: var(--heu); }
.aktion:not(.gross) .symhalter { width: 20px; height: 20px; }
.aktiontext { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; position: relative; }
.aktiontext .zeile1 { font-weight: 750; font-size: 14px; white-space: nowrap; }
.aktiontext small { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aktion:disabled { opacity: 0.55; }
.aktion:active:not(:disabled) { transform: scale(0.98); }
.aktion.drängt { border-color: var(--heu); background: linear-gradient(180deg, #4a3818, #33260f); animation: winken 1.2s ease-in-out infinite; }
.aktion .lauf { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: var(--heu); }
.aktion .hitze { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: linear-gradient(90deg, #d9c24a, var(--rot)); }
.aktion.sauger { touch-action: none; }
.aktion.sauger.heiss { border-color: var(--rot); }
.aktion.sauger:active { background: #3b2e1f; }

@keyframes winken { 50% { box-shadow: 0 0 0 3px rgba(232, 182, 76, 0.25); } }
@keyframes puls { 50% { opacity: 0.35; } }

/* ---------- Halle ---------- */

.hallenbild, .fundebild { overflow-y: auto; padding: 0 12px 24px; -webkit-overflow-scrolling: touch; }
.hallenszene { height: 150px; margin: 10px 0; border-radius: var(--r); overflow: hidden; border: 1px solid var(--naht); }
.hallecanvas { width: 100%; height: 100%; display: block; }
.kennzahlen { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kz { background: var(--panel); border: 1px solid var(--naht); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; line-height: 1.2; }
.kz span { font-size: 11px; color: var(--leise); text-transform: uppercase; letter-spacing: 0.08em; }
.kz b { font-size: 16px; margin: 2px 0; }
.kz small { font-size: 11px; color: var(--text-dim); }
.kz.schlecht { border-color: #7a3325; }
.kz.schlecht b { color: var(--rot); }
.kz.engpass b { color: var(--orange); }
.kz-einnahmen b { color: var(--gruen); }
.warnungen p {
  margin: 8px 0 0; padding: 8px 10px; border-radius: 10px; font-size: 13px;
  background: #3a1d14; border: 1px solid #6b3425; color: #ffd2c4;
}
.gruppe { margin: 20px 2px 8px; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--leise); }

.mkarte {
  display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; align-items: center;
  background: var(--panel); border: 1px solid var(--naht); border-radius: var(--r);
  padding: 10px; margin-bottom: 8px;
}
.msym { width: 38px; height: 38px; color: var(--blau); background: #1b2230; border-radius: 10px; padding: 5px; }
.mtext { min-width: 0; }
.mtext p { margin: 0; }
.mname { display: flex; gap: 6px; align-items: baseline; }
.mname b { font-size: 15px; }
.anzahl { color: var(--heu); font-weight: 700; }
.mbeschr { font-size: 12px; color: var(--text-dim); }
.mstatus { font-size: 11.5px; color: var(--leise); margin-top: 2px !important; }
.mknoepfe { display: flex; flex-direction: column; gap: 5px; align-items: stretch; min-width: 96px; }
.mklein { display: flex; gap: 5px; }
.mklein .knopf { flex: 1; }
.knopf.kaufen { font-size: 13px; }
.knopf.klein.aus { color: var(--rot); }
.knopf.sperre { font-size: 11px; max-width: 130px; white-space: normal; line-height: 1.2; color: var(--text-dim); }
.mkarte.gesperrt { opacity: 0.6; }
.mkarte.gesperrt .msym { color: var(--leise); background: var(--panel-2); }
.mkarte.ausgeschaltet { border-style: dashed; }

.leerkarte { text-align: center; padding: 40px 18px; }
.leerkarte h2 { margin: 12px 0 8px; font-family: var(--font-display); letter-spacing: 0.01em; }
.leerkarte p { color: var(--text-dim); margin: 0 0 10px; }
.grosssym { width: 72px; height: 72px; margin: 0 auto; color: var(--heu); opacity: 0.8; }

/* ---------- Forschung ---------- */

.forschungsbild { display: flex; flex-direction: column; position: relative; }
.forschungskopf {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  background: #0d0a07; border-bottom: 1px solid var(--naht);
}
.forschungskopf > div { flex: none; }
.ober { margin: 0; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--heu); font-weight: 800; }
.fortschritt { margin: 0; font-size: 12px; color: var(--text-dim); }
.suche {
  flex: 1; min-width: 0; height: 34px; border-radius: 8px; border: 1px solid var(--naht);
  background: #1a140e; color: var(--text); padding: 0 10px; font: inherit; font-size: 13px;
  user-select: text; -webkit-user-select: text;
}
.baum { flex: 1; overflow: auto; position: relative; background: #0d0a07; -webkit-overflow-scrolling: touch; }
.spaltenkopf {
  position: sticky; top: 0; z-index: 3; height: 26px;
  background: rgba(13, 10, 7, 0.94); border-bottom: 1px solid #241c14;
}
.spaltenkopf span {
  position: absolute; top: 6px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--leise); font-weight: 700;
}
.brett { position: relative; }
.linien { position: absolute; left: 0; top: 0; pointer-events: none; }
.linien path { fill: none; stroke: #3b3023; stroke-width: 2; }
.linien path.fremd { stroke-dasharray: 4 4; stroke: #2e261d; }
.linien path.offen { stroke: #8a6a32; }
.band {
  position: absolute; left: 0; right: 0;
  background: linear-gradient(90deg, color-mix(in srgb, var(--astfarbe) 12%, transparent), transparent 60%);
  border-top: 1px solid color-mix(in srgb, var(--astfarbe) 25%, transparent);
}
.band span {
  position: absolute; left: 4px; top: 6px; writing-mode: vertical-rl; transform: rotate(180deg);
  font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 800; color: var(--astfarbe); opacity: 0.8;
}
.karte {
  position: absolute; width: 148px; height: 56px; padding: 5px 8px;
  display: flex; flex-direction: column; justify-content: space-between; text-align: left;
  background: #1d1711; border: 1px solid #3a2f24; border-left: 3px solid var(--astfarbe); border-radius: 6px;
  line-height: 1.15; z-index: 1;
}
.karte .astname { font-size: 8.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--astfarbe); font-weight: 800; }
.karte b { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kartenfuss { display: flex; justify-content: space-between; font-size: 11px; }
.karte .preis { color: var(--text-dim); }
.karte.kaufbar .preis { color: var(--gruen); }
.karte .stufe { color: var(--leise); }
.karte.gesperrt { opacity: 0.42; }
.karte.kaufbar { border-color: #6d8f45; box-shadow: 0 0 0 1px rgba(124, 196, 127, 0.25), 0 0 12px rgba(124, 196, 127, 0.12); }
.karte.begonnen { background: #241d14; }
.karte.max { background: #2a2113; border-color: #6b5327; }
.karte.max .preis { color: var(--heu); }
.karte.gewaehlt { outline: 2px solid var(--heu); outline-offset: 2px; z-index: 2; }
.karte.blass { opacity: 0.15; }

.blatt {
  position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 5;
  background: var(--panel); border: 1px solid var(--naht); border-radius: 18px; padding: 12px 14px 14px;
  box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
  transform: translateY(120%); transition: transform 0.22s ease;
}
.blatt.offen { transform: none; }

/** Strom, den die Halle auch ohne Generator hat (eine Handkurbel in der Ecke). */
const GRUNDSTROM = 5;
/** Grundpreis der ersten Drohne und Faktor je weiterer. */
const DROHNE_KOSTEN = 250;
const DROHNE_FAKTOR = 1.35;

/* ------------------------------------------------------------ Zufall */

/** mulberry32: klein, schnell, und der ganze Zustand ist eine Zahl im Stand. */
function zufall(s) {
  s.rng = (s.rng + 0x6d2b79f5) | 0;
  let t = s.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

function nadelnVerstecken(s, gesamt) {
  return NADEL_BEREICHE.map(([von, bis]) => ({
    tiefe: Math.round(gesamt * (von + zufall(s) * (bis - von))),
    zustand: 'versteckt',
    zeit: null,
  }));
}

/* ------------------------------------------------------------ Stand */

function neuerStand(seed = Date.now()) {
  const s = {
    version: STAND_VERSION,
    rng: seed | 0,
    rev: 0,
    zeit: 0,
    geld: 0,
    verdient: 0,
    haufen: { gesamt: HAUFEN_GROESSE, entfernt: 0 },
    tasche: 0,
    laufen: 0,
    autoRest: 0,
    tech: { scheune: 1 },
    maschinen: {},
    aus: {},
    drohnen: 0,
    nadeln: [],
    ausschuss: 0,
    funde: {},
    sauger: { an: false, hitze: 0, heiss: false },
    stat: { tipps: 0, hand: 0, drohne: 0, maschine: 0, funde: 0, gaenge: 0 },
    lauf: 1,
    erledigt: 0,
    gezeigt: [],
    zuletzt: Date.now(),
  };
  s.nadeln = nadelnVerstecken(s, s.haufen.gesamt);
  return s;
}

const rest = (s) => Math.max(0, s.haufen.gesamt - s.haufen.entfernt);
const nadelnGefunden = (s) => s.nadeln.filter((n) => n.zustand === 'gefunden').length;
const alleNadeln = (s) => s.nadeln.every((n) => n.zustand === 'gefunden');
const imAusschuss = (s) => s.nadeln.filter((n) => n.zustand === 'ausschuss').length;
const fundArten = (s) => Object.values(s.funde).filter((f) => f.ges > 0).length;

/* ------------------------------------------------------------ Werte */

const cache = new WeakMap();

/** Alle abgeleiteten Zahlen: Grundwerte, darauf Techtree, Nadeln, Neustarts und Sammelbonus. */
function werte(s) {
  const alt = cache.get(s);
  if (alt && alt.rev === s.rev) return alt.w;

  const plus = {};
  const mal = {};
  const frei = new Set();
  const anwenden = (effekte, n) => {
    for (const e of effekte) {
      if (e[0] === 'frei') { frei.add(e[1]); continue; }
      if (e[1] === '+') plus[e[0]] = (plus[e[0]] || 0) + e[2] * n;
      else mal[e[0]] = (mal[e[0]] || 1) * Math.pow(e[2], n);
    }
  };
  for (const t of TECH) {
    const n = s.tech[t.id] || 0;
    if (n > 0) anwenden(t.effekt, n);
  }
  s.nadeln.forEach((nd, i) => { if (nd.zustand === 'gefunden') anwenden(NADELN[i].effekt, 1); });
  if (s.erledigt > 0) {
    anwenden([['preisAlle', '*', 1 + 0.5 * s.erledigt], ['griff', '*', 1 + 0.25 * s.erledigt]], 1);
  }
  const arten = fundArten(s);
  if (arten > 0) anwenden([['preisAlle', '*', 1 + SAMMELBONUS * arten]], 1);

  const w = { ...GRUND };
  for (const key of new Set([...Object.keys(plus), ...Object.keys(mal)])) {
    const basis = key in GRUND ? GRUND[key] : (key in plus ? 0 : 1);
    w[key] = (basis + (plus[key] || 0)) * (mal[key] || 1);
  }
  w.frei = frei;
  cache.set(s, { rev: s.rev, w });
  return w;
}

const faktor = (w, key) => (key in w ? w[key] : 1);

const griffMenge = (w) => w.griff * w.werkzeug;
const taschePlatz = (w) => Math.floor(w.tasche);
const preisRoh = (w) => w.preisRoh * w.preisAlle;

function produktPreis(w, p) {
  if (p === 'roh') return preisRoh(w);
  return PRODUKTE[p].wert * (w.preisRoh / GRUND.preisRoh) * w.preisAlle * w.preisProdukt * faktor(w, 'preis_' + p);
}

function fundPreis(w, id) {
  return FUND_NACH_ID[id].wert * w.fundWert * Math.sqrt(w.preisRoh / GRUND.preisRoh) * w.preisAlle;
}

/* ------------------------------------------------------------ Haufen abtragen */

function fundZiehen(s) {
  const summe = SELTENHEIT.reduce((n, r) => n + r.gewicht, 0);
  let x = zufall(s) * summe;
  let stufe = SELTENHEIT[SELTENHEIT.length - 1].id;
  for (const r of SELTENHEIT) {
    if (x < r.gewicht) { stufe = r.id; break; }
    x -= r.gewicht;
  }
  const kandidaten = FUNDE.filter((f) => f.stufe === stufe);
  return kandidaten[Math.floor(zufall(s) * kandidaten.length)];
}

function nadelFinden(s, i, ereignisse) {
  const nd = s.nadeln[i];
  nd.zustand = 'gefunden';
  nd.zeit = s.zeit;
  s.rev++;
  ereignisse.push({ typ: 'nadel', i });
}

/**
 * Nimmt Halme vom Haufen. quelle: 'hand' und 'drohne' sehen jede Nadel;
 * 'maschine' nur mit der Wahrscheinlichkeit der Scannerabdeckung, sonst fällt
 * sie in den Ausschuss. Fundstücke landen bei Maschinen nur im Anteil, den
 * die Sortierer schaffen, in der Kiste.
 */
function abtragen(s, menge, quelle, ereignisse = [], deckung = 1, sortiert = 1) {
  const vorher = s.haufen.entfernt;
  menge = Math.min(menge, rest(s));
  if (!(menge > 0)) return 0;
  const nachher = vorher + menge;
  s.haufen.entfernt = nachher;
  s.stat[quelle] = (s.stat[quelle] || 0) + menge;

  s.nadeln.forEach((nd, i) => {
    if (nd.zustand !== 'versteckt' || nd.tiefe <= vorher || nd.tiefe > nachher) return;
    if (quelle !== 'maschine' || zufall(s) < deckung) nadelFinden(s, i, ereignisse);
    else {
      nd.zustand = 'ausschuss';
      ereignisse.push({ typ: 'ausschuss', i });
    }
  });

  const w = werte(s);
  const erwartet = menge * w.fundChance * (quelle === 'maschine' ? sortiert : 1);
  let anzahl = Math.floor(erwartet) + (zufall(s) < erwartet % 1 ? 1 : 0);
  anzahl = Math.min(anzahl, 200);
  for (let n = 0; n < anzahl; n++) {
    const f = fundZiehen(s);
    const e = s.funde[f.id] || (s.funde[f.id] = { n: 0, ges: 0 });
    e.n++;
    e.ges++;
    s.stat.funde++;
    if (e.ges === 1) s.rev++;
    ereignisse.push({ typ: 'fund', id: f.id, neu: e.ges === 1 });
  }
  return menge;
}

/* ------------------------------------------------------------ Hände und Werkzeug */

/** Ein Griff in den Haufen. Liefert null, wenn gerade niemand da ist. */
function tippen(s, ereignisse = []) {
  if (s.laufen > 0) return null;
  const w = werte(s);
  const frei = taschePlatz(w) - s.tasche;
  if (frei <= 0) return { menge: 0, voll: true, ereignisse };
  let menge = griffMenge(w);
  const krit = w.krit > 0 && zufall(s) < w.krit;
  if (krit) menge *= w.kritFaktor;
  menge = abtragen(s, Math.min(menge, frei), 'hand', ereignisse);
  s.tasche += menge;
  s.stat.tipps++;
  return { menge, krit, voll: s.tasche >= taschePlatz(w), ereignisse };
}

function saugen(s, an) {
  const w = werte(s);
  s.sauger.an = !!an && w.frei.has('sauger') && !s.sauger.heiss;
}

/** Los zum Ankauf. Bezahlt wird bei der Ankunft (siehe tick). */
function verkaufen(s) {
  if (s.laufen > 0 || s.tasche <= 0) return false;
  s.laufen = Math.max(0.05, werte(s).laufzeit);
  s.sauger.an = false;
  return true;
}

function ankommen(s, ereignisse) {
  const w = werte(s);
  const betrag = s.tasche * preisRoh(w);
  s.geld += betrag;
  s.verdient += betrag;
  ereignisse.push({ typ: 'verkauft', menge: s.tasche, betrag });
  s.tasche = 0;
  s.stat.gaenge++;
}

/* ------------------------------------------------------------ Drohnen */

function drohnenKosten(s) {
  return Math.ceil(DROHNE_KOSTEN * Math.pow(DROHNE_FAKTOR, s.drohnen));
}

function drohneKaufen(s) {
  const w = werte(s);
  if (!w.frei.has('drohne')) return { ok: false, grund: 'gesperrt' };
  if (s.drohnen >= w.drohnenMax) return { ok: false, grund: 'voll' };
  const preis = drohnenKosten(s);
  if (s.geld < preis) return { ok: false, grund: 'geld' };
  s.geld -= preis;
  s.drohnen++;
  return { ok: true };
}

/* ------------------------------------------------------------ Techtree */

const techStufe = (s, id) => s.tech[id] || 0;

function techKosten(s, id) {
  const t = TECH_NACH_ID[id];
  const c = t.kosten * Math.pow(t.faktor, techStufe(s, id));
  return c < 100 ? Math.ceil(c * 10) / 10 : Math.ceil(c);
}

const techOffen = (s, id) => TECH_NACH_ID[id].braucht.every((b) => techStufe(s, b) > 0);

/** 'max' | 'kaufbar' | 'teuer' | 'gesperrt' */
function techStatus(s, id) {
  const t = TECH_NACH_ID[id];
  if (techStufe(s, id) >= t.stufen) return 'max';
  if (!techOffen(s, id)) return 'gesperrt';
  return s.geld >= techKosten(s, id) ? 'kaufbar' : 'teuer';
}

function techKaufen(s, id) {
  const status = techStatus(s, id);
  if (status !== 'kaufbar') return { ok: false, grund: status };
  s.geld -= techKosten(s, id);
  s.tech[id] = techStufe(s, id) + 1;
  s.rev++;
  return { ok: true };
}

const techGekauft = (s) => TECH.reduce((n, t) => n + (t.id === 'scheune' ? 0 : techStufe(s, t.id)), 0);

/** Schritte vom Start: der längste Weg über alle Voraussetzungen. */
const TECH_SCHRITTE = (() => {
  const schritte = {};
  const tiefe = (id) => {
    if (id in schritte) return schritte[id];
    const t = TECH_NACH_ID[id];
    schritte[id] = t.braucht.length ? 1 + Math.max(...t.braucht.map(tiefe)) : 0;
    return schritte[id];
  };
  for (const t of TECH) tiefe(t.id);
  return schritte;
})();

/**
 * Lage der Karten im Forschungsbaum: die Spalte ist die Zahl der Schritte vom
 * Start, die Zeile kommt aus einem ordentlich gelegten Baum je Ast (Blätter
 * untereinander, Eltern mittig neben ihren Kindern). Voraussetzungen aus
 * anderen Ästen zählen für die Spalte, nicht für die Zeile.
 */
function techLage(aeste) {
  const lage = {};
  const baender = [];
  let zeile = 0;
  for (const ast of aeste) {
    const knoten = TECH.filter((t) => t.ast === ast.id);
    const imAst = new Set(knoten.map((t) => t.id));
    const vater = (t) => t.braucht.find((b) => imAst.has(b)) || null;
    const von = zeile;
    const setzen = (t) => {
      const ks = knoten.filter((kk) => vater(kk) === t.id);
      let y;
      if (!ks.length) y = zeile++;
      else {
        const ys = ks.map(setzen);
        y = (ys[0] + ys[ys.length - 1]) / 2;
      }
      lage[t.id] = { x: TECH_SCHRITTE[t.id], y };
      return y;
    };
    for (const t of knoten.filter((kk) => !vater(kk))) setzen(t);
    baender.push({ ast: ast.id, von, bis: zeile - 1 });
    zeile += 0.5;
  }
  const hoehe = zeile - 0.5;
  // Start steht neben dem ersten Ast, dort, wo das Spiel beginnt.
  const erster = baender[0];
  lage.scheune = { x: 0, y: (erster.von + erster.bis) / 2 };
  const breite = Math.max(...Object.values(lage).map((l) => l.x)) + 1;
  return { lage, aeste: baender, hoehe, breite };
}

/* ------------------------------------------------------------ Maschinen */

const anzahl = (s, id) => s.maschinen[id] || 0;
const maschineFrei = (s, id) => werte(s).frei.has(MASCHINE_NACH_ID[id].frei);

function maschinenKosten(s, id) {
  const m = MASCHINE_NACH_ID[id];
  return Math.ceil(m.kosten * Math.pow(m.faktor, anzahl(s, id)) * werte(s).maschinenKosten);
}

function plaetzeBelegt(s) {
  return MASCHINEN.reduce((n, m) => n + anzahl(s, m.id) * m.plaetze, 0);
}

function maschineKaufen(s, id) {
  const m = MASCHINE_NACH_ID[id];
  if (!maschineFrei(s, id)) return { ok: false, grund: 'gesperrt' };
  if (plaetzeBelegt(s) + m.plaetze > werte(s).plaetze) return { ok: false, grund: 'platz' };
  const preis = maschinenKosten(s, id);
  if (s.geld < preis) return { ok: false, grund: 'geld' };
  s.geld -= preis;
  s.maschinen[id] = anzahl(s, id) + 1;
  return { ok: true };
}

/** Baut eine Maschine ab und gibt die Hälfte des letzten Kaufpreises zurück. */
function maschineAbbauen(s, id) {
  if (anzahl(s, id) <= 0) return { ok: false };
  s.maschinen[id]--;
  const erstattung = Math.floor(maschinenKosten(s, id) / 2);
  s.geld += erstattung;
  return { ok: true, erstattung };
}

function maschineUmschalten(s, id) {
  if (s.aus[id]) delete s.aus[id];
  else s.aus[id] = true;
}

/**
 * Momentaufnahme der Halle in Raten pro Sekunde. Strom, Band, Scanner und
 * Verarbeiter begrenzen sich gegenseitig; wer zuerst in VERARBEITUNG_REIHE
 * steht, bekommt zuerst vom Band.
 */
function fabrik(s) {
  const w = werte(s);
  const f = {
    aktiv: w.frei.has('halle'), foerderung: 0, band: w.band, fluss: 0, strom: 1,
    erzeugt: 0, bedarf: 0, deckung: 1, sortiert: 0, brennstoff: 0, roh: 0,
    produkte: {}, einnahmen: 0, auslastung: {},
  };
  if (!f.aktiv) return f;
  const n = (id) => (s.aus[id] ? 0 : anzahl(s, id));
  const mt = w.maschinenTempo;

  const moeglich = (n('arm') * MASCHINE_NACH_ID.arm.rate * w.armTempo
    + n('bagger') * MASCHINE_NACH_ID.bagger.rate * w.baggerTempo) * mt;
  const brennBedarf = MASCHINEN.reduce((sum, m) => sum + (m.brennstoff ? n(m.id) * m.brennstoff : 0), 0);
  const vorFluss = rest(s) > 0 ? Math.min(moeglich, w.band) : 0;
  const brennAnteil = brennBedarf > 0 ? Math.min(1, vorFluss / brennBedarf) : 1;

  for (const m of MASCHINEN) {
    const zahl = n(m.id);
    if (!zahl) continue;
    if (m.strom > 0) f.bedarf += zahl * m.strom * w.verbrauch;
    else {
      let leistung = -m.strom * zahl;
      if (m.brennstoff) leistung *= brennAnteil * (m.id === 'kessel' ? w.kesselMul : 1);
      f.erzeugt += leistung * w.stromMul;
    }
  }
  f.erzeugt += GRUNDSTROM;
  f.strom = f.bedarf > 0 ? Math.min(1, f.erzeugt / f.bedarf) : 1;

  f.foerderung = moeglich * f.strom;
  f.fluss = rest(s) > 0 ? Math.min(f.foerderung, w.band) : 0;
  f.brennstoff = Math.min(brennBedarf, f.fluss);
  f.auslastung.arm = moeglich > 0 ? f.fluss / moeglich : 0;

  const scan = n('scanner') * MASCHINE_NACH_ID.scanner.rate * w.scanDeckung * mt * f.strom;
  f.deckung = f.fluss > 0 ? Math.min(1, scan / f.fluss) : (n('scanner') > 0 ? 1 : 0);
  const sort = n('sortierer') * MASCHINE_NACH_ID.sortierer.rate * w.sortDeckung * mt * f.strom;
  f.sortiert = f.fluss > 0 ? Math.min(1, sort / f.fluss) : 0;

  const lager = { halme: f.fluss - f.brennstoff, ballen: 0, brei: 0 };
  for (const id of VERARBEITUNG_REIHE) {
    const zahl = n(id);
    if (!zahl) continue;
    const m = MASCHINE_NACH_ID[id];
    const max = zahl * m.rate * w.verarbeitung * mt * faktor(w, id) * f.strom;
    let stueck = max;
    for (const [zutat, menge] of Object.entries(m.rezept)) {
      const bedarf = zutat === 'halme' ? menge * w.ausbeute : menge;
      stueck = Math.min(stueck, lager[zutat] / bedarf);
    }
    stueck = Math.max(0, stueck);
    for (const [zutat, menge] of Object.entries(m.rezept)) {
      lager[zutat] -= stueck * (zutat === 'halme' ? menge * w.ausbeute : menge);
    }
    if (m.produkt in lager) lager[m.produkt] += stueck;
    else f.produkte[m.produkt] = (f.produkte[m.produkt] || 0) + stueck;
    f.auslastung[id] = max > 0 ? stueck / max : 0;
  }
  for (const p of ['ballen', 'brei']) if (lager[p] > 1e-9) f.produkte[p] = (f.produkte[p] || 0) + lager[p];
  f.roh = Math.max(0, lager.halme);

  f.einnahmen = f.roh * preisRoh(w);
  for (const [p, rate] of Object.entries(f.produkte)) f.einnahmen += rate * produktPreis(w, p);
  return f;
}

/* ------------------------------------------------------------ Ausschuss und Funde */

/** Ein Griff in den Ausschuss. Nach AUSSCHUSS_TIPPS Griffen ist die Nadel da. */
function ausschussTippen(s, ereignisse = []) {
  if (!imAusschuss(s)) return null;
  s.ausschuss += 1 / AUSSCHUSS_TIPPS;
  if (s.ausschuss >= 1 - 1e-9) {
    s.ausschuss = 0;
    nadelFinden(s, s.nadeln.findIndex((n) => n.zustand === 'ausschuss'), ereignisse);
  }
  return { fortschritt: s.ausschuss, ereignisse };
}

function fundeVerkaufen(s) {
  const w = werte(s);
  let betrag = 0;
  for (const [id, e] of Object.entries(s.funde)) {
    betrag += e.n * fundPreis(w, id);
    e.n = 0;
  }
  s.geld += betrag;
  s.verdient += betrag;
  return betrag;
}

function fundWert(s) {
  const w = werte(s);
  return Object.entries(s.funde).reduce((sum, [id, e]) => sum + e.n * fundPreis(w, id), 0);
}

/* ------------------------------------------------------------ Detektor */

/** stufe: 'still' | 'kalt' | 'warm' | 'heiss'; abstand in Halmen oder null. */
function detektor(s) {
  const w = werte(s);
  const offen = s.nadeln.filter((n) => n.zustand === 'versteckt' && n.tiefe > s.haufen.entfernt);
  if (!offen.length) return { abstand: null, staerke: 0, stufe: 'still' };
  const abstand = Math.min(...offen.map((n) => n.tiefe)) - s.haufen.entfernt;
  const staerke = Math.max(0, Math.min(1, 1 - abstand / w.detektor));
  const stufe = staerke <= 0 ? 'still' : staerke < 0.4 ? 'kalt' : staerke < 0.8 ? 'warm' : 'heiss';
  return { abstand, staerke, stufe };
}

/* ------------------------------------------------------------ Zeit */

/**
 * Lässt dt Sekunden vergehen. offline: nur was auch ohne dich läuft (Drohnen,
 * Halle), und das mit dem Wirkungsgrad aus dem Techtree.
 */
function tick(s, dt, { offline = false } = {}) {
  const ereignisse = [];
  if (!(dt > 0)) return ereignisse;
  s.zeit += dt;
  let w = werte(s);

  if (s.laufen > 0) {
    s.laufen -= dt;
    if (s.laufen <= 0) { s.laufen = 0; ankommen(s, ereignisse); }
  }

  if (!offline) {
    // Sauger
    const sg = s.sauger;
    if (sg.an && !sg.heiss && s.laufen <= 0 && w.frei.has('sauger')) {
      const frei = taschePlatz(w) - s.tasche;
      if (frei > 0) {
        const weg = abtragen(s, Math.min(frei, w.saugerRate * dt), 'hand', ereignisse);
        s.tasche += weg;
        sg.hitze += dt / w.saugerHitze;
        if (sg.hitze >= 1) {
          sg.hitze = 1; sg.heiss = true; sg.an = false;
          ereignisse.push({ typ: 'ueberhitzt' });
        }
      }
    } else {
      sg.hitze = Math.max(0, sg.hitze - dt / (w.saugerHitze * 0.6));
      if (sg.heiss && sg.hitze <= 0) sg.heiss = false;
    }

    // Muskelgedächtnis
    if (w.autotipp > 0) {
      s.autoRest += w.autotipp * dt;
      let runden = Math.min(Math.floor(s.autoRest), 100);
      s.autoRest -= Math.floor(s.autoRest);
      while (runden-- > 0 && s.laufen <= 0) {
        const r = tippen(s, ereignisse);
        if (r && r.voll) verkaufen(s);
      }
    }
  }

  const wirkung = offline ? Math.min(1, w.offlineEff) : 1;

  // Drohnen: sehen jede Nadel und fliegen direkt zum Ankauf.
  if (s.drohnen > 0 && rest(s) > 0) {
    const weg = abtragen(s, s.drohnen * w.drohnenRate * dt * wirkung, 'drohne', ereignisse);
    const betrag = weg * preisRoh(w);
    s.geld += betrag;
    s.verdient += betrag;
  }

  // Halle
  w = werte(s);
  if (w.frei.has('halle')) {
    const f = fabrik(s);
    const soll = f.fluss * dt * wirkung;
    if (soll > 0) {
      const weg = abtragen(s, soll, 'maschine', ereignisse, f.deckung, f.sortiert);
      const betrag = f.einnahmen * dt * wirkung * (weg / soll);
      s.geld += betrag;
      s.verdient += betrag;
    }
    // Nadelsichter im Ausschuss
    const sichter = s.aus.sichter ? 0 : anzahl(s, 'sichter');
    if (sichter > 0 && imAusschuss(s)) {
      s.ausschuss += dt * sichter * MASCHINE_NACH_ID.sichter.rate * f.strom * wirkung;
      while (s.ausschuss >= 1 && imAusschuss(s)) {
        s.ausschuss -= 1;
        nadelFinden(s, s.nadeln.findIndex((n) => n.zustand === 'ausschuss'), ereignisse);
      }
      if (!imAusschuss(s)) s.ausschuss = 0;
    }
  }
  return ereignisse;
}

/**
 * Holt nach, was während der Abwesenheit passiert ist. Liefert eine
 * Zusammenfassung oder null, wenn es sich nicht lohnt, davon zu erzählen.
 */
function offlineNachholen(s, jetzt = Date.now()) {
  const w = werte(s);
  const weg = Math.max(0, (jetzt - (s.zuletzt ?? jetzt)) / 1000);
  s.zuletzt = jetzt;
  if (s.laufen > 0 && weg > 0) {
    const e = [];
    s.laufen = 0;
    ankommen(s, e);
  }
  const sek = Math.min(weg, w.offlineStunden * 3600);
  if (sek < 30 || (s.drohnen === 0 && !w.frei.has('halle'))) return null;
  const geldVor = s.geld;
  const halmeVor = s.haufen.entfernt;
  const nadelnVor = nadelnGefunden(s);
  const ausschussVor = imAusschuss(s);
  const schritte = Math.min(600, Math.ceil(sek));
  const dt = sek / schritte;
  const ereignisse = [];
  for (let i = 0; i < schritte; i++) ereignisse.push(...tick(s, dt, { offline: true }));
  return {
    sekunden: sek,
    abwesend: weg,
    geld: s.geld - geldVor,
    halme: s.haufen.entfernt - halmeVor,
    nadeln: nadelnGefunden(s) - nadelnVor,
    ausschuss: Math.max(0, imAusschuss(s) - ausschussVor),
    funde: ereignisse.filter((e) => e.typ === 'fund').length,
    ereignisse,
  };
}

/* ------------------------------------------------------------ Neuer Haufen */

/** Nach der sechsten Nadel: alles auf Anfang, aber mit Bonus, Album und größerem Haufen. */
function neuerHaufen(s) {
  if (!alleNadeln(s)) return null;
  const neu = neuerStand(s.rng);
  neu.rng = s.rng;
  neu.erledigt = s.erledigt + 1;
  neu.lauf = s.lauf + 1;
  neu.haufen.gesamt = Math.round(s.haufen.gesamt * NEUER_HAUFEN_FAKTOR);
  neu.nadeln = nadelnVerstecken(neu, neu.haufen.gesamt);
  for (const [id, e] of Object.entries(s.funde)) neu.funde[id] = { n: 0, ges: e.ges };
  neu.stat = { ...s.stat };
  neu.zeitGesamt = (s.zeitGesamt || 0) + s.zeit;
  return neu;
}

/* ------------------------------------------------------------ Speichern */

function speichern(s, jetzt = Date.now()) {
  s.zuletzt = jetzt;
  return JSON.stringify(s);
}

/** Liest einen gespeicherten Stand; fehlende Felder kommen aus einem frischen Stand. */
function laden(text) {
  let roh;
  try { roh = JSON.parse(text); } catch { return null; }
  if (!roh || typeof roh !== 'object' || roh.version !== STAND_VERSION) return null;
  if (!Array.isArray(roh.nadeln) || roh.nadeln.length !== NADELN.length) return null;
  const s = neuerStand(roh.rng || 1);
  for (const [key, wert] of Object.entries(roh)) {
    if (wert && typeof wert === 'object' && !Array.isArray(wert) && s[key] && typeof s[key] === 'object'
      && !Array.isArray(s[key])) s[key] = { ...s[key], ...wert };
    else s[key] = wert;
  }
  s.rev = 0;
  return s;
}

// Zahlen so, wie man sie auf einem Handy lesen will: deutsch getrennt, große
// Beträge abgekürzt, Geld wie im Vorbild in Dollar.

const EINHEITEN = [
  [1e15, 'Brd.'], [1e12, 'Bio.'], [1e9, 'Mrd.'], [1e6, 'Mio.'],
];

const deutsch = (n, stellen) => n.toLocaleString('de-DE', {
  minimumFractionDigits: stellen, maximumFractionDigits: stellen,
});

function zahl(n) {
  if (!Number.isFinite(n)) return '–';
  const a = Math.abs(n);
  for (const [grenze, name] of EINHEITEN) {
    if (a >= grenze) return `${deutsch(n / grenze, a / grenze >= 100 ? 0 : a / grenze >= 10 ? 1 : 2)} ${name}`;
  }
  return deutsch(Math.floor(n + 1e-9), 0);
}

/** Wie zahl(), aber ohne Abkürzung bis 10 Millionen — für den Halmzähler. */
function halme(n) {
  if (Math.abs(n) < 1e7) return deutsch(Math.floor(n + 1e-9), 0);
  return zahl(n);
}

function geld(n) {
  if (!Number.isFinite(n)) return '–';
  if (Math.abs(n) < 100) return `${deutsch(n, 2)} $`;
  return `${zahl(n)} $`;
}

/** Raten mit einer Nachkommastelle, wenn sie klein sind. */
function rate(n) {
  if (n > 0 && n < 10) return deutsch(n, 1);
  return zahl(n);
}

function prozent(x) {
  return `${deutsch(Math.round(x * 100), 0)} %`;
}

function dauer(sek) {
  sek = Math.max(0, Math.round(sek));
  const h = Math.floor(sek / 3600);
  const m = Math.floor((sek % 3600) / 60);
  const s = sek % 60;
  if (h > 0) return `${h} h ${m} min`;
  if (m > 0) return `${m} min ${s} s`;
  return `${s} s`;
}

// Alle Geräusche werden erzeugt, nicht abgespielt: Rauschen für Heu, Sinus
// für Münzen, ein Rechteck für den Detektor. Keine Audiodateien.

let ctx = null;
let master = null;
let rauschPuffer = null;
let stumm = false;
let saugerTon = null;

function klangStumm(wert) {
  if (wert !== undefined) {
    stumm = !!wert;
    if (stumm) saugerAus();
  }
  return stumm;
}

/** Muss aus einer Nutzergeste heraus einmal aufgerufen werden (Autoplay-Regeln). */
function klangWecken() {
  if (ctx) {
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return;
  }
  const AC = typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext);
  if (!AC) return;
  try {
    ctx = new AC();
  } catch {
    ctx = null;
    return;
  }
  master = ctx.createGain();
  master.gain.value = 0.5;
  master.connect(ctx.destination);
  rauschPuffer = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const d = rauschPuffer.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}

const bereit = () => ctx && !stumm && ctx.state === 'running';

function ton(frequenz, dauer, { typ = 'sine', laut = 0.2, start = 0, gleiten = null } = {}) {
  const t = ctx.currentTime + start;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = typ;
  o.frequency.setValueAtTime(frequenz, t);
  if (gleiten) o.frequency.exponentialRampToValueAtTime(gleiten, t + dauer);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(laut, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
  o.connect(g).connect(master);
  o.start(t);
  o.stop(t + dauer + 0.02);
}

function rauschen(dauer, { frequenz = 3000, q = 1, laut = 0.25, start = 0, typ = 'bandpass' } = {}) {
  const t = ctx.currentTime + start;
  const quelle = ctx.createBufferSource();
  quelle.buffer = rauschPuffer;
  const filter = ctx.createBiquadFilter();
  filter.type = typ;
  filter.frequency.value = frequenz;
  filter.Q.value = q;
  const g = ctx.createGain();
  g.gain.setValueAtTime(laut, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
  quelle.connect(filter).connect(g).connect(master);
  quelle.start(t, Math.random() * 0.5);
  quelle.stop(t + dauer + 0.02);
}

const klang = {
  stich(krit = false) {
    if (!bereit()) return;
    rauschen(0.09, { frequenz: 2200 + Math.random() * 1800, q: 0.8, laut: 0.22 });
    rauschen(0.05, { frequenz: 600, q: 1.5, laut: 0.12, typ: 'lowpass' });
    if (krit) ton(1320, 0.18, { typ: 'triangle', laut: 0.12, start: 0.02 });
  },
  kasse() {
    if (!bereit()) return;
    rauschen(0.03, { frequenz: 5000, q: 2, laut: 0.15 });
    ton(1046, 0.12, { laut: 0.16, start: 0.02 });
    ton(1568, 0.25, { laut: 0.14, start: 0.09 });
  },
  piep(staerke) {
    if (!bereit()) return;
    ton(1400 + staerke * 900, 0.045, { typ: 'square', laut: 0.05 + staerke * 0.05 });
  },
  kauf() {
    if (!bereit()) return;
    ton(660, 0.06, { typ: 'triangle', laut: 0.14 });
    ton(990, 0.1, { typ: 'triangle', laut: 0.12, start: 0.05 });
  },
  fehler() {
    if (!bereit()) return;
    ton(160, 0.14, { typ: 'sawtooth', laut: 0.08, gleiten: 120 });
  },
  fund(rang = 0) {
    if (!bereit()) return;
    const noten = [784, 988, 1175, 1568, 1976];
    for (let i = 0; i <= rang; i++) ton(noten[i], 0.4, { laut: 0.1, start: i * 0.07 });
  },
  nadel() {
    if (!bereit()) return;
    [523, 659, 784, 1046, 1318].forEach((f, i) => ton(f, 0.6, { typ: 'triangle', laut: 0.16, start: i * 0.1 }));
    rauschen(1.2, { frequenz: 8000, q: 0.5, laut: 0.05, start: 0.4, typ: 'highpass' });
  },
  heiss() {
    if (!bereit()) return;
    rauschen(0.5, { frequenz: 1200, q: 3, laut: 0.15 });
    ton(300, 0.4, { typ: 'sawtooth', laut: 0.06, gleiten: 90 });
  },
};

function saugerAn() {
  if (!bereit() || saugerTon) return;
  const quelle = ctx.createBufferSource();
  quelle.buffer = rauschPuffer;
  quelle.loop = true;
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 900;
  const brumm = ctx.createOscillator();
  brumm.type = 'sawtooth';
  brumm.frequency.value = 95;
  const brummG = ctx.createGain();
  brummG.gain.value = 0.04;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, ctx.currentTime);
  g.gain.linearRampToValueAtTime(0.18, ctx.currentTime + 0.15);
  quelle.connect(filter).connect(g);
  brumm.connect(brummG).connect(g);
  g.connect(master);
  quelle.start();
  brumm.start();
  saugerTon = { quelle, brumm, g, filter };
}

function saugerHitze(h) {
  if (saugerTon) saugerTon.filter.frequency.value = 900 + h * 1400;
}

function saugerAus() {
  if (!saugerTon || !ctx) return;
  const { quelle, brumm, g } = saugerTon;
  saugerTon = null;
  g.gain.cancelScheduledValues(ctx.currentTime);
  g.gain.setValueAtTime(g.gain.value, ctx.currentTime);
  g.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.2);
  quelle.stop(ctx.currentTime + 0.25);
  brumm.stop(ctx.currentTime + 0.25);
}
