<style id="heuhaufen-css">
/* Heuhaufen — die Bedienung ist dunkel wie der Forschungsschirm des Vorbilds,
   das Bild selbst ist Tag: blauer Himmel über offenem Dach, Heugold, Holz.
   Bewusst einthemig, alles explizit gefärbt. */

:root {
  --grund: #12100d;
  --panel: #1d1914;
  --panel-2: #26211a;
  --naht: #3a3226;
  --text: #f4ecdc;
  --text-dim: #cbbd9f;
  --leise: #93846a;
  --heu: #e8b64c;
  --heu-hell: #f7da8a;
  --gruen: #8fd694;
  --rot: #ec6a4f;
  --orange: #ffb36b;
  --gold: #ffd24a;

  --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-schmal: 'Roboto Condensed', 'Arial Narrow', 'Helvetica Neue Condensed', system-ui, sans-serif;
  --font-display: 'Arial Black', 'Helvetica Neue', system-ui, sans-serif;
  --font-num: ui-monospace, SFMono-Regular, 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace;

  --r: 14px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --kopf-h: 54px;
  --reiter-h: 60px;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: none; background: var(--grund); }

body {
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
}

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--heu); outline-offset: 2px; }
[hidden] { display: none !important; }

.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.leise { color: var(--leise); }

.symhalter { display: inline-flex; width: 22px; height: 22px; flex: none; }
.sym { width: 100%; height: 100%; }

/* ---------- Gerüst ---------- */

#app {
  height: 100%;
  display: grid;
  grid-template-rows: calc(var(--kopf-h) + var(--safe-t)) minmax(0, 1fr) calc(var(--reiter-h) + var(--safe-b));
  grid-template-columns: minmax(0, 1fr);
  max-width: 760px;
  margin-inline: auto;
  overflow: hidden;
  position: relative;
}

.kopf {
  display: flex; align-items: center; gap: 8px;
  padding: var(--safe-t) 10px 0;
  background: linear-gradient(180deg, #0d0b09, #17130f);
  border-bottom: 1px solid var(--naht);
  min-width: 0;
}
.kopf > * { min-width: 0; }
.kasse { display: flex; align-items: center; gap: 5px; color: var(--heu-hell); font-weight: 700; flex: none; }
.kasse .symhalter { color: var(--heu); }
.kassetext { display: flex; flex-direction: column; line-height: 1.05; min-width: 0; }
.kassetext > span { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.schulden { font-size: 10px; color: var(--rot); white-space: nowrap; }
.schulden:empty { display: none; }
.zaehler { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.zaehler span { font-size: 14px; font-weight: 700; white-space: nowrap; }
.zaehler small { font-size: 9.5px; color: var(--leise); letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.nadelblock { display: flex; align-items: center; flex: none; }
.nadelreihe { display: flex; gap: 0; }
.nadelmarke { width: 11px; height: 11px; color: #6b5a45; }
.nadelmarke.gefunden { color: var(--heu-hell); filter: drop-shadow(0 0 3px rgba(247, 218, 138, 0.6)); }
.nadelmarke.gold { color: var(--gold); }
.nadelzahl { display: none; font-size: 13px; color: var(--heu-hell); font-weight: 700; }
.rund {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: var(--panel-2); border: 1px solid var(--naht); flex: none;
}

.buehne { min-height: 0; min-width: 0; overflow: hidden; position: relative; }
.bild { height: 100%; }

.reiter {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  padding-bottom: var(--safe-b);
  background: #0d0b09; border-top: 1px solid var(--naht);
}
.reiterknopf {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--leise); font-size: 11px; font-weight: 650; letter-spacing: 0.02em; min-width: 0;
}
.reiterknopf .symhalter { width: 24px; height: 24px; }
.reiterknopf.aktiv { color: var(--heu); }
.reiterknopf.aktiv::before {
  content: ''; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; border-radius: 0 0 3px 3px; background: var(--heu);
}
.reiterknopf.zu { opacity: 0.55; }
.marke {
  position: absolute; top: 6px; left: calc(50% + 8px);
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--rot); color: #fff; font-size: 11px; font-weight: 800; line-height: 18px; text-align: center;
  display: none;
}
.marke.sichtbar { display: block; animation: hops 0.4s ease; }
@keyframes hops { 40% { transform: translateY(-3px); } }

/* ---------- Knöpfe ---------- */

.knopf {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 8px 14px; border-radius: 12px;
  background: var(--panel-2); border: 1px solid var(--naht); color: var(--text);
  font-weight: 650; text-align: center;
}
.knopf:active:not(:disabled) { transform: scale(0.98); }
.knopf:disabled { opacity: 0.45; }
.knopf.primaer { background: linear-gradient(180deg, #f2c75c, #d49a30); border-color: #f7da8a; color: #2a1c08; }
.knopf.primaer:disabled { background: #2a251d; color: var(--leise); border-color: var(--naht); box-shadow: none; opacity: 1; }
.knopf.gefahr { background: #4a1e16; border-color: #7a3325; color: #ffcbbd; }
.knopf.breit { width: 100%; }
.knopf.klein { min-height: 40px; padding: 4px 10px; font-size: 13px; border-radius: 10px; }

/* ---------- Haufen ---------- */

.haufenbild { display: flex; flex-direction: column; }
.szene { position: relative; flex: 1; min-height: 0; }
.haufencanvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
.szeneoben { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.mission {
  display: flex; align-items: center; gap: 8px;
  background: rgba(18, 14, 10, 0.86); border: 1px solid var(--naht); border-radius: 12px; padding: 6px 10px;
}
.mission > .symhalter { width: 20px; height: 20px; color: var(--heu); }
.missionkern { flex: 1; min-width: 0; }
.missionzeile { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.missiontext { font-weight: 650; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.missionlohn { color: var(--gruen); white-space: nowrap; font-size: 12px; }
.missionbalken { height: 3px; border-radius: 2px; background: #3a3226; margin-top: 4px; overflow: hidden; }
.missionbalken .fuellung { height: 100%; background: var(--heu); width: 0; transition: width 0.2s; }
.hinweis {
  background: rgba(18, 14, 10, 0.86); border: 1px solid var(--naht); border-left: 3px solid var(--orange);
  border-radius: 10px; padding: 6px 10px; font-size: 12.5px; color: var(--text);
  display: none;
}
.hinweis.sichtbar { display: block; }
.szeneunten { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
.schildreihe { display: flex; align-items: flex-end; justify-content: flex-end; gap: 6px; min-width: 0; }
.maschinenzeile {
  margin-right: auto; font-size: 11px; font-weight: 700; color: var(--heu-hell); min-width: 0;
  background: rgba(18, 14, 10, 0.78); border-radius: 8px; padding: 3px 8px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto;
}
.balken.hitze { flex: 0 0 24%; }
.balken.hitze .fuellung { background: linear-gradient(90deg, rgba(255, 179, 107, 0.4), rgba(255, 90, 60, 0.8)); }
.balken.hitze.heiss { border-color: var(--rot); }
.werkzeugschild {
  flex: 0 1 auto; min-width: 0; font-size: 11px; color: var(--text); max-width: 100%;
  background: rgba(18, 14, 10, 0.78); border-radius: 8px; padding: 3px 8px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.balkenreihe { display: flex; gap: 6px; }
.balken {
  position: relative; height: 24px; border-radius: 12px; background: rgba(18, 14, 10, 0.86); border: 1px solid var(--naht);
  display: flex; align-items: center; gap: 6px; padding: 0 9px; overflow: hidden; font-size: 12px; font-weight: 700;
}
.balken .fuellung { position: absolute; left: 0; top: 0; bottom: 0; width: 0; transition: width 0.15s; }
.balken .symhalter, .balken span { position: relative; }
.balken .symhalter { width: 15px; height: 15px; }
.balken.tasche { flex: 1; }
.balken.tasche .fuellung { background: linear-gradient(90deg, rgba(232, 182, 76, 0.35), rgba(232, 182, 76, 0.65)); }
.balken.tasche .symhalter { color: var(--heu); }
.balken.tasche.voll { border-color: var(--orange); }
.balken.ausdauer { flex: 0 0 34%; }
.balken.ausdauer .fuellung { background: linear-gradient(90deg, rgba(143, 214, 148, 0.35), rgba(143, 214, 148, 0.7)); }
.balken.ausdauer .symhalter { color: var(--gruen); }
.balken.ausdauer.leer { border-color: var(--rot); }
.balken.dünn { height: 8px; padding: 0; border-radius: 4px; }
.balken.dünn .fuellung { background: var(--heu); }

.haufenseite { display: flex; flex-direction: column; background: var(--panel); border-top: 1px solid var(--naht); }
.detektorleiste {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px;
  font-size: 12px; color: var(--text-dim); min-width: 0;
}
.detektorleiste > .symhalter { width: 18px; height: 18px; color: #b58be8; }
.detektorleiste.aus { opacity: 0.6; }
.segmente { display: flex; gap: 2px; flex: none; }
.seg { width: 8px; height: 12px; border-radius: 2px; background: #4d3d2e; border: 1px solid #5d4c3a; }
.seg.an { background: #d9c24a; border-color: #d9c24a; box-shadow: 0 0 5px rgba(217, 194, 74, 0.5); }
.seg.heiss { background: var(--rot); border-color: var(--rot); box-shadow: 0 0 6px rgba(236, 106, 79, 0.7); }
.dtext { flex: 1; min-width: 0; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.werkzeugleiste { display: flex; gap: 4px; padding: 0 8px 6px; }
.wz {
  flex: 1 1 0; min-width: 0; min-height: 50px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--naht);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px 2px;
  font-size: 10px; color: var(--text-dim);
}
.wz .symhalter { width: 24px; height: 24px; color: var(--text); }
.wz span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wz.gewaehlt { border-color: var(--heu); background: linear-gradient(180deg, #4a3818, #2f230f); color: var(--heu-hell); box-shadow: inset 0 0 0 1px rgba(247, 218, 138, 0.25); }

.aktionen { display: flex; gap: 6px; padding: 0 8px 8px; }
.aktionen:empty { display: none; }
.aktion {
  position: relative; overflow: hidden; flex: 1 1 0; min-width: 0;
  display: flex; align-items: center; gap: 6px; min-height: 52px; padding: 6px 8px;
  border-radius: var(--r); background: var(--panel-2); border: 1px solid var(--naht); text-align: left;
}
.aktion.gross { flex: 1.5 1 0; }
.aktion .symhalter { width: 22px; height: 22px; color: var(--heu); }
.aktiontext { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; position: relative; }
.aktiontext .zeile1 { font-weight: 750; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aktiontext small { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aktion:disabled { opacity: 0.55; }
.aktion:active:not(:disabled) { transform: scale(0.98); }
.aktion.draengt { border-color: var(--heu); background: linear-gradient(180deg, #4a3818, #33260f); animation: winken 1.2s ease-in-out infinite; }
.aktion.ladungknopf { border-color: var(--gruen); background: linear-gradient(180deg, #243a26, #1a281b); }
.aktion.ladungknopf .symhalter { color: var(--gruen); }
.aktion .lauf { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: var(--heu); }

@keyframes winken { 50% { box-shadow: 0 0 0 3px rgba(232, 182, 76, 0.25); } }

/* ---------- Halle ---------- */

.hallenbild, .nadelbild { overflow-y: auto; padding: 0 12px 24px; -webkit-overflow-scrolling: touch; }
.hallenszene { height: clamp(160px, 24vh, 280px); margin: 10px 0; border-radius: var(--r); overflow: hidden; border: 1px solid var(--naht); }
.hallecanvas { width: 100%; height: 100%; display: block; }
.kennzahlen { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kz { background: var(--panel); border: 1px solid var(--naht); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.kz span { font-size: 10.5px; color: var(--leise); text-transform: uppercase; letter-spacing: 0.08em; }
.kz b { font-size: 16px; margin: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kz small { font-size: 11px; color: var(--text-dim); }
.kz.schlecht { border-color: #7a3325; }
.kz.schlecht b { color: var(--rot); }
.kz.engpass b { color: var(--orange); }
.kz-einnahmen b { color: var(--gruen); }
.warnungen p {
  margin: 8px 0 0; padding: 8px 10px; border-radius: 10px; font-size: 13px;
  background: #3a1d14; border: 1px solid #6b3425; color: #ffd2c4;
}
.gruppe { margin: 20px 2px 8px; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--leise); }

.auftragkarte, .ladungkarte {
  margin-top: 12px; background: var(--panel); border: 1px solid var(--naht); border-radius: var(--r); padding: 12px;
  display: flex; flex-direction: column; gap: 8px;
}
.auftragkarte { border-left: 3px solid #c9412e; }
.auftragkarte b { font-size: 15px; }
.auftragkarte small { color: var(--text-dim); font-size: 12.5px; }
.auftragknoepfe { display: flex; justify-content: flex-end; }
.kartenkopf { display: flex; align-items: center; gap: 10px; }
.kartenkopf .symhalter { width: 28px; height: 28px; color: var(--heu); }
.kartenkopf h3 { margin: 0; font-size: 16px; }
.kartenkopf .ober { margin: 0; }
.ladungkarte { border-left: 3px solid var(--gruen); margin-top: 12px; }
.ladungkarte p { margin: 0; font-size: 13.5px; color: var(--text-dim); }
.ladungkarte .kartenkopf .symhalter { color: var(--gruen); }

.mkarte {
  display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  background: var(--panel); border: 1px solid var(--naht); border-radius: var(--r);
  padding: 10px; margin-bottom: 8px;
}
.msym { width: 40px; height: 40px; color: var(--gruppenfarbe, var(--heu)); background: #16130f; border: 1px solid var(--naht); border-radius: 10px; padding: 6px; }
.mtext { min-width: 0; }
.mtext p { margin: 0; }
.mname { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.mname b { font-size: 15px; }
.anzahl { color: var(--heu); font-weight: 700; }
.mbeschr { font-size: 12px; color: var(--text-dim); }
.mstatus { font-size: 11.5px; color: var(--leise); margin-top: 2px !important; }
.mknoepfe { display: flex; flex-direction: column; gap: 5px; align-items: stretch; min-width: 100px; }
.mklein { display: flex; gap: 5px; }
.mklein .knopf { flex: 1; min-width: 0; padding-inline: 6px; }
.knopf.kaufen { font-size: 13px; }
.knopf.kaufen.ohneplatz { color: var(--orange); }
.knopf.klein.aus { color: var(--rot); }
.knopf.sperre { font-size: 11px; max-width: 132px; white-space: normal; line-height: 1.2; color: var(--text-dim); }
.mkarte.gesperrt { opacity: 0.62; }
.mkarte.gesperrt .msym { color: var(--leise); }
.mkarte.ausgeschaltet { border-style: dashed; }

.leerkarte { text-align: center; padding: 40px 18px; }
.leerkarte h2 { margin: 12px 0 8px; font-family: var(--font-display); letter-spacing: 0.01em; text-wrap: balance; }
.leerkarte p { color: var(--text-dim); margin: 0 0 10px; }
.grosssym { width: 72px; height: 72px; margin: 0 auto; color: var(--heu); opacity: 0.8; }

/* ---------- Forschung ---------- */

.forschungsbild { display: flex; flex-direction: column; position: relative; background: #0b0d0b; }
.forschungskopf {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px;
  background: #080a08; border-bottom: 1px solid #1f261f;
}
.fkopflinks { flex: none; }
.ober { margin: 0; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--heu); font-weight: 800; font-family: var(--font-schmal); }
.fortschritt { margin: 0; font-size: 11.5px; color: var(--text-dim); white-space: nowrap; }
.suchbox { flex: 1; min-width: 0; position: relative; }
.suche {
  width: 100%; height: 40px; border-radius: 8px; border: 1px solid #2a332a;
  background: #121612; color: var(--text); padding: 0 84px 0 10px; font: inherit; font-size: 13px;
  user-select: text; -webkit-user-select: text;
}
.suche::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.treffer { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--leise); pointer-events: none; }
.astchips { display: flex; gap: 6px; padding: 6px 10px; overflow-x: auto; background: #080a08; border-bottom: 1px solid #1f261f; scrollbar-width: none; }
.astchips::-webkit-scrollbar { display: none; }
.astchip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 3px 12px;
  border-radius: 999px; border: 1px solid #2a332a; background: #121612; font-size: 12px; color: var(--text-dim);
  font-family: var(--font-schmal); letter-spacing: 0.04em; text-transform: uppercase; font-weight: 700;
}
.astchip::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--astfarbe); }
.astchip .num { color: var(--gruen); font-size: 11px; }
.astchip.bereit { border-color: color-mix(in srgb, var(--astfarbe) 55%, #2a332a); color: var(--text); }
.baum { flex: 1; overflow: auto; position: relative; -webkit-overflow-scrolling: touch; }
.brettrahmen { position: relative; width: max-content; }
.baum.uebersicht .brettrahmen { zoom: 0.6; }
.baum.uebersicht .karte .astname, .baum.uebersicht .karte .stufe { display: none; }
.spaltenkopf {
  position: sticky; top: 0; z-index: 4; height: 28px;
  background: #080a08; border-bottom: 1px solid #1f261f;
}
.spaltenkopf span {
  position: absolute; top: 7px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--leise); font-weight: 700;
  font-family: var(--font-schmal);
}
.brett { position: relative; }
.linien { position: absolute; left: 0; top: 0; pointer-events: none; }
.linien path { fill: none; stroke: #2e3a2e; stroke-width: 1.6; }
.linien path.fremd { stroke-dasharray: 4 4; stroke: #253025; }
.linien path.offen { stroke: #8a7a3a; }
.band {
  position: absolute; left: 0; right: 0;
  background: linear-gradient(90deg, color-mix(in srgb, var(--astfarbe) 13%, transparent), color-mix(in srgb, var(--astfarbe) 4%, transparent) 70%);
  border-top: 1px solid color-mix(in srgb, var(--astfarbe) 25%, transparent);
}
.bandname {
  position: sticky; left: 0; top: 34px; display: inline-block; margin-top: 8px; padding: 6px 4px;
  writing-mode: vertical-rl; transform: rotate(180deg);
  font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 800; color: var(--astfarbe);
  font-family: var(--font-schmal); background: rgba(8, 10, 8, 0.85); border-radius: 0 6px 6px 0; z-index: 2;
}
.karte {
  position: absolute; padding: 5px 8px;
  display: flex; flex-direction: column; justify-content: space-between; text-align: left;
  background: #161a15; border: 1px solid #2d372c; border-radius: 4px;
  line-height: 1.12; z-index: 1;
}
.karte .astname { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--astfarbe); font-weight: 800; font-family: var(--font-schmal); }
.karte b { font-size: 12.5px; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.kartenfuss { display: flex; justify-content: space-between; font-size: 11px; }
.karte .preis { color: var(--text-dim); }
.karte.kaufbar .preis { color: var(--gruen); }
.karte .stufe { color: var(--leise); }
.karte.kompakt {
  flex-direction: row; align-items: center; gap: 6px; padding: 0 8px; border-radius: 0;
  border-top: 0; background: #121611;
}
.karte.kompakt b { flex: 1; font-size: 11.5px; font-weight: 600; -webkit-line-clamp: 1; }
.karte.kompakt .preis, .karte.kompakt .stufe { font-size: 10.5px; flex: none; }
.gruppenkopf {
  position: absolute; padding: 0 8px; display: flex; align-items: center;
  background: #1a2019; border: 1px solid #2d372c; border-bottom: 0; border-radius: 4px 4px 0 0;
  font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--astfarbe); font-weight: 800;
  font-family: var(--font-schmal); z-index: 1;
}
.karte.gesperrt { opacity: 0.45; }
.karte.kaufbar { border-color: #6d9a4a; box-shadow: 0 0 0 1px rgba(143, 214, 148, 0.22), 0 0 12px rgba(143, 214, 148, 0.1); z-index: 2; }
.karte.begonnen { background: #1c1f14; }
.karte.max { background: #211f12; border-color: #6b5a27; }
.karte.max .preis { color: var(--heu); }
.karte.gewaehlt { outline: 2px solid var(--heu); outline-offset: 1px; z-index: 3; }
.karte.blass { opacity: 0.14; }
.karte.gekauft { animation: gekauft 0.45s ease; }
@keyframes gekauft { 30% { transform: scale(1.06); box-shadow: 0 0 0 3px rgba(143, 214, 148, 0.6); } }

.blatt {
  position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 6;
  background: var(--panel); border: 1px solid var(--naht); border-radius: 18px; padding: 12px 14px 14px;
  box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.55);
  transform: translateY(calc(100% + 24px)); visibility: hidden; transition: transform 0.22s ease, visibility 0.22s;
  max-height: 70%; overflow-y: auto;
}
.blatt.offen { transform: none; visibility: visible; }
.blattkopf { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; border-left: 3px solid var(--astfarbe); padding-left: 10px; }
.blattkopf .astname { margin: 0; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--astfarbe); font-weight: 800; font-family: var(--font-schmal); }
.blattkopf h3 { margin: 2px 0 0; font-size: 19px; text-wrap: balance; }
.blatttext { margin: 10px 0 4px; color: var(--text-dim); font-size: 14px; }
.blattstufe { margin: 0 0 8px; font-size: 13px; color: var(--leise); }
.voraus { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.voraus button {
  display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; min-height: 36px; padding: 3px 10px 3px 6px; border-radius: 999px;
  border: 1px solid var(--naht);
}
.voraus .symhalter { width: 15px; height: 15px; }
.voraus .erfuellt { color: var(--gruen); }
.voraus .fehlt { color: var(--orange); }

/* ---------- Nadeln ---------- */

.nadelgitter { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.nadelkarte, .sammelkarte {
  background: var(--panel); border: 1px dashed var(--naht); border-radius: 12px; padding: 8px;
  display: flex; flex-direction: column; align-items: center; text-align: center; line-height: 1.2; min-width: 0;
}
.nadelkarte { min-height: 100px; }
.nsym { width: 34px; height: 34px; color: #5a4a38; margin-bottom: 4px; }
.nadelkarte b, .sammelkarte b { font-size: 12px; }
.sammelkarte b { padding: 0 6px; hyphens: auto; -webkit-hyphens: auto; overflow-wrap: anywhere; }
.nadelkarte small, .sammelkarte small { font-size: 10.5px; color: var(--leise); margin-top: 2px; }
.nadelkarte.gefunden, .sammelkarte.gefunden { border-style: solid; border-color: #6b5327; background: #241e12; }
.nadelkarte.gefunden .nsym, .sammelkarte.gefunden .nsym { color: var(--heu-hell); filter: drop-shadow(0 0 4px rgba(247, 218, 138, 0.5)); }
.nadelkarte.gold .nsym { color: var(--gold); }
.sammlung { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.sammelkarte .nsym { width: 26px; height: 26px; }

.werte { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 13px; }
.werte dt { color: var(--leise); }
.werte dd { margin: 0; text-align: right; }

/* ---------- Toasts und Modals ---------- */

.toasts {
  position: absolute; left: 12px; right: 12px; top: calc(var(--kopf-h) + var(--safe-t) + 8px);
  display: flex; flex-direction: column; gap: 6px; z-index: 20; pointer-events: none;
}
.toast {
  background: rgba(29, 25, 20, 0.97); border: 1px solid var(--naht); border-left: 3px solid var(--heu);
  border-radius: 10px; padding: 8px 12px; font-size: 13px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
  animation: rein 0.2s ease; transition: opacity 0.35s, transform 0.35s;
}
.toast.weg { opacity: 0; transform: translateY(-6px); }
.toast.warn { border-left-color: var(--rot); }
.toast.gut { border-left-color: var(--gruen); }
/* Toast und Mission teilen sich den Platz oben im Bild. */
.toastan .szeneoben .mission { visibility: hidden; }
@keyframes rein { from { opacity: 0; transform: translateY(-8px); } }

.modalhalter { display: none; }
.modalhalter.offen {
  display: flex; position: absolute; inset: 0; z-index: 30; align-items: center; justify-content: center; padding: 16px;
}
.schleier { position: absolute; inset: 0; background: rgba(6, 4, 2, 0.72); }
.modal {
  position: relative; width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--naht); border-radius: 20px; padding: 20px 18px 0;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); animation: auf 0.22s ease;
}
@keyframes auf { from { opacity: 0; transform: scale(0.96); } }
.modal h2 { margin: 4px 0 10px; font-family: var(--font-display); font-size: 24px; letter-spacing: 0.01em; color: var(--heu-hell); text-wrap: balance; }
.modal p { margin: 0 0 10px; color: var(--text-dim); text-wrap: pretty; }
.modalknoepfe {
  display: flex; flex-direction: column; gap: 8px; margin: 14px -18px 0; padding: 12px 18px 16px;
  position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid transparent;
  box-shadow: 0 -18px 16px -6px var(--panel);
}
.menuemodal .modalknoepfe .knopf { justify-content: flex-start; }
.intromodal::before {
  content: ''; display: block; height: 92px; margin: -20px -18px 14px; border-radius: 20px 20px 0 0;
  background:
    radial-gradient(120px 60px at 50% 118%, #e3a948 60%, transparent 61%),
    radial-gradient(30px 30px at 82% 30%, #fff5c9 40%, transparent 70%),
    linear-gradient(180deg, #4f93d6, #bfe0f5);
}
.anleitung { margin: 4px 0 0; padding-left: 18px; color: var(--text); font-size: 14px; }
.anleitung li { margin-bottom: 4px; }
.nadelgross { width: 84px; height: 84px; margin: 4px auto 10px; color: var(--heu-hell); filter: drop-shadow(0 0 10px rgba(247, 218, 138, 0.6)); animation: glanz 2s ease-in-out infinite; }
.nadelmodal .nadelgross { color: #d9e2e8; filter: drop-shadow(0 0 10px rgba(217, 226, 232, 0.6)); }
.nadelmodal.gold .nadelgross, .nadelmodal.gold h2 { color: var(--gold); }
.nadelmodal.gold .nadelgross { filter: drop-shadow(0 0 14px rgba(255, 210, 74, 0.8)); }
.modal.nadelmodal.gold {
  border-color: var(--gold); box-shadow: 0 0 0 2px #ffd24a55, 0 0 40px #ffd24a40;
  background-image: repeating-conic-gradient(from 0deg at 50% 64px, rgba(255, 210, 74, 0.09) 0 8deg, transparent 8deg 20deg);
}
@keyframes glanz { 50% { filter: drop-shadow(0 0 18px rgba(247, 218, 138, 0.9)); transform: rotate(-6deg); } }
.geschichte { font-style: italic; }
.bonus { color: var(--heu) !important; font-weight: 700; }
.endemodal .werte { margin-top: 6px; }

/* ---------- Schmal, breit, quer ---------- */

@media (max-width: 359px) {
  .nadelreihe { display: none; }
  .nadelzahl { display: inline; }
  .kassetext > span { font-size: 13px; }
  .wz span:last-child { display: none; }
  .wz { min-height: 44px; }
  .aktion .symhalter { display: none; }
}

@media (min-height: 760px) {
  .hallenszene { height: clamp(190px, 24vh, 300px); }
}

@media (orientation: landscape) and (max-height: 520px) {
  :root { --kopf-h: 44px; --reiter-h: 48px; }
  .reiterknopf { flex-direction: row; gap: 6px; }
  .haufenbild { display: grid; grid-template-columns: minmax(0, 1fr) minmax(250px, 36%); }
  .haufenseite { border-top: 0; border-left: 1px solid var(--naht); overflow-y: auto; justify-content: flex-start; padding-top: 6px; }
  .werkzeugleiste { flex-wrap: wrap; }
  .wz { flex: 1 1 30%; min-height: 44px; }
  .aktionen { flex-wrap: wrap; }
  .aktion { flex: 1 1 45%; }
  .blatt { left: auto; width: min(360px, 60%); top: 8px; max-height: none; }
  .toasts { left: 12px; right: auto; width: calc(64% - 24px); }
  .marke { position: relative; left: auto; top: -7px; margin-left: -2px; }
  .toast:nth-child(n + 2) { display: none; }
  .hallenszene { height: 130px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

// Spiellogik ohne DOM: ein Stand-Objekt, das sich als JSON speichern lässt,
// und reine Funktionen darauf. Zufall kommt aus einem eigenen Generator im
// Stand, damit Tests und Simulation reproduzierbar bleiben.


const STAND_VERSION = 3;
const TECH_NACH_ID = Object.fromEntries(TECH.map((t) => [t.id, t]));
const MASCHINE_NACH_ID = Object.fromEntries(MASCHINEN.map((m) => [m.id, m]));
/** Welcher Knoten schaltet was frei: frei-Name → Knoten-ID. */
const PLAN_FUER = Object.fromEntries(TECH.flatMap((t) => t.effekt.filter((e) => e[0] === 'frei').map((e) => [e[1], t.id])));
const WERKZEUG_NACH_ID = Object.fromEntries(WERKZEUGE.map((w) => [w.id, w]));
const TECH_STUFEN_GESAMT = TECH.reduce((n, t) => n + (t.id === 'scheune' ? 0 : t.stufen), 0);
const NADELN_JE_LADUNG = NADEL_BEREICHE.length;

/** Strom, den die Halle auch ohne Generator hat (eine Handkurbel in der Ecke). */
const GRUNDSTROM = 5;
/** Wie tief eine übersehene Nadel höchstens zurückrutscht, als Anteil des Haufens. */
const NADEL_RUTSCH = 0.03;
const DROHNE_KOSTEN = 55;
const DROHNE_FAKTOR = 1.35;

/* ------------------------------------------------------------ Zufall */

/** mulberry32: klein, schnell, und der ganze Zustand ist eine Zahl im Stand. */
function zufall(s) {
  s.rng = (s.rng + 0x6d2b79f5) | 0;
  let t = s.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

/* ------------------------------------------------------------ Ladungen */

function ladungGroesse(nr) {
  if (nr <= LADUNGEN.length) return LADUNGEN[nr - 1];
  return Math.round(LADUNGEN[LADUNGEN.length - 1] * Math.pow(LADUNG_WACHSTUM, nr - LADUNGEN.length));
}

function ladungPreis(s) {
  return Math.round(LADUNG_PREIS * Math.pow(LADUNG_PREIS_FAKTOR, s.ladung - 1));
}

/** Welche Nadelarten in Ladung nr stecken: erst die 24 der Reihe nach, danach gemischt. */
function nadelArten(s, nr) {
  const start = (nr - 1) * NADELN_JE_LADUNG;
  if (start + NADELN_JE_LADUNG <= NADELN.length) {
    return Array.from({ length: NADELN_JE_LADUNG }, (_, i) => start + i);
  }
  const arten = NADELN.map((_, i) => i);
  for (let i = arten.length - 1; i > 0; i--) {
    const j = Math.floor(zufall(s) * (i + 1));
    [arten[i], arten[j]] = [arten[j], arten[i]];
  }
  return arten.slice(0, NADELN_JE_LADUNG);
}

function nadelnVerstecken(s, nr, gesamt) {
  const arten = nadelArten(s, nr);
  return NADEL_BEREICHE.map(([von, bis], i) => ({
    art: arten[i],
    tiefe: Math.round(gesamt * (von + zufall(s) * (bis - von))),
    zustand: 'versteckt',
    zeit: null,
  }));
}

function neuerStand(seed = Date.now()) {
  const s = {
    version: STAND_VERSION,
    rng: seed | 0,
    rev: 0,
    zeit: 0,
    aktiv: 0,
    geld: 0,
    verdient: 0,
    schulden: 0,
    ladung: 1,
    haufen: { gesamt: ladungGroesse(1), entfernt: 0 },
    werkzeug: 'spaten',
    tasche: 0,
    laufen: 0,
    laufVoll: 0,
    autoRest: 0,
    ausdauer: GRUND.ausdauer,
    boden: 0,
    tech: { scheune: 1 },
    maschinen: {},
    aus: {},
    drohnen: 0,
    nadeln: [],
    arten: {},
    nadelnGesamt: 0,
    sauger: { an: false, hitze: 0, heiss: false },
    radar: { rest: 0, abstand: null, zeit: null },
    auftrag: { nr: 0, skip: 0, geliefert: 0, pause: 0 },
    mission: 0,
    stat: {
      tipps: 0, hand: 0, drohne: 0, maschine: 0, gaenge: 0, verkauft: 0, gefegt: 0,
      abgetragen: 0, auftraege: 0, besterVerkauf: 0, maxGeld: 0, ersteNadel: null, ersteLadung: null,
      produziert: {}, werkzeug: {},
    },
    zuletzt: Date.now(),
  };
  s.nadeln = nadelnVerstecken(s, 1, s.haufen.gesamt);
  return s;
}

const rest = (s) => Math.max(0, s.haufen.gesamt - s.haufen.entfernt);
const nadelnGefunden = (s) => s.nadeln.filter((n) => n.zustand === 'gefunden').length;
const alleNadeln = (s) => s.nadeln.every((n) => n.zustand === 'gefunden');
const artenGefunden = (s) => Object.values(s.arten).filter((n) => n > 0).length;

/* ------------------------------------------------------------ Werte */

const cache = new WeakMap();

/** Alle abgeleiteten Zahlen: Grundwerte, darauf Forschung und gesammelte Nadelarten. */
function werte(s) {
  const alt = cache.get(s);
  if (alt && alt.rev === s.rev) return alt.w;

  const plus = {};
  const mal = {};
  const frei = new Set();
  const anwenden = (effekte, n) => {
    for (const e of effekte) {
      if (e[0] === 'frei') { frei.add(e[1]); continue; }
      if (e[1] === '+') plus[e[0]] = (plus[e[0]] || 0) + e[2] * n;
      else mal[e[0]] = (mal[e[0]] || 1) * Math.pow(e[2], n);
    }
  };
  for (const t of TECH) {
    const n = s.tech[t.id] || 0;
    if (n > 0) anwenden(t.effekt, Math.min(n, t.stufen));
  }
  // Jede Nadelart zählt einmal, egal wie oft man sie gefunden hat.
  for (const [art, n] of Object.entries(s.arten)) if (n > 0 && NADELN[art]) anwenden(NADELN[art].effekt, 1);

  const w = { ...GRUND };
  for (const key of new Set([...Object.keys(plus), ...Object.keys(mal)])) {
    const basis = key in GRUND ? GRUND[key] : (key in plus ? 0 : 1);
    w[key] = (basis + (plus[key] || 0)) * (mal[key] || 1);
  }
  w.frei = frei;
  cache.set(s, { rev: s.rev, w });
  return w;
}

const faktor = (w, key) => (key in w ? w[key] : 1);

const taschePlatz = (w) => Math.floor(w.tasche);
const preisRoh = (w) => w.preisRoh * w.preisAlle;
const hatBand = (w) => w.frei.has('band');

function produktPreis(w, p) {
  if (p === 'roh') return preisRoh(w);
  return PRODUKTE[p].wert * (w.preisRoh / GRUND.preisRoh) * w.preisAlle * w.preisProdukt * faktor(w, 'preis_' + p);
}

/** Halme pro Stich mit dem Werkzeug, ohne Ausdauer und Glück. */
function stichMenge(w, werkzeug) {
  if (werkzeug === 'heugabel') return w.griff * w.heugabel;
  if (werkzeug === 'sandschaufel') return w.griff * w.sandschaufel;
  return w.griff;
}

/** Das beste Grabwerkzeug, das man hat — für Muskelgedächtnis und Anzeige. */
const bestesWerkzeug = (w) => (w.frei.has('heugabel') ? 'heugabel' : 'spaten');

function werkzeugFrei(s, id) {
  const wz = WERKZEUG_NACH_ID[id];
  return !!wz && (wz.frei === null || werte(s).frei.has(wz.frei));
}

/* ------------------------------------------------------------ Geld */

/** Jede Einnahme läuft hier durch: Schulden werden zuerst anteilig getilgt. */
function einnahme(s, betrag) {
  if (!(betrag > 0)) return 0;
  s.verdient += betrag;
  if (s.schulden > 0) {
    const tilgung = Math.min(s.schulden, betrag * KREDIT_TILGUNG);
    s.schulden -= tilgung;
    betrag -= tilgung;
    if (s.schulden < 1e-6) s.schulden = 0;
  }
  s.geld += betrag;
  if (s.geld > s.stat.maxGeld) s.stat.maxGeld = s.geld;
  return betrag;
}

/* ------------------------------------------------------------ Haufen abtragen */

function nadelFinden(s, i, ereignisse) {
  const nd = s.nadeln[i];
  // Die Arten werden in der Reihenfolge des Findens vergeben, damit die
  // Geschichte stimmt, auch wenn eine zurückgefallene Nadel eine andere überholt.
  for (const andere of s.nadeln) {
    if (andere !== nd && andere.zustand === 'versteckt' && andere.art < nd.art) {
      [andere.art, nd.art] = [nd.art, andere.art];
    }
  }
  nd.zustand = 'gefunden';
  nd.zeit = s.aktiv;
  s.arten[nd.art] = (s.arten[nd.art] || 0) + 1;
  s.nadelnGesamt++;
  if (s.stat.ersteNadel == null) s.stat.ersteNadel = s.aktiv;
  s.rev++;
  ereignisse.push({
    typ: 'nadel', i, art: nd.art, nr: nadelnGefunden(s), alle: alleNadeln(s), ladung: s.ladung,
    neu: s.arten[nd.art] === 1,
  });
}

/**
 * Nimmt Halme vom Haufen. quelle: 'hand' und 'drohne' sehen jede Nadel;
 * 'maschine' nur mit der Wahrscheinlichkeit der Scannerabdeckung. Eine
 * übersehene Nadel wird mit dem Heu verkauft — und landet wie im Vorbild
 * wieder irgendwo im restlichen Haufen.
 */
function abtragen(s, menge, quelle, ereignisse = [], deckung = 1) {
  const vorher = s.haufen.entfernt;
  menge = Math.min(menge, rest(s));
  if (!(menge > 0)) return 0;
  const nachher = vorher + menge;
  s.haufen.entfernt = nachher;
  s.stat[quelle] = (s.stat[quelle] || 0) + menge;
  s.stat.abgetragen += menge;

  s.nadeln.forEach((nd, i) => {
    if (nd.zustand !== 'versteckt' || nd.tiefe <= vorher || nd.tiefe > nachher) return;
    if (quelle !== 'maschine' || zufall(s) < deckung) { nadelFinden(s, i, ereignisse); return; }
    // Sie rutscht nicht bis ganz nach unten, sondern landet in den nächsten
    // paar Prozent des Haufens.
    const uebrig = Math.min(s.haufen.gesamt - nachher, s.haufen.gesamt * NADEL_RUTSCH);
    if (uebrig < 1) { nadelFinden(s, i, ereignisse); return; }
    nd.tiefe = Math.min(s.haufen.gesamt, nachher + Math.max(1, Math.round(zufall(s) * uebrig)));
    ereignisse.push({ typ: 'zurueck', i });
  });
  return menge;
}

/* ------------------------------------------------------------ Hände und Werkzeug */

function werkzeugWaehlen(s, id) {
  if (!werkzeugFrei(s, id)) return false;
  s.werkzeug = id;
  if (id !== 'sauger') s.sauger.an = false;
  return true;
}

/** Legt Halme ab: mit Förderband direkt aufs Band und verkauft, sonst in die Tasche. */
function ablegen(s, w, menge) {
  if (hatBand(w)) {
    const betrag = menge * preisRoh(w);
    einnahme(s, betrag);
    s.stat.verkauft += menge;
    return betrag;
  }
  s.tasche += menge;
  return 0;
}

function platzFuerHand(s, w) {
  return hatBand(w) ? Infinity : Math.max(0, taschePlatz(w) - s.tasche);
}

/**
 * Ein Stich in den Haufen mit dem gewählten Werkzeug. auto: Muskelgedächtnis,
 * kostet keine Ausdauer. Liefert null, wenn gerade niemand da ist.
 */
function stich(s, ereignisse = [], { auto = false } = {}) {
  if (s.laufen > 0) return null;
  const w = werte(s);
  const wz = auto ? bestesWerkzeug(w) : s.werkzeug;
  if (!auto) s.stat.werkzeug[wz] = (s.stat.werkzeug[wz] || 0) + 1;

  if (wz === 'detektor') return { menge: 0, detektor: true, ereignisse };
  if (wz === 'sauger') return { menge: 0, sauger: true, ereignisse };
  if (wz === 'besen') return fegen(s, w, ereignisse);

  if (rest(s) <= 0) return { menge: 0, leer: true, ereignisse };
  const frei = platzFuerHand(s, w);
  if (frei <= 0) return { menge: 0, voll: true, ereignisse };

  let menge = stichMenge(w, wz);
  let muede = false;
  if (!auto && wz !== 'sandschaufel') {
    if (s.ausdauer >= w.ausdauerKosten) s.ausdauer -= w.ausdauerKosten;
    else { menge *= w.erschoepft; muede = true; }
  }
  const krit = w.krit > 0 && zufall(s) < w.krit;
  if (krit) menge *= w.kritFaktor;
  menge = Math.min(menge, frei);
  // Etwas fällt immer daneben; ohne Besen hört das Verschütten irgendwann auf.
  const daneben = w.frei.has('besen') || s.boden < 400 ? menge * w.verschuetten : 0;
  const weg = abtragen(s, menge + daneben, 'hand', ereignisse);
  const inHand = Math.min(menge, weg);
  s.boden += weg - inHand;
  const betrag = ablegen(s, w, inHand);
  if (!auto) s.stat.tipps++;
  return {
    menge: inHand, betrag, krit, muede,
    voll: !hatBand(w) && s.tasche >= taschePlatz(w), ereignisse,
  };
}

function fegen(s, w, ereignisse) {
  if (s.boden < 0.5) return { menge: 0, nichts: true, ereignisse };
  const menge = Math.min(s.boden, w.besen, platzFuerHand(s, w));
  if (menge <= 0) return { menge: 0, voll: true, ereignisse };
  s.boden -= menge;
  s.stat.gefegt += menge;
  const betrag = ablegen(s, w, menge);
  return { menge, betrag, gefegt: true, voll: !hatBand(w) && s.tasche >= taschePlatz(w), ereignisse };
}

function saugen(s, an) {
  const w = werte(s);
  s.sauger.an = !!an && w.frei.has('sauger') && s.werkzeug === 'sauger' && !s.sauger.heiss;
}

/** Warum der Sauger gerade nichts tut, oder null. */
function saugerBlockiert(s) {
  const w = werte(s);
  if (s.sauger.heiss) return 'heiss';
  if (s.laufen > 0) return 'unterwegs';
  if (rest(s) <= 0) return 'leer';
  if (platzFuerHand(s, w) <= 0) return 'voll';
  return null;
}

/** Los zum Stand. Bezahlt wird bei der Ankunft (siehe tick). */
function verkaufen(s) {
  if (s.laufen > 0 || s.tasche <= 0) return false;
  s.laufen = Math.max(0.05, werte(s).laufzeit);
  s.laufVoll = s.laufen;
  s.sauger.an = false;
  return true;
}

function ankommen(s, ereignisse) {
  const w = werte(s);
  const betrag = s.tasche * preisRoh(w);
  einnahme(s, betrag);
  s.stat.verkauft += s.tasche;
  if (s.tasche > s.stat.besterVerkauf) s.stat.besterVerkauf = s.tasche;
  ereignisse.push({ typ: 'verkauft', menge: s.tasche, betrag });
  s.tasche = 0;
  s.stat.gaenge++;
}

/* ------------------------------------------------------------ Drohnen */

function drohnenKosten(s) {
  return Math.ceil(DROHNE_KOSTEN * Math.pow(DROHNE_FAKTOR, s.drohnen));
}

function drohneKaufen(s) {
  const w = werte(s);
  if (!w.frei.has('drohne')) return { ok: false, grund: 'gesperrt' };
  if (s.drohnen >= w.drohnenMax) return { ok: false, grund: 'voll' };
  const preis = drohnenKosten(s);
  if (s.geld < preis) return { ok: false, grund: 'geld' };
  s.geld -= preis;
  s.drohnen++;
  return { ok: true };
}

/* ------------------------------------------------------------ Forschung */

const techStufe = (s, id) => s.tech[id] || 0;

/** Rundet erst das Gleitkommarauschen weg, dann auf 10 Cent bzw. ganze Dollar. */
function preisRunden(c) {
  c = Math.round(c * 1e6) / 1e6;
  return c < 100 ? Math.ceil(c * 10) / 10 : Math.ceil(c);
}

function techKosten(s, id) {
  const t = TECH_NACH_ID[id];
  if (!t) return Infinity;
  return preisRunden(t.kosten * Math.pow(t.faktor, techStufe(s, id)));
}

const techOffen = (s, id) => !!TECH_NACH_ID[id] && TECH_NACH_ID[id].braucht.every((b) => techStufe(s, b) > 0);

/** 'max' | 'kaufbar' | 'teuer' | 'gesperrt' */
function techStatus(s, id) {
  const t = TECH_NACH_ID[id];
  if (!t) return 'gesperrt';
  if (techStufe(s, id) >= t.stufen) return 'max';
  if (!techOffen(s, id)) return 'gesperrt';
  return s.geld >= techKosten(s, id) ? 'kaufbar' : 'teuer';
}

function techKaufen(s, id) {
  const status = techStatus(s, id);
  if (status !== 'kaufbar') return { ok: false, grund: status };
  s.geld -= techKosten(s, id);
  if (s.geld < 0 && s.geld > -1e-9) s.geld = 0;
  s.tech[id] = techStufe(s, id) + 1;
  s.rev++;
  return { ok: true };
}

const techGekauft = (s) => TECH.reduce((n, t) => n + (t.id === 'scheune' ? 0 : Math.min(techStufe(s, t.id), t.stufen)), 0);

/** Schritte vom Start: der längste Weg über alle Voraussetzungen. */
const TECH_SCHRITTE = (() => {
  const schritte = {};
  const tiefe = (id) => {
    if (id in schritte) return schritte[id];
    const t = TECH_NACH_ID[id];
    schritte[id] = t.braucht.length ? 1 + Math.max(...t.braucht.map(tiefe)) : 0;
    return schritte[id];
  };
  for (const t of TECH) tiefe(t.id);
  return schritte;
})();

/** Maße im Forschungsbaum in Zeileneinheiten. */
const BAUM_MASS = { karte: 0.82, zeile: 0.42, kopf: 0.36, luecke: 0.2, astLuecke: 0.6 };

/**
 * Lage im Forschungsbaum: die Spalte ist die Zahl der Schritte vom Start, die
 * Zeile kommt aus einem ordentlich gelegten Baum je Ast (Blätter untereinander,
 * Eltern mittig neben ihren Kindern). Upgrades mit gleicher Gruppe stehen wie
 * im Vorbild als schmale Zeilen unter einer Überschrift.
 * Liefert { lage: {id: {x, y, h}}, gruppen: [{name, ast, x, y, ids}], aeste, hoehe, breite }.
 */
function techLage(aeste) {
  const M = BAUM_MASS;
  const lage = {};
  const gruppen = [];
  const baender = [];

  // Ein Block ist ein fertig gelegter Teilbaum mit eigener Umrisslinie je Spalte.
  // Blöcke werden untereinander gestapelt und rücken so weit nach oben, wie ihre
  // Spalten es zulassen: ein kurzer Ast braucht dann keine eigene Zeile über die ganze Breite.
  const block = () => ({ karten: [], koepfe: [], oben: new Map(), unten: new Map(), anker: 0 });
  const belege = (bl, x, y, h) => {
    bl.oben.set(x, Math.min(bl.oben.has(x) ? bl.oben.get(x) : Infinity, y));
    bl.unten.set(x, Math.max(bl.unten.has(x) ? bl.unten.get(x) : -Infinity, y + h));
  };
  const schiebe = (bl, d) => {
    for (const k of bl.karten) k.y += d;
    for (const k of bl.koepfe) k.y += d;
    for (const [x, v] of bl.oben) bl.oben.set(x, v + d);
    for (const [x, v] of bl.unten) bl.unten.set(x, v + d);
    bl.anker += d;
  };
  const stapeln = (bloecke) => {
    const ges = block();
    const anker = [];
    let zuletzt = 0;
    for (const bl of bloecke) {
      let d = zuletzt;
      for (const [x, v] of bl.oben) {
        if (ges.unten.has(x)) d = Math.max(d, ges.unten.get(x) + M.luecke - v);
      }
      schiebe(bl, d);
      zuletzt = d;
      ges.karten.push(...bl.karten);
      ges.koepfe.push(...bl.koepfe);
      for (const [x, v] of bl.oben) belege(ges, x, v, bl.unten.get(x) - v);
      anker.push(bl.anker);
    }
    ges.anker = anker.length ? (anker[0] + anker[anker.length - 1]) / 2 : 0;
    return ges;
  };

  for (const ast of aeste) {
    const knoten = TECH.filter((t) => t.ast === ast.id);
    if (!knoten.length) continue;
    const imAst = new Set(knoten.map((t) => t.id));
    const vater = (t) => t.braucht.find((b) => imAst.has(b)) || null;
    // Gruppen nach hinten, damit die großen Karten oben stehen.
    const ordnen = (ks) => ks.sort((a, b) => (a.gruppe ? 1 : 0) - (b.gruppe ? 1 : 0));

    const einheiten = (ks) => {
      const liste = [];
      for (let i = 0; i < ks.length;) {
        const kk = ks[i];
        if (kk.gruppe) {
          let j = i;
          const ids = [];
          while (j < ks.length && ks[j].gruppe === kk.gruppe) ids.push(ks[j++].id);
          const x = Math.max(...ids.map((id) => TECH_SCHRITTE[id]));
          const bl = block();
          bl.koepfe.push({ name: kk.gruppe, ast: ast.id, x, y: 0, ids });
          ids.forEach((id, n) => bl.karten.push({ id, x, y: M.kopf + n * M.zeile, h: M.zeile }));
          const hoch = M.kopf + ids.length * M.zeile;
          belege(bl, x, 0, hoch);
          bl.anker = hoch / 2;
          liste.push(bl);
          i = j;
        } else {
          liste.push(teilbaum(kk));
          i++;
        }
      }
      return liste;
    };
    const teilbaum = (t) => {
      const x = TECH_SCHRITTE[t.id];
      const ks = ordnen(knoten.filter((kk) => vater(kk) === t.id));
      if (!ks.length) {
        const bl = block();
        bl.karten.push({ id: t.id, x, y: 0, h: M.karte });
        belege(bl, x, 0, M.karte);
        bl.anker = M.karte / 2;
        return bl;
      }
      const bl = stapeln(einheiten(ks));
      const y = bl.anker - M.karte / 2;
      bl.karten.push({ id: t.id, x, y, h: M.karte });
      belege(bl, x, y, M.karte);
      const oberkante = Math.min(...bl.oben.values());
      if (oberkante < 0) schiebe(bl, -oberkante);
      return bl;
    };

    const von = baender.length ? baender[baender.length - 1].bis + M.astLuecke : 0;
    const bl = stapeln(einheiten(ordnen(knoten.filter((kk) => !vater(kk)))));
    schiebe(bl, von - Math.min(...bl.oben.values()));
    for (const k of bl.karten) lage[k.id] = { x: k.x, y: k.y, h: k.h };
    gruppen.push(...bl.koepfe);
    baender.push({ ast: ast.id, von, bis: Math.max(...bl.unten.values()) });
  }
  const hoehe = baender[baender.length - 1].bis;
  const erster = baender[0];
  lage.scheune = { x: 0, y: (erster.von + erster.bis) / 2 - M.karte / 2, h: M.karte };
  const breite = Math.max(...Object.values(lage).map((l) => l.x)) + 1;
  return { lage, gruppen, aeste: baender, hoehe, breite };
}

/* ------------------------------------------------------------ Maschinen */

const anzahl = (s, id) => s.maschinen[id] || 0;
const maschineFrei = (s, id) => !!MASCHINE_NACH_ID[id] && werte(s).frei.has(MASCHINE_NACH_ID[id].frei);

function maschinenKosten(s, id) {
  const m = MASCHINE_NACH_ID[id];
  if (!m) return Infinity;
  const c = Math.round(m.kosten * Math.pow(m.faktor, anzahl(s, id)) * werte(s).maschinenKosten * 1e6) / 1e6;
  return Math.ceil(c);
}

function plaetzeBelegt(s) {
  return MASCHINEN.reduce((n, m) => n + anzahl(s, m.id) * m.plaetze, 0);
}

const platzFrei = (s, id) => plaetzeBelegt(s) + MASCHINE_NACH_ID[id].plaetze <= werte(s).plaetze;

function maschineKaufen(s, id) {
  if (!maschineFrei(s, id)) return { ok: false, grund: 'gesperrt' };
  if (!platzFrei(s, id)) return { ok: false, grund: 'platz' };
  const preis = maschinenKosten(s, id);
  if (s.geld < preis) return { ok: false, grund: 'geld' };
  s.geld -= preis;
  s.maschinen[id] = anzahl(s, id) + 1;
  return { ok: true };
}

/** Baut eine Maschine ab und gibt die Hälfte des letzten Kaufpreises zurück. */
function maschineAbbauen(s, id) {
  if (anzahl(s, id) <= 0) return { ok: false };
  s.maschinen[id]--;
  const erstattung = Math.floor(maschinenKosten(s, id) / 2);
  s.geld += erstattung;
  return { ok: true, erstattung };
}

function maschineUmschalten(s, id) {
  if (s.aus[id]) delete s.aus[id];
  else s.aus[id] = true;
}

/**
 * Momentaufnahme der Halle in Raten pro Sekunde. Strom, Brennstoff, Band,
 * Wasser, Scanner und Verarbeiter begrenzen sich gegenseitig. Strom und
 * Brennstoff hängen im Kreis voneinander ab (Generatoren fressen vom Band, das
 * Band braucht Strom); das wird bis zum Gleichgewicht nachgerechnet.
 */
function fabrik(s) {
  const w = werte(s);
  const f = {
    aktiv: hatBand(w), foerderung: 0, moeglich: 0, band: w.band, fluss: 0, strom: 1,
    erzeugt: GRUNDSTROM, bedarf: 0, deckung: 1, brennstoff: 0, brennBedarf: 0,
    wasser: 0, wasserBedarf: 0, wasserAnteil: 1, roh: 0, produkte: {}, einnahmen: 0,
    auslastung: {}, leistung: {},
  };
  if (!f.aktiv) return f;
  const n = (id) => (s.aus[id] ? 0 : anzahl(s, id));
  const mt = w.maschinenTempo;
  const M = MASCHINE_NACH_ID;

  f.moeglich = (n('rechen') * M.rechen.rate * w.rechenTempo + n('arm') * M.arm.rate * w.armTempo) * mt;
  f.band = w.band * (1 + n('rohrwerfer') * M.rohrwerfer.rate * w.werfer);
  const voll = rest(s) > 0;

  for (const m of MASCHINEN) if (m.strom > 0) f.bedarf += n(m.id) * m.strom * w.verbrauch;
  f.brennBedarf = MASCHINEN.reduce((sum, m) => sum + (m.brennstoff ? n(m.id) * m.brennstoff * w.brennstoff : 0), 0);

  // Erzeugt(p) wächst mit der Leistung p. Von p = 1 aus abwärts iteriert
  // landet man beim größten Gleichgewicht; danach einmal sauber auswerten.
  const erzeugtBei = (p) => {
    const fluss = voll ? Math.min(f.moeglich * p, f.band) : 0;
    const brennAnteil = f.brennBedarf > 0 ? Math.min(1, fluss / f.brennBedarf) : 1;
    let summe = GRUNDSTROM;
    f.leistung = {};
    for (const m of MASCHINEN) {
      if (m.strom >= 0 || !n(m.id)) continue;
      const l = -m.strom * n(m.id) * w.generatorMul * w.stromMul * (m.brennstoff ? brennAnteil : 1);
      f.leistung[m.id] = l;
      summe += l;
    }
    return summe;
  };
  const leistungBei = (p) => (f.bedarf > 0 ? Math.min(1, erzeugtBei(p) / f.bedarf) : 1);
  let strom = 1;
  for (let runde = 0; runde < 200; runde++) {
    const neu = leistungBei(strom);
    if (strom - neu < 1e-10) { strom = Math.min(strom, neu); break; }
    strom = neu;
  }
  f.erzeugt = erzeugtBei(strom);
  f.strom = strom;
  f.foerderung = f.moeglich * strom;
  f.fluss = voll ? Math.min(f.foerderung, f.band) : 0;
  f.brennstoff = Math.min(f.brennBedarf, f.fluss);
  f.auslastung.arm = f.moeglich > 0 ? f.fluss / f.moeglich : 0;
  f.auslastung.rechen = f.auslastung.arm;

  const scan = n('scanner') * M.scanner.rate * w.scanDeckung * mt * strom;
  f.deckung = f.fluss > 0 ? Math.min(1, scan / f.fluss) : (n('scanner') > 0 ? 1 : 0);

  f.wasser = n('brunnen') * -M.brunnen.wasser * w.wasserMul * mt * strom;
  let wasser = f.wasser;

  const lager = { halme: Math.max(0, f.fluss - f.brennstoff), ballen: 0, brei: 0 };
  const verteilung = Math.min(1, w.verteilung);
  for (const id of VERARBEITUNG_REIHE) {
    const zahl = n(id);
    if (!zahl) continue;
    const m = M[id];
    const nenn = zahl * m.rate * w.verarbeitung * mt * faktor(w, id) * strom;
    const max = nenn * verteilung;
    let stueck = max;
    for (const [zutat, menge] of Object.entries(m.rezept)) {
      const bedarf = zutat === 'halme' ? menge * w.ausbeute : menge;
      stueck = Math.min(stueck, lager[zutat] / bedarf);
    }
    if (m.wasser) {
      f.wasserBedarf += Math.max(0, stueck) * m.wasser;
      stueck = Math.min(stueck, wasser / m.wasser);
      wasser -= Math.max(0, stueck) * m.wasser;
    }
    stueck = Math.max(0, stueck);
    for (const [zutat, menge] of Object.entries(m.rezept)) {
      lager[zutat] -= stueck * (zutat === 'halme' ? menge * w.ausbeute : menge);
    }
    if (m.produkt in lager) lager[m.produkt] += stueck;
    else f.produkte[m.produkt] = (f.produkte[m.produkt] || 0) + stueck;
    f.auslastung[id] = nenn > 0 ? stueck / nenn : 0;
  }
  f.wasserAnteil = f.wasserBedarf > 0 ? Math.min(1, f.wasser / f.wasserBedarf) : 1;
  for (const p of ZWISCHEN) if (lager[p] > 1e-9) f.produkte[p] = (f.produkte[p] || 0) + lager[p];
  f.roh = Math.max(0, lager.halme);

  f.einnahmen = f.roh * preisRoh(w);
  for (const [p, rate] of Object.entries(f.produkte)) f.einnahmen += rate * produktPreis(w, p);
  return f;
}

/* ------------------------------------------------------------ Aufträge */

/** Der Auftrag mit Nummer nr; nach der festen Liste wachsen sie weiter. */
function auftrag(nr, skip = 0) {
  if (nr < AUFTRAEGE.length) return AUFTRAEGE[nr];
  const reihe = ['ballen', 'silage', 'papier', 'brikett', 'pellet', 'brei'];
  const will = reihe[(nr + skip - AUFTRAEGE.length) % reihe.length];
  const wachstum = Math.pow(1.35, nr - AUFTRAEGE.length + 1);
  const menge = Math.round((600 * wachstum * 20) / PRODUKTE[will].halme);
  const titel = KUNDEN[(nr + skip) % KUNDEN.length];
  return { titel, will, menge, lohn: Math.round(menge * PRODUKTE[will].wert * 1.5) };
}

/** Der Lohn zieht mit den Preisen mit, damit ein Auftrag nie weniger bringt als der Stand. */
const auftragLohn = (s, a) => {
  const w = werte(s);
  return a.lohn * w.auftragLohn * (produktPreis(w, a.will) / PRODUKTE[a.will].wert);
};

/** Den laufenden Auftrag ablehnen; nach der Pause kommt der nächste. Geliefertes ist verloren. */
function auftragAblehnen(s) {
  if (!werte(s).frei.has('auftraege') || s.auftrag.pause > 0) return false;
  // Ablehnen überspringt die Ware, lässt die Aufträge aber nicht wachsen.
  if (s.auftrag.nr < AUFTRAEGE.length) s.auftrag.nr++;
  else s.auftrag.skip = (s.auftrag.skip || 0) + 1;
  s.auftrag.geliefert = 0;
  s.auftrag.pause = AUFTRAG_PAUSE;
  return true;
}

/* ------------------------------------------------------------ Missionen */

/** Wie weit die offene Mission ist. null, wenn alle erledigt sind. */
function missionStand(s) {
  const m = MISSIONEN[s.mission];
  if (!m) return null;
  const st = s.stat;
  let ist = 0;
  let ziel = typeof m.ziel === 'number' ? m.ziel : 1;
  switch (m.art) {
    case 'tipps': ist = st.tipps; break;
    case 'verkauft': ist = st.verkauft; break;
    case 'tech': ist = techStufe(s, m.ziel) > 0 ? 1 : 0; break;
    case 'werkzeug': ist = st.werkzeug[m.ziel] ? 1 : 0; break;
    case 'verdient': ist = s.verdient; break;
    case 'gefegt': ist = st.gefegt; break;
    case 'maschine': ist = anzahl(s, m.ziel[0]); ziel = m.ziel[1]; break;
    case 'nadeln': ist = s.nadelnGesamt; break;
    case 'auftraege': ist = st.auftraege; break;
    case 'produziert': ist = st.produziert[m.ziel[0]] || 0; ziel = m.ziel[1]; break;
    case 'abgetragen': ist = st.abgetragen; break;
    case 'haelfte': ist = s.ladung > 1 ? 1 : s.haufen.entfernt / s.haufen.gesamt; break;
    case 'ladungen': ist = s.ladung; break;
    case 'forschung': ist = techGekauft(s); break;
    case 'arten': ist = artenGefunden(s); break;
    default: ist = 0;
  }
  return { m, ist: Math.min(ist, ziel), ziel, erfuellt: ist >= ziel };
}

function missionenPruefen(s, ereignisse) {
  for (let schutz = 0; schutz < 5; schutz++) {
    const ms = missionStand(s);
    if (!ms || !ms.erfuellt) return;
    const { m } = ms;
    let text = '';
    let betrag = 0;
    if (m.geschenk) {
      const mm = MASCHINE_NACH_ID[m.geschenk];
      // Wer die Maschine geschenkt bekommt, darf sie auch nachkaufen.
      const plan = PLAN_FUER[mm.frei];
      if (plan && !techStufe(s, plan) && techOffen(s, plan)) { s.tech[plan] = 1; s.rev++; }
      if (platzFrei(s, m.geschenk)) {
        s.maschinen[m.geschenk] = anzahl(s, m.geschenk) + 1;
        s.rev++;
        text = plan && techStufe(s, plan) === 1 ? `${mm.name} samt Plänen geschenkt` : `${mm.name} geschenkt`;
      } else {
        einnahme(s, mm.kosten);
        betrag = mm.kosten;
        text = `statt ${mm.name}`;
      }
    } else if (m.geschenkTech) {
      const t = TECH_NACH_ID[m.geschenkTech];
      if (techStufe(s, t.id) < t.stufen) {
        s.tech[t.id] = techStufe(s, t.id) + 1;
        s.rev++;
        text = `${t.name} geschenkt`;
      } else {
        const preis = t.kosten;
        einnahme(s, preis);
        betrag = preis;
        text = `statt ${t.name}`;
      }
    } else if (m.geld) {
      einnahme(s, m.geld);
      betrag = m.geld;
    }
    s.mission++;
    // belohnung ist nur der Text zum Geschenk; den Betrag formatiert die Oberfläche.
    ereignisse.push({ typ: 'mission', text: m.text, belohnung: text, geld: betrag });
  }
}

/* ------------------------------------------------------------ Detektor */

function naechsteNadel(s) {
  const offen = s.nadeln.filter((n) => n.zustand === 'versteckt' && n.tiefe > s.haufen.entfernt);
  if (!offen.length) return null;
  return Math.min(...offen.map((n) => n.tiefe)) - s.haufen.entfernt;
}

/** stufe: 'still' | 'kalt' | 'warm' | 'heiss'; abstand in Halmen oder null. */
function detektor(s) {
  const w = werte(s);
  const abstand = naechsteNadel(s);
  if (abstand == null) return { abstand: null, staerke: 0, stufe: 'still' };
  const staerke = Math.max(0, Math.min(1, 1 - abstand / w.detektor));
  const stufe = staerke <= 0 ? 'still' : staerke < 0.4 ? 'kalt' : staerke < 0.8 ? 'warm' : 'heiss';
  return { abstand, staerke, stufe };
}

/* ------------------------------------------------------------ Neue Ladung */

const ladungMoeglich = (s) => alleNadeln(s);
const kreditAufschlag = (s) => (werte(s).frei.has('kredit') ? KREDIT_AUFSCHLAG_GUT : KREDIT_AUFSCHLAG);

/**
 * Bestellt die nächste Ladung. aufRechnung: fehlendes Geld wird mit Aufschlag
 * zu Schulden. Forschung und Maschinen bleiben; der Rest der alten Ladung wird
 * mit abgeholt.
 */
function ladungBestellen(s, { aufRechnung = false } = {}) {
  if (!ladungMoeglich(s)) return { ok: false, grund: 'nadeln' };
  const preis = ladungPreis(s);
  if (s.geld >= preis) s.geld -= preis;
  else if (aufRechnung) {
    s.schulden += (preis - s.geld) * kreditAufschlag(s);
    s.geld = 0;
  } else return { ok: false, grund: 'geld' };
  if (s.stat.ersteLadung == null) s.stat.ersteLadung = s.aktiv;
  s.ladung++;
  s.haufen = { gesamt: ladungGroesse(s.ladung), entfernt: 0 };
  s.nadeln = nadelnVerstecken(s, s.ladung, s.haufen.gesamt);
  s.boden = 0;
  s.radar = { rest: 0, abstand: null, zeit: null };
  s.rev++;
  return { ok: true };
}

/* ------------------------------------------------------------ Zeit */

/**
 * Lässt dt Sekunden vergehen. offline: nur was auch ohne dich läuft (Drohnen,
 * Halle, Aufträge, Radar), mit dem Wirkungsgrad aus der Forschung.
 */
function tick(s, dt, { offline = false } = {}) {
  const ereignisse = [];
  if (!(dt > 0) || !Number.isFinite(dt)) return ereignisse;
  s.zeit += dt;
  if (!offline) s.aktiv += dt;
  let w = werte(s);

  if (s.laufen > 0) {
    s.laufen -= dt;
    if (s.laufen <= 0) { s.laufen = 0; ankommen(s, ereignisse); }
  }
  s.ausdauer = Math.min(w.ausdauer, s.ausdauer + w.ausdauerRegen * dt);

  if (!offline) {
    // Hofsauger
    const sg = s.sauger;
    const frei = platzFuerHand(s, w);
    if (sg.an && !sg.heiss && s.laufen <= 0 && w.frei.has('sauger') && frei > 0 && rest(s) > 0) {
      const weg = abtragen(s, Math.min(frei, w.saugerRate * dt), 'hand', ereignisse);
      ablegen(s, w, weg);
      sg.hitze += dt / w.saugerHitze;
      if (sg.hitze >= 1) {
        sg.hitze = 1; sg.heiss = true; sg.an = false;
        ereignisse.push({ typ: 'ueberhitzt' });
      }
    } else {
      sg.hitze = Math.max(0, sg.hitze - dt / (w.saugerHitze * 0.6));
      if (sg.heiss && sg.hitze <= 0) sg.heiss = false;
    }

    // Muskelgedächtnis
    if (w.autotipp > 0 && rest(s) > 0) {
      s.autoRest += w.autotipp * dt;
      let runden = Math.min(Math.floor(s.autoRest), 100);
      s.autoRest -= Math.floor(s.autoRest);
      while (runden-- > 0 && s.laufen <= 0) {
        const r = stich(s, ereignisse, { auto: true });
        if (r && r.voll) { verkaufen(s); break; }
      }
    }
  }

  const wirkung = offline ? Math.min(1, w.offlineEff) : 1;

  // Drohnen: sehen jede Nadel und fliegen direkt zum Stand.
  if (s.drohnen > 0 && rest(s) > 0) {
    const weg = abtragen(s, s.drohnen * w.drohnenRate * dt * wirkung, 'drohne', ereignisse);
    einnahme(s, weg * preisRoh(w));
  }

  // Halle
  w = werte(s);
  if (hatBand(w)) {
    const f = fabrik(s);
    const soll = f.fluss * dt * wirkung;
    let anteil = 0;
    if (soll > 0) {
      const weg = abtragen(s, soll, 'maschine', ereignisse, f.deckung);
      anteil = (weg / soll) * dt * wirkung;
    }
    if (w.frei.has('auftraege') && s.auftrag.pause > 0) s.auftrag.pause = Math.max(0, s.auftrag.pause - dt);
    if (anteil > 0) {
      let betrag = f.einnahmen * anteil;
      for (const [p, r] of Object.entries(f.produkte)) {
        s.stat.produziert[p] = (s.stat.produziert[p] || 0) + r * anteil;
      }
      // Laster: nimmt die gewünschte Ware, bevor sie am Stand verkauft wird.
      if (w.frei.has('auftraege') && s.auftrag.pause <= 0) {
        const a = s.auftrag;
        const au = auftrag(a.nr, a.skip);
        const verfuegbar = (au.will === 'roh' ? f.roh : (f.produkte[au.will] || 0)) * anteil;
        const nimmt = Math.min(verfuegbar, au.menge - a.geliefert);
        if (nimmt > 0) {
          a.geliefert += nimmt;
          betrag -= nimmt * produktPreis(w, au.will);
        }
        if (a.geliefert >= au.menge - 1e-9) {
          const lohn = auftragLohn(s, au);
          einnahme(s, lohn);
          s.stat.auftraege++;
          ereignisse.push({ typ: 'auftrag', auftrag: au, lohn });
          a.nr++;
          a.geliefert = 0;
          a.pause = AUFTRAG_PAUSE;
        }
      }
      einnahme(s, Math.max(0, betrag));
    }

    // Nadelradar
    const radare = s.aus.radar ? 0 : anzahl(s, 'radar');
    if (radare > 0 && f.strom > 0) {
      s.radar.rest -= dt * radare * f.strom;
      if (s.radar.rest <= 0) {
        s.radar.rest = w.radarCD;
        s.radar.abstand = naechsteNadel(s);
        s.radar.zeit = s.zeit;
        ereignisse.push({ typ: 'radar', abstand: s.radar.abstand });
      }
    }
  }

  missionenPruefen(s, ereignisse);
  return ereignisse;
}

/**
 * Holt nach, was während der Abwesenheit passiert ist. Liefert eine
 * Zusammenfassung oder null, wenn es sich nicht lohnt, davon zu erzählen.
 */
function offlineNachholen(s, jetzt = Date.now()) {
  const w = werte(s);
  const zuletzt = Number.isFinite(s.zuletzt) ? s.zuletzt : jetzt;
  const weg = Math.max(0, (jetzt - zuletzt) / 1000);
  s.zuletzt = jetzt;
  const e0 = [];
  if (s.laufen > 0 && weg > 0) {
    s.laufen -= weg;
    if (s.laufen <= 0) { s.laufen = 0; ankommen(s, e0); }
  }
  s.ausdauer = Math.min(w.ausdauer, s.ausdauer + w.ausdauerRegen * weg);
  // Der Sauger kühlt in der Zeit ab, die man weg war, nicht auf einen Schlag.
  s.sauger.an = false;
  s.sauger.hitze = Math.max(0, s.sauger.hitze - weg / (w.saugerHitze * 0.6));
  s.sauger.heiss = s.sauger.heiss && s.sauger.hitze > 0;
  const sek = Math.min(weg, w.offlineStunden * 3600);
  if (sek <= 0 || (s.drohnen === 0 && !hatBand(w))) return null;
  const geldVor = s.geld;
  const verdientVor = s.verdient;
  const halmeVor = s.stat.abgetragen;
  const nadelnVor = s.nadelnGesamt;
  const auftraegeVor = s.stat.auftraege;
  const schritte = Math.min(600, Math.ceil(sek));
  const dt = sek / schritte;
  const ereignisse = [...e0];
  for (let i = 0; i < schritte; i++) ereignisse.push(...tick(s, dt, { offline: true }));
  // Auch kurze Abwesenheiten zählen; der Bericht kommt erst ab einer halben Minute,
  // Funde und Missionen aber immer.
  return {
    kurz: sek < 30,
    sekunden: sek,
    abwesend: weg,
    geld: s.geld - geldVor,
    verdient: s.verdient - verdientVor,
    halme: s.stat.abgetragen - halmeVor,
    nadeln: s.nadelnGesamt - nadelnVor,
    auftraege: s.stat.auftraege - auftraegeVor,
    drohnenAllein: !hatBand(w),
    ereignisse,
  };
}

/* ------------------------------------------------------------ Speichern */

function speichern(s, jetzt = Date.now()) {
  s.zuletzt = jetzt;
  return JSON.stringify(s);
}

const istObjekt = (x) => !!x && typeof x === 'object' && !Array.isArray(x);
const zahlOder = (x, ersatz) => (typeof x === 'number' && Number.isFinite(x) ? x : ersatz);

/**
 * Liest einen gespeicherten Stand. Kaputte oder fremde Stände werden
 * abgelehnt, Kleinigkeiten repariert: unbekannte ids fliegen raus, Zahlen
 * werden Zahlen, der Sauger ist nach dem Laden aus.
 */
/* Was Fassung 2 noch kannte: entfernte Knoten und Maschinen mit ihrem alten Preis,
   damit alte Stände das Geld zurückbekommen, und die alte Missionsliste zum Umrechnen. */
const ENTFERNT_TECH = {
  lange_halle: [2000, 1.9], hohes_dach: [19800, 1], zweite_halle: [810000, 1],
  werfer2: [1600, 2.1], breitband: [7200, 2.8], dampf: [36000, 1],
};
const ENTFERNT_MASCHINE = { dampf: [32000, 1.18] };
/** Stufen, die es nicht mehr gibt, mit altem Grundpreis, Faktor und alter Höchststufe. */
const GEKUERZT_TECH = { arbeitslampen: [9900, 2.5] };
const MISSIONEN_V2 = ['Heb etwas Heu auf', 'Bring 25 Halme zum Stand', 'Kauf einen Eimer', 'Kauf die Heugabel',
  'Halte den Detektor an den Haufen', 'Verdiene 30 $', 'Feg verschüttetes Heu zusammen', 'Kauf die Förderband-Pläne',
  'Stell einen zweiten Kolbenrechen auf', 'Kauf Elektrizität', 'Finde die erste Nadel', 'Bau ein Silo',
  'Bau einen Greifarm', 'Bau einen Scanner', 'Erfülle einen Auftrag', 'Presse 100 Pressballen',
  'Trag eine Million Halme ab', 'Finde drei Nadeln', 'Bohr einen Brunnen', 'Trag den Haufen zur Hälfte ab',
  'Stell 20 Greifarme auf', 'Mach 50 Bögen Heupapier', 'Finde alle sechs Nadeln', 'Bestell eine neue Ladung',
  'Presse 100 Öko-Ziegel', 'Finde zwölf Nadeln', 'Erforsche 200 Stufen', 'Finde alle 24 Nadelarten'];
const summePreise = (kosten, faktor, von, bis) => {
  let n = 0;
  for (let i = von; i < bis; i++) n += kosten * Math.pow(faktor, i);
  return n;
};

/** Hebt einen Stand der Fassung 2 an: Erstattung für Entferntes, Mission nach Text. */
function vonFassung2(roh) {
  let erstattung = 0;
  const tech = istObjekt(roh.tech) ? roh.tech : {};
  for (const [id, [kosten, faktor]] of Object.entries(ENTFERNT_TECH)) {
    const n = Math.floor(zahlOder(tech[id], 0));
    if (n > 0) erstattung += summePreise(kosten, faktor, 0, n);
  }
  for (const [id, [kosten, faktor]] of Object.entries(GEKUERZT_TECH)) {
    const n = Math.floor(zahlOder(tech[id], 0));
    const max = TECH_NACH_ID[id].stufen;
    if (n > max) erstattung += summePreise(kosten, faktor, max, n);
  }
  const maschinen = istObjekt(roh.maschinen) ? roh.maschinen : {};
  for (const [id, [kosten, faktor]] of Object.entries(ENTFERNT_MASCHINE)) {
    const n = Math.floor(zahlOder(maschinen[id], 0));
    if (n > 0) erstattung += summePreise(kosten, faktor, 0, n);
  }
  roh.geld = zahlOder(roh.geld, 0) + Math.round(erstattung);
  const text = MISSIONEN_V2[Math.floor(zahlOder(roh.mission, 0))];
  const neu = text ? MISSIONEN.findIndex((m) => m.text === text) : -1;
  roh.mission = text == null ? MISSIONEN.length : Math.max(0, neu);
  roh.version = STAND_VERSION;
  return erstattung;
}

function laden(text) {
  let roh;
  try { roh = JSON.parse(text); } catch { return null; }
  if (!istObjekt(roh)) return null;
  let erstattung = 0;
  if (roh.version === 2) erstattung = vonFassung2(roh);
  if (roh.version !== STAND_VERSION) return null;
  if (!istObjekt(roh.haufen) || !Number.isFinite(roh.haufen.gesamt) || !Number.isFinite(roh.haufen.entfernt)
    || roh.haufen.gesamt <= 0) return null;
  if (!Array.isArray(roh.nadeln) || roh.nadeln.length !== NADELN_JE_LADUNG) return null;
  for (const n of roh.nadeln) {
    if (!istObjekt(n) || !Number.isFinite(n.tiefe) || !['versteckt', 'gefunden'].includes(n.zustand)
      || !Number.isInteger(n.art) || !NADELN[n.art]) return null;
  }
  const s = neuerStand(zahlOder(roh.rng, 1));
  for (const [key, wert] of Object.entries(roh)) {
    if (!(key in s)) continue;
    if (istObjekt(s[key])) {
      if (istObjekt(wert)) s[key] = { ...s[key], ...wert };
    } else if (Array.isArray(s[key])) {
      if (Array.isArray(wert)) s[key] = wert;
    } else if (typeof s[key] === 'number') {
      s[key] = zahlOder(wert, s[key]);
    } else if (typeof wert === typeof s[key]) {
      s[key] = wert;
    }
  }
  s.tech = Object.fromEntries(Object.entries(s.tech)
    .filter(([id, n]) => TECH_NACH_ID[id] && Number.isFinite(n) && n > 0)
    .map(([id, n]) => [id, Math.min(Math.floor(n), TECH_NACH_ID[id].stufen)]));
  s.tech.scheune = 1;
  s.maschinen = Object.fromEntries(Object.entries(s.maschinen)
    .filter(([id, n]) => MASCHINE_NACH_ID[id] && Number.isFinite(n) && n >= 0));
  s.aus = Object.fromEntries(Object.entries(s.aus).filter(([id]) => MASCHINE_NACH_ID[id]));
  s.arten = Object.fromEntries(Object.entries(s.arten).filter(([a, n]) => NADELN[a] && Number.isFinite(n)));
  if (!WERKZEUG_NACH_ID[s.werkzeug]) s.werkzeug = 'spaten';
  if (!istObjekt(s.stat.produziert)) s.stat.produziert = {};
  if (!istObjekt(s.stat.werkzeug)) s.stat.werkzeug = {};
  for (const k of ['tipps', 'hand', 'drohne', 'maschine', 'gaenge', 'verkauft', 'gefegt', 'abgetragen',
    'auftraege', 'besterVerkauf', 'maxGeld']) s.stat[k] = zahlOder(s.stat[k], 0);
  for (const k of ['nr', 'skip', 'geliefert', 'pause']) s.auftrag[k] = Math.max(0, zahlOder(s.auftrag[k], 0));
  s.auftrag.nr = Math.floor(s.auftrag.nr);
  s.mission = Math.max(0, Math.floor(s.mission));
  s.ladung = Math.max(1, Math.floor(s.ladung));
  s.stat.produziert = Object.fromEntries(Object.entries(s.stat.produziert).filter(([p, n]) => PRODUKTE[p] && Number.isFinite(n)));
  s.haufen.entfernt = Math.max(0, Math.min(s.haufen.entfernt, s.haufen.gesamt));
  // Steckt noch eine Nadel im Haufen, darf er nicht ganz leer sein, sonst findet sie keiner.
  if (s.nadeln.some((n) => n.zustand === 'versteckt')) s.haufen.entfernt = Math.min(s.haufen.entfernt, s.haufen.gesamt - 1);
  for (const n of s.nadeln) {
    if (n.zustand === 'versteckt' && (n.tiefe <= s.haufen.entfernt || n.tiefe > s.haufen.gesamt)) {
      n.tiefe = Math.min(s.haufen.gesamt, Math.floor(s.haufen.entfernt) + 1);
    }
  }
  s.radar = { rest: zahlOder(s.radar.rest, 0), abstand: zahlOder(s.radar.abstand, null), zeit: zahlOder(s.radar.zeit, null) };
  s.sauger = { an: false, hitze: zahlOder(s.sauger.hitze, 0), heiss: !!s.sauger.heiss };
  s.rev = 0;
  // Nur für die Oberfläche: wird nicht gespeichert (speichern nimmt die Felder von neuerStand).
  if (erstattung > 0) Object.defineProperty(s, 'erstattet', { value: Math.round(erstattung), enumerable: false });
  return s;
}

// Zahlen so, wie man sie auf einem Handy lesen will: deutsch getrennt, große
// Beträge abgekürzt, Geld wie im Vorbild in Dollar. Zwischen Zahl und Einheit
// steht ein geschütztes Leerzeichen, damit "$" und "%" nie allein umbrechen.

const NB = ' ';
const EINHEITEN = [
  [1e15, 'Brd.'], [1e12, 'Bio.'], [1e9, 'Mrd.'], [1e6, 'Mio.'],
];

// Ein Formatierer je Nachkommastellen, einmal gebaut: toLocaleString baut sonst bei jedem Aufruf neu.
const FORMATE = [0, 1, 2].map((st) => new Intl.NumberFormat('de-DE', { minimumFractionDigits: st, maximumFractionDigits: st }));
const deutsch = (n, stellen) => FORMATE[stellen].format(n);

const stellenFuer = (x) => (x >= 100 ? 0 : x >= 10 ? 1 : 2);

function zahl(n) {
  if (!Number.isFinite(n)) return '–';
  const a = Math.abs(n);
  if (a >= 1e18) return n.toExponential(2).replace('.', ',').replace('e+', '·10^');
  for (let i = 0; i < EINHEITEN.length; i++) {
    const [grenze, name] = EINHEITEN[i];
    if (a >= grenze * 0.9995) {
      let x = n / grenze;
      let st = stellenFuer(Math.abs(x));
      st = stellenFuer(Number(Math.abs(x).toFixed(st)));
      // Rundet es auf 1000, gehört es zur nächsten Einheit.
      if (Math.abs(Number(x.toFixed(st))) >= 1000 && i > 0) {
        const [g2, n2] = EINHEITEN[i - 1];
        x = n / g2;
        st = stellenFuer(Math.abs(x));
        return `${deutsch(x, st)}${NB}${n2}`;
      }
      return `${deutsch(x, st)}${NB}${name}`;
    }
  }
  const t = Math.trunc(n + (n >= 0 ? 1e-9 : -1e-9));
  return deutsch(t === 0 ? 0 : t, 0);
}

/** Wie zahl(), aber ohne Abkürzung bis 10 Millionen — für den Halmzähler. */
function halme(n) {
  if (!Number.isFinite(n)) return '–';
  if (Math.abs(n) < 1e7) return deutsch(Math.max(0, Math.floor(n + 1e-9)), 0);
  return zahl(n);
}

function geld(n) {
  if (!Number.isFinite(n)) return '–';
  if (Math.abs(n) < 0.005) n = 0;
  if (Math.abs(n) < 100) return `${deutsch(n, 2)}${NB}$`;
  return `${zahl(n)}${NB}$`;
}

/** Raten mit einer Nachkommastelle, wenn sie klein sind. */
function rate(n) {
  if (!Number.isFinite(n)) return '–';
  if (n > 0 && n < 10) return deutsch(n, 1);
  return zahl(n);
}

function prozent(x) {
  if (!Number.isFinite(x)) return `0${NB}%`;
  return `${deutsch(Math.round(x * 100), 0)}${NB}%`;
}

/** Wie prozent(), aber abgerundet — für Mängel, die man nicht schönrechnen soll. */
function prozentAb(x) {
  if (!Number.isFinite(x)) return `0${NB}%`;
  return `${deutsch(Math.floor(x * 100), 0)}${NB}%`;
}

function dauer(sek) {
  if (!Number.isFinite(sek)) sek = 0;
  sek = Math.max(0, Math.round(sek));
  const h = Math.floor(sek / 3600);
  const m = Math.floor((sek % 3600) / 60);
  const s = sek % 60;
  if (h > 0) return `${h}${NB}h ${m}${NB}min`;
  if (m > 0) return `${m}${NB}min ${s}${NB}s`;
  return `${s}${NB}s`;
}

// Alle Geräusche werden erzeugt, nicht abgespielt: Rauschen für Heu, Sinus
// für Münzen, ein Rechteck für den Detektor. Keine Audiodateien.

let ctx = null;
let master = null;
let rauschPuffer = null;
let stumm = false;
let saugerTon = null;

function klangStumm(wert) {
  if (wert !== undefined) {
    stumm = !!wert;
    if (stumm) saugerAus();
  }
  return stumm;
}

/** Muss aus einer Nutzergeste heraus einmal aufgerufen werden (Autoplay-Regeln). */
function klangWecken() {
  if (ctx) {
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return;
  }
  const AC = typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext);
  if (!AC) return;
  try {
    ctx = new AC();
  } catch {
    ctx = null;
    return;
  }
  master = ctx.createGain();
  master.gain.value = 0.5;
  master.connect(ctx.destination);
  rauschPuffer = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const d = rauschPuffer.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}

const bereit = () => ctx && !stumm && ctx.state === 'running';

function ton(frequenz, dauer, { typ = 'sine', laut = 0.2, start = 0, gleiten = null } = {}) {
  const t = ctx.currentTime + start;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = typ;
  o.frequency.setValueAtTime(frequenz, t);
  if (gleiten) o.frequency.exponentialRampToValueAtTime(gleiten, t + dauer);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(laut, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
  o.connect(g).connect(master);
  o.start(t);
  o.stop(t + dauer + 0.02);
}

function rauschen(dauer, { frequenz = 3000, q = 1, laut = 0.25, start = 0, typ = 'bandpass' } = {}) {
  const t = ctx.currentTime + start;
  const quelle = ctx.createBufferSource();
  quelle.buffer = rauschPuffer;
  const filter = ctx.createBiquadFilter();
  filter.type = typ;
  filter.frequency.value = frequenz;
  filter.Q.value = q;
  const g = ctx.createGain();
  g.gain.setValueAtTime(laut, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
  quelle.connect(filter).connect(g).connect(master);
  quelle.start(t, Math.random() * 0.5);
  quelle.stop(t + dauer + 0.02);
}

const klang = {
  stich(krit = false) {
    if (!bereit()) return;
    rauschen(0.09, { frequenz: 2200 + Math.random() * 1800, q: 0.8, laut: 0.22 });
    rauschen(0.05, { frequenz: 600, q: 1.5, laut: 0.12, typ: 'lowpass' });
    if (krit) ton(1320, 0.18, { typ: 'triangle', laut: 0.12, start: 0.02 });
  },
  kasse() {
    if (!bereit()) return;
    rauschen(0.03, { frequenz: 5000, q: 2, laut: 0.15 });
    ton(1046, 0.12, { laut: 0.16, start: 0.02 });
    ton(1568, 0.25, { laut: 0.14, start: 0.09 });
  },
  piep(staerke) {
    if (!bereit()) return;
    ton(1400 + staerke * 900, 0.045, { typ: 'square', laut: 0.05 + staerke * 0.05 });
  },
  klick() {
    if (!bereit()) return;
    ton(520, 0.04, { typ: 'triangle', laut: 0.1 });
  },
  kauf() {
    if (!bereit()) return;
    ton(660, 0.06, { typ: 'triangle', laut: 0.14 });
    ton(990, 0.1, { typ: 'triangle', laut: 0.12, start: 0.05 });
  },
  fehler() {
    if (!bereit()) return;
    ton(160, 0.14, { typ: 'sawtooth', laut: 0.08, gleiten: 120 });
  },
  fund(rang = 0) {
    if (!bereit()) return;
    const noten = [784, 988, 1175, 1568, 1976];
    for (let i = 0; i <= rang; i++) ton(noten[i], 0.4, { laut: 0.1, start: i * 0.07 });
  },
  nadel() {
    if (!bereit()) return;
    [523, 659, 784, 1046, 1318].forEach((f, i) => ton(f, 0.6, { typ: 'triangle', laut: 0.16, start: i * 0.1 }));
    rauschen(1.2, { frequenz: 8000, q: 0.5, laut: 0.05, start: 0.4, typ: 'highpass' });
  },
  heiss() {
    if (!bereit()) return;
    rauschen(0.5, { frequenz: 1200, q: 3, laut: 0.15 });
    ton(300, 0.4, { typ: 'sawtooth', laut: 0.06, gleiten: 90 });
  },
};

function saugerAn() {
  if (!bereit() || saugerTon) return;
  const quelle = ctx.createBufferSource();
  quelle.buffer = rauschPuffer;
  quelle.loop = true;
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 900;
  const brumm = ctx.createOscillator();
  brumm.type = 'sawtooth';
  brumm.frequency.value = 95;
  const brummG = ctx.createGain();
  brummG.gain.value = 0.04;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, ctx.currentTime);
  g.gain.linearRampToValueAtTime(0.18, ctx.currentTime + 0.15);
  quelle.connect(filter).connect(g);
  brumm.connect(brummG).connect(g);
  g.connect(master);
  quelle.start();
  brumm.start();
  saugerTon = { quelle, brumm, g, filter };
}

function saugerHitze(h) {
  if (saugerTon) saugerTon.filter.frequency.value = 900 + h * 1400;
}

function saugerAus() {
  if (!saugerTon || !ctx) return;
  const { quelle, brumm, g } = saugerTon;
  saugerTon = null;
  g.gain.cancelScheduledValues(ctx.currentTime);
  g.gain.setValueAtTime(g.gain.value, ctx.currentTime);
  g.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.2);
  quelle.stop(ctx.currentTime + 0.25);
  brumm.stop(ctx.currentTime + 0.25);
}
